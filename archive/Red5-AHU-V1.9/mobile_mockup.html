<!DOCTYPE html>
<!--
  RED5 STUDIO · MOBILE MOCKUP (iter 3)
  Two-screen flow with hash routing:
    #/         → site overview (gauge + AHU dropdown)
    #/ahu/<id> → per-AHU detail page (per-AHU bg tint, VAV dropdown,
                 tap-gauge to open the AHU equipment graphic modal)
-->
<html lang="en">
<head>
<!-- Cache-control: psy_3d.html and friends have no compiled bundle to ?v=-stamp, so the HTML itself must opt-out of browser caching. Without this, PROD users see stale UI after every deploy until they hard-refresh.  Sentinel data-cache-policy attribute is used by scripts/inject_no_cache_meta.py and deploy.sh preflight to detect missing tags.  Do NOT remove. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" data-cache-policy="no-cache">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Red5 Studio · Mobile</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #050912; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #e2e8f0; min-height: 100vh; overscroll-behavior: contain; }
  .device-frame {
    max-width: 420px; margin: 0 auto; min-height: 100vh;
    display: flex; flex-direction: column;
    box-shadow: 0 0 80px rgba(99, 102, 241, 0.15);
    position: relative; transition: background 320ms ease;
  }
  /* Home view bg */
  body[data-view="home"] .device-frame {
    background:
      radial-gradient(circle at 50% 18%, rgba(244, 63, 94, 0.18) 0%, transparent 55%),
      radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 55%),
      linear-gradient(180deg, #0b1220 0%, #050912 100%);
  }
  /* AHU-detail view bg — accent colour comes from `--ahu-accent` set per AHU */
  body[data-view="ahu"] .device-frame {
    background:
      radial-gradient(circle at 50% 18%, var(--ahu-glow, rgba(99, 102, 241, 0.30)) 0%, transparent 55%),
      radial-gradient(circle at 50% 0%, var(--ahu-tint, #1e1b4b) 0%, transparent 60%),
      linear-gradient(180deg, #0b1220 0%, #050912 100%);
  }

  header.brand { padding: 22px 24px 4px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; font-weight: 900; letter-spacing: 0.18em; color: #f87171; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .logo .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ahu-accent, #f87171); box-shadow: 0 0 10px var(--ahu-accent, #f87171); }
  .status-bar { display: flex; align-items: center; gap: 10px; font-family: ui-monospace, monospace; font-size: 10px; color: #94a3b8; }
  .status-bar .pulse { width: 6px; height: 6px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }

  .back-btn { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(99, 116, 139, 0.4); padding: 6px 12px 6px 8px; border-radius: 14px; color: #cbd5e1; font-family: ui-monospace, monospace; font-size: 10px; font-weight: 800; letter-spacing: 0.12em; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .back-btn:active { transform: scale(0.96); }

  h1.page-title { padding: 4px 24px 0; font-size: 30px; font-weight: 900; line-height: 1.05; letter-spacing: -0.02em; color: #f8fafc; }
  h1.page-title span.accent { background: linear-gradient(135deg, #ec4899 0%, #f43f5e 60%, #fb7185 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1.page-title span.ahu-id { background: linear-gradient(135deg, var(--ahu-bright, #c4b5fd) 0%, var(--ahu-accent, #818cf8) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { padding: 6px 24px 0; font-size: 12px; color: #64748b; line-height: 1.5; }
  .ts { padding: 14px 24px 0; font-family: ui-monospace, monospace; font-size: 10px; color: #475569; letter-spacing: 0.08em; display: flex; align-items: center; gap: 8px; }
  .ts .dot { width: 4px; height: 4px; background: #475569; border-radius: 50%; }

  /* ── GAUGE ──────────────────────────────────────────── */
  .gauge-card { margin: 22px 20px 0; padding: 20px 20px 22px; border-radius: 28px; background: linear-gradient(180deg, rgba(15, 23, 42, 0.6) 0%, rgba(2, 6, 23, 0.4) 100%); border: 1px solid var(--ahu-border, rgba(244, 63, 94, 0.18)); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; transition: border 320ms ease; }
  .ring-wrap { position: relative; width: 260px; height: 260px; margin: 4px auto 6px; cursor: pointer; }
  .ring-wrap.tap-hint::after { content: 'TAP'; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); font-family: ui-monospace, monospace; font-size: 8px; letter-spacing: 0.20em; color: var(--ahu-accent, #fb7185); font-weight: 800; opacity: 0.65; animation: tapPulse 2s ease-in-out infinite; }
  @keyframes tapPulse { 0%, 100% { opacity: 0.30; transform: translateX(-50%) translateY(0); } 50% { opacity: 0.85; transform: translateX(-50%) translateY(2px); } }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg, .ring-fg { fill: none; stroke-width: 14; stroke-linecap: round; }
  .ring-bg { stroke: rgba(51, 65, 85, 0.45); }
  .ring-fg { stroke: url(#ringGrad); filter: drop-shadow(0 0 12px var(--ahu-glowstroke, rgba(244, 63, 94, 0.55))); transition: stroke-dashoffset 1200ms cubic-bezier(0.16, 1, 0.3, 1); }

  .gauge-centre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .gauge-pct { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 64px; font-weight: 900; line-height: 1; background: linear-gradient(180deg, #fff 0%, var(--ahu-bright, #fb7185) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }
  .gauge-pct .sym { font-size: 28px; vertical-align: top; line-height: 1; margin-left: 2px; color: var(--ahu-bright, #fb7185); -webkit-text-fill-color: var(--ahu-bright, #fb7185); }
  .gauge-label { font-family: ui-monospace, monospace; font-size: 9.5px; font-weight: 800; letter-spacing: 0.20em; color: var(--ahu-label, #fda4af); text-transform: uppercase; margin-top: 4px; text-align: center; }
  .gauge-fraction { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; font-weight: 700; color: #94a3b8; margin-top: 6px; }
  .gauge-fraction b { color: var(--ahu-bright, #fb7185); }

  .icon-row { display: flex; gap: 22px; margin-top: 16px; padding: 4px 0; }
  .icon-pill { display: flex; align-items: center; gap: 9px; padding: 8px 14px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--ahu-pill-border, rgba(99, 102, 241, 0.25)); border-radius: 18px; backdrop-filter: blur(8px); }
  .icon-pill .ic { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 8px; background: var(--ahu-pill-bg, linear-gradient(135deg, rgba(99, 102, 241, 0.30), rgba(139, 92, 246, 0.18))); border: 1px solid var(--ahu-pill-border, rgba(139, 92, 246, 0.45)); }
  .icon-pill .ic svg { width: 14px; height: 14px; stroke: var(--ahu-pill-icon, #c4b5fd); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-pill .num { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 18px; font-weight: 800; color: #f1f5f9; line-height: 1; font-variant-numeric: tabular-nums; }
  .icon-pill .lbl { font-family: ui-monospace, monospace; font-size: 8.5px; font-weight: 700; letter-spacing: 0.14em; color: #94a3b8; text-transform: uppercase; line-height: 1; margin-top: 3px; }

  /* ── DROPDOWN (shared between AHU+VAV lists) ─────────── */
  .dropdown { margin: 26px 20px 24px; border-radius: 20px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(71, 85, 105, 0.5); overflow: hidden; backdrop-filter: blur(8px); }
  .dd-trigger { width: 100%; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(90deg, var(--ahu-trigger-bg, rgba(244, 63, 94, 0.08)) 0%, transparent 100%); border: 0; cursor: pointer; text-align: left; transition: background 200ms ease; }
  .dd-trigger:active { background: var(--ahu-trigger-active, rgba(244, 63, 94, 0.14)); }
  .dd-trigger .left { display: flex; align-items: center; gap: 12px; }
  .dd-trigger .ic-circle { width: 32px; height: 32px; border-radius: 50%; background: var(--ahu-circle-bg, linear-gradient(135deg, rgba(244, 63, 94, 0.25), rgba(190, 24, 93, 0.15))); border: 1px solid var(--ahu-accent, rgba(244, 63, 94, 0.50)); display: grid; place-items: center; flex-shrink: 0; }
  .dd-trigger .ic-circle svg { width: 16px; height: 16px; stroke: var(--ahu-bright, #fda4af); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dd-trigger .title-block { display: flex; flex-direction: column; }
  .dd-trigger .title-block .t1 { font-size: 13px; font-weight: 800; color: #f1f5f9; line-height: 1.1; }
  .dd-trigger .title-block .t2 { font-family: ui-monospace, monospace; font-size: 9.5px; color: #94a3b8; letter-spacing: 0.10em; margin-top: 3px; text-transform: uppercase; }
  .dd-trigger .chev { width: 18px; height: 18px; color: #94a3b8; transition: transform 260ms cubic-bezier(0.16, 1, 0.3, 1); }
  .dropdown.open .chev { transform: rotate(180deg); color: var(--ahu-bright, #fb7185); }
  .dd-body { max-height: 0; opacity: 0; overflow: hidden; transition: max-height 360ms cubic-bezier(0.16, 1, 0.3, 1), opacity 220ms ease; }
  .dropdown.open .dd-body { max-height: 2400px; opacity: 1; }

  /* AHU row (home view) and VAV row (detail view) share styling */
  .list { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .list-row { background: rgba(2, 6, 23, 0.6); border: 1px solid rgba(51, 65, 85, 0.4); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; cursor: pointer; transition: transform 140ms; }
  .list-row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent, #475569); box-shadow: 0 0 10px var(--accent, #475569); opacity: 0.85; }
  .list-row:active { transform: scale(0.985); }
  .list-row .id { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; font-weight: 800; color: #f1f5f9; letter-spacing: 0.05em; flex-shrink: 0; min-width: 76px; }
  .list-row .meta { flex: 1; min-width: 0; }
  .list-row .bar-row { display: flex; align-items: center; gap: 8px; }
  .list-row .bar-bg { flex: 1; height: 5px; background: rgba(51, 65, 85, 0.6); border-radius: 3px; overflow: hidden; }
  .list-row .bar-fill { height: 100%; background: var(--accent, #475569); box-shadow: 0 0 6px var(--accent, #475569); border-radius: 3px; }
  .list-row .pct { font-family: ui-monospace, monospace; font-size: 11px; color: var(--accent, #94a3b8); font-weight: 800; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
  .list-row .sub { font-family: ui-monospace, monospace; font-size: 9px; color: #64748b; margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .list-row .sub b { color: #e2e8f0; font-weight: 700; }
  .list-row .sub .sep { width: 2px; height: 2px; background: #475569; border-radius: 50%; }
  .list-row .sub .badge { color: var(--accent, #94a3b8); font-weight: 800; letter-spacing: 0.06em; }

  /* ── AHU GRAPHIC MODAL ──────────────────────────────── */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.84); backdrop-filter: blur(12px); display: none; z-index: 50; align-items: center; justify-content: center; padding: 16px; }
  .modal-backdrop.show { display: flex; animation: fadeIn 240ms ease; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  .modal { width: 100%; max-width: 380px; max-height: 90vh; background: linear-gradient(180deg, rgba(15, 23, 42, 0.96) 0%, rgba(2, 6, 23, 0.96) 100%); border: 1px solid var(--ahu-accent, rgba(99, 102, 241, 0.45)); border-radius: 22px; padding: 18px 18px 20px; box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 60px var(--ahu-glow, rgba(99, 102, 241, 0.30)); display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex: 0 0 auto; }
  .modal-head h3 { font-size: 14px; font-weight: 800; color: var(--ahu-bright, #c4b5fd); letter-spacing: 0.04em; }
  .modal-close { background: rgba(51, 65, 85, 0.5); border: 0; width: 28px; height: 28px; border-radius: 50%; color: #cbd5e1; font-size: 16px; cursor: pointer; display: grid; place-items: center; }
  .modal-close:active { transform: scale(0.92); }
  /* Stylised 2D equipment diagram — no iframe.  Phone screens don't have
     the real estate for the full desktop modal; the simple SVG keeps
     things readable.  Telemetry shows below in headline pills + scrolling table. */
  .modal-svg { width: 100%; aspect-ratio: 16/9; background: linear-gradient(180deg, #cbd5e1 0%, #94a3b8 100%); border-radius: 14px; overflow: hidden; flex: 0 0 auto; }
  .modal-svg svg { width: 100%; height: 100%; display: block; }

  /* Headline pills — 4 most-important metrics at-a-glance. */
  .modal-foot { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; flex: 0 0 auto; }
  .modal-stat { background: rgba(2, 6, 23, 0.55); border: 1px solid rgba(71, 85, 105, 0.4); border-radius: 10px; padding: 8px 6px; text-align: center; }
  .modal-stat .v { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; font-weight: 800; color: var(--ahu-bright, #c4b5fd); line-height: 1.2; }
  .modal-stat .k { font-family: ui-monospace, monospace; font-size: 7px; color: #64748b; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 3px; font-weight: 700; }

  /* Scrolling all-points table — everything else lives here */
  .modal-tablewrap { margin-top: 10px; flex: 1 1 auto; overflow-y: auto; border-top: 1px solid rgba(71, 85, 105, 0.35); padding-top: 8px; min-height: 0; }
  .modal-tablewrap::-webkit-scrollbar { width: 4px; }
  .modal-tablewrap::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.4); border-radius: 4px; }
  .modal-table { width: 100%; border-collapse: collapse; font-family: ui-monospace, monospace; font-size: 10px; }
  .modal-table thead th { position: sticky; top: 0; background: rgba(2,6,23,0.95); color: #64748b; text-transform: uppercase; letter-spacing: 0.12em; font-size: 8px; font-weight: 800; padding: 6px 8px; text-align: left; border-bottom: 1px solid rgba(71,85,105,0.4); }
  .modal-table tbody td { padding: 6px 8px; border-bottom: 1px solid rgba(30, 41, 59, 0.6); color: #cbd5e1; }
  .modal-table tbody td.k { color: #94a3b8; font-weight: 700; }
  .modal-table tbody td.v { font-family: "JetBrains Mono", ui-monospace, monospace; color: var(--ahu-bright, #c4b5fd); text-align: right; font-weight: 700; }
  .modal-table tbody td.v.alert { color: #f87171; text-shadow: 0 0 12px rgba(248,113,113,0.6); }
  .modal-table tbody tr:last-child td { border-bottom: 0; }

  .footer { margin-top: auto; padding: 16px 24px calc(20px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(30, 41, 59, 0.6); display: flex; align-items: center; justify-content: space-between; font-family: ui-monospace, monospace; font-size: 9px; color: #475569; letter-spacing: 0.08em; }
  .footer a { color: #64748b; text-decoration: none; }
  .footer a:active { color: #ec4899; }
  .footer .links { display: flex; gap: 14px; }

  @media (min-width: 480px) {
    body::before { content: 'desktop preview — open on a phone or use dev-tools mobile mode'; position: fixed; top: 8px; left: 50%; transform: translateX(-50%); font-family: ui-monospace, monospace; font-size: 10px; background: rgba(15, 23, 42, 0.9); color: #94a3b8; padding: 6px 14px; border-radius: 12px; border: 1px solid #334155; z-index: 999; white-space: nowrap; }
  }
</style>
</head>
<body data-view="home">
<div class="device-frame" id="app"></div>

<!-- Reusable SVG gradient defs (out of flow) -->
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"  stop-color="#fb7185"/>
    <stop offset="50%" stop-color="#f43f5e"/>
    <stop offset="100%" stop-color="#e11d48"/>
  </linearGradient>
</defs></svg>

<!-- AHU/VAV graphic modal — stylised 2D + headline pills + scrolling table.
     Phones don't have room for the full schema-driven equipment graphic with
     overlay pills, so we keep the diagram stylised and surface ALL the
     telemetry as a sticky-header table below the 4 headline metrics. -->
<div class="modal-backdrop" id="ahuModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">AHU-XX-X · Equipment</h3>
      <button class="modal-close" id="modalClose" aria-label="close">×</button>
    </div>
    <div class="modal-svg" id="modalSvg"></div>
    <div class="modal-foot">
      <div class="modal-stat"><div class="v" id="mOA">— °C</div><div class="k">OA</div></div>
      <div class="modal-stat"><div class="v" id="mSA">— °C</div><div class="k">SA</div></div>
      <div class="modal-stat"><div class="v" id="mFan">— Hz</div><div class="k">FAN</div></div>
      <div class="modal-stat"><div class="v" id="mSP">— Pa</div><div class="k">STATIC</div></div>
    </div>
    <div class="modal-tablewrap">
      <table class="modal-table">
        <thead><tr><th>Point</th><th style="text-align:right">Value</th></tr></thead>
        <tbody id="modalTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
/* ── LIVE DATA HOOK ────────────────────────────────────
   Pulls the real AHU+VAV roster from /api/data (V1.9-shaped array used
   by the desktop dashboard).  Falls back to the demo roster below only
   when the backend can't be reached, so the mockup degrades gracefully
   in offline-preview situations.

   The same backend hosts the dashboard and this page, so a same-origin
   request is enough — no CORS handshake, no auth header for the demo
   path.  We poll every 8s to keep the gauge + VAV roster live without
   pounding the controller.

   /api/data row shape we depend on:
     { id, vavs: [{ id, t, rh, all_points:{ DPR, AFM, ... } }] }
   → mapped into the mockup's `AHUs[]` + `vavsFor(ahu)` shape so the
     rest of the UI is unchanged. */
const DEMO_AHUs = [
  { id: 'AHU-05-N', total: 24, out: 11, name: 'North Wing',  accent: '#f43f5e', label: 'rose'    },
  { id: 'AHU-02-S', total: 18, out:  7, name: 'South Wing',  accent: '#fb923c', label: 'orange'  },
  { id: 'AHU-01-E', total: 22, out:  5, name: 'East Annex',  accent: '#facc15', label: 'amber'   },
  { id: 'AHU-07-W', total: 16, out:  3, name: 'West Lab',    accent: '#84cc16', label: 'lime'    },
  { id: 'AHU-08-R', total: 14, out:  3, name: 'Roof Plenum', accent: '#06b6d4', label: 'cyan'    },
  { id: 'AHU-03-W', total: 12, out:  1, name: 'Workshop',    accent: '#a78bfa', label: 'violet'  },
  { id: 'AHU-04-C', total: 19, out:  1, name: 'Conference',  accent: '#22d3ee', label: 'sky'     },
  { id: 'AHU-06-L', total: 17, out:  0, name: 'Lobby',       accent: '#10b981', label: 'emerald' }
];
/* Accent rotation matches the dashboard's per-AHU palette feel */
const ACCENT_RING = ['#f43f5e','#fb923c','#facc15','#84cc16','#06b6d4','#a78bfa','#22d3ee','#10b981','#ef4444','#f59e0b'];
/* Comfort-zone gate: a VAV is "out" if its zone temp leaves 19..27 °C
   OR its RH leaves 30..65 %.  Mirrors the band defaults shipped in
   /app/frontend/public/docs/ashrae_55_reference.md. */
function _isVavOut(v) {
  const t  = (v.t  != null) ? +v.t  : 22;
  const rh = (v.rh != null) ? +v.rh : 50;
  return t < 19 || t > 27 || rh < 30 || rh > 65;
}
function _cookedVavs(rawVavs) {
  return (rawVavs || []).map(v => {
    const isOut = _isVavOut(v);
    const status = !isOut ? 'in' : (v.t < 21 ? 'cold' : 'hot');
    const dpr = v.all_points && v.all_points.DPR;
    return {
      id:     v.id,
      zone:   v.zone || ('Zone-' + (v.id || '').slice(-3)),
      t:      v.t  != null ? +v.t  : 22,
      rh:     v.rh != null ? +v.rh : 50,
      flow:   Math.max(200, Math.round((dpr != null ? +dpr : 50) * 12)),  // synthetic CFM proxy
      status: status,
      _raw:   v   // full point map for the modal table
    };
  }).sort((a,b) => (a.status === 'in') - (b.status === 'in'));
}
function _cookedAhus(raw) {
  return (raw || []).map((row, i) => {
    const vavs = row.vavs || [];
    const out  = vavs.filter(_isVavOut).length;
    const acc  = ACCENT_RING[i % ACCENT_RING.length];
    return {
      id:    row.id,
      total: vavs.length,
      out:   out,
      name:  row.zone || row.id,
      accent: acc,
      label: 'live',
      _vavs: vavs,  // keep raw so detail page doesn't refetch
      _raw:  row    // full AHU object (incl. all_points) for the modal table
    };
  }).sort((a, b) => (b.out - a.out) || ((b.out/(b.total||1)) - (a.out/(a.total||1))));
}
let AHUs = DEMO_AHUs.slice().sort((a, b) => (b.out - a.out) || (b.out / b.total - a.out / a.total));
let _liveOk = false;

async function fetchLive() {
  try {
    const r = await fetch('/api/data', { credentials: 'include' });
    if (!r.ok) throw new Error('http ' + r.status);
    const data = await r.json();
    if (!Array.isArray(data) || !data.length) throw new Error('empty');
    AHUs = _cookedAhus(data);
    _liveOk = true;
    return true;
  } catch (e) {
    if (!_liveOk) AHUs = DEMO_AHUs.slice();   // first-failure: fall back
    return false;
  }
}

/* Re-render the current view on each successful poll so the gauge + VAV
   list stay live.  Routing hash drives view selection (see ROUTER). */
async function _liveLoop() {
  const ok = await fetchLive();
  if (ok) route();          // re-render with fresh data
  setTimeout(_liveLoop, 8000);
}

/* Generate a VAV roster for a given AHU.  When live data is available
   we use the real VAVs cached on the AHU object (set by `_cookedAhus`).
   Falls through to deterministic synthetic data for the demo roster so
   the mockup still renders convincingly when /api/data is unreachable. */
function vavsFor(ahu) {
  if (ahu._vavs && ahu._vavs.length) return _cookedVavs(ahu._vavs);
  const out = [];
  for (let i = 1; i <= ahu.total; i++) {
    const isOut = i <= ahu.out;
    const cold  = isOut && (i % 2 === 0);
    out.push({
      id:    `VAV-${String(i).padStart(3,'0')}`,
      zone:  `Zone-${ahu.id.slice(4,6)}-${String(i).padStart(2,'0')}`,
      t:     cold ? (18 + Math.random()*1.8) : isOut ? (28 + Math.random()*2.0) : (22 + Math.random()*3.5),
      rh:    cold ? (28 + Math.random()*7)   : isOut ? (62 + Math.random()*12) : (44 + Math.random()*14),
      flow:  ((420 + Math.random()*180)|0),
      status: cold ? 'cold' : isOut ? 'hot' : 'in'
    });
  }
  // Out first
  return out.sort((a,b) => (a.status === 'in') - (b.status === 'in'));
}

/* Colour ramp re-used across home & AHU views */
function accentForPct(pct) {
  if (pct === 0)  return { c: '#475569', name: 'NOMINAL'  };
  if (pct >= 30)  return { c: '#f43f5e', name: 'CRITICAL' };
  if (pct >= 10)  return { c: '#facc15', name: 'WARN'     };
  return                  { c: '#34d399', name: 'OK'       };
}

/* Helpers: hex → rgba with given alpha */
function rgba(hex, a) {
  const h = hex.replace('#',''); const r = parseInt(h.slice(0,2),16);
  const g = parseInt(h.slice(2,4),16); const b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* Tween the ring fill + numeric readout */
function animateRing(fgEl, pctEl, target) {
  const start = parseFloat(pctEl.textContent) || 0;
  fgEl.style.strokeDasharray = `${target} ${100 - target}`;
  const t0 = performance.now();
  function step(t) {
    const k = Math.min(1, (t - t0) / 1100);
    const eased = 1 - Math.pow(1 - k, 3);
    pctEl.textContent = (start + (target - start) * eased).toFixed(0);
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ── ROUTER ──────────────────────────────────────────── */
function parseHash() {
  const h = (location.hash || '#/').replace(/^#/, '');
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'ahu' && parts[1]) return { view: 'ahu', id: parts[1] };
  return { view: 'home' };
}

/* ── EQUIPMENT MODAL (shared between AHU + VAV) ───────────
   - 2D stylised SVG (ahuSvg/vavSvg) — phone-friendly diagram
   - 4 headline metric pills (OA/SA/FAN/STATIC for AHUs;
     ZONE T / ZONE RH / FLOW / DAMPER for VAVs)
   - sticky-header table of every available telemetry point so
     operators can scroll through full point lists without
     squinting at overlay pills jammed into a thumbnail. */
function openEquipmentModal(kind, item) {
  const isAhu  = kind === 'ahu';
  const accent = item.accent || '#facc15';
  document.getElementById('modalTitle').textContent = `${item.id} \u00B7 ${isAhu ? 'AHU' : 'VAV'} equipment`;
  document.getElementById('modalSvg').innerHTML     = isAhu ? ahuSvg(accent) : vavSvg(accent);

  // Resolve raw point map (each AHU/VAV from /api/data has all_points)
  const raw    = item._raw || {};
  const points = raw.all_points || raw.points || {};
  // Robust numeric/format helper — '—' fallback keeps the layout stable
  const fmt = (v, suf, digits) => {
    if (v == null || v === '' || isNaN(+v)) return '\u2014 ' + suf;
    return (+v).toFixed(digits == null ? 1 : digits) + ' ' + suf;
  };

  // Headline metrics — 4 most actionable values for the kind
  const headline = isAhu
    ? [
        ['OA',     fmt(points.OAT  || points.OA_T  || points.OA,  '\u00B0C', 1)],
        ['SA',     fmt(points.SAT  || points.SA_T  || points.SA,  '\u00B0C', 1)],
        ['FAN',    fmt(points.INV1_F || points.SAFP || points.FAN_HZ, 'Hz',   0)],
        ['STATIC', fmt(points.SPR  || points.STATIC_P || points.SP, 'Pa',    0)]
      ]
    : [
        ['ZONE T',  fmt(item.t,  '\u00B0C', 1)],
        ['ZONE RH', fmt(item.rh, '%',       0)],
        ['FLOW',    fmt(item.flow, 'cfm',   0)],
        ['DAMPER',  fmt(points.DPR, '%',    0)]
      ];
  const sEls = document.querySelectorAll('.modal-foot .modal-stat');
  headline.forEach((cell, i) => {
    const el = sEls[i]; if (!el) return;
    el.querySelector('.k').textContent = cell[0];
    el.querySelector('.v').textContent = cell[1];
  });

  // Full table — every point with a value, sorted alphabetically
  const rows = Object.keys(points || {})
    .filter(k => points[k] !== null && points[k] !== '')
    .sort((a, b) => a.localeCompare(b))
    .map(k => {
      const raw = points[k];
      const num = (typeof raw === 'number') ? raw : (raw != null && !isNaN(+raw) ? +raw : null);
      const display = (num != null) ? num.toFixed(Math.abs(num) < 10 ? 2 : 1) : String(raw);
      // Flag SAT/OAT below 5 or above 35 °C as alert; can be tuned later.
      const isTemp = /T($|_)/.test(k) && num != null;
      const alert  = isTemp && (num < 5 || num > 35);
      return '<tr><td class="k">' + k + '</td><td class="v' + (alert ? ' alert' : '') + '">' + display + '</td></tr>';
    });
  document.getElementById('modalTableBody').innerHTML = rows.length
    ? rows.join('')
    : '<tr><td class="k" colspan="2" style="text-align:center;color:#64748b;padding:24px 8px;">No telemetry yet.<br/>Waiting for the next /api/data tick.</td></tr>';

  document.getElementById('ahuModal').classList.add('show');
}
document.getElementById('modalClose').onclick = () => document.getElementById('ahuModal').classList.remove('show');
document.getElementById('ahuModal').addEventListener('click', (e) => { if (e.target.id === 'ahuModal') e.target.classList.remove('show'); });

function ticksSvg() {
  let s = '<g>';
  for (let i = 0; i < 12; i++) {
    const a = (i * 30 - 90) * Math.PI / 180;
    const x1 = 100 + 92 * Math.cos(a), y1 = 100 + 92 * Math.sin(a);
    const x2 = 100 + 87 * Math.cos(a), y2 = 100 + 87 * Math.sin(a);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(100,116,139,0.55)" stroke-width="1.4" stroke-linecap="round"/>`;
  }
  return s + '</g>';
}

function route() {

/* ── SWIPE-TO-NEXT-AHU ──────────────────────────────────
   On the AHU detail view (body[data-view='ahu']), a horizontal touch
   swipe cycles through AHUs in the worst-first sort order — same as
   the dropdown list — so an operator walking a building can flick
   through equipment one-handed.  Threshold values are sized for
   thumb-only navigation (60 px min, 40 px vertical tolerance).  Desktop
   preview is supported via Arrow-Left / Arrow-Right keys.  Each
   transition triggers a 280 ms slide animation pegged to the swipe
   direction so the user perceives forward/backward motion. */
(function setupSwipeNav() {
  let startX = 0, startY = 0, startT = 0, tracking = false;
  const TH_X = 60, TH_Y = 40, TH_T = 700;

  function neighbour(id, dir) {
    if (!AHUs.length) return null;
    const idx = AHUs.findIndex(a => a.id === id);
    if (idx < 0) return AHUs[0].id;            // unknown id → bounce to first
    const next = (idx + dir + AHUs.length) % AHUs.length;
    return AHUs[next].id;
  }
  function go(dir) {
    if (document.body.dataset.view !== 'ahu') return;
    const cur = parseHash().id;
    const nxt = neighbour(cur, dir);
    if (!nxt || nxt === cur) return;
    const app = document.getElementById('app');
    // Animate the outgoing view: slide in the OPPOSITE direction of the
    // swipe so it visually "leaves" toward the gesture origin.
    app.style.transition = 'transform 220ms ease, opacity 220ms ease';
    app.style.transform  = `translateX(${dir > 0 ? -36 : 36}px)`;
    app.style.opacity    = '0';
    setTimeout(() => {
      location.hash = '#/ahu/' + encodeURIComponent(nxt);
      // After the new view paints, animate it in from the opposite edge
      requestAnimationFrame(() => {
        app.style.transition = 'none';
        app.style.transform  = `translateX(${dir > 0 ? 36 : -36}px)`;
        app.style.opacity    = '0';
        requestAnimationFrame(() => {
          app.style.transition = 'transform 280ms cubic-bezier(.2,.7,.2,1), opacity 280ms ease';
          app.style.transform  = 'translateX(0)';
          app.style.opacity    = '1';
        });
      });
    }, 200);
  }

  document.addEventListener('touchstart', (e) => {
    if (document.body.dataset.view !== 'ahu') return;
    // Ignore swipes that start inside the modal or the dropdown (those have
    // their own scroll/tap semantics).
    const t = e.target;
    if (t.closest('#ahuModal') || t.closest('.dropdown')) return;
    const p = e.touches[0];
    startX = p.clientX; startY = p.clientY; startT = Date.now();
    tracking = true;
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const p = (e.changedTouches && e.changedTouches[0]) || null;
    if (!p) return;
    const dx = p.clientX - startX;
    const dy = p.clientY - startY;
    const dt = Date.now() - startT;
    if (dt > TH_T) return;
    if (Math.abs(dx) < TH_X || Math.abs(dy) > TH_Y) return;
    // Left-swipe (dx negative) → NEXT AHU.  Right-swipe → PREV.
    go(dx < 0 ? 1 : -1);
  }, { passive: true });

  document.addEventListener('keydown', (e) => {
    if (document.body.dataset.view !== 'ahu') return;
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });
})();
</script>
