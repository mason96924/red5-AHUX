<!DOCTYPE html>
<!--
  setup.html  —  PRODUCTION setup-walk page (1-time onboarding gate).
  Compiled JSX bundle: /setup_walk.compiled.js?v=6fe47d9133  (built from
  /app/frontend/src/setup-walk/setup_walk.jsx via build.sh).

  Gate behaviour:
    - First visit:         shows the 4-tile setup hub.
    - Subsequent visits:   instant redirect to /dashboard.html (the flag
                           "red5.setup.done" is set when the operator
                           clicks Open Dashboard or Skip all).
    - "?force=1" in URL:   bypass the gate (used by the dashboard's

-->
<html lang="en">

<!-- Cache-control: psy_3d.html and friends have no compiled bundle to ?v=-stamp, so the HTML itself must opt-out of browser caching. Without this, PROD users see stale UI after every deploy until they hard-refresh.  Sentinel data-cache-policy attribute is used by scripts/inject_no_cache_meta.py and deploy.sh preflight to detect missing tags.  Do NOT remove. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" data-cache-policy="no-cache">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red5 Studio — Setup</title>
<!-- One-time gate.  Runs synchronously BEFORE any other script so we
     never paint the setup UI just to redirect away on next tick. -->
<script>
(function(){
    try {
        var params = new URLSearchParams(location.search);
        if (params.get('force') !== '1' &&
            localStorage.getItem('red5.setup.done') === '1') {
            location.replace('/dashboard.html');
        }
    } catch (e) { /* private mode / SSR -- fall through to UI */ }
})();
</script>
