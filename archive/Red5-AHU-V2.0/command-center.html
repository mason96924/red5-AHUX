<!doctype html>
<html lang="en">
<head>
<!-- Cache-control: psy_3d.html and friends have no compiled bundle to ?v=-stamp, so the HTML itself must opt-out of browser caching. Without this, PROD users see stale UI after every deploy until they hard-refresh.  Sentinel data-cache-policy attribute is used by scripts/inject_no_cache_meta.py and deploy.sh preflight to detect missing tags.  Do NOT remove. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" data-cache-policy="no-cache">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<title>Red5 Command Center</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0b0f1a;color:#e2e8f0;font-family:ui-monospace,Menlo,monospace}
  header{padding:.6rem 1rem;background:#070a13;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:1rem;font-size:12px;letter-spacing:.15em}
  header b{color:#34d399}
  header a{color:#94a3b8;text-decoration:none;margin-left:auto}
  header a:hover{color:#34d399}
  .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:6px;height:calc(100% - 38px)}
  .panel{position:relative;background:#0f172a;border:1px solid #1e293b;border-radius:6px;overflow:hidden;cursor:pointer}
  .panel:hover{border-color:#34d399}
  .panel:hover .label{background:rgba(52,211,153,.15);color:#6ee7b7}
  .label{position:absolute;top:6px;left:8px;z-index:2;font-size:10px;font-weight:900;letter-spacing:.2em;color:#34d399;background:rgba(7,10,19,.85);padding:3px 8px;border-radius:3px;pointer-events:none}
  .open-hint{position:absolute;top:6px;right:8px;z-index:2;font-size:9px;color:#475569;background:rgba(7,10,19,.85);padding:3px 7px;border-radius:3px;pointer-events:none}
  .panel:hover .open-hint{color:#34d399}
  iframe{width:100%;height:100%;border:0;background:#0b0f1a;pointer-events:none}
</style>
</head>
<body>
<header>
  <b>RED5 COMMAND CENTER</b>
  <span style="color:#475569">| 4 SITES LIVE &middot; CLICK A PANEL TO OPEN IN NEW TAB</span>
  <a href="/dashboard.html">&larr; Back to dashboard</a>
</header>

<div class="grid" id="grid">
  <div class="panel" data-c="c1" data-testid="cc-panel-c1">
    <div class="label">C1 &middot; 192.168.1.158</div>
    <div class="open-hint">OPEN IN NEW TAB &#9654;</div>
    <iframe src="https://c1.geniusmason.com/" loading="lazy"></iframe>
  </div>
  <div class="panel" data-c="c2" data-testid="cc-panel-c2">
    <div class="label">C2 &middot; 192.168.1.208</div>
    <div class="open-hint">OPEN IN NEW TAB &#9654;</div>
    <iframe src="https://c2.geniusmason.com/" loading="lazy"></iframe>
  </div>
  <div class="panel" data-c="c3" data-testid="cc-panel-c3">
    <div class="label">C3 &middot; 192.168.1.167</div>
    <div class="open-hint">OPEN IN NEW TAB &#9654;</div>
    <iframe src="https://c3.geniusmason.com/" loading="lazy"></iframe>
  </div>
  <div class="panel" data-c="c4" data-testid="cc-panel-c4">
    <div class="label">C4 &middot; 192.168.1.169</div>
    <div class="open-hint">OPEN IN NEW TAB &#9654;</div>
    <iframe src="https://c4.geniusmason.com/" loading="lazy"></iframe>
  </div>
</div>

<script>
(function(){
  var grid = document.getElementById('grid');
  Array.prototype.forEach.call(grid.children, function(panel){
    panel.addEventListener('click', function(){
      var iframe = panel.querySelector('iframe');
      if (!iframe || !iframe.src) return;
      window.open(iframe.src, '_blank', 'noopener,noreferrer');
    });
  });
})();
</script>
</body>
</html>
