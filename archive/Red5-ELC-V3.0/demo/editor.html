<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Red5-ELC · Editor</title>
<style>
  :root {
    --bg: #0c0f13;
    --panel: #13181f;
    --panel-2: #1a2029;
    --line: #232b36;
    --text: #d8dde4;
    --muted: #6b7684;
    --accent: #d97a30;
    --accent-2: #f5a25b;
    --ok: #4ecb71;
    --warn: #e3b341;
    --bad: #ec5b56;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
               font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto; }
  ::selection { background: var(--accent); color: var(--bg); }
  a { color: var(--accent-2); }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px 14px; border-bottom: 1px solid var(--line); gap: 14px;
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .04em; font-weight: 600; }
  header h1 .sub { color: var(--muted); font-weight: 400; margin-left: 10px;
                    font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
  .toolbar { display: flex; gap: 8px; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px;
          border: 1px solid var(--line); border-radius: 999px; font-family: var(--mono);
          font-size: 12px; color: var(--muted); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background .2s; }
  .pill.ok .dot { background: var(--ok); }
  .pill.bad .dot { background: var(--bad); }

  button, .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font-family: inherit; font-size: 12.5px;
    cursor: pointer; transition: background .12s, border-color .12s;
  }
  button:hover, .btn:hover { background: #202832; border-color: #313b48; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #17110b; font-weight: 600; }
  button.primary:hover { background: var(--accent-2); }
  button.ghost { background: transparent; }
  button.icon { padding: 2px 7px; font-size: 12px; line-height: 1; }
  button.danger:hover { background: #3a1e1e; border-color: var(--bad); color: var(--bad); }

  main {
    display: grid;
    grid-template-columns: 260px 1fr 1fr;
    gap: 16px; padding: 16px 24px; height: calc(100vh - 62px);
  }
  section.panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-direction: column; min-height: 0;
  }
  section.panel > h2 {
    margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line);
    font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
  }
  section.panel > h2 .count { color: var(--text); font-family: var(--mono); font-size: 12px; }
  .panel-body { flex: 1; overflow-y: auto; padding: 12px; }

  /* Inline "new item" form */
  .new-form { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px;
              border-bottom: 1px solid var(--line); background: #10151b; }
  .new-form input[type="text"] {
    background: #0a0d11; color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 8px; font: inherit; font-size: 12.5px; flex: 1 1 130px;
  }
  .new-form input[type="color"] {
    width: 32px; height: 30px; border: 1px solid var(--line); border-radius: 5px;
    background: transparent; padding: 0; cursor: pointer;
  }
  .new-form button { flex: 0 0 auto; }

  /* Schedule chip (draggable) */
  .chip {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    margin-bottom: 8px; cursor: grab; user-select: none;
    transition: transform .06s, border-color .1s;
  }
  .chip:active { cursor: grabbing; }
  .chip:hover { border-color: #3a4552; }
  .chip.dragging { opacity: 0.4; }
  .chip .swatch { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; }
  .chip .name { flex: 1; font-size: 13px; font-family: var(--mono); }
  .chip .actions { display: flex; gap: 4px; opacity: 0; transition: opacity .1s; }
  .chip:hover .actions { opacity: 1; }

  /* Group card */
  .group-card {
    background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--muted);
    border-radius: 6px; margin-bottom: 12px; overflow: hidden;
    transition: border-color .12s, box-shadow .12s;
  }
  .group-card.drop-target {
    box-shadow: inset 0 0 0 2px var(--accent);
    background: #1c2028;
  }
  .group-card .card-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--line); background: #171d25;
  }
  .group-card .card-head .name { flex: 1; font-weight: 600; font-size: 13px; }
  .group-card .card-body { padding: 10px 12px; font-size: 12px; }
  .group-card .subhead { color: var(--muted); font-size: 10px;
                         letter-spacing: .15em; text-transform: uppercase; margin: 4px 0 6px; }
  .group-card .members, .group-card .schedules {
    display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px;
  }
  .group-card .empty { color: #4a5361; font-style: italic; font-size: 11px; }
  .member-tag, .schedule-tag {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px;
    background: #0e131a; border: 1px solid var(--line); border-radius: 3px;
    font-family: var(--mono); font-size: 11px;
  }
  .schedule-tag .swatch { width: 8px; height: 8px; border-radius: 2px; }
  .tag-x { background: none; border: none; color: var(--muted);
           cursor: pointer; padding: 0 2px; font-size: 12px; line-height: 1; }
  .tag-x:hover { color: var(--bad); }

  /* Device grid */
  .device-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 8px;
  }
  .device-cell {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px;
    padding: 10px 8px; text-align: center; cursor: grab; user-select: none;
    transition: transform .06s, border-color .1s;
    position: relative;
    border-left: 4px solid var(--muted);
  }
  .device-cell:active { cursor: grabbing; }
  .device-cell:hover { border-color: #3a4552; }
  .device-cell.dragging { opacity: 0.4; }
  .device-cell .id { font-family: var(--mono); font-size: 11px; color: var(--text); }
  .device-cell .groups { display: flex; gap: 2px; justify-content: center; margin-top: 4px; }
  .device-cell .g-swatch { width: 8px; height: 8px; border-radius: 50%; }

  .empty-state { color: var(--muted); text-align: center; padding: 30px 20px; font-size: 12.5px; }
  .empty-state code { background: #0a0d11; padding: 2px 6px; border-radius: 3px;
                      font-family: var(--mono); font-size: 11.5px; color: var(--accent-2); }

  /* Toast */
  #toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    color: var(--text); padding: 10px 14px; border-radius: 6px;
    font-size: 12.5px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    transform: translateY(6px); z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.err { border-left-color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>RED5-ELC · EDITOR <span class="sub">Phase 2 — offline</span></h1>
  <div class="toolbar">
    <span class="pill" id="conn-pill" data-testid="editor-conn-pill">
      <span class="dot"></span><span id="conn-text">checking…</span>
    </span>
    <button class="ghost" id="btn-seed" data-testid="editor-seed-btn">Seed 4 demo devices</button>
    <a href="/" class="btn ghost">← Demo console</a>
  </div>
</header>

<main>
  <!-- ============= SCHEDULES ============= -->
  <section class="panel" data-testid="panel-schedules">
    <h2>Schedules <span class="count" id="sch-count">0</span></h2>
    <form class="new-form" id="new-sch-form" autocomplete="off">
      <input type="text" name="name" placeholder="Schedule name" required
             data-testid="new-sch-name" />
      <input type="color" name="color" value="#38bdf8" data-testid="new-sch-color" />
      <button type="submit" class="primary" data-testid="new-sch-submit">+ Add</button>
    </form>
    <div class="panel-body" id="sch-list"></div>
  </section>

  <!-- ============= GROUPS ============= -->
  <section class="panel" data-testid="panel-groups">
    <h2>Groups <span class="count" id="grp-count">0</span></h2>
    <form class="new-form" id="new-grp-form" autocomplete="off">
      <input type="text" name="name" placeholder="Group name" required
             data-testid="new-grp-name" />
      <input type="color" name="color" value="#22c55e" data-testid="new-grp-color" />
      <button type="submit" class="primary" data-testid="new-grp-submit">+ Add</button>
    </form>
    <div class="panel-body" id="grp-list"></div>
  </section>

  <!-- ============= DEVICES ============= -->
  <section class="panel" data-testid="panel-devices">
    <h2>Devices <span class="count" id="dev-count">0</span></h2>
    <div class="panel-body" id="dev-grid"></div>
  </section>
</main>

<div id="toast" data-testid="toast"></div>

<script>
// ---------- state -----------------------------------------------------------
const state = {
  groups: [],
  schedules: [],
  devices: [],       // [{device, relay_state, ...}]  (device_id lives in .device)
  deviceGroups: {},  // device_id → [{gid, priority, color, name}]  (derived)
};

// ---------- HTTP helper -----------------------------------------------------
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const r = await fetch('/api/elc' + path, opts);
  const text = await r.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch (_) {}
  if (!r.ok) {
    const msg = (json && (json.detail || json.error)) || text || r.statusText;
    throw new Error(`${r.status} ${msg}`);
  }
  return json;
}

// ---------- toast -----------------------------------------------------------
let toastTimer = null;
function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// ---------- connection pill -------------------------------------------------
async function refreshConn() {
  const pill = document.getElementById('conn-pill');
  const text = document.getElementById('conn-text');
  try {
    const link = await api('GET', '/link');
    const connected = link.state === 'connected';
    pill.classList.toggle('ok', connected);
    pill.classList.toggle('bad', !connected);
    text.textContent = `link ${link.state}`;
  } catch (e) {
    pill.classList.remove('ok'); pill.classList.add('bad');
    text.textContent = 'api down';
  }
}

// ---------- derived: device → [groups] --------------------------------------
async function rebuildDeviceGroupsIndex() {
  // For each group we already have `.members` after get_group; combine into
  // a device→groups map so we can colour tiles by highest-priority group.
  const map = {};
  // We need each group's assigned schedules too — but for the tile colour
  // we colour by group membership (each group has one colour of its own).
  // If a device is in N groups, pick the group with the max # of assigned
  // schedules (proxy for "primary"); tie-break by first-added.
  for (const g of state.groups) {
    const full = await api('GET', `/groups/${g.id}`).catch(() => null);
    if (!full) continue;
    for (const did of (full.members || [])) {
      (map[did] = map[did] || []).push({
        gid: g.id, name: g.name, color: g.color,
        schedule_count: (full.schedules || []).length,
      });
    }
  }
  state.deviceGroups = map;
}

// ---------- rendering: schedule palette -------------------------------------
function renderSchedules() {
  const host = document.getElementById('sch-list');
  document.getElementById('sch-count').textContent = state.schedules.length;
  if (state.schedules.length === 0) {
    host.innerHTML = `<div class="empty-state">No schedules yet.<br>
      Add one above, then drag it onto a group.</div>`;
    return;
  }
  host.innerHTML = '';
  for (const s of state.schedules) {
    const el = document.createElement('div');
    el.className = 'chip';
    el.draggable = true;
    el.dataset.testid = `sch-chip-${s.id}`;
    el.dataset.type = 'schedule';
    el.dataset.id = s.id;
    el.innerHTML = `
      <span class="swatch" style="background:${s.color}"></span>
      <span class="name">${escapeHtml(s.name)}</span>
      <span class="actions">
        <button class="icon danger" title="Delete schedule"
                data-testid="sch-del-${s.id}">×</button>
      </span>`;
    el.addEventListener('dragstart', (ev) => {
      el.classList.add('dragging');
      ev.dataTransfer.setData('text/plain',
        JSON.stringify({ type: 'schedule', id: s.id }));
      ev.dataTransfer.effectAllowed = 'copy';
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    el.querySelector('button.danger').addEventListener('click', async (ev) => {
      ev.stopPropagation();
      if (!confirm(`Delete schedule "${s.name}"? Assignments will be dropped.`)) return;
      try { await api('DELETE', `/schedules/${s.id}`); await refreshAll(); toast('Schedule deleted'); }
      catch (e) { toast(e.message, true); }
    });
    host.appendChild(el);
  }
}

// ---------- rendering: group cards ------------------------------------------
function renderGroups() {
  const host = document.getElementById('grp-list');
  document.getElementById('grp-count').textContent = state.groups.length;
  if (state.groups.length === 0) {
    host.innerHTML = `<div class="empty-state">No groups yet.<br>
      Add one above, then drag <b>schedules</b> or <b>devices</b> onto it.</div>`;
    return;
  }
  host.innerHTML = '';
  for (const g of state.groups) {
    const card = document.createElement('div');
    card.className = 'group-card';
    card.style.borderLeftColor = g.color;
    card.dataset.testid = `group-card-${g.id}`;
    card.dataset.gid = g.id;
    card.innerHTML = `
      <div class="card-head">
        <span class="swatch" style="width:14px;height:14px;border-radius:3px;background:${g.color}"></span>
        <span class="name">${escapeHtml(g.name)}</span>
        <button class="icon danger" title="Delete group"
                data-testid="grp-del-${g.id}">×</button>
      </div>
      <div class="card-body">
        <div class="subhead">Schedules</div>
        <div class="schedules" data-role="schedules"></div>
        <div class="subhead" style="margin-top:10px">Members</div>
        <div class="members" data-role="members"></div>
      </div>`;
    // populate schedules + members (async — fetches the join view)
    fillGroupDetail(card, g.id);
    // drop target: schedules + devices both land here
    card.addEventListener('dragover', (ev) => {
      ev.preventDefault();
      ev.dataTransfer.dropEffect = 'copy';
      card.classList.add('drop-target');
    });
    card.addEventListener('dragleave', () => card.classList.remove('drop-target'));
    card.addEventListener('drop', async (ev) => {
      ev.preventDefault();
      card.classList.remove('drop-target');
      let payload;
      try { payload = JSON.parse(ev.dataTransfer.getData('text/plain')); }
      catch (_) { return; }
      try {
        if (payload.type === 'schedule') {
          // priority = current_max_in_this_group + 1
          const detail = await api('GET', `/groups/${g.id}`);
          const maxP = (detail.schedules || [])
            .reduce((m, s) => Math.max(m, s.priority || 0), 0);
          await api('POST', `/groups/${g.id}/schedules`,
                    { schedule_id: payload.id, priority: maxP + 1 });
          toast(`Schedule assigned to ${g.name}`);
        } else if (payload.type === 'device') {
          await api('POST', `/groups/${g.id}/members`, { device_id: payload.id });
          toast(`Device added to ${g.name}`);
        }
        await refreshAll();
      } catch (e) { toast(e.message, true); }
    });
    // delete-group button
    card.querySelector('button.danger').addEventListener('click', async () => {
      if (!confirm(`Delete group "${g.name}"? Members + assignments will be dropped.`)) return;
      try { await api('DELETE', `/groups/${g.id}`); await refreshAll(); toast('Group deleted'); }
      catch (e) { toast(e.message, true); }
    });
    host.appendChild(card);
  }
}

async function fillGroupDetail(card, gid) {
  let detail;
  try { detail = await api('GET', `/groups/${gid}`); }
  catch (_) { return; }
  const schHost = card.querySelector('[data-role=schedules]');
  const memHost = card.querySelector('[data-role=members]');
  // schedules
  if (!detail.schedules || detail.schedules.length === 0) {
    schHost.innerHTML = `<span class="empty">drop schedules here…</span>`;
  } else {
    schHost.innerHTML = '';
    for (const s of detail.schedules) {
      const t = document.createElement('span');
      t.className = 'schedule-tag';
      t.dataset.testid = `grp-${gid}-sch-${s.id}`;
      t.innerHTML = `
        <span class="swatch" style="background:${s.color}"></span>
        ${escapeHtml(s.name)}
        <span style="color:var(--muted);font-size:10px">p${s.priority}</span>
        <button class="tag-x" title="Unassign">×</button>`;
      t.querySelector('.tag-x').addEventListener('click', async () => {
        try { await api('DELETE', `/groups/${gid}/schedules/${s.id}`); await refreshAll(); }
        catch (e) { toast(e.message, true); }
      });
      schHost.appendChild(t);
    }
  }
  // members
  if (!detail.members || detail.members.length === 0) {
    memHost.innerHTML = `<span class="empty">drop devices here…</span>`;
  } else {
    memHost.innerHTML = '';
    for (const did of detail.members) {
      const t = document.createElement('span');
      t.className = 'member-tag';
      t.dataset.testid = `grp-${gid}-mem-${did}`;
      t.innerHTML = `${escapeHtml(did)}
        <button class="tag-x" title="Remove">×</button>`;
      t.querySelector('.tag-x').addEventListener('click', async () => {
        try { await api('DELETE', `/groups/${gid}/members/${did}`); await refreshAll(); }
        catch (e) { toast(e.message, true); }
      });
      memHost.appendChild(t);
    }
  }
}

// ---------- rendering: device grid ------------------------------------------
function renderDevices() {
  const host = document.getElementById('dev-grid');
  document.getElementById('dev-count').textContent = state.devices.length;
  if (state.devices.length === 0) {
    host.innerHTML = `<div class="empty-state">
      No devices seen yet.<br>
      Click <code>Seed 4 demo devices</code> above to populate the replica.
    </div>`;
    return;
  }
  host.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'device-grid';
  for (const d of state.devices) {
    const did = d.device;
    const memberships = state.deviceGroups[did] || [];
    // primary group = one with most assigned schedules
    const primary = memberships
      .slice()
      .sort((a, b) => (b.schedule_count - a.schedule_count))[0];
    const cell = document.createElement('div');
    cell.className = 'device-cell';
    cell.draggable = true;
    cell.dataset.testid = `dev-cell-${did}`;
    cell.style.borderLeftColor = primary ? primary.color : 'var(--muted)';
    cell.title = memberships.length
      ? memberships.map(m => `${m.name} (${m.schedule_count} sched)`).join('\n')
      : 'unassigned';
    cell.innerHTML = `
      <div class="id">${escapeHtml(did)}</div>
      <div class="groups">
        ${memberships.map(m =>
          `<span class="g-swatch" style="background:${m.color}"></span>`
        ).join('')}
      </div>`;
    cell.addEventListener('dragstart', (ev) => {
      cell.classList.add('dragging');
      ev.dataTransfer.setData('text/plain',
        JSON.stringify({ type: 'device', id: did }));
      ev.dataTransfer.effectAllowed = 'copy';
    });
    cell.addEventListener('dragend', () => cell.classList.remove('dragging'));
    grid.appendChild(cell);
  }
  host.appendChild(grid);
}

// ---------- refreshAll ------------------------------------------------------
async function refreshAll() {
  const [groupsRes, schRes, devRes] = await Promise.all([
    api('GET', '/groups'),
    api('GET', '/schedules'),
    api('GET', '/devices'),
  ]);
  state.groups = groupsRes.groups || [];
  state.schedules = schRes.schedules || [];
  state.devices = devRes || [];
  await rebuildDeviceGroupsIndex();
  renderSchedules();
  renderGroups();
  renderDevices();
}

// ---------- form wiring -----------------------------------------------------
document.getElementById('new-sch-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const name = fd.get('name').trim();
  const color = fd.get('color');
  if (!name) return;
  try {
    await api('POST', '/schedules',
              { name, color, rules: null, enabled: true });
    ev.target.reset();
    ev.target.querySelector('input[name=color]').value = randomColor();
    await refreshAll();
    toast('Schedule added');
  } catch (e) { toast(e.message, true); }
});

document.getElementById('new-grp-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const name = fd.get('name').trim();
  const color = fd.get('color');
  if (!name) return;
  try {
    await api('POST', '/groups', { name, color });
    ev.target.reset();
    ev.target.querySelector('input[name=color]').value = randomColor();
    await refreshAll();
    toast('Group added');
  } catch (e) { toast(e.message, true); }
});

document.getElementById('btn-seed').addEventListener('click', async () => {
  const btn = document.getElementById('btn-seed');
  btn.disabled = true;
  const devices = ['SRM/1/10/0', 'SRM/1/20/0', 'SRM/1/30/0', 'SRM/1/40/0'];
  try {
    for (const d of devices) {
      await api('POST', `/devices/${d}/relay`, { state: true });
    }
    // give the MockScu echo a beat to hit the replica
    await new Promise(r => setTimeout(r, 400));
    await refreshAll();
    toast('4 demo devices seeded');
  } catch (e) { toast(`Seed failed: ${e.message}`, true); }
  finally { btn.disabled = false; }
});

// ---------- utils -----------------------------------------------------------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
  ));
}
function randomColor() {
