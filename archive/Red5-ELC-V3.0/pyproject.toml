[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "red5-elc"
version = "0.1.0"
description = "Red5 controller's replacement for the SCU PC counterpart (ELC protocol)."
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "Red5 / DIBT" }]
dependencies = [
    # Runtime deps for the FastAPI stack + scheduling engine (Phase 4).
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "websockets>=12.0",
    "astral>=3.2",              # sunrise/sunset/civil-twilight, DST-aware
    "holidays>=0.50",           # per-country holiday calendars, offline
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    # Starlette 0.50+'s TestClient imports `httpx2` instead of `httpx`.
    # Pinning both keeps the ASGI-transport tests (httpx) and the sync
    # TestClient tests (httpx2) working side-by-side.
    "httpx2>=2.5",
    "freezegun>=1.4",           # frozen-clock tests for the scheduler
]

[tool.setuptools.packages.find]
include = ["elc*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # uvicorn 0.49 + websockets 16 trip these on every WS request; benign.
    "ignore::DeprecationWarning:websockets.legacy",
    "ignore::DeprecationWarning:websockets.legacy.server",
    "ignore::DeprecationWarning:uvicorn.protocols.websockets.websockets_impl",
]

[tool.coverage.run]
branch = true
source = ["elc"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
