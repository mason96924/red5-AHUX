                                if (eq !== vavEquipId) continue;
                                if (nowMs - pw[k].ts > 15000) { delete pw[k]; continue; }
                                out[lbl] = pw[k].value;
                            }
                            return out;
                        })();
                        const vavVn = (k) => { const v = vavAp[k]; return typeof v === 'number' ? v : (v != null ? parseFloat(v) || 0 : 0); };
                        const vavIsBool = (k) => { const v = vavAp[k]; return v === 1 || v === true || v === '1'; };

                        const writeVavRW = (label, value) => {
                            const num = parseFloat(value);
                            if (isNaN(num)) return;
                            window._lastWriteSig = window._lastWriteSig || {};
                            const dbKey = `${vavEquipId}|${label}`;
                            const now = Date.now();
                            if (window._lastWriteSig[dbKey] && now - window._lastWriteSig[dbKey] < 300) return;
                            window._lastWriteSig[dbKey] = now;
                            window._pendingWrites = window._pendingWrites || {};
                            window._pendingWrites[dbKey] = { value: num, ts: now };
                            _setForceApTick(t => t + 1);
                            setAhuData(prev => prev.map(a => ({

                                vavs: (a.vavs || []).map(v => v.id === vavEquipId

                                    : v)
                            })));
                            fetch(`${API_URL}/api/write-point`, {
                                method: 'POST', headers: {'Content-Type':'application/json'},
                                body: JSON.stringify({ equipment_name: vavEquipId, writes: { [label]: num } })
                            }).then(r => r.json()).then(d => {

                        const vavIsPopped = !!(vavModalPopupWin && vavModalPopupHost);
                        const vavOuterStyle = vavIsPopped

                        const vavOuterCls = vavIsPopped

                        const vavModalTree = (
                            <div className={vavOuterCls} style={vavOuterStyle}>
                                <div className={`${theme === 'dark' ? 'bg-slate-900 border-slate-700 text-slate-200' : 'bg-[#e2e5e8] border-white/20 text-slate-800'} ${vavIsPopped ? '' : 'rounded-xl border-2'} shadow-2xl relative flex flex-col overflow-hidden`} style={vavInnerStyle} onMouseDown={e => e.stopPropagation()}>
                                    
                                    <div className={`cursor-grab active:cursor-grabbing ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-slate-300/60 border-slate-300'} backdrop-blur-md border-b p-3 flex justify-between items-center z-[60]`} onMouseDown={(e) => { if (vavIsPopped) return; setIsVavModalDragging(true); setDragStart({ x: e.clientX - vavModalOffset.x, y: e.clientY - vavModalOffset.y }); }}>

                                            <span className={`ml-3 inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full border text-[9px] font-mono font-bold tracking-wider ${modalBandTrim.sun_trim_c < 0
                                                ? (theme === 'dark' ? 'bg-amber-500/15 border-amber-500/50 text-amber-400' : 'bg-amber-100 border-amber-400 text-amber-700')

                                                ? (theme === 'dark' ? 'bg-sky-500/15 border-sky-500/50 text-sky-400' : 'bg-sky-100 border-sky-400 text-sky-700')
                                                : (theme === 'dark' ? 'bg-slate-700/40 border-slate-600 text-slate-400' : 'bg-slate-200 border-slate-300 text-slate-500')
                                            }`} title={`Sun-exposure ${(modalBandTrim.sun_score*100).toFixed(0)}% on this VAV → band ${modalBandTrim.id} SA target ${modalBandTrim.base_sa_t}°C ${modalBandTrim.sun_trim_c >= 0 ? '+' : ''}${modalBandTrim.sun_trim_c.toFixed(2)}°C ⇒ ${modalBandTrim.sa_t_sp}°C local target`}>
                                                <span className="text-[8px] opacity-70 uppercase">{modalBandTrim.id}</span>
                                                <span>SA {modalBandTrim.sa_t_sp}°C</span>
                                                {modalBandTrim.sun_trim_c !== 0 && <span className="opacity-80">({modalBandTrim.sun_trim_c > 0 ? '+' : ''}{modalBandTrim.sun_trim_c.toFixed(2)} sun)</span>}
                                            </span>
                                        )}<span style={{color:'#64748b', fontSize:'10px', marginLeft:'8px', fontWeight:'normal'}}>{vavIsPopped ? 'Resize the popped-out window directly' : 'Drag corner ↘ to resize'}</span></h3>
                                        <div className="flex items-center gap-2 mr-1" onMouseDown={e => e.stopPropagation()}>
                                            <button

                                                className={`px-2 py-0.5 border rounded text-[8px] font-black uppercase tracking-wider transition-all ${vavIsPopped ? 'bg-emerald-700 border-emerald-400 text-white hover:bg-emerald-600' : (theme === 'dark' ? 'bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700 hover:border-cyan-500 hover:text-cyan-300' : 'bg-white border-slate-300 text-slate-600 hover:bg-slate-100 hover:border-cyan-500 hover:text-cyan-600')}`}
                                            >
                                                {vavIsPopped ? '\u21A9 ATTACH' : '\u2197 POP OUT'}
                                            </button>
                                            <button className={`${theme === 'dark' ? 'text-slate-400 hover:text-white' : 'text-slate-500 hover:text-slate-800'} transition-colors cursor-pointer`} onClick={() => setSelectedVavForModal(null)}>
                                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                            </button>
                                        </div>
                                    </div>

                                    <div className={`relative w-full flex-1 ${theme === 'dark' ? 'bg-[#d0d4d8]' : 'bg-[#d8dce0]'} overflow-hidden flex items-center justify-center p-2`}>
                                        {!effectiveVavImage ? (

                                            <div className="absolute inset-0 pointer-events-none">

                                                    const gScale = p.scale || 1.0;

                                                    const minVal = parseFloat(p.min);
                                                    const maxVal = parseFloat(p.max);
                                                    const isDigital = minVal === 0 && maxVal === 1;
                                                    const rawVal = vavAp[p.label];
                                                    const numVal = typeof rawVal === 'number' ? rawVal : (rawVal != null ? parseFloat(rawVal) || 0 : 0);
                                                    const boolVal = rawVal === 1 || rawVal === true || rawVal === '1';
                                                    const displayName = (p.name && p.name !== p.label) ? p.name : p.label;

                                                    const renderCtl = () => {
                                                        if (isDigital) {
                                                            if (isRW) {
                                                                return (
                                                                    <button type="button" className="relative inline-flex items-center cursor-pointer pointer-events-auto bg-transparent border-0 p-0 select-none" onClick={e => { e.stopPropagation(); e.preventDefault(); writeVavRW(p.label, boolVal ? 0 : 1); }} onMouseDown={e => e.preventDefault()}>
                                                                        <div className={`w-7 h-4 rounded-full shadow-inner relative ${boolVal ? 'bg-emerald-500' : 'bg-slate-700'}`}>

                                                            return <div className={`px-1.5 py-0.5 rounded text-[7px] font-black border uppercase tracking-widest ${boolVal ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50' : 'bg-slate-700/20 text-slate-500 border-slate-600/50'}`}>{boolVal ? 'ON' : 'OFF'}</div>;

                                                            const bump = (delta) => {

                                                            return (
                                                                <div className="flex items-center gap-1 pointer-events-auto">
                                                                    <button type="button" onClick={e => { e.stopPropagation(); bump(-step); }} className="w-5 h-5 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 rounded text-white text-sm font-black flex items-center justify-center transition-colors select-none">−</button>
                                                                    <input id={inpId} type="text" inputMode="decimal" defaultValue={numVal.toFixed(1)} onKeyDown={e => { if (e.key === 'Enter') { writeVavRW(p.label, e.target.value); e.target.blur(); } }} onBlur={e => writeVavRW(p.label, e.target.value)} onClick={e => e.stopPropagation()} className="no-spinner w-12 bg-slate-900 border border-slate-600 rounded px-1 py-0.5 text-emerald-400 font-mono text-[10px] font-black text-right outline-none focus:border-emerald-500" />
                                                                    <button type="button" onClick={e => { e.stopPropagation(); bump(+step); }} className="w-5 h-5 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 rounded text-white text-sm font-black flex items-center justify-center transition-colors select-none">+</button>
                                                                    {p.unit && <span className="text-[7px] font-black text-slate-400">{p.unit}</span>}

                                                        return <div className="font-mono text-[10px] font-black text-emerald-400 whitespace-nowrap">{rawVal != null ? numVal.toFixed(1) : '--'} {p.unit && <span className="text-[8px] text-slate-400 ml-0.5">{p.unit}</span>}</div>;

                                                    return (
                                                        <div key={`vpt_${pi}_${p.label}`} className="absolute z-20" style={{left:`${p.x}%`,top:`${p.y}%`,transform:`translate(-50%,-50%) scale(${gScale})`,transformOrigin:'center center'}}>
                                                            {isRW ? (
                                                                <div className="flex flex-col bg-slate-950/95 border border-amber-700/60 rounded shadow-xl backdrop-blur-md min-w-[150px]">

                                                                        </div>
                                                                        <span className="text-[6px] font-black text-amber-500/70 uppercase tracking-widest">RW</span>
                                                                    </div>
                                                                    <div className="flex items-center justify-between px-2 py-0.5">
                                                                        <span className="text-[7px] font-black uppercase tracking-wider text-amber-400">{p.label}</span>

                                                                    </div>
                                                                </div>

                                                                <div className="flex flex-row gap-2 px-2.5 py-1 bg-slate-900/90 border border-slate-700 rounded-full shadow-xl backdrop-blur-md items-center">
                                                                    <div className="w-2 h-2 rounded-full flex-shrink-0 bg-emerald-500 shadow-[0_0_8px_#10b981]"></div>
                                                                    <span className="font-mono text-[8px] font-black uppercase tracking-widest text-white whitespace-nowrap">{displayName}</span>
                                                                    {renderCtl()}
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}

                                                {/* === SCHEMA-DRIVEN VAV ANIMATIONS === */}
                                                {(() => {
                                                    const vavImgScale = (vavImgDims.dispW && vavImgDims.natW) ? (vavImgDims.dispW / vavImgDims.natW) : 1;
                                                    return vavSchemaAnimations.map((a, ai) => {
                                                        if (a.x == null || a.y == null) return null;
                                                        const tKey = a.telemetry_key || '';
                                                        const tVal = vavVn(tKey);
                                                        const isAlarm = vavIsBool(tKey + '_ALM');
                                                        const isRunning = vavIsBool(tKey + '_STATUS') || tVal > 0;
                                                        const atype = a.animation_type;

                                                        if (atype === 'air_flow_path' && typeof PreviewAirFlowSimulator !== 'undefined') {
                                                            // Schema-migration (2026-02): segment offsets are now stored as
                                                            // offsetXFrac/offsetYFrac (fraction of natural image width). The

                                                            // no longer needs a transform: scale(vavImgScale) workaround.
                                                            return (

                                                            const hz = tVal;
                                                            const amps = (hz / 60) * 8.5;

                                    <div className={`cursor-grab active:cursor-grabbing ${dk ? 'bg-slate-900 border-slate-800' : 'bg-slate-300/60 border-slate-300'} backdrop-blur-md border-b p-2.5 flex justify-between items-center z-[60]`} onMouseDown={(e) => { if (ahuModalPopupWin) return; setIsAhuModalDragging(true); setDragStart({ x: e.clientX - ahuModalOffset.x, y: e.clientY - ahuModalOffset.y }); }}>
                                        <h3 className={`text-sm font-black tracking-widest ml-2 ${dk ? 'text-slate-300' : 'text-slate-700'}`}>{showAhuModalFor} EQUIPMENT DIAGRAM <span style={{color:'#64748b', fontSize:'10px', marginLeft:'8px', fontWeight:'normal'}}>{ahuModalPopupWin ? 'Resize the popped-out window directly' : 'Drag corner ↘ to resize'}</span></h3>
                                        <div className="flex items-center gap-2 mr-1" onMouseDown={e => e.stopPropagation()}>
                                            <button
                                                data-testid="popout-ahu-modal-btn"
                                                onClick={() => { if (ahuModalPopupWin && !ahuModalPopupWin.closed) { ahuModalPopupWin.close(); } else { popOutAhuModal(); } }}
                                                title={ahuModalPopupWin ? 'Re-attach modal to this window' : 'Pop modal out into a draggable window (move it to another monitor)'}
                                                className={`px-2 py-0.5 border rounded text-[8px] font-black uppercase tracking-wider transition-all ${ahuModalPopupWin ? 'bg-emerald-700 border-emerald-400 text-white hover:bg-emerald-600' : (dk ? 'bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700 hover:border-cyan-500 hover:text-cyan-300' : 'bg-white border-slate-300 text-slate-600 hover:bg-slate-100 hover:border-cyan-500 hover:text-cyan-600')}`}
                                            >
                                                {ahuModalPopupWin ? '\u21A9 ATTACH' : '\u2197 POP OUT'}
                                            </button>
                                            <button className={`${dk ? 'text-slate-400 hover:text-white' : 'text-slate-500 hover:text-slate-800'} transition-colors cursor-pointer`} onClick={() => setShowAhuModalFor(null)}>
                                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                            </button>
                                        </div>
                                    </div>

                                    <div ref={ahuBodyRef} className={`relative w-full flex-1 ${dk ? 'bg-[#d0d4d8]' : 'bg-[#d8dce0]'} overflow-hidden flex items-center justify-center p-2`}>
                                        {!currentAhuImage ? (
                                            <div className="flex flex-col items-center justify-center font-bold text-center font-mono text-[10px] w-full h-full">
                                                <span className="mb-2 uppercase tracking-widest text-red-600 text-lg">{window.t ? window.t("ahu_image_missing") : "AHU IMAGE MISSING"}</span>
                                                <span className="text-xs">Upload: ahu_type_{ahuTypeId || 'N'}.jpg</span>
                                            </div>
                                        ) : (
                                        <div className="relative inline-block pointer-events-auto shadow-[0_0_50px_rgba(0,0,0,0.15)]" style={{ perspective: '1500px' }}>
                                            <img ref={ahuImgRef} src={currentAhuImage} alt="AHU"
                                                 className="block max-w-full pointer-events-none"
                                                 style={{ maxHeight: 'calc(100% - 4px)' }}
                                                 onLoad={(e) => { const im = e.target; setAhuImgDims({ natW: im.naturalWidth || 1600, natH: im.naturalHeight || 700, dispW: im.offsetWidth, dispH: im.offsetHeight }); }} />
                                            <div className="absolute inset-0 pointer-events-none" style={{ perspective: '1500px' }}>

                                        {/* === SCHEMA-DRIVEN OVERLAYS (mirrors Config Tool groupedPoints renderer) === */}
                                        {groupedPoints.map((grp, gi) => {
                                            if (grp.x == null || grp.y == null) return null;
                                            const gScale = grp.scale || 1.0;
                                            const hasRW = grp.points.some(p => p.access === 'RW');
                                            const displayName = grp.name;

                                            // renderValueControl — mirrors equipment_mapper.html renderValueControl
                                            const renderValueControl = (p) => {
                                                const minVal = parseFloat(p.min);
                                                const maxVal = parseFloat(p.max);
                                                const isDigital = minVal === 0 && maxVal === 1;
                                                const isRW = p.access === 'RW';
                                                const rawVal = ap[p.label];
                                                const numVal = typeof rawVal === 'number' ? rawVal : (rawVal != null ? parseFloat(rawVal) || 0 : 0);
                                                const boolVal = rawVal === 1 || rawVal === true || rawVal === '1';

                                                if (isDigital) {
                                                    if (isRW) {
                                                        return (
                                                            <button type="button" className="relative inline-flex items-center cursor-pointer pointer-events-auto bg-transparent border-0 p-0 select-none" onClick={e => { e.stopPropagation(); e.preventDefault(); writeRW(p.label, boolVal ? 0 : 1); }} onMouseDown={e => e.preventDefault()}>
                                                                <div className={`w-7 h-4 rounded-full shadow-inner relative ${boolVal ? 'bg-emerald-500' : 'bg-slate-700'}`}>
                                                                    <div className={`absolute top-[2px] bg-white border-slate-300 border rounded-full h-3 w-3 transition-all ${boolVal ? 'left-[14px]' : 'left-[2px]'}`}></div>
                                                                </div>
                                                            </button>
                                                        );
                                                    }
                                                    return <div className={`px-1.5 py-0.5 rounded text-[7px] font-black border uppercase tracking-widest ${boolVal ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50' : 'bg-slate-700/20 text-slate-500 border-slate-600/50'}`}>{boolVal ? 'ON' : 'OFF'}</div>;
                                                }
                                                // Analog
                                                if (isRW) {
                                                    const step = 0.1;
                                                    const inpId = `ahu_inp_${p.label}`;
                                                    const readCur = () => {
                                                        const el = document.getElementById(inpId);
                                                        const v = el ? parseFloat(el.value) : numVal;
                                                        return isNaN(v) ? numVal : v;
                                                    };
                                                    const bump = (delta) => {
                                                        const nv = +(readCur() + delta).toFixed(3);
                                                        const el = document.getElementById(inpId);
                                                        if (el) el.value = nv.toFixed(1);
                                                        writeRW(p.label, nv);
                                                    };
                                                    return (
                                                        <div className="flex items-center gap-1 pointer-events-auto">
                                                            <button type="button" onClick={e => { e.stopPropagation(); bump(-step); }} className="w-5 h-5 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 rounded text-white text-sm font-black flex items-center justify-center transition-colors select-none">−</button>
                                                            <input id={inpId} type="text" inputMode="decimal" defaultValue={numVal.toFixed(1)} onKeyDown={e => { if (e.key === 'Enter') { writeRW(p.label, e.target.value); e.target.blur(); } }} onBlur={e => writeRW(p.label, e.target.value)} onClick={e => e.stopPropagation()} className="no-spinner w-12 bg-slate-900 border border-slate-600 rounded px-1 py-0.5 text-emerald-400 font-mono text-[10px] font-black text-right outline-none focus:border-emerald-500" />
                                                            <button type="button" onClick={e => { e.stopPropagation(); bump(+step); }} className="w-5 h-5 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 rounded text-white text-sm font-black flex items-center justify-center transition-colors select-none">+</button>
                                                            {p.unit && <span className="text-[7px] font-black text-slate-400">{p.unit}</span>}
                                                        </div>
                                                    );
                                                }
                                                return <div className="font-mono text-[10px] font-black text-emerald-400 whitespace-nowrap">{numVal.toFixed(1)} {p.unit && <span className="text-[8px] text-slate-400 ml-0.5">{p.unit}</span>}</div>;
                                            };

                                            return (
                                                <div key={`grp_${gi}`} className="absolute z-20" style={{left:`${grp.x}%`,top:`${grp.y}%`,transform:`translate(-50%,-50%) scale(${gScale})`,transformOrigin:'center center'}}>
                                                    {hasRW ? (
                                                        // RW DATABOX — amber-bordered rectangular
                                                        <div className="flex flex-col bg-slate-950/95 border border-amber-700/60 rounded shadow-xl backdrop-blur-md min-w-[150px]">
                                                            <div className="flex items-center justify-between px-2 py-1 border-b border-amber-800/40">
                                                                <div className="flex items-center gap-1.5">
                                                                    <div className="w-1.5 h-1.5 rounded-full flex-shrink-0 bg-amber-400 shadow-[0_0_6px_#f59e0b]"></div>
                                                                    <span className="font-mono text-[8px] font-black uppercase tracking-widest text-amber-300 whitespace-nowrap">{displayName}</span>
                                                                </div>
                                                                <span className="text-[6px] font-black text-amber-500/70 uppercase tracking-widest">RW</span>
                                                            </div>
                                                            <div className="flex flex-col">
                                                                {grp.points.map((p, pIdx) => (
                                                                    <div key={`db-${p.label}-${pIdx}`} className={`flex items-center justify-between px-2 py-0.5 ${pIdx > 0 ? 'border-t border-slate-800/40' : ''}`}>
                                                                        <span className={`text-[7px] font-black uppercase tracking-wider ${p.access === 'RW' ? 'text-amber-400' : 'text-slate-500'}`}>{p.label}</span>
                                                                        <div className="flex items-center">{renderValueControl(p)}</div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ) : grp.isGroup ? (
                                                        // RO GROUP PILL — rounded-xl with emerald dot + values wrapped
                                                        <div className="flex flex-col gap-1 px-3 py-1.5 bg-slate-900/90 border border-slate-700 rounded-xl shadow-xl backdrop-blur-md items-center">
                                                            <div className="flex items-center justify-center gap-1.5 w-full border-b border-slate-700/50 pb-0.5 mb-0.5">
                                                                <div className="w-1.5 h-1.5 rounded-full flex-shrink-0 bg-emerald-500 shadow-[0_0_8px_#10b981]"></div>
                                                                <span className="font-mono text-[9px] font-black uppercase tracking-widest text-white whitespace-nowrap">{displayName}</span>
                                                            </div>
                                                            <div className="flex flex-row flex-wrap gap-x-2 gap-y-1 justify-center max-w-[280px]">
                                                                {grp.points.map((p, pIdx) => (
                                                                    <div key={`comp-${p.label}-${pIdx}`} className="flex items-center">{renderValueControl(p)}</div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        // RO SINGLE PILL — rounded-full
                                                        <div className="flex flex-row gap-2 px-2.5 py-1 bg-slate-900/90 border border-slate-700 rounded-full shadow-xl backdrop-blur-md items-center">
                                                            <div className="w-2 h-2 rounded-full flex-shrink-0 bg-emerald-500 shadow-[0_0_8px_#10b981]"></div>
                                                            {renderValueControl(grp.points[0])}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}

                                        {/* === SCHEMA-DRIVEN ANIMATIONS === */}
                                        <div className="absolute inset-0 pointer-events-none" style={{perspective:'1500px'}}>
                                        {schemaAnimations.map((a, ai) => {
                                            if (a.x == null || a.y == null) return null;
                                            const tKey = a.telemetry_key || '';
                                            const tVal = vn(tKey);
                                            const isAlarm = isBool(tKey + '_ALM');
                                            const isRunning = isBool(tKey + '_STATUS') || tVal > 0;
                                            const isAuto = isBool(tKey + '_SST');
                                            const isHeatingMode = a.element_id && a.element_id.toLowerCase().includes('heat');
                                            const atype = a.animation_type;

                                            if (atype === 'vfd_aligner') {
                                                const chassisW = a.base_w || 220, chassisH = a.base_h || 300;
                                                const screenW = a.screen_w || 140, screenH = a.screen_h || 85;
                                                const pillW = a.pill_w || 100, pillH = a.pill_h || 32;
                                                const hz = tVal;
                                                const amps = (hz / 60) * 8.5;
                                                return (
                                                    <div key={`anim_${ai}`} className="absolute z-20" style={{left:`${a.x}%`, top:`${a.y}%`, transform:`scale(${a.scale ?? 1.0})`}}>
                                                        <div className="relative w-0 h-0">
                                                            <div className="absolute" style={{left:0,top:0,width:chassisW+'px',height:chassisH+'px',transform:'translate(-50%,-50%)'}}>
                                                                {typeof PreviewVFDChassis !== 'undefined' && <PreviewVFDChassis imageData={a.image_data} isRunning={isRunning} isAlarm={isAlarm} />}
                                                            </div>
                                                            <div className="absolute" style={{left:(a.screen_dx||0)+'px',top:(a.screen_dy||0)+'px',width:screenW+'px',height:screenH+'px',transform:`translate(-50%,-50%) scale(${a.screen_scale ?? 1.0})`}}>
                                                                {typeof PreviewVFDDisplay !== 'undefined' && <PreviewVFDDisplay targetHz={hz} actualHz={isRunning?hz:0} amps={isRunning?amps:0} isRunning={isRunning} hasFault={isAlarm} />}
                                                            </div>
                                                            <div className="absolute" style={{left:(a.pill_dx||0)+'px',top:(a.pill_dy||0)+'px',width:pillW+'px',height:pillH+'px',transform:`translate(-50%,-50%) scale(${a.pill_scale ?? 1.0})`}}>
                                                                {typeof PreviewVFDPill !== 'undefined' && <PreviewVFDPill isActivated={true} isRunning={isRunning} hasFault={isAlarm} onToggleActivate={()=>{}} />}
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            }

                                            if (atype === 'air_flow_path' && typeof PreviewAirFlowSimulator !== 'undefined') {
                                                return (
                                                    <div key={`anim_${ai}`} className="absolute z-10" style={{left:`${a.x}%`, top:`${a.y}%`, pointerEvents:'none'}}>
                                                        <PreviewAirFlowSimulator segments={a.segments || []} fanSpeed={fanSpeed} isActive={fanRunning} antiFreeze={isFreeze} heating={isHeatingMode} oat={oaTemp} sat={saTemp} allSensors={schemaPoints} containerW={ahuImgDims.dispW} naturalW={ahuImgDims.natW} />
                                                    </div>
                                                );
                                            }

                                            const wPx = a.base_w || 150, hPx = a.base_h || 150;
                                            const transformStyle = `scale(${a.scale||1}) scaleX(${a.stretchX||1}) scaleY(${a.stretchY||1}) skewX(${a.skewX||0}deg) skewY(${a.skewY||0}deg) rotateX(${a.rotX||0}deg) rotateY(${a.rotY||0}deg) rotateZ(${a.rotZ||0}deg)`;
                                            const isSplitDP = atype === 'diff_pressure_switch';
                                            const sX = a.sensor_x != null ? a.sensor_x : a.x;
                                            const sY = a.sensor_y != null ? a.sensor_y : a.y - 20;
                                            const sScale = a.sensor_scale != null ? a.sensor_scale : 0.8;
                                            // Decoupled M|R/S pill for centrifugal_fan — mirrors the mapper's
                                            // "DECOUPLED PILL BODY (For Fans)" block (equipment_mapper.html
                                            // ~line 4840).  Driven by real telemetry (isAuto / isRunning /
                                            // isAlarm) instead of the mapper's simulator state.  Position is
                                            // independent of the fan body (a.pill_x / a.pill_y in the schema)
                                            // so the operator can place the toggle wherever it reads best.
                                            const hasFanPill = atype === 'centrifugal_fan';
                                            const pX = a.pill_x != null ? a.pill_x : a.x;
                                            const pY = a.pill_y != null ? a.pill_y : a.y + 10;
                                            const pScale = a.pill_scale != null ? a.pill_scale : 1.0;
                                            const fanOn = isRunning && !isAlarm;
                                            return (
                                                <React.Fragment key={`anim_frag_${ai}`}>
                                                <div key={`anim_${ai}`} className="absolute z-20" style={{left:`${a.x}%`,top:`${a.y}%`,width:wPx+'px',height:hPx+'px',marginLeft:`-${wPx/2}px`,marginTop:`-${hPx/2}px`,transform:transformStyle,transformStyle:'preserve-3d'}}>
                                                    <div className="absolute inset-0 flex items-center justify-center" style={{transformStyle:'preserve-3d'}}>
                                                        {atype === 'centrifugal_fan' && typeof PreviewCentrifugalFan !== 'undefined' && <PreviewCentrifugalFan outlinePath={a.outline_path} isAuto={isAuto} isManualRunning={!isAuto && isRunning} fanSpeed={tVal} hasFault={isAlarm} isActive={false} />}
                                                        {['rectangular_fan','rectangular_fan_aligner'].includes(atype) && typeof PreviewRectangularFan !== 'undefined' && <PreviewRectangularFan isAuto={isAuto} isManualRunning={!isAuto && isRunning} fanSpeed={tVal} hasFault={isAlarm} />}
                                                        {['hydration_valve','hydration_valve_aligner'].includes(atype) && typeof PreviewHydrationValve !== 'undefined' && <PreviewHydrationValve hydrateLevel={tVal} isHeating={isHeatingMode} width={wPx} height={hPx} rotX={a.rotX||0} rotY={a.rotY||0} rotZ={a.rotZ||0} />}
                                                        {['antifreeze_coil_valve','antifreeze_coil'].includes(atype) && typeof PreviewAntiFreezeCoil !== 'undefined' && <PreviewAntiFreezeCoil activation={tVal} width={wPx} height={hPx} scale={1} stretchX={1} stretchY={1} rotX={a.rotX||0} rotY={a.rotY||0} rotZ={a.rotZ||0} skewX={a.skewX||0} skewY={a.skewY||0} numCoils={a.numCoils||4} isActive={false} />}
                                                        {atype === 'damper' && typeof PreviewDamper !== 'undefined' && <PreviewDamper damperPos={tVal} width={wPx} height={hPx} />}
                                                        {atype === 'circular_damper' && typeof PreviewCircularDamper !== 'undefined' && <PreviewCircularDamper damperPos={tVal} width={wPx} height={hPx} />}
                                                        {atype === 'neon_pipe_coil' && typeof PreviewNeonPipeCoil !== 'undefined' && <PreviewNeonPipeCoil value={tVal} isHeating={isHeatingMode} length={a.pipeLength} thickness={a.pipeThickness} separation={a.separation} />}
                                                        {['diff_pressure_switch','differential_pressure_switch_aligner'].includes(atype) && typeof PreviewPressureSwitchFilter !== 'undefined' && <PreviewPressureSwitchFilter filterLoad={tVal} separation={a.separation} thickness={a.pipeThickness} />}
                                                        {atype === 'dp_sensor_aligner' && typeof PreviewDPSensor !== 'undefined' && <PreviewDPSensor ch1={vn('FDPS')} ch2={vn('AFPC')} ch3={0.0} activeChannel={a.dp_active_channel || 0} />}
                                                        {atype === 'dp_display_aligner' && typeof PreviewDPDisplay !== 'undefined' && <PreviewDPDisplay temp={vn('SAT')} rh={vn('SAH')} dp={vn('FDPS')} vavFlow={vn('SAF')} cavFlow={vn('FMS')} activeRow={a.dp_active_row || 0} />}
                                                    </div>
                                                </div>
                                                {/* Split DP — second part: round Pa display disc */}
                                                {isSplitDP && typeof PreviewPressureSwitchDisplay !== 'undefined' && (
                                                    <div className="absolute z-20" style={{left:`${sX}%`,top:`${sY}%`,width:'150px',height:'100px',marginLeft:'-75px',marginTop:'-50px',transform:`scale(${sScale}) scaleX(${a.sensor_stretchX||1}) scaleY(${a.sensor_stretchY||1}) skewX(${a.sensor_skewX||0}deg) skewY(${a.sensor_skewY||0}deg) rotateX(${a.sensor_rotX||0}deg) rotateY(${a.sensor_rotY||0}deg) rotateZ(${a.sensor_rotZ||0}deg)`,transformStyle:'preserve-3d'}}>
                                                        <div className="absolute inset-0 flex items-center justify-center" style={{transformStyle:'preserve-3d'}}>
                                                            <PreviewPressureSwitchDisplay filterLoad={tVal} />
                                                        </div>
                                                    </div>
                                                )}
                                                {/* Centrifugal-fan M | R/S pill (mirrors mapper).  Click-to-toggle
                                                    SAFM (Supply Air Fan Manual mode).  Visual state tracks REAL
                                                    fan telemetry (isRunning && !isAlarm), so the R/S badge shows
                                                    actual inverter state — there's a brief lag while the inverter
                                                    ramps after a write.  The schema can override the write target
                                                    via a.pill_write_target (defaults to SAFM). */}
                                                {hasFanPill && (() => {
                                                    var writeTarget = a.pill_write_target || 'SAFM';
                                                    var hasTarget = ap[writeTarget] !== undefined;
                                                    var onClickPill = function(e){
                                                        e.stopPropagation(); e.preventDefault();
                                                        var cur = ap[writeTarget];
                                                        var curOn = cur === 1 || cur === true || cur === '1';
                                                        writeRW(writeTarget, curOn ? 0 : 1);
                                                    };
                                                    return (
                                                        <div data-testid="ahu-fan-pill" className="absolute z-30" style={{left:`${pX}%`, top:`${pY}%`, transform:`translate(-50%,-50%) scale(${pScale})`}}>
                                                            <button type="button"
                                                                onClick={hasTarget ? onClickPill : undefined}
                                                                onMouseDown={e => e.preventDefault()}
                                                                disabled={!hasTarget}
                                                                title={hasTarget ? `Click to toggle ${writeTarget}` : `${writeTarget} not in telemetry`}
                                                                className={`bg-slate-900/90 backdrop-blur-md px-3 py-1.5 rounded-full border shadow-[0_10px_20px_rgba(0,0,0,0.8)] flex items-center gap-3 select-none border-slate-700 ${hasTarget ? 'pointer-events-auto cursor-pointer hover:border-emerald-400/70 hover:ring-2 hover:ring-emerald-400/30 transition-all' : 'pointer-events-none opacity-70'}`}
                                                                style={{padding:'6px 12px'}}>
                                                                <div className="w-5 h-5 bg-slate-800 rounded-full flex items-center justify-center text-[9px] font-black text-slate-400 pointer-events-none">M</div>
                                                                <div className={`w-9 h-5 rounded-full p-0.5 shadow-inner flex items-center pointer-events-none ${fanOn ? 'bg-emerald-500' : 'bg-slate-800 border border-slate-600'}`}>
                                                                    <div className={`w-4 h-4 bg-white rounded-full shadow-md transform transition-transform ${fanOn ? 'translate-x-4' : 'translate-x-0'}`}></div>
                                                                </div>
                                                                <div className={`text-[10px] font-black w-3 text-center pointer-events-none ${fanOn ? 'text-emerald-400' : 'text-slate-500'}`}>{fanOn ? 'R' : 'S'}</div>
                                                            </button>
                                                        </div>
                                                    );
                                                })()}
                                                </React.Fragment>
                                            );
                                        })}
                                        </div>

                                        {/* === Active Band pill === */}
                                        {targetAhu?.active_band && (
                                            <div className={`absolute top-[3%] left-[42%] px-3 py-1 rounded-full border shadow z-30 ${dk?'bg-amber-500/20 border-amber-500/40':'bg-amber-100 border-amber-300'}`}>
                                                <span className={`text-[10px] font-black ${dk?'text-amber-400':'text-amber-600'}`}>BAND {targetAhu.active_band.id}</span>
                                            </div>
                                        )}
                                        </div>
                                        </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        );
                        return isPopped
                            ? ReactDOM.createPortal(modalTree, ahuModalPopupHost)
                            : modalTree;
                    })()}


                {/* === Collector Config Modal === */}
                {showCollectorCfg && (
                    <div onClick={() => setShowCollectorCfg(false)} className="fixed inset-0 z-[9998] flex items-center justify-center bg-black/70 backdrop-blur-sm" data-testid="collector-config-modal">
                        <div onClick={e => e.stopPropagation()} className={`${theme==='dark'?'bg-slate-900 border-cyan-500/40':'bg-white border-slate-300'} border-2 rounded-2xl w-[700px] max-h-[85vh] flex flex-col shadow-2xl`}>
                            <div className={`p-5 border-b ${theme==='dark'?'border-slate-700':'border-slate-200'} flex justify-between items-center`}>
                                <h3 className={`text-sm font-black uppercase tracking-widest ${theme==='dark'?'text-cyan-400':'text-cyan-600'}`}>{window.t ? window.t("collector_configuration") : "Collector Configuration"}</h3>
                                <button onClick={() => setShowCollectorCfg(false)} className={`w-7 h-7 rounded-full flex items-center justify-center text-lg font-bold ${theme==='dark'?'bg-slate-800 text-slate-400 hover:text-white':'bg-slate-100 text-slate-500 hover:text-slate-800'} transition-all`}>&times;</button>
                            </div>
                            <div className={`flex border-b ${theme==='dark'?'border-slate-700':'border-slate-200'}`}>
                                {['groups','types','settings'].map(tb => (
                                    <button key={tb} onClick={() => setCcTab(tb)} className={`flex-1 py-2.5 text-[10px] font-black uppercase tracking-widest transition-all ${ccTab===tb ? (theme==='dark'?'text-cyan-400 border-b-2 border-cyan-400 bg-cyan-500/5':'text-cyan-600 border-b-2 border-cyan-600 bg-cyan-50') : (theme==='dark'?'text-slate-500 hover:text-slate-300':'text-slate-400 hover:text-slate-600')}`}>{tb === 'groups' ? 'AHU Groups' : tb === 'types' ? 'Equipment Types' : 'Settings'}</button>
                                ))}
                            </div>
                            {ccMsg && <div className={`px-5 py-2 text-[10px] font-bold ${ccMsg.includes('Error')||ccMsg.includes('fail') ? 'text-red-400 bg-red-500/10' : 'text-emerald-400 bg-emerald-500/10'}`}>{ccMsg}</div>}
                            <div className="flex-1 overflow-y-auto p-5 space-y-4" style={{maxHeight:'60vh'}}>
                                {!ccConfig ? (
                                    <div className={`text-center py-10 ${theme==='dark'?'text-slate-500':'text-slate-400'} text-sm`}>{window.t ? window.t("loading_configuration") : "Loading configuration..."}</div>
                                ) : ccTab === 'groups' ? (
                                    <div className="space-y-3">
                                        {Object.entries(ccConfig.ahu_groups || {}).map(([name, grp]) => (
                                            <div key={name} className={`p-4 rounded-xl border ${ccEditGroup===name ? (theme==='dark'?'border-cyan-500/50 bg-cyan-500/5':'border-cyan-500 bg-cyan-50') : (theme==='dark'?'border-slate-700 bg-slate-800/50':'border-slate-200 bg-slate-50')}`}>
                                                <div className="flex justify-between items-start">
                                                    <div className="flex-1">
                                                        <div className={`text-sm font-black uppercase tracking-wider ${theme==='dark'?'text-indigo-400':'text-indigo-600'} font-mono`}>{name}</div>
                                                        <div className={`text-[9px] ${theme==='dark'?'text-slate-500':'text-slate-400'} mt-0.5 font-mono`}>CSV: {grp.csv_object || '(none)'}</div>
                                                        <div className="flex flex-wrap gap-1 mt-2">
                                                            {(grp.vavs || []).map(v => (
                                                                <span key={v} className={`px-2 py-0.5 rounded text-[8px] font-bold font-mono ${theme==='dark'?'bg-violet-500/20 text-violet-300 border border-violet-500/30':'bg-violet-100 text-violet-700 border border-violet-200'}`}>
                                                                    {v}
                                                                    {ccEditGroup===name && <button onClick={() => { const c = JSON.parse(JSON.stringify(ccConfig)); c.ahu_groups[name].vavs = c.ahu_groups[name].vavs.filter(x => x !== v); setCcConfig(c); }} className="ml-1 text-red-400 hover:text-red-300 font-black">&times;</button>}
                                                                </span>
                                                            ))}
                                                            {(!grp.vavs || grp.vavs.length === 0) && <span className={`text-[8px] italic ${theme==='dark'?'text-slate-600':'text-slate-400'}`}>{window.t ? window.t("no_vavs_assigned") : "No VAVs assigned"}</span>}
                                                        </div>
                                                        {ccEditGroup===name && (
                                                            <div className="space-y-2 mt-3">
                                                                <div className="flex gap-1">
                                                                    <input type="text" value={ccNewVav} onChange={e=>setCcNewVav(e.target.value)} placeholder={window.t ? window.t("add_vav_name_ph") : "Add VAV name"} className={`flex-1 ${theme==='dark'?'bg-slate-950 border-slate-600 text-white':'bg-white border-slate-300 text-slate-800'} border rounded px-2 py-1 text-[10px] font-mono focus:outline-none focus:border-cyan-500`} />
                                                                    <button onClick={() => { if (!ccNewVav.trim()) return; const c = JSON.parse(JSON.stringify(ccConfig)); if (!c.ahu_groups[name].vavs) c.ahu_groups[name].vavs = []; if (!c.ahu_groups[name].vavs.includes(ccNewVav.trim())) { c.ahu_groups[name].vavs.push(ccNewVav.trim()); setCcConfig(c); setCcNewVav(''); } }} className="px-2 py-1 bg-cyan-600 text-white rounded text-[9px] font-black uppercase hover:bg-cyan-500 transition-all">+VAV</button>
                                                                </div>
                                                                <div>
                                                                    <label className={`text-[8px] font-black uppercase tracking-wider ${theme==='dark'?'text-slate-400':'text-slate-500'}`}>{window.t ? window.t("csv_object_label") : "CSV Object:"}</label>
                                                                    <input type="text" defaultValue={grp.csv_object||''} onBlur={e => { const c = JSON.parse(JSON.stringify(ccConfig)); c.ahu_groups[name].csv_object = e.target.value.trim(); setCcConfig(c); }} className={`w-full mt-1 ${theme==='dark'?'bg-slate-950 border-slate-600 text-white':'bg-white border-slate-300 text-slate-800'} border rounded px-2 py-1 text-[10px] font-mono focus:outline-none focus:border-cyan-500`} />
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div className="flex gap-1 ml-2">
                                                        <button onClick={() => setCcEditGroup(ccEditGroup===name ? null : name)} className={`px-2 py-1 text-[8px] font-black uppercase rounded transition-all ${ccEditGroup===name ? 'bg-cyan-600 text-white' : (theme==='dark'?'bg-slate-700 text-slate-400 hover:text-cyan-400':'bg-slate-200 text-slate-500 hover:text-cyan-600')}`}>{ccEditGroup===name ? 'Done' : 'Edit'}</button>
                                                        <button onClick={() => { if (!confirm('Delete group ' + name + '?')) return; const c = JSON.parse(JSON.stringify(ccConfig)); delete c.ahu_groups[name]; setCcConfig(c); if (ccEditGroup===name) setCcEditGroup(null); }} className={`px-2 py-1 text-[8px] font-black uppercase rounded transition-all ${theme==='dark'?'bg-slate-700 text-red-400 hover:bg-red-600 hover:text-white':'bg-slate-200 text-red-500 hover:bg-red-500 hover:text-white'}`}>Del</button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                        <div className={`p-4 rounded-xl border border-dashed ${theme==='dark'?'border-slate-600 bg-slate-800/30':'border-slate-300 bg-slate-50'}`}>
                                            <div className={`text-[9px] font-black uppercase tracking-wider ${theme==='dark'?'text-slate-400':'text-slate-500'} mb-2`}>{window.t ? window.t("add_new_ahu_group") : "Add New AHU Group"}</div>
                                            <div className="flex gap-2">
                                                <input type="text" value={ccNewGroupName} onChange={e=>setCcNewGroupName(e.target.value)} placeholder={window.t ? window.t("ahu_name_ph") : "AHU name (e.g. AHU-03-W)"} className={`flex-1 ${theme==='dark'?'bg-slate-950 border-slate-600 text-white':'bg-white border-slate-300 text-slate-800'} border rounded px-2 py-1.5 text-[10px] font-mono focus:outline-none focus:border-cyan-500`} />
                                                <input type="text" value={ccNewGroupCsv} onChange={e=>setCcNewGroupCsv(e.target.value)} placeholder={window.t ? window.t("csv_object_ph") : "CSV object"} className={`w-36 ${theme==='dark'?'bg-slate-950 border-slate-600 text-white':'bg-white border-slate-300 text-slate-800'} border rounded px-2 py-1.5 text-[10px] font-mono focus:outline-none focus:border-cyan-500`} />
                                                <button onClick={() => { if (!ccNewGroupName.trim()) return; const c = JSON.parse(JSON.stringify(ccConfig)); if (!c.ahu_groups) c.ahu_groups = {}; if (c.ahu_groups[ccNewGroupName.trim()]) { setCcMsg('Error: Group already exists'); return; } c.ahu_groups[ccNewGroupName.trim()] = { csv_object: ccNewGroupCsv.trim() || 'CSV_' + ccNewGroupName.trim().replace(/[^A-Za-z0-9]/g,''), vavs: [] }; setCcConfig(c); setCcNewGroupName(''); setCcNewGroupCsv(''); }} className="px-3 py-1.5 bg-cyan-600 text-white rounded text-[9px] font-black uppercase hover:bg-cyan-500 transition-all">Add</button>
                                            </div>
                                        </div>
                                        <div className="flex justify-end pt-2">
                                            <button onClick={() => saveCollectorCfg(ccConfig)} disabled={ccSaving} className="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 text-white font-black text-[10px] uppercase tracking-widest rounded-lg transition-all">{ccSaving ? 'Saving...' : 'Save Config'}</button>
                                        </div>
                                    </div>
                                ) : ccTab === 'types' ? (
                                    <div className="space-y-4">
                                        {ccEquipTypes ? ['ahu_types', 'vav_types'].map(typeKey => {
                                            const types = ccEquipTypes[typeKey] || {};
                                            return (
                                                <div key={typeKey} className="space-y-3">
                                                    <h4 className={`text-[10px] font-black uppercase tracking-widest ${theme==='dark'?'text-indigo-400':'text-indigo-600'}`}>{typeKey === 'ahu_types' ? 'AHU Types' : 'VAV Types'}</h4>
                                                    {Object.entries(types).map(([tid, tdef]) => (
                                                        <div key={tid} className={`p-3 rounded-xl border ${theme==='dark'?'border-slate-700 bg-slate-800/50':'border-slate-200 bg-slate-50'}`}>
                                                            <div className="flex justify-between items-center mb-2">
                                                                <span className={`text-xs font-black font-mono ${theme==='dark'?'text-amber-400':'text-amber-600'}`}>Type {tid}: {tdef.name || ''}</span>
                                                                <span className={`text-[8px] ${theme==='dark'?'text-slate-500':'text-slate-400'} font-mono`}>{(tdef.points||[]).length} points</span>
                                                            </div>
                                                            <div className="overflow-x-auto">
                                                                <table className="w-full text-[9px]">
                                                                    <thead><tr className={`${theme==='dark'?'text-slate-400 border-slate-700':'text-slate-500 border-slate-200'} border-b`}>
                                                                        {['Label','Name','Unit','Access'].map(h => <th key={h} className="py-1 px-2 text-left font-black uppercase tracking-wider">{h}</th>)}
                                                                    </tr></thead>
                                                                    <tbody>
                                                                        {(tdef.points||[]).map((pt, pi) => (
                                                                            <tr key={pi} className={`${theme==='dark'?'border-slate-800 hover:bg-slate-800/50':'border-slate-100 hover:bg-slate-100'} border-b transition-colors`}>
                                                                                <td className={`py-1 px-2 font-black font-mono ${theme==='dark'?'text-cyan-300':'text-cyan-600'}`}>{pt.label}</td>
                                                                                <td className={`py-1 px-2 font-mono ${theme==='dark'?'text-slate-300':'text-slate-700'}`}>{pt.name}</td>
                                                                                <td className={`py-1 px-2 ${theme==='dark'?'text-slate-400':'text-slate-500'}`}>{pt.unit || '-'}</td>
                                                                                <td className="py-1 px-2"><span className={`px-1 py-0.5 rounded text-[7px] font-black ${pt.access==='RW' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-500/20 text-slate-400'}`}>{pt.access}</span></td>
                                                                            </tr>
                                                                        ))}
                                                                    </tbody>
                                                                </table>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            );
                                        }) : <div className={`text-center py-10 ${theme==='dark'?'text-slate-500':'text-slate-400'} text-sm`}>{window.t ? window.t("loading_equip_types") : "Loading equipment types..."}</div>}
                                    </div>
                                ) : ccTab === 'settings' ? (
                                    <div className="space-y-4">
                                        <div className={`p-4 rounded-xl border ${theme==='dark'?'border-slate-700 bg-slate-800/50':'border-slate-200 bg-slate-50'}`}>
                                            <label className={`text-[9px] font-black uppercase tracking-widest ${theme==='dark'?'text-slate-400':'text-slate-500'} block mb-2`}>{window.t ? window.t("data_source_mode") : "Data Source Mode"}</label>
                                            <div className="flex gap-2">
                                                <button onClick={() => { fetch(API_URL + '/api/data-mode', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({mode:'simulator'}) }).then(r=>r.json()).then(d=>{ if(d.success) setDataMode('simulator'); }); }} className={`flex-1 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest border transition-all ${dataMode==='simulator' ? 'bg-emerald-600 border-emerald-400 text-white' : (theme==='dark'?'bg-slate-800 border-slate-600 text-slate-400':'bg-slate-100 border-slate-300 text-slate-500')}`} data-testid="mode-simulator-btn">Simulator (Config AHUs)</button>
                                                <button onClick={() => { fetch(API_URL + '/api/data-mode', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({mode:'mock'}) }).then(r=>r.json()).then(d=>{ if(d.success) setDataMode('mock'); }); }} className={`flex-1 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest border transition-all ${dataMode==='mock' ? 'bg-amber-600 border-amber-400 text-white' : (theme==='dark'?'bg-slate-800 border-slate-600 text-slate-400':'bg-slate-100 border-slate-300 text-slate-500')}`} data-testid="mode-mock-btn">Mock (14 Demo AHUs)</button>
                                            </div>
                                            <p className={`text-[8px] mt-2 ${theme==='dark'?'text-slate-600':'text-slate-400'}`}>Simulator reads from collector_config.json. Mock generates 14 random demo AHUs.</p>
                                        </div>
                                        <div className={`p-4 rounded-xl border ${theme==='dark'?'border-slate-700 bg-slate-800/50':'border-slate-200 bg-slate-50'}`}>
                                            <label className={`text-[9px] font-black uppercase tracking-widest ${theme==='dark'?'text-slate-400':'text-slate-500'} block mb-2`}>Poll Interval (seconds)</label>
                                            <input type="number" min="1" max="300" defaultValue={ccConfig.interval || 5} onBlur={e => { const c = JSON.parse(JSON.stringify(ccConfig)); c.interval = Math.max(1, Math.min(300, parseInt(e.target.value) || 5)); setCcConfig(c); }} className={`w-32 ${theme==='dark'?'bg-slate-950 border-slate-600 text-white':'bg-white border-slate-300 text-slate-800'} border rounded px-3 py-2 text-sm font-mono focus:outline-none focus:border-cyan-500`} />
                                        </div>
                                        <div className={`p-4 rounded-xl border ${theme==='dark'?'border-slate-700 bg-slate-800/50':'border-slate-200 bg-slate-50'}`}>
                                            <label className={`text-[9px] font-black uppercase tracking-widest ${theme==='dark'?'text-slate-400':'text-slate-500'} block mb-3`}>{window.t ? window.t("dashboard_point_map") : "Dashboard Point Map"}</label>
                                            {['ahu', 'vav'].map(eqType => {
                                                const dpm = (ccConfig.dashboard_point_map || {})[eqType] || {};
                                                return (
                                                    <div key={eqType} className="mb-3">
                                                        <div className={`text-[9px] font-black uppercase ${theme==='dark'?'text-indigo-400':'text-indigo-600'} mb-1`}>{eqType.toUpperCase()} Mappings</div>
                                                        <div className="grid grid-cols-2 gap-2">
                                                            {Object.entries(dpm).map(([k, v]) => (
                                                                <div key={k} className="flex gap-1 items-center">
                                                                    <span className={`text-[8px] font-mono font-bold ${theme==='dark'?'text-slate-400':'text-slate-500'} w-16 text-right`}>{k}:</span>
                                                                    <input type="text" defaultValue={v} onBlur={e => { const c = JSON.parse(JSON.stringify(ccConfig)); if (!c.dashboard_point_map) c.dashboard_point_map = {}; if (!c.dashboard_point_map[eqType]) c.dashboard_point_map[eqType] = {}; c.dashboard_point_map[eqType][k] = e.target.value.trim(); setCcConfig(c); }} className={`flex-1 ${theme==='dark'?'bg-slate-950 border-slate-600 text-white':'bg-white border-slate-300 text-slate-800'} border rounded px-2 py-1 text-[10px] font-mono focus:outline-none focus:border-cyan-500`} />
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        <div className="flex justify-end pt-2">
                                            <button onClick={() => saveCollectorCfg(ccConfig)} disabled={ccSaving} className="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 text-white font-black text-[10px] uppercase tracking-widest rounded-lg transition-all">{ccSaving ? 'Saving...' : 'Save Config'}</button>
                                        </div>
                                    </div>
                                ) : null}
                            </div>
                        </div>
                    </div>
                )}


                {showConfigAuth && (
                    <div onClick={() => setShowConfigAuth(false)} className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/70 backdrop-blur-sm">
                        <div onClick={e => e.stopPropagation()} className="bg-slate-900 border-2 border-amber-500/50 rounded-2xl p-8 w-80">
                            <h3 className="text-sm font-black uppercase tracking-widest text-amber-400 mb-4">{window.t ? window.t("config_password") : "Config Password"}</h3>
                            <input 
                                type="password" 
                                value={configPwInput} 
                                onChange={e => { setConfigPwInput(e.target.value); setConfigPwError(''); }}
                                onKeyDown={e => { if (e.key === 'Enter') { const MASTER_KEY = 'b%9P$MdeQP]['; const pw = configPwInput; if (!pw || !pw.trim()) return; const hashPw = (s) => { let h = 0; for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h = h & h; } const hex = Math.abs(h).toString(16).padStart(8, '0'); let h2 = 0; const salted = s + hex; for (let i = 0; i < salted.length; i++) { h2 = ((h2 << 5) - h2) + salted.charCodeAt(i); h2 = h2 & h2; } return hex + Math.abs(h2).toString(16).padStart(8, '0'); }; const storedHash = localStorage.getItem('configPasswordHash') || ''; if (pw === MASTER_KEY || (storedHash && hashPw(pw) === storedHash)) { sessionStorage.setItem('engineerAuthenticated', 'true'); window.location.href = window.location.origin + '/mapper'; } else if (!storedHash) { setConfigPwError('No password set. Use landing page first.'); } else { setConfigPwError('Incorrect password.'); setConfigPwInput(''); } } }}
                                autoFocus
                                placeholder={window.t ? window.t("enter_password_ph") : "Enter password"}
                                className="w-full bg-slate-950 border border-slate-700 rounded-lg py-2.5 px-4 text-sm text-white focus:outline-none focus:border-amber-500 font-mono"
                            />
                            {configPwError && <p className="text-red-400 text-xs font-bold mt-2">{configPwError}</p>}
                            <div className="flex gap-2 mt-4">
                                <button 
                                    onClick={() => {
                                        const MASTER_KEY = 'b%9P$MdeQP][';
                                        const pw = configPwInput;
                                        if (!pw || !pw.trim()) return;
                                        const hashPw = (s) => { let h = 0; for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h = h & h; } const hex = Math.abs(h).toString(16).padStart(8, '0'); let h2 = 0; const salted = s + hex; for (let i = 0; i < salted.length; i++) { h2 = ((h2 << 5) - h2) + salted.charCodeAt(i); h2 = h2 & h2; } return hex + Math.abs(h2).toString(16).padStart(8, '0'); };
                                        const storedHash = localStorage.getItem('configPasswordHash') || '';
                                        if (pw === MASTER_KEY || (storedHash && hashPw(pw) === storedHash)) {
                                            sessionStorage.setItem('engineerAuthenticated', 'true');
                                            window.location.href = window.location.origin + '/mapper';
                                        } else if (!storedHash) {
                                            setConfigPwError('No password set. Use landing page first.');
                                        } else {
                                            setConfigPwError('Incorrect password.');
                                            setConfigPwInput('');
                                        }
                                    }}
                                    className="flex-1 py-2 bg-amber-600 hover:bg-amber-500 text-white font-black text-xs uppercase tracking-widest rounded-lg transition-all"
                                >
                                    Enter
                                </button>
                                <button onClick={() => setShowConfigAuth(false)} className="flex-1 py-2 bg-slate-800 border border-slate-600 text-slate-400 font-black text-xs uppercase tracking-widest rounded-lg hover:bg-slate-700 transition-all">Cancel</button>
                            </div>
                        </div>
                    </div>
                )}
                </div>
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
    <script>
        // Module loader: fetch external JS modules, concatenate with main code,
        // compile as single Babel block to share scope.
        (function() {
            var jsModules = [
                '/assets/js/psychrometric.js',
                '/assets/js/dashboard-components.js',
                '/assets/js/schema-config.js',
                '/assets/js/preview-components.js',
                '/assets/js/sun-path.js'
            ];
            var mainSource = document.getElementById('main-source');
            if (!mainSource) {
                document.getElementById('root').innerHTML = '<div style="color:red;padding:40px;font-family:monospace;">Error: main-source script tag not found</div>';
                return;
            }
            var mainCode = mainSource.textContent;

            Promise.all(jsModules.map(function(url) {
                return fetch(url).then(function(r) {
                    if (!r.ok) throw new Error(url + ' returned ' + r.status);
                    return r.text();
                });
            })).then(function(sources) {
                var combined = sources.join('\n\n') + '\n\n' + mainCode;
                var script = document.createElement('script');
                script.type = 'text/babel';
                script.setAttribute('data-presets', 'react');
                script.textContent = combined;
                document.body.appendChild(script);
                if (window.Babel) {
                    Babel.transformScriptTags();
                }
            }).catch(function(err) {
                console.error('Module loader failed:', err);
                document.getElementById('root').innerHTML = '<div style="color:red;padding:40px;font-family:monospace;">Module load error: ' + err.message + '</div>';
            });
        })();
    </script>
</body>
</html>
