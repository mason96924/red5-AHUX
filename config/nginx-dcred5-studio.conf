# Dedicated vhost for dcred5-studio.com — avoids server_name conflicts with
# the geniusmason.com block in sites-available/red5.
#
# Install on server:
#   sudo cp config/nginx-dcred5-studio.conf /etc/nginx/sites-available/dcred5-studio
#   sudo ln -sf /etc/nginx/sites-available/dcred5-studio /etc/nginx/sites-enabled/dcred5-studio
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then REMOVE dcred5-studio.com and www.dcred5-studio.com from the server_name
# line in /etc/nginx/sites-available/red5 (geniusmason block only).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dcred5-studio.com www.dcred5-studio.com;

    ssl_certificate     /etc/nginx/ssl/geniusmason.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/geniusmason.com/private.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /home/newborn/red5-studio/frontend/build;
    index index.html;
    client_max_body_size 32m;

    location = / {
        return 302 /access.html;
    }

    location = /dashboard       { return 301 /dashboard.html; }
    location = /ahu             { return 301 /dashboard.html; }
    location = /mapper          { return 301 /equipment_mapper.html; }
    location = /config-tool     { return 301 /equipment_mapper.html; }
    location = /command-center  { return 301 /command-center.html; }
    location = /landing         { return 301 /landing.html; }
    location = /admin           { return 301 /admin-login; }

    # Perf iframe. `root` is leftover ~/red5-studio/frontend/build — try_files
    # would keep the old all-mint colorForMode ahu.html after git pull of
    # ~/red5-ahu. FastAPI pages.py serves frontend/public/ahu.html.
    location = /ahu.html {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Same leftover `root` (~/red5-studio/frontend/build) would keep a
    # pre-undim dashboard.html after git pull of ~/red5-ahu. FastAPI
    # pages.py serves frontend/public/dashboard.html.
    location = /dashboard.html {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.env { deny all; return 404; }
    location ~ /\.git { deny all; return 404; }
}
