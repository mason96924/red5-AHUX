# Dedicated vhost for dcred5-studio.com — avoids server_name conflicts with
# the geniusmason.com block in sites-available/red5.
#
# Install on server:
#   sudo cp config/nginx-dcred5-studio.conf /etc/nginx/sites-available/dcred5-studio
#   sudo ln -sf /etc/nginx/sites-available/dcred5-studio /etc/nginx/sites-enabled/dcred5-studio
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then REMOVE dcred5-studio.com and www.dcred5-studio.com from the server_name
# line in /etc/nginx/sites-available/red5 (geniusmason block only).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dcred5-studio.com www.dcred5-studio.com;

    ssl_certificate     /etc/letsencrypt/live/red5-origin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/red5-origin/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # No `root`. FastAPI owns every path, so nginx cannot shadow a git file with
    # a leftover build tree, and / is served by pages.py the way AHUX does it.
    client_max_body_size 32m;

    location = /dashboard       { return 301 /dashboard.html; }
    location = /ahu             { return 301 /dashboard.html; }
    location = /mapper          { return 301 /equipment_mapper.html; }
    location = /config-tool     { return 301 /equipment_mapper.html; }
    location = /command-center  { return 301 /command-center.html; }
    location = /landing         { return 301 /landing.html; }
    # /admin-login was a route inside the retired CRA build tree, so this
    # pointed at a 404 once nginx stopped serving that tree. Admin signs in
    # on Access Control (username `admin`, password = master key).
    location = /admin           { return 301 /access.html; }

    # Explicit only to add no-store; `location /` already proxies these.
    location = /ahu.html {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /dashboard.html {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /equipment_mapper.html {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    location ~ /\.env { deny all; return 404; }
    location ~ /\.git { deny all; return 404; }
}
