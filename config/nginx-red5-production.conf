server {
    listen 80;
    listen [::]:80;
    server_name geniusmason.com www.geniusmason.com;
    return 301 https://www.geniusmason.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name geniusmason.com;

    ssl_certificate     /etc/letsencrypt/live/red5-origin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/red5-origin/privkey.pem;

    return 301 https://www.geniusmason.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.geniusmason.com geniusmason.com www.dcred5-studio.com dcred5-studio.com;

    ssl_certificate     /etc/letsencrypt/live/red5-origin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/red5-origin/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # No `root`. FastAPI owns every path, so nginx cannot shadow a git file with
    # a leftover build tree. The old root was ~/red5-studio/frontend/build, whose
    # index.html is gone -- try_files fell back to a missing file and answered
    # /access.html with 500 while AHUX served it fine.
    client_max_body_size 32m;

    location = /dashboard       { return 301 /dashboard.html; }
    location = /ahu             { return 301 /dashboard.html; }
    location = /mapper          { return 301 /equipment_mapper.html; }
    location = /config-tool     { return 301 /equipment_mapper.html; }
    location = /command-center  { return 301 /command-center.html; }
    location = /landing         { return 301 /landing.html; }
    # /admin-login was a route inside the retired CRA build tree, so this
    # pointed at a 404 once nginx stopped serving that tree. Admin signs in
    # on Access Control (username `admin`, password = master key).
    location = /admin           { return 301 /access.html; }

    # Perf iframe — must not come from leftover red5-studio/frontend/build.
    location = /ahu.html {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /dashboard.html {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /equipment_mapper.html {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /js/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    location ~ /\.env { deny all; return 404; }
    location ~ /\.git { deny all; return 404; }
}

# NO 127.0.0.1:8080 server block here. chirpstack holds 0.0.0.0:8080, which
# covers 127.0.0.1:8080, so nginx dies with "bind() ... (98: Address already in
# use)" and systemd leaves the previous master running its old in-memory config.
# `nginx -t` does not bind ports, so it reports success and the breakage is
# invisible until a restart. The tunnel sends these hostnames straight to
# 127.0.0.1:8001, so this block was never on the request path anyway.
