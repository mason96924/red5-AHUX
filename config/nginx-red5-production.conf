server {
    listen 80;
    listen [::]:80;
    server_name geniusmason.com www.geniusmason.com;
    return 301 https://www.geniusmason.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name geniusmason.com;

    ssl_certificate     /etc/nginx/ssl/geniusmason.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/geniusmason.com/private.key;

    return 301 https://www.geniusmason.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.geniusmason.com geniusmason.com www.dcred5-studio.com dcred5-studio.com;

    ssl_certificate     /etc/nginx/ssl/geniusmason.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/geniusmason.com/private.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /home/newborn/red5-studio/frontend/build;
    index index.html;
    client_max_body_size 32m;

    # GET / → Access Control.  Catches / inside location / because try_files
    # $uri/ otherwise serves index.html for the directory root.
    location = /dashboard       { return 301 /dashboard.html; }
    location = /ahu             { return 301 /dashboard.html; }
    location = /mapper          { return 301 /equipment_mapper.html; }
    location = /config-tool     { return 301 /equipment_mapper.html; }
    location = /command-center  { return 301 /command-center.html; }
    location = /landing         { return 301 /landing.html; }
    location = /admin           { return 301 /admin-login; }

    # Perf iframe — must not come from leftover red5-studio/frontend/build.
    location = /ahu.html {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /dashboard.html {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        if ($uri = '/') {
            return 302 /access.html;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.env { deny all; return 404; }
    location ~ /\.git { deny all; return 404; }
}

# Cloudflare tunnel origin (listens on localhost only)
server {
    listen 127.0.0.1:8080;
    server_name dcred5-studio.com www.dcred5-studio.com geniusmason.com www.geniusmason.com;
    root /home/newborn/red5-studio/frontend/build;
    index index.html;
    client_max_body_size 32m;

    location = /ahu.html {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
    location = /dashboard.html {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /assets/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        if ($uri = '/') {
            return 302 /access.html;
        }
        try_files $uri $uri/ /index.html;
    }
}
