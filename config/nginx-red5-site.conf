# config/nginx-red5-site.conf — canonical Red5 Studio V2.0 nginx site block.
#
# Install on the Linux server:
#   sudo cp config/nginx-red5-site.conf /etc/nginx/sites-available/red5
#   sudo ln -sf /etc/nginx/sites-available/red5 /etc/nginx/sites-enabled/red5
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN and SSL paths after certbot.  Set `root` to the
# directory deploy.sh mirrors into (usually frontend/build/).

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # certbot injects ssl_certificate lines here.

    root /home/red5-studio/frontend/build;
    index index.html;

    client_max_body_size 32m;

    # GET / → Access Control (V1.9 parity).  Without this, try_files falls
    # through to /dashboard.html and operators never see the sign-in page.
    location = / {
        rewrite ^ /access.html last;
    }

    # Perf iframe — git-tracked frontend/public/ahu.html via FastAPI, not
    # a leftover frontend/build copy under `root`.
    location = /ahu.html {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /dashboard.html {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files (dashboard.html, js/, css/, img/, …).  Unknown paths fall
    # back to the CRA index.html shell — NOT dashboard.html — so SPA routes
    # under /index.html keep working.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.env { deny all; return 404; }
    location ~ /\.git { deny all; return 404; }
}
