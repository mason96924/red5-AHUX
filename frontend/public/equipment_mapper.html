            };

            const handleCanvasMouseMove = (e) => {
                if (isPanning) {
                    setView(prev => ({ 
                        ...prev, 
                        x: e.clientX - panStart.current.x, 
                        y: e.clientY - panStart.current.y 
                    }));
                    return;
                }       
                if (draggingTarget !== null && isDraggingMode.current && imageRef.current) {
                    const rect = imageRef.current.getBoundingClientRect();
                    const xPct = Math.max(0, Math.min(100, Number((((e.clientX - rect.left) / rect.width) * 100).toFixed(1))));
                    const yPct = Math.max(0, Math.min(100, Number((((e.clientY - rect.top) / rect.height) * 100).toFixed(1))));

                    const subtype = draggingTarget.subtype;

                    if (draggingTarget.type === 'point_group') {
                        const grp = groupedPoints[draggingTarget.idx];
                        if (!grp) return;
                        if (isDraggingMode.current === 'move') {
                            handleFineTuneGroup(grp.indices, 'x', xPct);
                            handleFineTuneGroup(grp.indices, 'y', yPct);
                        }
                        return;
                    }

                    const list = schema[category]?.[typeId]?.visual_assets?.animations || [];
                    const item = list[draggingTarget.idx];
                    if (!item) return;

                    if (isDraggingMode.current === 'move') {
                        if (subtype === 'sensor') updateTargetCoords(draggingTarget, { sensor_x: xPct, sensor_y: yPct });
                        else if (subtype === 'vfd_screen') {
                            const dxScaled = (e.clientX - draggingTarget.startX) / view.scale / (item.scale || 1.0);
                            const dyScaled = (e.clientY - draggingTarget.startY) / view.scale / (item.scale || 1.0);
                            updateTargetCoords(draggingTarget, { screen_dx: Math.round(draggingTarget.initOffX + dxScaled), screen_dy: Math.round(draggingTarget.initOffY + dyScaled) });
                        } else if (subtype === 'vfd_pill') {
                            const dxScaled = (e.clientX - draggingTarget.startX) / view.scale / (item.scale || 1.0);
                            const dyScaled = (e.clientY - draggingTarget.startY) / view.scale / (item.scale || 1.0);
                            updateTargetCoords(draggingTarget, { pill_dx: Math.round(draggingTarget.initOffX + dxScaled), pill_dy: Math.round(draggingTarget.initOffY + dyScaled) });
                        } else {
                            updateTargetCoords(draggingTarget, { x: xPct, y: yPct });
                        }
                    }
                    else if (isDraggingMode.current === 'move-pill') {
                        updateTargetCoords(draggingTarget, { pill_x: xPct, pill_y: yPct });
                    }
                    else if (isDraggingMode.current === 'move-segment') {
                        // Frac math: drag delta in screen px → fraction of image natural width.
                        // rect.width includes view.scale, so dividing by it gives screen-fraction-of-image,
                        // which equals natural-fraction (image scales uniformly).
                        const dxScreen = (e.clientX - draggingTarget.startX);
                        const dyScreen = (e.clientY - draggingTarget.startY);
                        const dxFrac = rect.width > 0 ? (dxScreen / rect.width) : 0;
                        const dyFrac = rect.width > 0 ? (dyScreen / rect.width) : 0; // use width as the canonical denominator for both axes
                        // Legacy px: keep computing it for backward compat (old hosts that haven't been updated)
                        const dxScaled = (e.clientX - draggingTarget.startX) / view.scale;
                        const dyScaled = (e.clientY - draggingTarget.startY) / view.scale;
                        
                        const segIdx = item.segments?.findIndex(s => s.id === subtype) ?? -1;
                        if (segIdx > -1) {
                            const initFx = (draggingTarget.initOffXFrac != null) ? draggingTarget.initOffXFrac : 0;
                            const initFy = (draggingTarget.initOffYFrac != null) ? draggingTarget.initOffYFrac : 0;
                            handleAirflowSegmentChange(draggingTarget.idx, segIdx, 'offsetXFrac', +(initFx + dxFrac).toFixed(6));
                            handleAirflowSegmentChange(draggingTarget.idx, segIdx, 'offsetYFrac', +(initFy + dyFrac).toFixed(6));
                            // Also keep legacy px in sync (best-effort, for backward compat with older renderers)
                            handleAirflowSegmentChange(draggingTarget.idx, segIdx, 'offsetX', Math.round(draggingTarget.initOffX + dxScaled));
                            handleAirflowSegmentChange(draggingTarget.idx, segIdx, 'offsetY', Math.round(draggingTarget.initOffY + dyScaled));
                        }
                    }
                    else if (isDraggingMode.current === 'rotate' && draggingTarget.type === 'animation') {
                        if (typeof subtype === 'number' || typeof subtype === 'string') {
                            const segIdx = item.segments?.findIndex(s => s.id === subtype) ?? -1;
                            if (segIdx > -1) {
                                const seg = item.segments[segIdx];
                                // Prefer canonical Frac; fall back to legacy px scaled by current display ratio.
                                const dispW = imageRef.current ? imageRef.current.offsetWidth : rect.width / Math.max(view.scale, 0.0001);
                                const natW = imageRef.current ? imageRef.current.naturalWidth : dispW;
                                const segPxX = (seg.offsetXFrac != null) ? (seg.offsetXFrac * dispW) : ((seg.offsetX || 0) * (dispW / Math.max(natW, 1)));
                                const segPxY = (seg.offsetYFrac != null) ? (seg.offsetYFrac * dispW) : ((seg.offsetY || 0) * (dispW / Math.max(natW, 1)));
                                const centerX = rect.left + (item.x / 100 * rect.width) + (segPxX * view.scale);
                                const centerY = rect.top + (item.y / 100 * rect.height) + (segPxY * view.scale);
                                let angle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
                                angle += 90; if (angle < 0) angle += 360;
                                handleAirflowSegmentChange(draggingTarget.idx, segIdx, 'rotZ', angle);
                                return;
                            }
                        }
                        
                        const originX = subtype === 'sensor' ? item.sensor_x : item.x;
                        const originY = subtype === 'sensor' ? item.sensor_y : item.y;
                        const centerX = rect.left + (originX / 100) * rect.width;
                        const centerY = rect.top + (originY / 100) * rect.height;
                        let angle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
                        angle += 90; if (angle < 0) angle += 360;
                        handleFineTune(draggingTarget, subtype === 'sensor' ? 'sensor_rotZ' : 'rotZ', angle);
                    }
                    else if (isDraggingMode.current === 'scale' && draggingTarget.type === 'animation') {
                        if (typeof subtype === 'number' || typeof subtype === 'string') {
                            const segIdx = item.segments?.findIndex(s => s.id === subtype) ?? -1;
                            if (segIdx > -1) {
                                const seg = item.segments[segIdx];
                                const dispW = imageRef.current ? imageRef.current.offsetWidth : rect.width / Math.max(view.scale, 0.0001);
                                const natW = imageRef.current ? imageRef.current.naturalWidth : dispW;
                                const segPxX = (seg.offsetXFrac != null) ? (seg.offsetXFrac * dispW) : ((seg.offsetX || 0) * (dispW / Math.max(natW, 1)));
                                const segPxY = (seg.offsetYFrac != null) ? (seg.offsetYFrac * dispW) : ((seg.offsetY || 0) * (dispW / Math.max(natW, 1)));
                                const centerX = rect.left + (item.x / 100 * rect.width) + (segPxX * view.scale);
                                const centerY = rect.top + (item.y / 100 * rect.height) + (segPxY * view.scale);
                                const dist = Math.sqrt(Math.pow(e.clientX - centerX, 2) + Math.pow(e.clientY - centerY, 2));
                                const newScale = Math.max(0.1, (dist / 100).toFixed(2));
                                handleAirflowSegmentChange(draggingTarget.idx, segIdx, 'scale', newScale);
                                return;
                            }
                        }
                        
                        const originX = subtype === 'sensor' ? item.sensor_x : item.x;
                        const originY = subtype === 'sensor' ? item.sensor_y : item.y;
                        const centerX = rect.left + (originX / 100) * rect.width;
                        const centerY = rect.top + (originY / 100) * rect.height;
                        const dist = Math.sqrt(Math.pow(e.clientX - centerX, 2) + Math.pow(e.clientY - centerY, 2));
                        const newScale = Math.max(0.1, (dist / 100).toFixed(2));
                        handleFineTune(draggingTarget, subtype === 'sensor' ? 'sensor_scale' : 'scale', newScale);
                    }
                }
            };

            const handleImageClick = (e) => {
                if (isDraggingMode.current || panMode || e.button === 1) return; 
                if (!imageRef.current || draggingTarget !== null) return;
                
                const rect = imageRef.current.getBoundingClientRect();
                const xPct = Number((((e.clientX - rect.left) / rect.width) * 100).toFixed(1));
                const yPct = Number((((e.clientY - rect.top) / rect.height) * 100).toFixed(1));

                if (activeTarget.type === 'point_group') {
                    if (activeTarget.idx >= groupedPoints.length) return;
                    const grp = groupedPoints[activeTarget.idx];
                    handleFineTuneGroup(grp.indices, 'x', xPct);
                    handleFineTuneGroup(grp.indices, 'y', yPct);
                    if (activeTarget.idx < groupedPoints.length - 1) setActiveTarget({ type: 'point_group', idx: activeTarget.idx + 1 });
                } else if (activeTarget.type === 'animation') {
                    const list = schema[category]?.[typeId]?.visual_assets?.animations || [];
                    if (activeTarget.idx >= list.length) return; 
                    const updates = { x: xPct, y: yPct };
                    if (['centrifugal_fan', 'rectangular_fan'].includes(list[activeTarget.idx].animation_type)) {
                        updates.pill_x = xPct; updates.pill_y = yPct + 10;
                    }
                    if (list[activeTarget.idx].animation_type === 'diff_pressure_switch') {
                        updates.sensor_x = xPct + 10; updates.sensor_y = yPct - 10;
                    }
                    updateTargetCoords(activeTarget, updates);
                    if (activeTarget.idx < list.length - 1) setActiveTarget({ type: 'animation', idx: activeTarget.idx + 1 });
                }
            };

            const handleWheel = (e) => {
                setView(prev => {
                    const delta = e.deltaY < 0 ? 0.2 : -0.2;
                    return { ...prev, scale: Math.max(0.2, Math.min(10, prev.scale + delta)) };
                });
            };

            const exportConfig = () => {
                const schemaData = schema;

                function downloadToBuffer() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(schemaData, null, 2));
                    const downloadAnchorNode = document.createElement('a');
                    downloadAnchorNode.setAttribute("href", dataStr);
                    downloadAnchorNode.setAttribute("download", "equipment_types.json");
                    document.body.appendChild(downloadAnchorNode);
                    downloadAnchorNode.click();
                    downloadAnchorNode.remove();
                }

                // Always also download to the browser PC Downloads folder.
                if (deploymentPath && deploymentPath.trim()) {
                    const apiUrl = window.API_BASE_URL || '';
                    fetch(`${apiUrl}/api/save-equipment-schema`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            deployment_path: deploymentPath,
                            equipment_schema: schemaData
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        downloadToBuffer();
                        if (data.success) {
                            // V1.9: dual-write site + configs. V2.0 demo may return virtual path.
                            const files = (data.files && data.files.length)
                                ? data.files.join('\n')
                                : data.file;
                            toast(`Equipment schema saved to:\n\n${files}\n\n+ downloaded to this PC (Downloads).`);
                        } else if (data.warning) {
                            toast(data.warning + '\n\nDownloaded to this PC (Downloads).');
                        } else {
                            throw new Error(data.error || 'Save failed');
                        }
                    })
                    .catch(err => {
                        downloadToBuffer();
                        toast(`Error saving to server:\n\n${err.message}\n\nDownloaded to this PC (Downloads) instead.`);
                    });
                } else {
                    downloadToBuffer();
                }
            };

            // ============= FLOOR PLAN MAPPER FUNCTIONS (v12.2) =============
            
            const addFloor = () => {
                addNewFloorPlan();
            };
            
            // Shared helper: finalize adding a new floor with given image
            const finalizeNewFloor = (fileName, imageData) => {
                const floorName = prompt(`Name this floor plan:\n\nExamples: Ground Floor, Level 2 - East Wing`, `Floor ${floorPlans.length + 1}`);
                if (!floorName || !floorName.trim()) {
                    toast('Floor name is required. Floor plan not added.');
                    return;
                }
                const newFloor = {
                    id: `floor_${Date.now()}`,
                    name: floorName.trim(),
                    imagePath: fileName,
                    imageData: imageData,
                    originalFileName: fileName
                };
                const updatedFloors = [...floorPlans, newFloor];
                setFloorPlans(updatedFloors);
                setCurrentFloorIdx(updatedFloors.length - 1);
            };
            
            const addNewFloorPlan = () => {
                const source = prompt('Load floor plan image from:\n\n1 = Controller (/root/data/)\n2 = Local PC (browse)\n\nEnter 1 or 2:', '2');
                if (!source) return;
                
                if (source.trim() === '1') {
                    // Pick from controller
                    openImagePicker((filename, imageURL) => {
                        finalizeNewFloor(filename, imageURL);
                    });
                } else {
                    // Pick from local PC
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/png,image/jpeg,image/jpg,image/svg+xml';
                    input.onchange = async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        
                        const reader = new FileReader();
                        reader.onload = async (event) => {
                            const imageDataURL = event.target.result;
                            const fileName = file.name;
                            
                            finalizeNewFloor(fileName, imageDataURL);
                            
                            // Also upload image to controller
                            try {
                                const apiUrl = window.API_BASE_URL || '';
                                const response = await fetch(`${apiUrl}/api/save-floor-plan`, {
                                    method: 'POST',
                                    credentials: 'include',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ filename: `graphics/floor_plans/${fileName}`, image_data: imageDataURL })
                                });
                                const data = await response.json();
                                if (data.success) {
                                    toast(`Floor plan added.\n\nImage saved to controller: /root/data/${data.relative_path || fileName}`);
                                } else {
                                    toast(`Floor plan added to preview.\n\nSave to controller failed: ${data.error || data.warning || 'Unknown error'}`);
                                }
                            } catch (err) {
                                toast(`Floor plan added to preview.\n\nCould not reach controller: ${err.message}`);
                            }
                        };
                        reader.readAsDataURL(file);
                    };
                    input.click();
                }
            };
            
            const replaceFloorBackground = () => {
                if (floorPlans.length === 0 || !floorPlans[currentFloorIdx]) {
                    toast('No floor selected. Upload a floor plan first.');
                    return;
                }
                
                const currentFloorName = floorPlans[currentFloorIdx].name;
                const source = prompt(`Change image for "${currentFloorName}" from:\n\n1 = Controller (/root/data/)\n2 = Local PC (browse)\n\nEnter 1 or 2:`, '2');
                if (!source) return;
                
                const applyImage = (fileName, imageData) => {
                    setFloorPlans(prev => prev.map((floor, idx) => 
                        idx === currentFloorIdx 
                            ? { ...floor, imagePath: fileName, imageData: imageData, originalFileName: fileName }
                            : floor
                    ));
                };
                
                if (source.trim() === '1') {
                    // Pick from controller
                    openImagePicker((filename, imageURL) => {
                        applyImage(filename, imageURL);
                        toast(`Background updated for "${currentFloorName}" using ${filename} from controller.`);
                    });
                } else {
                    // Pick from local PC
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/png,image/jpeg,image/jpg,image/svg+xml';
                    input.onchange = async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        
                        const reader = new FileReader();
                        reader.onload = async (event) => {
                            const imageDataURL = event.target.result;
                            const fileName = file.name;
                            
                            applyImage(fileName, imageDataURL);
                            
                            try {
                                const apiUrl = window.API_BASE_URL || '';
                                const response = await fetch(`${apiUrl}/api/save-floor-plan`, {
                                    method: 'POST',
                                    credentials: 'include',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ filename: `graphics/floor_plans/${fileName}`, image_data: imageDataURL })
                                });
                                const data = await response.json();
                                if (data.success) {
                                    toast(`Background updated for "${currentFloorName}".\n\nImage saved to controller: /root/data/${data.relative_path || fileName}`);
                                } else {
                                    toast(`Background updated in preview, but save failed: ${data.error || data.warning || 'Unknown error'}`);
                                }
                            } catch (err) {
                                toast(`Background updated in preview, could not reach controller: ${err.message}`);
                            }
                        };
                        reader.readAsDataURL(file);
                    };
                    input.click();
                }
            };
            
            const renameFloor = (floorIdx) => {
                const currentName = floorPlans[floorIdx].name;
                const newName = prompt(`Rename this floor:\n\nCurrent name: "${currentName}"`, currentName);
                
                if (newName && newName.trim() && newName.trim() !== currentName) {
                    setFloorPlans(prev => prev.map((floor, idx) => 
                        idx === floorIdx 
                            ? { ...floor, name: newName.trim() }
                            : floor
                    ));
                }
            };
            
            const deleteFloor = (floorIdx) => {
                const floor = floorPlans[floorIdx];
                const markersOnFloor = floorMarkers.filter(m => m.floorIdx === floorIdx).length;
                
                const confirmMsg = markersOnFloor > 0 
                    ? `Delete "${floor.name}"?\n\nThis will also delete ${markersOnFloor} marker(s) on this floor.`
                    : `Delete "${floor.name}"?`;
                
                if (confirm(confirmMsg)) {
                    // Remove the floor
                    setFloorPlans(prev => prev.filter((_, idx) => idx !== floorIdx));
                    
                    // Remove all markers on this floor and update indices for markers on higher floors
                    setFloorMarkers(prev => 
                        prev
                            .filter(m => m.floorIdx !== floorIdx)
                            .map(m => ({
                                ...m,
                                floorIdx: m.floorIdx > floorIdx ? m.floorIdx - 1 : m.floorIdx
                            }))
                    );
                    setFloorWindows(prev =>
                        prev
                            .filter(w => w.floorIdx !== floorIdx)
                            .map(w => ({
                                ...w,
                                floorIdx: w.floorIdx > floorIdx ? w.floorIdx - 1 : w.floorIdx
                            }))
                    );
                    
                    // Update current floor index
                    if (currentFloorIdx >= floorPlans.length - 1) {
                        setCurrentFloorIdx(Math.max(0, floorPlans.length - 2));
                    }
                }
            };

            const handleFloorCanvasClick = (e) => {
                if (!floorCanvasRef.current) return;
                const rect = floorCanvasRef.current.getBoundingClientRect();
                const xPct = ((e.clientX - rect.left) / rect.width) * 100;
                const yPct = ((e.clientY - rect.top) / rect.height) * 100;

                const closeIfNearFirst = (pts, commitFn) => {
                    if (pts.length < 3) return false;
                    const f0 = pts[0];
                    const dPx = Math.hypot(
                        ((f0.x - xPct) / 100) * rect.width,
                        ((f0.y - yPct) / 100) * rect.height
                    );
                    if (dPx < 14) { commitFn(); return true; }
                    return false;
                };

                if (nsMode && nsMode !== 'edit') {
                    e.stopPropagation();
                    const key = nsMode === 'n' ? 'north' : nsMode === 's' ? 'south' : nsMode === 'w' ? 'west' : 'east';
                    setFloorOrientations(prev => {
                        const cur = Object.assign({}, prev[currentFloorIdx] || {});
                        cur[key] = { x: xPct, y: yPct };
                        return Object.assign({}, prev, { [currentFloorIdx]: cur });
                    });
                    const order = ['n', 's', 'w', 'e'];
                    const i = order.indexOf(nsMode);
                    setNsMode(i >= 0 && i < order.length - 1 ? order[i + 1] : 'edit');
                    toast(i < order.length - 1
                        ? `Placed ${key.toUpperCase()} — now click ${order[i + 1].toUpperCase()} on the plan`
                        : 'N/S/W/E set — drag to fine-tune, then click N/S/W/E again when done.');
                    return;
                }

                if (windowTraceMode) {
                    e.stopPropagation();
                    const pts = windowTraceMode.pts || [];
                    if (closeIfNearFirst(pts, commitTracedWindow)) return;
                    setWindowTraceMode(Object.assign({}, windowTraceMode, { pts: [...pts, { x: xPct, y: yPct }] }));
                    return;
                }

                if (obstructionTraceMode) {
                    e.stopPropagation();
                    const pts = obstructionTraceMode.pts || [];
                    if (closeIfNearFirst(pts, commitTracedObstruction)) return;
                    setObstructionTraceMode({ pts: [...pts, { x: xPct, y: yPct }] });
                    return;
                }

                // Trace room: click corners; close near first / dblclick / Enter.
                if (roomMode) {
                    e.stopPropagation();
                    const pts = roomMode.pts || [];
                    if (closeIfNearFirst(pts, commitTracedRoom)) return;
                    setRoomMode({ pts: [...pts, { x: xPct, y: yPct }] });
                    return;
                }

                if (!draggedMarkerType) return;

                // If this floor already has exactly one named AHU, pre-bind new VAVs to it
                const soleAhuName = (() => {
                    if (draggedMarkerType !== 'vav') return '';
                    const named = floorMarkers
                        .filter(m => m.floorIdx === currentFloorIdx && m.type === 'ahu' && (m.name || '').trim())
                        .map(m => m.name.trim());
                    const uniq = [...new Set(named)];
                    return uniq.length === 1 ? uniq[0] : '';
                })();
                
                const newMarker = {
                    id: `${draggedMarkerType}_${Date.now()}`,
                    type: draggedMarkerType,
                    floorIdx: currentFloorIdx,
                    x: xPct,
                    y: yPct,
                    name: '',
                    active: true,
                    equipment_type_id: '',
                    // AHU placeholder telemetry
                    ...(draggedMarkerType === 'ahu' ? {
                        oa_temp: 75.2,
                        sa_temp: 55.4,
                        ra_temp: 72.8,
                        humidity: 45.0,
                        enthalpy: 28.5
                    } : {}),
                    // VAV placeholder telemetry + optional parent AHU
                    ...(draggedMarkerType === 'vav' ? {
                        zone_temp: 72.0,
                        damper_position: 65,
                        ahu_id: soleAhuName,
                    } : {})
                };

                setFloorMarkers([...floorMarkers, newMarker]);
                setDraggedMarkerType(null);
            };

            const handleFloorMarkerDragStart = (e, markerId) => {
                e.stopPropagation();
                setDraggingWindowId(null);
                setDraggingFloorMarker(markerId);
            };

            const handleNsMarkerDragStart = (e, key) => {
                e.stopPropagation();
                e.preventDefault();
                if (roomMode || windowTraceMode || obstructionTraceMode) return;
                if (nsMode && nsMode !== 'edit') return;
                setDraggingFloorMarker(null);
                setDraggingWindowId(null);
                setPanMode(false);
                setNsMode('edit');
                setDraggingNsKey(key);
            };

            const handleWindowDragStart = (e, windowId) => {
                e.stopPropagation();
                if (roomMode || windowTraceMode || obstructionTraceMode || (nsMode && nsMode !== 'edit')) return;
                setDraggingFloorMarker(null);
                setSelectedWindowId(windowId);
                setDraggingWindowId(windowId);
            };

            const commitTracedRoom = () => {
                const pts = (roomMode && roomMode.pts) || [];
                if (pts.length < 3) {
                    toast('A room needs at least 3 corners.');
                    return;
                }
                const verts = pts.map(p => [p.x, p.y]);
                const n = floorRooms.filter(r => r.floorIdx === currentFloorIdx).length;
                const newRoom = {
                    id: 'room_' + Date.now(),
                    floorIdx: currentFloorIdx,
                    name: 'Room ' + (n + 1),
                    vertices: verts,
                };
                setFloorRooms(prev => [...prev, newRoom]);
                setSelectedRoomId(newRoom.id);
                setRoomsPanelOpen(true);
                setRoomMode(null);
                toast('Room traced — sunlight will stay inside this boundary.');
            };

            const commitTracedWindow = () => {
                const pts = (windowTraceMode && windowTraceMode.pts) || [];
                if (pts.length < 3) {
                    toast('A window aperture needs at least 3 corners.');
                    return;
                }
                const verts = pts.map(p => [p.x, p.y]);
                const cx = verts.reduce((s, v) => s + v[0], 0) / verts.length;
                const cy = verts.reduce((s, v) => s + v[1], 0) / verts.length;
                const dx = verts[1][0] - verts[0][0];
                const dy = verts[1][1] - verts[0][1];
                const length = Math.max(Math.hypot(dx, dy), 3);
                const angle_deg = Math.atan2(dy, dx) * 180 / Math.PI;
                if (windowTraceMode.windowId) {
                    setFloorWindows(prev => prev.map(w => w.id === windowTraceMode.windowId
                        ? Object.assign({}, w, {
                            vertices: verts, x: cx, y: cy, length, angle_deg,
                            skew_x: 0, skew_y: 0, stretch_x: 1, stretch_y: 1,
                        })
                        : w));
                    toast('Window updated from trace (2D glass outline).');
                } else {
                    const n = floorWindows.filter(w => w.floorIdx === currentFloorIdx).length;
                    const newWin = {
                        id: 'w_' + Date.now(),
                        floorIdx: currentFloorIdx,
                        name: 'W' + (n + 1),
                        x: cx, y: cy, length, angle_deg,
                        blind_level: 0, blind_type: 'roller',
                        sill_height_m: 1.0, head_height_m: 2.2,
                        skew_x: 0, skew_y: 0, stretch_x: 1, stretch_y: 1,
                        vertices: verts,
                    };
                    setFloorWindows(prev => [...prev, newWin]);
                    setSelectedWindowId(newWin.id);
                    toast('Traced 2D window — sun spill follows this outline.');
                }
                setWindowTraceMode(null);
            };

            const commitTracedObstruction = () => {
                const pts = (obstructionTraceMode && obstructionTraceMode.pts) || [];
                if (pts.length < 3) {
                    toast('Concrete needs at least 3 corners.');
                    return;
                }
                const n = floorObstructions.filter(o => o.floorIdx === currentFloorIdx).length;
                setFloorObstructions(prev => [...prev, {
                    id: 'obs_' + Date.now(),
                    floorIdx: currentFloorIdx,
                    name: 'Concrete ' + (n + 1),
                    vertices: pts.map(p => [p.x, p.y]),
                }]);
                setObstructionTraceMode(null);
                toast('Concrete traced — sun spill is blocked through it.');
            };

            const clearAllTraceModes = () => {
                setRoomMode(null);
                setWindowTraceMode(null);
                setObstructionTraceMode(null);
                setNsMode(null);
                setDraggedMarkerType(null);
            };

            const startRoomTrace = () => {
                const was = !!roomMode;
                clearAllTraceModes();
                if (was) return;
                setRoomMode({ pts: [] });
                setRoomsPanelOpen(true);
                toast('Trace room: click each corner. Click first again, double-click, or Enter to close. Esc cancels.');
            };

            const startWindowTrace = (opts) => {
                const togglingToolbar = !opts;
                const was = togglingToolbar && !!windowTraceMode;
                clearAllTraceModes();
                if (was) {
                    toast('Window trace cancelled.');
                    return;
                }
                const createNew = !!(opts && opts.createNew) || (togglingToolbar && !selectedWindowId);
                const wid = createNew ? null : ((opts && opts.windowId) || selectedWindowId || null);
                if (!createNew && !wid) {
                    toast('Select exactly one window, then Trace aperture — or use Trace Window to create.');
                    return;
                }
                const seed = [];
                if (wid) {
                    const w = floorWindows.find(x => x.id === wid);
                    if (w && Array.isArray(w.vertices)) {
                        w.vertices.forEach(p => seed.push({ x: p[0], y: p[1] }));
                    }
                    setSelectedWindowId(wid);
                }
                setWindowTraceMode({ windowId: wid, createNew: !wid, pts: seed });
                setPanMode(false);
                toast(!wid
                    ? 'Trace new window: click each corner. Close on first point / Enter / double-click. Esc cancels.'
                    : 'Re-trace glass: close on first point / Enter / double-click. Esc cancels.');
            };

            const startObstructionTrace = () => {
                const was = !!obstructionTraceMode;
                clearAllTraceModes();
                if (was) return;
                setObstructionTraceMode({ pts: [] });
                toast('Trace concrete: click each corner. Close on first point / Enter / double-click. Esc cancels.');
            };

            const startNsMarkers = () => {
                const o = floorOrientations[currentFloorIdx] || {};
                const complete = !!(o.north && o.south && o.west && o.east);
                const was = !!nsMode;
                clearAllTraceModes();
                setPanMode(false);
                if (was) {
                    toast(complete
                        ? 'N/S/W/E done — letters stay on the plan. Click the button to edit again.'
                        : 'N/S/W/E cancelled.');
                    return;
                }
                if (complete) {
                    setNsMode('edit');
                    toast('Edit N/S/W/E — drag the letters. Click N/S/W/E again when done.');
                    return;
                }
                const next = !o.north ? 'n' : !o.south ? 's' : !o.west ? 'w' : 'e';
                setNsMode(next);
                toast('Click ' + next.toUpperCase() + ' on the floor image, then South, West, East. Click N/S/W/E again when done.');
            };

            useEffect(() => {
                const tracing = roomMode || windowTraceMode || obstructionTraceMode || nsMode;
                if (!tracing) return undefined;
                const onKey = (ev) => {
                    if (ev.key === 'Enter') {
                        ev.preventDefault();
                        if (roomMode) commitTracedRoom();
                        else if (windowTraceMode) commitTracedWindow();
                        else if (obstructionTraceMode) commitTracedObstruction();
                    } else if (ev.key === 'Escape') {
                        const finishingNs = !!nsMode;
                        clearAllTraceModes();
                        toast(finishingNs
                            ? 'N/S/W/E done — letters stay on the plan.'
                            : 'Trace cancelled.');
                    } else if (ev.key === 'Backspace') {
                        if (roomMode && roomMode.pts && roomMode.pts.length) {
                            ev.preventDefault();
                            setRoomMode({ pts: roomMode.pts.slice(0, -1) });
                        } else if (windowTraceMode && windowTraceMode.pts && windowTraceMode.pts.length) {
                            ev.preventDefault();
                            setWindowTraceMode(Object.assign({}, windowTraceMode, { pts: windowTraceMode.pts.slice(0, -1) }));
                        } else if (obstructionTraceMode && obstructionTraceMode.pts && obstructionTraceMode.pts.length) {
                            ev.preventDefault();
                            setObstructionTraceMode({ pts: obstructionTraceMode.pts.slice(0, -1) });
                        }
                    }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [roomMode, windowTraceMode, obstructionTraceMode, nsMode, floorRooms, floorWindows, floorObstructions, currentFloorIdx]);

            const handleFloorMarkerDrag = (e) => {
                if ((!draggingFloorMarker && !draggingWindowId && !draggingNsKey) || !floorCanvasRef.current) return;
                
                const rect = floorCanvasRef.current.getBoundingClientRect();
                const xPct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
                const yPct = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));

                if (draggingFloorMarker) {
                    setFloorMarkers(prev => prev.map(m => 
                        m.id === draggingFloorMarker ? { ...m, x: xPct, y: yPct } : m
                    ));
                }
                if (draggingWindowId) {
                    setFloorWindows(prev => prev.map(w =>
                        w.id === draggingWindowId ? { ...w, x: xPct, y: yPct } : w
                    ));
                }
                if (draggingNsKey) {
                    setFloorOrientations(prev => {
                        const cur = Object.assign({}, prev[currentFloorIdx] || {});
                        cur[draggingNsKey] = { x: xPct, y: yPct };
                        return Object.assign({}, prev, { [currentFloorIdx]: cur });
                    });
                }
            };

            const updateMarkerField = (markerId, field, value) => {
                setFloorMarkers(prev => prev.map(m => 
                    m.id === markerId ? { ...m, [field]: value } : m
                ));
            };

            const deleteMarker = (markerId) => {
                setFloorMarkers(prev => prev.filter(m => m.id !== markerId));
                if (selectedMarkerId === markerId) setSelectedMarkerId(null);
            };

            const deleteWindow = (windowId) => {
                setFloorWindows(prev => prev.filter(w => w.id !== windowId));
                if (selectedWindowId === windowId) setSelectedWindowId(null);
                if (draggingWindowId === windowId) setDraggingWindowId(null);
            };

            // Build collector_config.json from floor-plan AHU/VAV markers.
            // Shared by Save-to-Controller and the dedicated Export button.
            // VAV → AHU priority: explicit marker.ahu_id → sole AHU on floor →
            // E/S/W/N name suffix match → first AHU on that floor.
            const generateCollectorConfig = (markers) => {
                const groups = {};
                const orphanVavs = [];
                let skippedUnnamed = 0;

                const getOrientation = (name) => {
                    const m = String(name || '').match(/[-_]([ESWN])$/i);
                    return m ? m[1].toUpperCase() : null;
                };

                const ensureGroup = (ahuName) => {
                    if (!groups[ahuName]) {
                        const csvObj = 'CSV_' + ahuName.replace(/[-\s]/g, '');
                        groups[ahuName] = { csv_object: csvObj, vavs: [] };
                    }
                    return groups[ahuName];
                };

                // Group markers by floor (keep full marker objects for ahu_id)
                const byFloor = {};
                markers.forEach(m => {
                    if (!m || !m.type) return;
                    const name = (m.name || '').trim();
                    if (!name) {
                        skippedUnnamed += 1;
                        return;
                    }
                    const fi = m.floorIdx !== undefined ? m.floorIdx : -1;
                    if (!byFloor[fi]) byFloor[fi] = { ahus: [], vavs: [] };
                    if (m.type === 'ahu') {
                        if (!byFloor[fi].ahus.some(a => a.name === name)) {
                            byFloor[fi].ahus.push({ name, id: m.id });
                        }
                    } else if (m.type === 'vav') {
                        if (!byFloor[fi].vavs.some(v => v.name === name)) {
                            byFloor[fi].vavs.push({
                                name,
                                ahu_id: (m.ahu_id || '').trim(),
                            });
                        }
                    }
                });

                Object.keys(byFloor).sort((a, b) => a - b).forEach(fi => {
                    const floor = byFloor[fi];
                    const ahuNames = floor.ahus.map(a => a.name);
                    ahuNames.forEach(ensureGroup);

                    if (ahuNames.length === 0) {
                        floor.vavs.forEach(v => orphanVavs.push(v.name));
                        return;
                    }

                    floor.vavs.forEach(v => {
                        let target = null;
                        if (v.ahu_id && ahuNames.includes(v.ahu_id)) {
                            target = v.ahu_id;
                        } else if (v.ahu_id && groups[v.ahu_id]) {
                            // Parent AHU named but lives on another floor — still honor it
                            target = v.ahu_id;
                            ensureGroup(target);
                        } else if (ahuNames.length === 1) {
                            target = ahuNames[0];
                        } else {
                            const vOrient = getOrientation(v.name);
                            if (vOrient) {
                                target = ahuNames.find(a => getOrientation(a) === vOrient) || null;
                            }
                            if (!target) target = ahuNames[0];
                        }
                        ensureGroup(target).vavs.push(v.name);
                    });
                });

                if (orphanVavs.length > 0) {
                    console.warn('Orphaned VAVs (no AHU on their floor):', orphanVavs);
                }

                Object.keys(groups).forEach(a => { groups[a].vavs = [...new Set(groups[a].vavs)]; });

                return {
                    version: '1.1',
                    interval: 5,
                    mock_mode: true,
                    ahu_groups: groups,
                    dashboard_point_map: {
                        ahu: { oa_t: 'OAT', oa_rh: 'OAH', sa_t: 'SAT', sa_rh: 'SAH' },
                        vav: { zone_t: 't', zone_rh: 'rh' }
                    },
                    _meta: { skippedUnnamed, orphanVavs }
                };
            };

            // Full-plant baseline (AHU-01..05). Used when the controller master
            // was previously wiped down to a single floor — Export/Save must NOT
            // treat that truncated file as the plant master.
            const FULL_PLANT_COLLECTOR_TEMPLATE = {
  "version": "1.1",
  "interval": 5,
  "mock_mode": true,
  "ahu_groups": {
    "AHU-01": {
      "csv_object": "CSV1",
      "vavs": [
        "VAV-01-E",
        "VAV-02-E",
        "VAV-03-E",
        "VAV-04-E",
        "VAV-01-S",
        "VAV-02-S",
        "VAV-01-W",
        "VAV-02-W",
        "VAV-01-N",
        "VAV-02-N"
      ]
    },
    "AHU-02": {
      "csv_object": "CSV2",
      "vavs": [
        "VAV-01-E",
        "VAV-02-E",
        "VAV-03-E",
        "VAV-04-E",
        "VAV-01-S",
        "VAV-02-S",
        "VAV-03-S",
        "VAV-01-W",
        "VAV-02-W",
        "VAV-01-N",
        "VAV-02-N",
        "VAV-03-N"
      ]
    },
    "AHU-03": {
      "csv_object": "CSV3",
      "vavs": [
        "VAV-01-N",
        "VAV-02-N",
        "VAV-03-N",
        "VAV-04-N",
        "VAV-01-W",
        "VAV-02-W",
        "VAV-03-W",
        "VAV-04-W",
        "VAV-01-E",
        "VAV-02-E",
        "VAV-01-S",
        "VAV-02-S",
        "VAV-03-S",
        "VAV-04-S",
        "VAV-05-S"
      ]
    },
    "AHU-04": {
      "csv_object": "CSV4",
      "vavs": [
        "VAV-01-N",
        "VAV-02-N",
        "VAV-01-E",
        "VAV-02-E",
        "VAV-01-S",
        "VAV-02-S",
        "VAV-03-S",
        "VAV-01-W",
        "VAV-02-W",
        "VAV-03-W",
        "VAV-04-W"
      ]
    },
    "AHU-05": {
      "csv_object": "CSV5",
      "vavs": [
        "VAV-01-N",
        "VAV-02-N",
        "VAV-03-N",
        "VAV-04-N",
        "VAV-05-N",
        "VAV-01-W",
        "VAV-02-W",
        "VAV-03-W",
        "VAV-04-W",
        "VAV-05-W"
      ]
    }
  },
  "dashboard_point_map": {
    "ahu": {
      "oa_t": "OAT",
      "oa_rh": "OAH",
      "sa_t": "SAT",
      "sa_rh": "SAH",
      "ma_t": "MAT",
      "ma_rh": "MAH"
    },
    "vav": {
      "zone_t": "t",
      "zone_rh": "rh"
    }
  }
};

            // Empty shell used only when no master can be loaded.
            const emptyCollectorShell = () => ({
                version: '1.1',
                interval: 5,
                mock_mode: true,
                ahu_groups: {},
                dashboard_point_map: {
                    ahu: { oa_t: 'OAT', oa_rh: 'OAH', sa_t: 'SAT', sa_rh: 'SAH' },
                    vav: { zone_t: 't', zone_rh: 'rh' }
                }
            });

            const normalizeCollectorConfig = (j) => {
                if (!j || typeof j !== 'object') return null;
                // Controller: { success, config }. Cloud/demo: bare cfg. Some builds nest under .data.
                if (j.ahu_groups && typeof j.ahu_groups === 'object') return j;
                if (j.config && typeof j.config === 'object' && j.config.ahu_groups) return j.config;
                if (j.data && typeof j.data === 'object' && j.data.ahu_groups) return j.data;
                if (j.config && typeof j.config === 'object') return j.config;
                return null;
            };

            const pickCollectorConfigFile = () => new Promise((resolve) => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json,application/json';
                input.onchange = () => {
                    const f = input.files && input.files[0];
                    if (!f) { resolve(null); return; }
                    const reader = new FileReader();
                    reader.onload = () => {
                        try {
                            const parsed = JSON.parse(reader.result);
                            const cfg = normalizeCollectorConfig(parsed) || (parsed && parsed.ahu_groups ? parsed : null);
                            resolve(cfg);
                        } catch (e) {
                            console.warn('pickCollectorConfigFile parse error', e);
                            resolve(null);
                        }
                    };
                    reader.onerror = () => resolve(null);
                    reader.readAsText(f);
                };
                // Cancel: some browsers fire no event — resolve null after blur delay is unreliable;
                // user can re-click Export. If they cancel the dialog, onchange never runs.
                input.addEventListener('cancel', () => resolve(null));
                input.click();
            });

            // Load master collector_config.json from the controller / demo API.
            const fetchMasterCollectorConfig = async () => {
                const apiUrl = window.API_BASE_URL || '';
                try {
                    const r = await fetch(`${apiUrl}/api/collector-config`, { credentials: 'include' });
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    const j = await r.json();
                    const cfg = normalizeCollectorConfig(j);
                    if (cfg) return { cfg, source: 'api' };
                } catch (err) {
                    console.warn('fetchMasterCollectorConfig:', err);
                }
                return { cfg: emptyCollectorShell(), source: 'empty' };
            };

            // Patch master: for each AHU on the current floor, REPLACE its vavs
            // list with what the floor map says (do not keep old master VAVs).
            // AHUs not on this floor are left untouched.
            const mergeFloorIntoMasterCollector = (master, floorPatch, floorMarkersOnFloor) => {
                const out = {
                    version: master.version || floorPatch.version || '1.1',
                    interval: master.interval != null ? master.interval : (floorPatch.interval || 5),
                    mock_mode: master.mock_mode != null ? master.mock_mode : true,
                    ahu_groups: { ...(master.ahu_groups || {}) },
                    dashboard_point_map: master.dashboard_point_map || floorPatch.dashboard_point_map || {
                        ahu: { oa_t: 'OAT', oa_rh: 'OAH', sa_t: 'SAT', sa_rh: 'SAH' },
                        vav: { zone_t: 't', zone_rh: 'rh' }
                    }
                };
                Object.keys(master || {}).forEach(k => {
                    if (!(k in out) && k !== 'ahu_groups') out[k] = master[k];
                });

                // Deep-clone groups so we don't mutate the template/live refs
                Object.keys(out.ahu_groups).forEach((k) => {
                    out.ahu_groups[k] = {
                        ...out.ahu_groups[k],
                        vavs: [...(out.ahu_groups[k].vavs || [])],
                    };
                });

                const updated = [];
                Object.entries(floorPatch.ahu_groups || {}).forEach(([ahuName, grp]) => {
                    const prev = out.ahu_groups[ahuName] || {};
                    const prevCsv = prev.csv_object || '';
                    const patchCsv = (grp && grp.csv_object) || '';
                    // Prefer real BACnet IDs (CSV1); ignore mapper auto CSV_AHU01
                    let csv = prevCsv || patchCsv || ('CSV_' + ahuName.replace(/[-\s]/g, ''));
                    if (/^CSV_AHU/i.test(csv) && prevCsv && !/^CSV_AHU/i.test(prevCsv)) csv = prevCsv;
                    if (/^CSV_AHU/i.test(csv) && patchCsv && !/^CSV_AHU/i.test(patchCsv)) csv = patchCsv;

                    out.ahu_groups[ahuName] = {
                        ...prev,
                        csv_object: csv,
                        // REPLACE — floor map is the source of truth for this AHU
                        vavs: [...((grp && grp.vavs) || [])],
                    };
                    updated.push(ahuName);
                });
                return { merged: out, updatedAhus: updated };
            };

            const downloadJsonFile = (obj, filename) => {
                const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1500);
            };

            const cloneCollector = (cfg) => JSON.parse(JSON.stringify(cfg || {}));

            // Build the real plant master:
            // - If live controller config has at least as many AHUs as the full-plant
            //   template, trust live.
            // - Otherwise start from FULL_PLANT_COLLECTOR_TEMPLATE and overlay live
            //   csv_object / mock_mode (so a wiped Floor-1-only controller master
            //   cannot shrink the export).
            const resolveFullPlantMaster = (liveCfg) => {
                const template = cloneCollector(FULL_PLANT_COLLECTOR_TEMPLATE);
                const live = liveCfg && typeof liveCfg === 'object' ? liveCfg : {};
                const liveGroups = live.ahu_groups || {};
                const tmplGroups = template.ahu_groups || {};
                const liveCount = Object.keys(liveGroups).length;
                const tmplCount = Object.keys(tmplGroups).length;

                if (liveCount >= tmplCount && liveCount > 0) {
                    return { master: cloneCollector(live), source: 'controller', liveCount, tmplCount };
                }

                const master = cloneCollector(template);
                if (live.mock_mode != null) master.mock_mode = live.mock_mode;
                if (live.interval != null) master.interval = live.interval;
                if (live.version) master.version = live.version;
                if (live.dashboard_point_map) master.dashboard_point_map = live.dashboard_point_map;

                Object.entries(liveGroups).forEach(([ahu, grp]) => {
                    if (!master.ahu_groups[ahu]) {
                        master.ahu_groups[ahu] = { ...grp };
                        return;
                    }
                    const csv = (grp && grp.csv_object) || '';
                    // Keep real BACnet IDs (CSV1); ignore mapper auto names (CSV_AHU01)
                    if (csv && !/^CSV_AHU/i.test(csv)) {
                        master.ahu_groups[ahu].csv_object = csv;
                    }
                });

                return {
                    master,
                    source: liveCount === 0 ? 'full-plant-template' : 'template+controller-overlay',
                    liveCount,
                    tmplCount,
                };
            };

            // Export FULL master collector_config.json:
            // full plant baseline + current-floor AHU patch → download.
            const exportCollectorConfig = async () => {
                if (!floorPlans.length) {
                    toast('Add a floor plan and place AHU/VAV markers first.');
                    return;
                }
                const floorName = (floorPlans[currentFloorIdx] && floorPlans[currentFloorIdx].name)
                    || ('Floor ' + (currentFloorIdx + 1));
                // Coerce floorIdx — map load / JSON can leave string indices on V1.9.
                const floorOnly = floorMarkers
                    .filter(m => Number(m.floorIdx) === Number(currentFloorIdx))
                    .map(m => ({
                        type: m.type,
                        name: m.name,
                        floorIdx: Number(m.floorIdx),
                        ahu_id: m.ahu_id || '',
                        id: m.id,
                    }));
                const floorPatch = generateCollectorConfig(floorOnly);
                const meta = floorPatch._meta || {};
                const skipped = meta.skippedUnnamed || 0;
                const orphans = meta.orphanVavs || [];
                delete floorPatch._meta;
                const updatedNames = Object.keys(floorPatch.ahu_groups || {});
                if (updatedNames.length === 0) {
                    toast(
                        skipped
                            ? ('No named AHU on "' + floorName + '". Name your AHU marker(s) first (' + skipped + ' unnamed skipped).')
                            : ('No AHU markers on "' + floorName + '" (floorIdx=' + currentFloorIdx + ', markersOnFloor=' + floorOnly.length + ').')
                    );
                    return;
                }

                toast('Building full-plant master collector_config.json…');
                const fetched = await fetchMasterCollectorConfig();
                const live = fetched.cfg;
                const resolved = resolveFullPlantMaster(live);
                const master = resolved.master;
                const source = resolved.source;
                const liveCount = resolved.liveCount;
                const tmplCount = resolved.tmplCount;

                const mergeResult = mergeFloorIntoMasterCollector(master, floorPatch, floorOnly);
                const merged = mergeResult.merged;
                const updatedAhus = mergeResult.updatedAhus;

                // Prefer template/real csv_object over auto CSV_AHU* from the floor patch
                updatedAhus.forEach((ahu) => {
                    const tmplCsv = (FULL_PLANT_COLLECTOR_TEMPLATE.ahu_groups[ahu] || {}).csv_object;
                    const cur = merged.ahu_groups[ahu];
                    if (!cur) return;
                    if (tmplCsv && (!cur.csv_object || /^CSV_AHU/i.test(cur.csv_object))) {
                        cur.csv_object = tmplCsv;
                    }
                });

                // Hard verify: each updated AHU must match the floor patch VAV list exactly
                const mismatches = [];
                updatedAhus.forEach((ahu) => {
                    const want = JSON.stringify((floorPatch.ahu_groups[ahu] && floorPatch.ahu_groups[ahu].vavs) || []);
                    const got = JSON.stringify((merged.ahu_groups[ahu] && merged.ahu_groups[ahu].vavs) || []);
                    if (want !== got) mismatches.push(ahu);
                });
                if (mismatches.length) {
                    toast('Export aborted — floor VAV replace failed for: ' + mismatches.join(', '));
                    return;
                }

                const afterAhus = Object.keys(merged.ahu_groups || {}).length;
                const masterVavCount = Object.values(merged.ahu_groups).reduce((s, g) => s + (g.vavs || []).length, 0);

                // Unique filename so Downloads cannot be confused with a stale collector_config.json
                const outName = 'collector_config_SP57.json';
                downloadJsonFile(merged, outName);

                const notes = [
                    'Downloaded ' + outName + ' — FULL plant (' + afterAhus + ' AHUs).',
                    'Baseline: ' + source + ' (controller ' + liveCount + ', template ' + tmplCount + ').',
                    'Floor "' + floorName + '" markers used: ' + floorOnly.length + '.',
                    'Replaced VAV lists:',
                ].concat(updatedAhus.map((ahu) => {
                    const vs = (merged.ahu_groups[ahu] && merged.ahu_groups[ahu].vavs) || [];
                    return '  ' + ahu + ': [' + (vs.join(', ') || '(none)') + ']';
                }));
                notes.push('VAVs in file: ' + masterVavCount + '.');
                if (liveCount > 0 && liveCount < tmplCount) {
                    notes.push('Controller master was truncated — restored AHU-03+ from template.');
                }
                if (skipped) notes.push(skipped + ' unnamed marker(s) skipped.');
                if (orphans.length) notes.push('Orphan VAVs: ' + orphans.join(', '));
                toast(notes.join('\n'));

            // ============= STAGE B LOGIN =============

            // File Browser - fetches list of files from controller
            const openFileBrowser = async (relPath, root) => {

            // Utilities loaded from js/utils.js: formatFileSize, formatDate, fileTypeIcon, fileTypeColor
            
            const deleteFileFromController = async (filename) => {

                const rootLabel = fileBrowserRoot === 'scripts' ? '/root/scripts/' : '/root/data/';
                if (!confirm(`Delete "${fullName}" from ${rootLabel}?\n\nThis cannot be undone.`)) return;
                try {

                    const response = await fetch(`${apiUrl}/api/delete-file`, {
