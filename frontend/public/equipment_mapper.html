    <script>
        (function () {
            var banner = document.getElementById('v2-auth-banner');
            var state  = document.getElementById('v2-auth-state');
            var btnIn  = document.getElementById('v2-auth-signin');
            var btnOut = document.getElementById('v2-auth-logout');
            banner.style.display = 'flex';

            btnIn.addEventListener('click', function () {
                window.location.href = '/';
            });
            btnOut.addEventListener('click', function () {
                fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' })
                    .finally(function () { window.location.href = '/'; });
            });

            fetch('/api/auth/whoami', { credentials: 'same-origin' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (me) {
                    var role = (me && me.role) || 'viewer';
                    var user = (me && me.username) || '';
                    if (role === 'editor' || role === 'admin') {
                        var label = user ? user + ' (' + role + ')' : role;
                        state.textContent = 'Signed in: ' + label;
                        state.style.color = '#a3e635';
                        btnOut.style.display = 'inline-block';
                        window.__red5_signed_in = true;
                    } else {
                        state.textContent = 'View only — sign in to save';
                        state.style.color = '#fbbf24';
                        btnIn.style.display = 'inline-block';
                        window.__red5_signed_in = false;
                    }
                })
                .catch(function () {
                    state.textContent = 'Auth check failed';
                    state.style.color = '#f87171';
                    btnIn.style.display = 'inline-block';
                });
        })();
    </script>

    <script type="text/plain" id="main-source">
        const { useState, useRef, useEffect, useMemo, useCallback } = React;

        // --- DEFINITIVE ERROR BOUNDARY ---
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return <div className="p-10 text-rose-500 font-mono bg-slate-950 h-full w-full flex flex-col items-center justify-center text-center">
                        <h1 className="text-2xl font-black mb-4 uppercase text-white tracking-tighter italic leading-none">{window.t ? window.t('system_crash_prevented') : 'System Render Crash Prevented'}</h1>
                        <p className="bg-slate-900 p-4 rounded border border-rose-900/50 mb-6 max-w-2xl text-[10px] leading-relaxed shadow-black">{this.state.error?.toString()}</p>
                        <button onClick={() => window.location.reload()} className="px-8 py-3 bg-indigo-600 text-white rounded-xl font-black uppercase tracking-widest shadow-xl active:scale-95 transition-all">{window.t ? window.t('reload_system') : 'Reload System'}</button>
                    </div>;
                }
                return this.props.children;
            }
        }

        // ============================================================================
        // UTILITY: VFD BACKGROUND REMOVAL
        // ============================================================================
        const processAndExtractVFD = (imageSource, callback) => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i+1], b = data[i+2];
                    if (r > 190 && g > 190 && b > 190 && Math.abs(r-g) < 25 && Math.abs(g-b) < 25) {
                        data[i+3] = 0; 
                    }
                }
                
                ctx.putImageData(imgData, 0, 0);
                callback(canvas.toDataURL('image/png'));
            };
            img.src = imageSource;
        };

        // ============================================================================
        // 1-2. LOADED FROM EXTERNAL JS FILES (see <script> tags below main script)
        // Preview components: js/preview-components.js
        // Schema config: js/schema-config.js
        // Utilities: js/utils.js
        // ============================================================================

        // ============================================================================
        // 3. MAIN APPLICATION & CANVAS
        // ============================================================================

        // ============================================================================
        // 3. MAIN APPLICATION & CANVAS
        // ============================================================================

        const App = () => {
            const lang = window.useLang ? window.useLang() : 'en';
            const [i18nReady, setI18nReady] = React.useState(!!window.LangSelector);
            React.useEffect(() => {
                if (window.LangSelector) { setI18nReady(true); return; }
                const iv = setInterval(() => { if (window.LangSelector) { setI18nReady(true); clearInterval(iv); } }, 200);
                return () => clearInterval(iv);
            }, []);
            // ============= STAGE B AUTH (server session via /api/auth/whoami) =============
            const [authChecked, setAuthChecked] = useState(false);
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [loginUsername, setLoginUsername] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [authError, setAuthError] = useState('');

            useEffect(() => {
                fetch('/api/auth/whoami', { credentials: 'same-origin' })
                    .then(r => r.json())
                    .then(d => {
                        const role = d.role || 'viewer';
                        const ok = role === 'editor' || role === 'admin';
                        setIsAuthenticated(ok);
                        if (ok) sessionStorage.setItem('engineerAuthenticated', 'true');
                        setAuthChecked(true);
                    })
                    .catch(() => { setAuthChecked(true); });
            }, []);
            
            const [bgImage, setBgImage] = useState(null);
            const [schema, setSchema] = useState(FALLBACK_SCHEMA);
            
            const categories = Object.keys(schema);
            const [category, setCategory] = useState(categories[0] || '');
            const typeIds = schema[category] ? Object.keys(schema[category]) : [];
            const [typeId, setTypeId] = useState(typeIds[0] || '');
            
            const [activeTarget, setActiveTarget] = useState({ type: 'point_group', idx: 0 });
            const [activeSegmentId, setActiveSegmentId] = useState(null); // Track which segment is being edited
            
            // ============= FLOOR PLAN MAPPER STATE (v12.2) =============
            // CRITICAL: Floor Plan Mapper maps PHYSICAL INSTANCES, not schema types
            // Output: floor_mapped.json (separate from equipment_types.json)
            const [floorPlans, setFloorPlans] = useState([]); // [{id, name, imagePath, imageData (for preview only)}]
            const [currentFloorIdx, setCurrentFloorIdx] = useState(0);
            const [floorMarkers, setFloorMarkers] = useState([]); // Physical AHU/VAV instances with coordinates
            const [draggedMarkerType, setDraggedMarkerType] = useState(null); // 'ahu' or 'vav'
            const [selectedMarkerId, setSelectedMarkerId] = useState(null);
            // ELC window creation: Trace Window (2D glass).
            const [floorWindows, setFloorWindows] = useState([]); // {id,floorIdx,x,y,length,angle_deg,blind_level,blind_type,vertices}
            const [windowTraceMode, setWindowTraceMode] = useState(null); // ELC Trace Window: 2D glass polygon
            const isTracedWindow = (w) => !!(w && Array.isArray(w.vertices) && w.vertices.length >= 3);
            const [selectedWindowId, setSelectedWindowId] = useState(null);
            const [draggingWindowId, setDraggingWindowId] = useState(null);
            // Room polygons (plan %) — clip sunshafts + gate VAV amber rings (ELC-style trace).
            const [floorRooms, setFloorRooms] = useState([]); // {id,floorIdx,name,vertices:[[x,y],...]}
            const [roomMode, setRoomMode] = useState(null); // null | {pts:[{x,y},...]}
            const [roomsPanelOpen, setRoomsPanelOpen] = useState(false);
            const [selectedRoomId, setSelectedRoomId] = useState(null);
            const [obstructionTraceMode, setObstructionTraceMode] = useState(null);
            const [floorObstructions, setFloorObstructions] = useState([]); // {id,floorIdx,name,vertices}
            const [nsMode, setNsMode] = useState(null); // null | 'n'|'s'|'w'|'e'|'edit'
            const [floorOrientations, setFloorOrientations] = useState({}); // { [floorIdx]: {north,south,west,east} }
            const [draggingNsKey, setDraggingNsKey] = useState(null); // null | 'north'|'south'|'west'|'east'
            const [showPsychroChart, setShowPsychroChart] = useState(false);
            const [psychroChartData, setPsychroChartData] = useState(null);
            const [draggingFloorMarker, setDraggingFloorMarker] = useState(null);
            const floorCanvasRef = useRef(null);
            const floorHairVRef = useRef(null);
            const floorHairHRef = useRef(null);
            const updateFloorHair = (e) => {
                if (!floorHairVRef.current || !floorHairHRef.current) return;
                const host = e.currentTarget;
                const rect = host.getBoundingClientRect();
                if (rect.width < 1 || rect.height < 1) return;
                floorHairVRef.current.style.left = (e.clientX - rect.left) + 'px';
                floorHairHRef.current.style.top = (e.clientY - rect.top) + 'px';
                floorHairVRef.current.parentNode.style.opacity = '1';
            };
            const hideFloorHair = () => {
                if (floorHairVRef.current && floorHairVRef.current.parentNode) {
                    floorHairVRef.current.parentNode.style.opacity = '0';
                }
            };
            // Image aspect ratio (natural width / height) used by the air-flow
            // segment Snap-Guide overlay to convert width-fraction to %-of-height
            // for horizontal crosshair positioning.  Updated on image onLoad.
            const [imgAspect, setImgAspect] = useState(1);
            
            // Deployment path - hardcoded for flat /root/data structure
            const deploymentPath = '/root';
            
            // Configuration mode: 'equipment' or 'map' or 'points'
            const [configMode, setConfigMode] = useState(localStorage.getItem('configMode') || 'equipment');
            // Equipment-mode sub-tab: equip / sensors / aligners / sim — one
            // 4-tab row replaces the legacy stacked accordions (Equipment
            // Category + Global Simulation Rig) and the 2-tab Sensors/Aligners
            // strip below.  Defaults to 'sensors' to preserve the prior
            // landing view; persisted across reloads.
            // Drag-and-drop sensor regrouping: which drop target is being
            // hovered over right now.  Value:
            //   null              → no drag in progress (or not over a drop zone)
            //   '__UNGROUPED__'   → over the "Ungrouped Sensors" header
            //   <group.id>        → over that group's header
            const [dragOverGroupId, setDragOverGroupId] = useState(null);
            const [equipSubTab, setEquipSubTab] = useState(localStorage.getItem('equipSubTab') || 'sensors');
            useEffect(() => { try { localStorage.setItem('equipSubTab', equipSubTab); } catch(e){} }, [equipSubTab]);

            // ELC Sun Path on the floor image (not the AHU Sun-Dial compass).
            const [sunPathEnabled, setSunPathEnabled] = useState(() => {
                try { return localStorage.getItem('elc.floor.sunPathOverlay') !== '0'; } catch (e) { return true; }
            });
            const [sunPathAdj, setSunPathAdj] = useState(() => (
                (window.red5ElcSunPath && window.red5ElcSunPath.loadAdj)
                    ? window.red5ElcSunPath.loadAdj()
                    : { size: 1, rot: 0, look: 0, tilt: 0 }
            ));
            const [sunHour, setSunHour] = useState(() => {
                const n = new Date();
                return n.getHours() + n.getMinutes() / 60 + n.getSeconds() / 3600;
            });
            const [sunDoy, setSunDoy] = useState(() => {
                const n = new Date();
                return Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - Date.UTC(n.getFullYear(), 0, 1)) / 86400000) + 1;
            });
            const [sunFollowClock, setSunFollowClock] = useState(true);
            const [sunState, setSunState] = useState(null);
            // Building lat/lon for solar math.  Reads (1) localStorage
            // `weatherLocation` (set by the Dashboard whenever the operator
            // changes selection), and (2) /api/weather-location's `active`
            // field as a fallback for fresh sessions before Dashboard has
            // run.  Listens for storage events so changes made elsewhere
            // (e.g. another tab) propagate to the sun-path widget here.
            // Bug history (2026-05-29): the original code parsed the API
            // response as `data[0]` but it's actually `{active, saved,
            // default}` -- so the array check always failed and the sun
            // path was permanently stuck on NYC.
            const NYC = {lat: 40.7128, lon: -74.0060, elevation_m: 0, timezone: ''};
            const locTimezone = (wl) => String((wl && (wl.timezone || wl.tz_id || wl.tz)) || '').trim();
            const readLatLonFromStorage = () => {
                try {
                    const wl = JSON.parse(localStorage.getItem('weatherLocation'));
                    if (wl && typeof wl.lat === 'number') {
                        return {
                            lat: wl.lat,
                            lon: wl.lon,
                            elevation_m: Number(wl.elevation_m != null ? wl.elevation_m : wl.asl) || 0,
                            timezone: locTimezone(wl),
                        };
                    }
                } catch (e) {}
                return null;
            };
            const [buildingLatLon, setBuildingLatLon] = useState(() => readLatLonFromStorage() || NYC);
            useEffect(() => {
                // Only fall back to the API if localStorage has no pick yet.
                if (readLatLonFromStorage()) return;
                fetch('/api/weather-location').then(r => r.ok ? r.json() : null).then(data => {
                    const pick = (data && data.active && typeof data.active.lat === 'number')
                        ? data.active
                        : (data && data.default && typeof data.default.lat === 'number' ? data.default : null);
                    if (pick) {
                        setBuildingLatLon({
                            lat: pick.lat,
                            lon: pick.lon,
                            elevation_m: Number(pick.elevation_m != null ? pick.elevation_m : pick.asl) || 0,
                            timezone: locTimezone(pick),
                        });
                    }
                }).catch(() => {});
            }, []);
            // Cross-tab / cross-page propagation: if Dashboard updates the
            // weather selection, pick it up here without a reload.
            useEffect(() => {
                const onStorage = (e) => {
                    if (e.key !== 'weatherLocation') return;
                    const latlon = readLatLonFromStorage();
                    if (latlon) setBuildingLatLon(latlon);
                };
                window.addEventListener('storage', onStorage);
                return () => window.removeEventListener('storage', onStorage);

                    return;
                }
                // Wipe any default content; build a clean shell.
                win.document.open(); win.document.write('<!doctype html><html><head></head><body></body></html>'); win.document.close();
                // Title + favicon parity with the main window.
                const titleEl = win.document.createElement('title');
                titleEl.textContent = 'Red5 Sidebar (popped out)';
                win.document.head.appendChild(titleEl);
                // Resolve relative URLs (images, fonts, etc.) against the
                // main window's URL so all assets keep loading.
                const baseEl = win.document.createElement('base');
                baseEl.href = window.location.href;
                win.document.head.appendChild(baseEl);

                document.head.querySelectorAll('style, link[rel="stylesheet"]').forEach(node => {

            // CSV Import/Export Functions

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const csvText = event.target.result;
                            const lines = csvText.split('\n').filter(line => line.trim());
                            
                            if (lines.length === 0) {
                                toast('❌ CSV file is empty');
                                return;
                            }
                            
                            // Auto-detect headers from first row
                            const headers = lines[0].split(',').map(h => h.trim());
                            const dataRows = lines.slice(1);
                            
                            const importedData = dataRows.map(line => {
                                const values = line.split(',').map(v => v.trim());
                                const row = {};
                                headers.forEach((header, i) => {
                                    row[header] = values[i] || '';
                                });
                                return row;
                            });
                            
                            setPointsTableData(importedData);
                            setPointsJsonText(JSON.stringify(importedData, null, 2));

            const exportCSVFile = () => {

                    pointsTableData.forEach(row => {
                        const values = allKeys.map(key => {

                            return val !== undefined && val !== null ? String(val) : '';
                        });
                        csv += values.join(',') + '\n';

            const unmapGroup = (indices) => {
                setSchema(prevSchema => {

            const updateTargetCoords = (target, updates) => {
                if (!target) return;
                setSchema(prevSchema => {
                    if (!prevSchema[category] || !prevSchema[category][typeId]) return prevSchema;
                    const updatedType = { ...prevSchema[category][typeId] };
                    if (target.type === 'animation') {
                        const currentVisualAssets = updatedType.visual_assets || {};
                        const updatedAnims = [...(currentVisualAssets.animations || [])];
                        if (updatedAnims[target.idx]) { updatedAnims[target.idx] = { ...updatedAnims[target.idx], ...updates }; updatedType.visual_assets = { ...currentVisualAssets, animations: updatedAnims }; }
                    }
                    return { ...prevSchema, [category]: { ...prevSchema[category], [typeId]: updatedType } };
                });
            };

            const handleFineTune = (target, axis, value) => {
                if (['outline_path', 'animation_type', 'element_id', 'telemetry_key', 'telemetry_keys', 'image_data', 'dp_active_channel', 'dp_active_row'].includes(axis)) {
                    const updates = { [axis]: value };
                    if (axis === 'animation_type' && value === 'air_flow_path') {
                        updates.segments = [{ id: Date.now(), type: "SA", offsetX: 0, offsetY: 0, offsetXFrac: 0, offsetYFrac: 0, scale: 1.0, stretchX: 1.0, stretchY: 1.0, rotX: 0, rotY: 0, rotZ: 0, skewX: 0, skewY: 0, path: DEFAULT_WAVY_PATH }];
                    }
                    if (axis === 'animation_type' && value === 'vfd_aligner') {
                        updates.telemetry_keys = { target_hz: 'INV1_F', actual_hz: 'INV1_H', amps: 'INV1_A', alarm: 'INV1_ALM', run_cmd: 'INV1_SST', status: 'INV1_STATUS' };
                    }
                    if (axis === 'animation_type' && value === 'dp_sensor_aligner') {
                        updates.telemetry_keys = { ch1_temp: 'ZONE_TEMP', ch2_rh: 'ZONE_RH', ch3_pa: 'DP_PA' };
                        updates.dp_active_channel = 0;
                    }
                    if (axis === 'animation_type' && value === 'dp_display_aligner') {
                        updates.telemetry_keys = { indoor_temp: 'ZONE_TEMP', indoor_rh: 'ZONE_RH', diff_pressure: 'DP_PA', vav_flow: 'VAV_FLOW', cav_flow: 'CAV_FLOW' };
                        updates.dp_active_row = 0;
                    }
                    updateTargetCoords(target, updates);
                    return;
                }
                
                let numVal = parseFloat(value);
                if (isNaN(numVal)) numVal = 0;
                
                if (['x', 'y', 'pill_x', 'pill_y', 'sensor_x', 'sensor_y'].includes(axis)) numVal = Number(Math.max(0, Math.min(100, numVal)).toFixed(1));
                else if (['scale', 'stretchX', 'stretchY', 'pill_scale', 'screen_scale', 'sensor_scale', 'sensor_stretchX', 'sensor_stretchY'].includes(axis)) numVal = Number(Math.max(0.1, Math.min(10, numVal)).toFixed(2));
                else if (['rotX', 'rotY', 'skewX', 'skewY', 'sensor_rotX', 'sensor_rotY', 'sensor_skewX', 'sensor_skewY'].includes(axis)) numVal = Number(Math.max(-90, Math.min(90, numVal)).toFixed(1));
                else if (['rotZ', 'sensor_rotZ'].includes(axis)) numVal = Number(Math.max(-180, Math.min(180, numVal)).toFixed(1));
                else if (['pipeLength', 'base_w', 'base_h', 'screen_w', 'screen_h', 'pill_w', 'pill_h'].includes(axis)) numVal = Number(Math.max(20, Math.min(1000, numVal)).toFixed(0));
                else if (['pipeThickness', 'separation'].includes(axis)) numVal = Number(Math.max(0, Math.min(200, numVal)).toFixed(0));
                else if (['screen_dx', 'screen_dy', 'pill_dx', 'pill_dy'].includes(axis)) numVal = Number(Math.round(numVal));

                updateTargetCoords(target, { [axis]: numVal });
            };

            const handleFineTuneGroup = (indices, axis, value) => {
                let numVal = value;
                if (['x', 'y', 'scale'].includes(axis)) {
                    numVal = parseFloat(value);
                    if (isNaN(numVal)) numVal = 0;
                    if (['x', 'y'].includes(axis)) numVal = Number(Math.max(0, Math.min(100, numVal)).toFixed(1));
                    if (axis === 'scale') numVal = Number(Math.max(0.1, Math.min(10, numVal)).toFixed(2));
                }

                setSchema(prevSchema => {
                    const draft = JSON.parse(JSON.stringify(prevSchema));
                    const list = draft[category][typeId].points;
                    indices.forEach((idx, i) => {
                        if (list && list[idx]) {
                            if (axis === 'name') { if (i === 0) list[idx][axis] = value; } 
                            else { list[idx][axis] = numVal; }
                        }
                    });
                    return draft;
                });
            };

            const handleAirflowSegmentChange = (animIdx, segIdx, field, value) => {
                // PERF: path-targeted shallow update instead of full
                // JSON.parse(JSON.stringify(schema)).  The schema can contain
                // large base64 image_data (VFD chassis PNGs) which made the
                // deep-clone cost 50-300ms PER slider tick.  Continuous slider
                // drag (~60 Hz) saturated the main thread and triggered the
                // browser "page unresponsive" dialog.  We now only clone the
                // nodes on the path to the changed segment.  Schema-wide
                // identity for unchanged branches is preserved.
                setSchema(prevSchema => {
                    const cat = prevSchema && prevSchema[category];
                    if (!cat) return prevSchema;
                    const tDef = cat[typeId];
                    if (!tDef || !tDef.visual_assets || !tDef.visual_assets.animations) return prevSchema;
                    const anims = tDef.visual_assets.animations;
                    const anim = anims[animIdx];
                    if (!anim || !anim.segments || !anim.segments[segIdx]) return prevSchema;

                    const oldSeg = anim.segments[segIdx];
                    // No-op short-circuit: avoid re-rendering when the slider
                    // emits an identical value (browsers fire input events
                    // even when the thumb has not moved a step).
                    if (oldSeg[field] === value) return prevSchema;

                    const newSeg = { ...oldSeg, [field]: value };
                    const newSegments = anim.segments.slice();
                    newSegments[segIdx] = newSeg;
                    const newAnim = { ...anim, segments: newSegments };
                    const newAnims = anims.slice();
                    newAnims[animIdx] = newAnim;
                    const newVA = { ...tDef.visual_assets, animations: newAnims };
                    const newTDef = { ...tDef, visual_assets: newVA };
                    const newCat = { ...cat, [typeId]: newTDef };

                    // Auto-select this segment when editing.  setState batches
                    // both updates into a single React render commit.
                    setActiveSegmentId(newSeg.id);

                    return { ...prevSchema, [category]: newCat };
                });
            };

            const addAirflowSegment = (animIdx) => {
                setSchema(prevSchema => {
                    const draft = JSON.parse(JSON.stringify(prevSchema));
                    const anim = draft[category][typeId].visual_assets.animations[animIdx];
                    if (anim) {
                        if (!anim.segments) anim.segments = [];
                        const offX = anim.segments.length * 120; 
                        const offY = anim.segments.length * 40; 
                        // Convert default offset hint to canonical Frac using the
                        // currently-displayed image natural width if available.
                        // Falls back to 1500 px so segments don't pile up at origin.
                        const refW = (imageRef.current && imageRef.current.naturalWidth) || 1500;
                        const offXFrac = offX / refW;
                        const offYFrac = offY / refW;
                        // NEW: Use temperature system instead of type
                        anim.segments.push({ 
                            id: Date.now(), 
                            start_temp_mode: 'sensor',
                            start_temp_value: 'OAT',
                            end_temp_mode: 'sensor',
                            end_temp_value: 'SAT',
                            offsetX: offX, 
                            offsetY: offY, 
                            offsetXFrac: offXFrac,
                            offsetYFrac: offYFrac,
                            scale: 1.0, 
                            stretchX: 1.0, 
                            stretchY: 1.0, 
                            rotX: 0, 
                            rotY: 0, 
                            rotZ: 0, 
                            skewX: 0, 
                            skewY: 0, 
                            path: DEFAULT_WAVY_PATH 
                        });
                    }
                    return draft;
                });
            };

                    const anim = draft[category][typeId].visual_assets.animations[animIdx];

            const handleSidebarClick = (type, idx) => {

            const handleElementMouseDown = (e, type, idx, mode = 'move', subtype = 'main') => {
                if (panMode || e.button === 1) return; 
                e.stopPropagation(); e.preventDefault(); 
                
                let initOffX = 0, initOffY = 0;
                setDraggingTarget({ type, idx, subtype, startX: e.clientX, startY: e.clientY, initOffX, initOffY }); 
                setActiveTarget({ type, idx });

            const handleCanvasMouseDown = (e) => {
                if (panMode || e.button === 1 || e.target.id === 'canvas-bg' || e.target.id === 'transform-wrapper' || e.target.tagName === 'IMG') {
                    e.preventDefault();

                    panStart.current = { x: e.clientX - view.x, y: e.clientY - view.y };
