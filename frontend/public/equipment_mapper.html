                                                                    </button>
                                                                    <button onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); unmapItem('animation', i); }} className="w-7 h-7 bg-rose-600 hover:bg-rose-500 text-white rounded-full flex items-center justify-center shadow-lg border-2 border-white cursor-pointer transition-transform hover:scale-110" title="Unmap Airflow from Canvas">
                                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                                                    </button>
                                                                </div>
                                                            )}

                                                            <PreviewAirFlowSimulator 
                                                                segments={a.segments} 
                                                                fanSpeed={simSpeedVal} 
                                                                isActive={isActive} 
                                                                antiFreeze={false} 
                                                                heating={isHeatingMode} 
                                                                oat={25} 
                                                                sat={15}
                                                                allSensors={currentType.points || []}
                                                                containerW={imageRef.current ? imageRef.current.offsetWidth : null}
                                                                naturalW={imageRef.current ? imageRef.current.naturalWidth : null}
                                                                onSegmentMouseDown={(e, action, segId) => {
                                                                    if (panMode || e.button === 1) return;
                                                                    e.stopPropagation(); e.preventDefault();
                                                                    setActiveTarget({type: 'animation', idx: i});
                                                                    
                                                                    const seg = a.segments.find(s => s.id === segId);
                                                                    if (!seg) return;

                                                                    if (action === 'move-segment') {
                                                                        // Capture both legacy px AND canonical Frac initial values, so the drag
                                                                        // handler can update both fields (frac canonical, px for back-compat).
                                                                        const dispW = imageRef.current ? imageRef.current.offsetWidth : 1;
                                                                        const natW  = imageRef.current ? imageRef.current.naturalWidth : dispW;
                                                                        const initOffXFrac = (seg.offsetXFrac != null) ? seg.offsetXFrac : ((seg.offsetX || 0) / Math.max(natW, 1));
                                                                        const initOffYFrac = (seg.offsetYFrac != null) ? seg.offsetYFrac : ((seg.offsetY || 0) / Math.max(natW, 1));
                                                                        setDraggingTarget({ type: 'animation', idx: i, subtype: segId, startX: e.clientX, startY: e.clientY, initOffX: seg.offsetX || 0, initOffY: seg.offsetY || 0, initOffXFrac, initOffYFrac });
                                                                        isDraggingMode.current = 'move-segment';
                                                                    } else {
                                                                        setDraggingTarget({ type: 'animation', idx: i, subtype: segId, startX: e.clientX, startY: e.clientY });
                                                                        isDraggingMode.current = action;
                                                                    }
                                                                }}
                                                            />
                                                        </div>
                                                        </React.Fragment>
                                                    )}
                                                </React.Fragment>
                                            );
                                        })}

                                        {/* SENSOR PILLS (Grouped and Independent) */}
                                        {groupedPoints.map((grp, i) => {
                                            if (grp.x == null || grp.y == null) return null;
                                            // Skip the duplicate isGroup:false row for any point that
                                            // is also represented by an isGroup:true parent above —
                                            // canvas should only render each pill once.  See the
                                            // PHASE 2 comment in groupedPoints for why both rows exist.
                                            if (!grp.isGroup && grp.points[0]?.group_id) return null;
                                            const isActive = isTargetActive('point_group', i);
                                            const isDraggingThis = isDraggingMode.current === 'move' && draggingTarget?.idx === i && draggingTarget?.type === 'point_group';
                                            const showExpanded = isActive && !isDraggingThis;
                                            const displayScale = grp.scale ?? 1.0;
                                            const displayName = grp.name;
                                            
                                            // Determine expansion direction based on canvas vertical position (>65% expands UP)
                                            const expandUpwards = grp.y > 65;

                                            return (

                                                key={`point_grp_${i}`} 
                                                className={`absolute flex flex-col items-center transition-transform duration-200 ease-out ${isActive ? 'z-50' : 'z-30'}`} 
                                                style={{ 
                                                    left: `${grp.x}%`, 
                                                    top: `${grp.y}%`, 
                                                    transform: showExpanded 
                                                        ? `translate(-50%, ${expandUpwards ? 'calc(-100% + 16px)' : '-16px'}) scale(${displayScale})`
                                                        : `translate(-50%, -50%) scale(${displayScale})`,
                                                    transformOrigin: showExpanded 
                                                        ? (expandUpwards ? 'bottom center' : 'top center') 
                                                        : 'center center'
                                                }}
                                            >
                                                
                                                <div 
                                                    onMouseDown={(e) => handleElementMouseDown(e, 'point_group', i, 'move')} 
                                                    onClick={(e) => e.stopPropagation()}
                                                    className={`relative flex border shadow-xl transition-all pointer-events-auto backdrop-blur-md select-none ${
                                                        showExpanded 
                                                            ? 'flex-col gap-1.5 px-3 py-1.5 bg-indigo-900/95 border-indigo-400 ring-[3px] ring-indigo-500/30 rounded-xl min-w-[180px]' 
                                                            : (() => {
                                                                const hasRW = grp.points.some(p => p.access === 'RW');
                                                                if (hasRW) {
                                                                    // RW DATABOX: rectangular, structured rows
                                                                    return `flex-col gap-0 ${isActive ? 'bg-indigo-900/95 border-indigo-400 ring-[3px] ring-indigo-500/30' : 'bg-slate-950/95 border-amber-700/60 hover:border-amber-500'} rounded items-stretch`;
                                                                }
                                                                return grp.isGroup 
                                                                    ? `flex-col gap-1 px-3 py-1.5 ${isActive ? 'bg-indigo-900/95 border-indigo-400 ring-[3px] ring-indigo-500/30' : 'bg-slate-900/90 border-slate-700 hover:border-emerald-500'} rounded-xl items-center` 
                                                                    : `flex-row gap-2 px-2.5 py-1 ${isActive ? 'bg-indigo-900/95 border-indigo-400 ring-[3px] ring-indigo-500/30' : 'bg-slate-900/90 border-slate-700 hover:border-emerald-500'} rounded-full items-center`;
                                                              })()
                                                    }`}
                                                    style={{ cursor: panMode ? 'grab' : (isDraggingThis ? 'grabbing' : 'grab') }}
                                                >
                                                    {showExpanded ? (
                                                        // ACTIVE EXPANDED VIEW
                                                        <>
                                                            <div className="flex justify-between items-center border-b border-slate-700/50 pb-1 mb-1 w-full">
                                                                <div className="flex items-center gap-2">
                                                                    <div className="w-2 h-2 rounded-full flex-shrink-0 bg-indigo-400 animate-pulse"></div>
                                                                    <input 
                                                                        type="text" 
                                                                        value={grp.points[0].name || ''} 
                                                                        onChange={e => handleFineTuneGroup([grp.indices[0]], 'name', e.target.value)}
                                                                        onMouseDown={e => e.stopPropagation()}
                                                                        className="bg-slate-950 border border-slate-600 rounded px-1.5 py-0.5 text-[9px] font-black text-white w-28 outline-none focus:border-indigo-400 font-mono tracking-widest"
                                                                        placeholder={grp.defaultName}
                                                                    />
                                                                </div>

                                                                {!panMode && (
                                                                    <div className="flex gap-1">
                                                                        <button 
                                                                            onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); setActiveTarget({type:'none', idx:0}); }}
                                                                            className="w-4 h-4 bg-slate-700 hover:bg-slate-600 text-white rounded-full flex items-center justify-center shadow-lg border border-white cursor-pointer transition-transform hover:scale-110"
                                                                            title="Minimize Pill"
                                                                        >
                                                                            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                                                        </button>
                                                                        <button 
                                                                            onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); unmapGroup(grp.indices); }}
                                                                            className="w-4 h-4 bg-rose-600 hover:bg-rose-500 text-white rounded-full flex items-center justify-center shadow-lg border border-white cursor-pointer transition-transform hover:scale-110"
                                                                            title="Unmap Group from Canvas"
                                                                        >
                                                                            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                                                        </button>
                                                                    </div>
                                                                )}
                                                            </div>

                                                            <div className="flex flex-col gap-1.5 w-full max-h-[110px] overflow-y-auto custom-scrollbar pr-1" onMouseDown={e => e.stopPropagation()}>
                                                                {grp.points.map((p, pIdx) => (
                                                                    <div key={`exp-${p.label}-${pIdx}`} className="flex justify-between items-center bg-slate-950/50 p-1.5 rounded border border-slate-800 flex-shrink-0" onMouseDown={e => e.stopPropagation()}>
                                                                        <div className="flex flex-col">
                                                                            <span className="text-[9px] text-slate-300 font-black font-mono tracking-widest">{p.label}</span>
                                                                            <span className="text-[7px] text-slate-500 uppercase tracking-widest">{p.access} {p.min !== undefined && `[${p.min}-${p.max}]`}</span>

                                                                    <button onMouseDown={(e) => { e.stopPropagation(); handleFineTuneGroup(grp.indices, 'scale', Math.max(0.1, Number(grp.scale) - 0.05)); }} className="w-5 h-5 flex-shrink-0 bg-slate-800 hover:bg-slate-700 rounded text-slate-400 font-bold flex items-center justify-center">-</button>
                                                                    <input type="range" min="0.1" max="3" step="0.05" value={grp.scale} onChange={e => handleFineTuneGroup(grp.indices, 'scale', e.target.value)} className="flex-1" />

                                                                </div>
                                                            </div>
                                                        </>
                                                    ) : (
                                                        // INACTIVE OR DRAGGING COMPACT VIEW
                                                        (() => {
                                                            const hasRW = grp.points.some(p => p.access === 'RW');
                                                            if (hasRW) {
                                                                // RW DATABOX — rectangular, labeled rows, scrollable
                                                                return (
                                                                    <>
                                                                        <div className="flex items-center justify-between px-2 py-1 border-b border-amber-800/40 flex-shrink-0">
                                                                            <div className="flex items-center gap-1.5">
                                                                                <div className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${isActive ? 'bg-indigo-400 animate-pulse' : 'bg-amber-400 shadow-[0_0_6px_#f59e0b]'}`}></div>
                                                                                <span className="font-mono text-[8px] font-black uppercase tracking-widest text-amber-300 whitespace-nowrap">{displayName}</span>
                                                                            </div>
                                                                            <span className="text-[6px] font-black text-amber-500/70 uppercase tracking-widest">RW</span>
                                                                        </div>
                                                                        <div className="flex flex-col overflow-y-auto" style={{ maxHeight: '80px', scrollbarWidth: 'thin', scrollbarColor: '#44403c transparent' }}>
                                                                            {grp.points.map((p, pIdx) => (
                                                                                <div key={`db-${p.label}-${pIdx}`} className={`flex items-center justify-between px-2 py-0.5 ${pIdx > 0 ? 'border-t border-slate-800/40' : ''}`} onMouseDown={e => e.stopPropagation()}>
                                                                                    <span className={`text-[7px] font-black uppercase tracking-wider ${p.access === 'RW' ? 'text-amber-400' : 'text-slate-500'}`}>{p.label}</span>
                                                                                    <div className="flex items-center">{renderValueControl(p)}</div>
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                    </>
                                                                );
                                                            }
                                                            // RO PILLS — original pill rendering
                                                            return grp.isGroup ? (
                                                            <>
                                                                <div className="flex items-center justify-center gap-1.5 w-full border-b border-slate-700/50 pb-0.5 mb-0.5">
                                                                    <div className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${isActive ? 'bg-indigo-400 animate-pulse shadow-[0_0_8px_#818cf8]' : 'bg-emerald-500 shadow-[0_0_8px_#10b981]'}`}></div>
                                                                    <span className="font-mono text-[9px] font-black uppercase tracking-widest text-white whitespace-nowrap">
                                                                        {displayName}
                                                                    </span>
                                                                </div>
                                                                <div className="flex flex-row flex-wrap gap-x-2 gap-y-1.5 justify-center w-full max-w-[280px]">
                                                                    {grp.points.map((p, pIdx) => (
                                                                        <div key={`comp-${p.label}-${pIdx}`} className="flex justify-center items-center" onMouseDown={e => e.stopPropagation()}>
                                                                            {renderValueControl(p)}
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </>
                                                        ) : (
                                                            <>
                                                                <div className={`w-2 h-2 rounded-full flex-shrink-0 ${isActive ? 'bg-indigo-400 animate-pulse shadow-[0_0_8px_#818cf8]' : 'bg-emerald-500 shadow-[0_0_8px_#10b981]'}`}></div>
                                                                <div className="flex justify-center items-center" onMouseDown={e => e.stopPropagation()}>
                                                                    {renderValueControl(grp.points[0])}
                                                                </div>
                                                            </>
                                                        );
                                                        })()
                                                    )}
                                                </div>
                                            </div>
                                        )})}

                                    </div>
                                </div>
                            </div>
                            )
                        )}
                    </div>
                    )}
                    
                    {/* ============= SIZING TAB CANVAS (V1.9) ============= */}
                    {configMode === 'sizing' && window.SizingTab && (
                        <window.SizingTab
                            configuredAhus={floorMarkers.filter(m => m.type === 'ahu').length}
                        />
                    )}
                    
                    {/* ============= POINTS EDITOR CANVAS ============= */}
                    {configMode === 'points' && (
                        <div className="flex-1 bg-slate-950 overflow-hidden border-l border-slate-800">
                            {!selectedEquipmentId ? (
                                <div className="h-full flex items-center justify-center text-slate-500">
                                    <div className="text-center">
                                        <div className="text-6xl mb-4">📊</div>
                                        <div className="text-lg font-bold">Points Data Editor</div>
                                        <div className="text-sm mt-2">Select equipment from sidebar to begin</div>
                                    </div>
                                </div>
                            ) : (
                                <div className="h-full flex flex-col">
                                    {/* Header with Save Button */}
                                    <div className="bg-slate-900 border-b border-slate-800 px-6 py-3 flex justify-between items-center">
                                        <div>
                                            <h3 className="text-white font-bold text-sm">{selectedEquipmentType.replace('_', ' ').toUpperCase()} / {selectedEquipmentId}</h3>
                                            <p className="text-slate-500 text-xs mt-0.5">
                                                {pointsEditorView === 'json' ? 'JSON Editor Mode' : 'Table View Mode'}
                                            </p>
                                        </div>
                                        <button
                                            onClick={savePointsData}
                                            className="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-bold uppercase tracking-wider transition-all shadow-lg"
                                        >
                                            💾 Save Points
                                        </button>
                                    </div>
                                    
                                    {/* JSON Editor View */}
                                    {pointsEditorView === 'json' && (
                                        <div className="flex-1 p-4 overflow-auto">
                                            <textarea
                                                value={pointsJsonText}
                                                onChange={(e) => {
                                                    setPointsJsonText(e.target.value);
                                                    setJsonError('');
                                                }}
                                                className="w-full h-full bg-slate-900 text-emerald-400 font-mono text-sm p-4 rounded border border-slate-700 outline-none focus:border-emerald-500 resize-none"
                                                placeholder="Points data as JSON array..."
                                                spellCheck="false"
                                            />
                                        </div>
                                    )}
                                    
                                    {/* Table View - EDITABLE */}
                                    {pointsEditorView === 'table' && (
                                        <div className="flex-1 flex flex-col overflow-hidden">
                                            <div className="flex-1 overflow-auto p-4">
                                                {pointsTableData.length === 0 ? (
                                                    <div className="text-center text-slate-500 mt-20">
                                                        <div className="text-4xl mb-4">📋</div>
                                                        <div className="text-lg font-bold">No Points Data</div>
                                                        <div className="text-sm mt-2">Click "Add Row" below or "Import CSV" to get started</div>
                                                    </div>
                                                ) : (
                                                    <div className="overflow-x-auto">
                                                        <table className="w-full text-xs border-collapse">
                                                            <thead>
                                                                <tr className="bg-slate-900 border-b-2 border-slate-700">
                                                                    <th className="px-3 py-2 text-left text-slate-400 font-bold uppercase tracking-wider w-12">#</th>
                                                                    {(() => {
                                                                        const allKeys = [...new Set(pointsTableData.flatMap(p => Object.keys(p)))];
                                                                        return allKeys.map(key => (
                                                                            <th key={key} className="px-3 py-2 text-left text-slate-400 font-bold uppercase tracking-wider">
                                                                                {key}
                                                                            </th>
                                                                        ));
                                                                    })()}
                                                                    <th className="px-3 py-2 text-center text-slate-400 font-bold uppercase tracking-wider w-20">Actions</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {pointsTableData.map((point, rowIdx) => {
                                                                    const allKeys = [...new Set(pointsTableData.flatMap(p => Object.keys(p)))];
                                                                    return (
                                                                        <tr key={rowIdx} className="border-b border-slate-800 hover:bg-slate-900/30">
                                                                            <td className="px-3 py-2 text-slate-500 font-mono text-center">{rowIdx + 1}</td>
                                                                            {allKeys.map(key => {
                                                                                const isEditing = editingCell?.rowIndex === rowIdx && editingCell?.field === key;
                                                                                return (
                                                                                    <td 
                                                                                        key={key} 
                                                                                        className="px-3 py-2 text-white font-mono cursor-pointer hover:bg-slate-800/50"
                                                                                        onClick={() => {
                                                                                            if (!isEditing) {
                                                                                                setEditingCell({
                                                                                                    rowIndex: rowIdx,
                                                                                                    field: key,
                                                                                                    value: point[key] !== undefined && point[key] !== null ? String(point[key]) : ''
                                                                                                });
                                                                                            }
                                                                                        }}
                                                                                    >
                                                                                        {isEditing ? (
                                                                                            <input
                                                                                                autoFocus
                                                                                                type="text"
                                                                                                value={editingCell.value}
                                                                                                onChange={(e) => setEditingCell({...editingCell, value: e.target.value})}
                                                                                                onKeyDown={(e) => {
                                                                                                    if (e.key === 'Enter') {
                                                                                                        updateCell(rowIdx, key, editingCell.value);
                                                                                                        setEditingCell(null);
                                                                                                    } else if (e.key === 'Escape') {
                                                                                                        setEditingCell(null);
                                                                                                    }
                                                                                                }}
                                                                                                onBlur={() => {
                                                                                                    updateCell(rowIdx, key, editingCell.value);
                                                                                                    setEditingCell(null);
                                                                                                }}
                                                                                                className="w-full bg-slate-700 border border-emerald-500 rounded px-2 py-1 text-white text-xs focus:outline-none focus:ring-2 focus:ring-emerald-400"
                                                                                            />
                                                                                        ) : (
                                                                                            <div className="min-h-[24px] flex items-center">
                                                                                                {point[key] !== undefined && point[key] !== null
                                                                                                    ? typeof point[key] === 'object'
                                                                                                        ? JSON.stringify(point[key])
                                                                                                        : String(point[key])
                                                                                                    : <span className="text-slate-600">-</span>
                                                                                                }
                                                                                            </div>
                                                                                        )}
                                                                                    </td>
                                                                                );
                                                                            })}
                                                                            <td className="px-3 py-2 text-center">
                                                                                <button
                                                                                    onClick={() => deleteRow(rowIdx)}
                                                                                    className="px-2 py-1 bg-red-600 hover:bg-red-500 text-white rounded text-[10px] font-bold transition-all"
                                                                                    title="Delete row"
                                                                                >
                                                                                    🗑️
                                                                                </button>
                                                                            </td>
                                                                        </tr>
                                                                    );
                                                                })}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                )}
                                            </div>
                                            
                                            {/* Action Buttons Footer */}
                                            <div className="bg-slate-900 border-t border-slate-800 px-6 py-4">
                                                <div className="flex gap-3 items-center justify-between">
                                                    <div className="text-slate-500 text-xs">
                                                        {pointsTableData.length} row{pointsTableData.length !== 1 ? 's' : ''} | Click cell to edit, press Enter to save
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button
                                                            onClick={addNewRow}
                                                            className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-xs font-bold uppercase tracking-wider transition-all shadow-lg"

                                                            ➕ Add Row
                                                        </button>

                                                            onClick={importCSVFile}
                                                            className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded text-xs font-bold uppercase tracking-wider transition-all shadow-lg"
                                                        >
                                                            📥 Import CSV
                                                        </button>
                                                        <button
                                                            onClick={exportCSVFile}
                                                            className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded text-xs font-bold uppercase tracking-wider transition-all shadow-lg"
                                                        >
                                                            📤 Export CSV
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                    {/* IMAGE PICKER MODAL — Component from js/image-picker.js */}
                    <ImagePickerModal

                        currentPath={imagePickerPath}

                    />

                    {/* FILE BROWSER MODAL — Component from js/file-browser.js */}
                    <FileBrowserModal

                        data={fileBrowserData}
                        loading={fileBrowserLoading}
                        currentPath={fileBrowserPath}
                        activeRoot={fileBrowserRoot}
                        onNavigate={(p) => openFileBrowser(p)}
                        onSwitchRoot={(root) => { 
                            if (root === null) {
                                setFileBrowserRoot(null); 
                                setFileBrowserPath(''); 
                                setFileBrowserData(null);
                            } else {
                                setFileBrowserPath(''); 
                                openFileBrowser('', root); 
                            }

                        onRefresh={() => openFileBrowser(fileBrowserPath)}

                        onDownload={downloadFileFromController}

                            >

                                    Psychrometric Chart

                                <div className="bg-slate-950 border border-purple-500/30 rounded-xl p-6 min-h-[400px] flex items-center justify-center">

                                        <div className="text-purple-400/50 text-6xl mb-4">📊</div>
                                        <h3 className="text-2xl font-black text-slate-600 uppercase mb-2">Chart Wrapper Ready</h3>
                                        <p className="text-slate-500 font-mono text-sm max-w-md">
                                            This modal is ready for psychrometric chart integration.<br/>
                                            Data available: OA Temp: {psychroChartData?.oa_temp}°F, SA Temp: {psychroChartData?.sa_temp}°F, 
                                            Humidity: {psychroChartData?.humidity}%, Enthalpy: {psychroChartData?.enthalpy} BTU/lb
                                        </p>
                                    </div>
                                </div>
                                
                                <div className="mt-6 flex justify-end">
                                    <button 
                                        onClick={() => setShowPsychroChart(false)}
                                        className="px-6 py-3 bg-purple-600 hover:bg-purple-500 text-white rounded-lg font-black uppercase tracking-widest transition-all"

                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
    <script>
        // Module loader: fetch all external JS modules, concatenate with main code,
        // and compile everything as a single Babel block to share scope.
        (function() {
            var jsModules = [
                '/assets/js/utils.js',
                '/assets/js/preview-components.js',
                '/assets/js/schema-config.js',
                '/assets/js/image-picker.js',
                '/assets/js/file-browser.js',
                '/assets/js/sizing-check.js',
                '/assets/js/sun-path.js?v=sunshaft-rose3',
                '/assets/js/elc-sun-path-overlay.js?v=daysel3',
                '/assets/js/window-blinds-popout.js'
            ];
            var mainSource = document.getElementById('main-source');
            if (!mainSource) {
                document.getElementById('root').innerHTML = '<div style="color:red;padding:40px;font-family:monospace;">Error: main-source script tag not found</div>';
                return;
            }
            var mainCode = mainSource.textContent;

            Promise.all(jsModules.map(function(url) {
                return fetch(url).then(function(r) {
                    if (!r.ok) throw new Error(url + ' returned ' + r.status);
                    return r.text();
                });
            })).then(function(sources) {
                var combined = sources.join('\n\n') + '\n\n' + mainCode;
                var script = document.createElement('script');
                script.type = 'text/babel';
                script.setAttribute('data-presets', 'react');
                script.textContent = combined;
                document.body.appendChild(script);
                if (window.Babel) {
                    Babel.transformScriptTags();
                }
            }).catch(function(err) {
                console.error('Module loader failed:', err);
                document.getElementById('root').innerHTML = '<div style="color:red;padding:40px;font-family:monospace;">Module load error: ' + err.message + '<br><br>Make sure the backend is running and JS files are accessible.</div>';
            });
        })();
    </script>
