                } catch (err) {
                    toast(`Could not reach controller: ${err.message}`);
                }
            };
            
            // Strip browser-injected " (N)" duplicate suffix BEFORE the
            // extension.  Chrome/Firefox auto-rename re-downloaded files
            // (e.g. equipment_mapper.html  ->  equipment_mapper (1).html
            //  ->  equipment_mapper (2).html ...).  When the operator
            // re-uploads such a file to push a change to the controller,
            // they expect the canonical name to overwrite -- not to grow
            // a new "(1)" sibling on every redeploy.  Normalise on the
            // way out so deploys are idempotent regardless of what the
            // local browser named the download.  Multi-segment suffixes
            // ("file (1) (2).html") collapse in a single pass.
            const normalizeUploadFilename = (name) => {
                if (!name) return name;
                const slash = name.lastIndexOf('/');
                const dir   = slash >= 0 ? name.slice(0, slash + 1) : '';
                const leaf  = slash >= 0 ? name.slice(slash + 1)    : name;
                const dot   = leaf.lastIndexOf('.');
                const stem  = dot > 0 ? leaf.slice(0, dot) : leaf;
                const ext   = dot > 0 ? leaf.slice(dot)    : '';
                const cleanStem = stem.replace(/(\s*\(\d+\))+\s*$/, '');
                // If stripping leaves nothing (e.g. the file was literally
                // named "(1).html"), keep the original so we never lose
                // the upload entirely.
                return dir + (cleanStem || stem) + ext;
            };

            const uploadFileToController = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.multiple = true;
                input.onchange = async (e) => {
                    const files = Array.from(e.target.files);
                    if (files.length === 0) return;
                    
                    const apiUrl = window.API_BASE_URL || '';
                    const results = [];
                    
                    for (const file of files) {
                        try {
                            const dataURL = await new Promise((resolve, reject) => {
                                const reader = new FileReader();
                                reader.onload = (ev) => resolve(ev.target.result);
                                reader.onerror = reject;
                                reader.readAsDataURL(file);
                            });
                            
                            const cleanName  = normalizeUploadFilename(file.name);
                            const renamed    = cleanName !== file.name;
                            const uploadName = fileBrowserPath ? `${fileBrowserPath}/${cleanName}` : cleanName;
                            const response = await fetch(`${apiUrl}/api/upload-file`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ filename: uploadName, file_data: dataURL, root: fileBrowserRoot })
                            });
                            const data = await response.json();
                            const tag  = renamed ? ` (was "${file.name}")` : '';
                            results.push(data.success ? `${cleanName} - OK${tag}` : `${cleanName} - FAILED: ${data.error}${tag}`);
                        } catch (err) {
                            results.push(`${file.name} - ERROR: ${err.message}`);
                        }
                    }
                    
                    // Native browser alert() — same look-and-feel as the
                    // delete-file confirm() dialog the operator expects.
                    // Renders as the standard cross-origin-iframe blue
                    // popup ("An embedded page at … says").  Matches the
                    // operator's muscle memory; no custom modal styling
                    // that diverges from the rest of the file-browser
                    // UX.
                    alert(`Upload results:\n\n${results.join('\n')}`);
                    openFileBrowser(fileBrowserPath);
                };
                input.click();
            };
            
            const downloadFileFromController = (filename) => {
                const apiUrl = window.API_BASE_URL || '';
                const fullName = fileBrowserPath ? `${fileBrowserPath}/${filename}` : filename;
                const link = document.createElement('a');
                link.href = `${apiUrl}/api/assets/${fullName}`;
                link.download = filename;
                link.click();
            };

            // Reusable progress toast — bottom-right fixed overlay that
            // appears during slow controller-side ops (zip builds can run
            // 30+ s on the embedded box) so the operator gets immediate
            // feedback instead of staring at a frozen UI.
            const _ensureOpToast = () => {
                let host = document.getElementById('red5-op-toast');
                if (host) return host;
                host = document.createElement('div');
                host.id = 'red5-op-toast';
                host.setAttribute('data-testid', 'controller-op-toast');
                host.style.cssText = [
                    'position:fixed','right:20px','bottom:20px','z-index:99999',
                    'min-width:280px','max-width:380px',
                    'background:#020617','color:#e2e8f0',
                    'border:1px solid #4f46e5','border-radius:8px',
                    'padding:12px 14px',
                    'box-shadow:0 8px 24px rgba(0,0,0,.45)',
                    "font-family:'Courier New',monospace",'font-size:12px',
                    'opacity:0','transform:translateY(8px)',
                    'transition:opacity .2s ease,transform .2s ease',
                    'pointer-events:none',
                ].join(';');
                host.innerHTML =
                    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">' +
                    '  <span id="red5-op-spinner" style="display:inline-block;width:10px;height:10px;border:2px solid #4f46e5;border-top-color:transparent;border-radius:50%;animation:red5spin .9s linear infinite"></span>' +
                    '  <span id="red5-op-label" style="flex:1;color:#a5b4fc;text-transform:uppercase;letter-spacing:.08em;font-size:11px">Working...</span>' +
                    '</div>' +
                    '<div id="red5-op-detail" style="color:#94a3b8;font-size:11px;margin-bottom:6px">Contacting controller...</div>' +
                    '<div style="height:6px;background:#1e293b;border-radius:3px;overflow:hidden">' +
                    '  <div id="red5-op-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#4f46e5,#6366f1);transition:width .15s ease"></div>' +
                    '</div>';
                document.body.appendChild(host);
                // Inject spinner keyframes once.
                if (!document.getElementById('red5-op-toast-style')){
                    const st = document.createElement('style');
                    st.id = 'red5-op-toast-style';
                    st.textContent = '@keyframes red5spin{to{transform:rotate(360deg)}}'
                                   + '@keyframes red5pulsebar{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}';
                    document.head.appendChild(st);
                }
                requestAnimationFrame(() => {
                    host.style.opacity = '1';
                    host.style.transform = 'translateY(0)';
                });
                return host;
            };
            const _setOpLabel = (label, detail) => {
                _ensureOpToast();
                const l = document.getElementById('red5-op-label');
                const d = document.getElementById('red5-op-detail');
                if (l && label != null) l.textContent = label;
                if (d && detail != null) d.textContent = detail;
            };
            const _setOpProgress = (pct, color) => {
                _ensureOpToast();
                const bar = document.getElementById('red5-op-bar');
                if (!bar) return;
                if (pct == null){
                    // Indeterminate — replace solid fill with a sliding shimmer.
                    bar.style.width = '40%';
                    bar.style.animation = 'red5pulsebar 1.4s ease-in-out infinite';
                } else {
                    bar.style.animation = 'none';
                    bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
                }
                if (color) bar.style.background = color;
            };
            const _hideOpToast = (delayMs) => {
                const host = document.getElementById('red5-op-toast');
                if (!host) return;
                setTimeout(() => {
                    host.style.opacity = '0';
                    host.style.transform = 'translateY(8px)';
                    setTimeout(() => { host.remove(); }, 260);
                }, delayMs || 0);
            };
            // POST JSON and stream the response body with progress reporting.
            // Phase 1: indeterminate "Building archive on controller..."
            //          (server side is building the ZIP synchronously).
            // Phase 2: once headers arrive, switch to determinate
            //          "Downloading X.X / Y.Y MB · NN%" based on
            //          Content-Length + ReadableStream.
            const _fetchBlobWithProgress = async (url, body, opLabel, buildingMsg) => {
                _ensureOpToast();
                _setOpLabel(opLabel, buildingMsg || 'Building archive on controller (this can take 30+ s for large folders)...');
                _setOpProgress(null);
                const start = Date.now();
                let resp;
                try {
                    resp = await fetch(url, {
                        method:  'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body:    JSON.stringify(body),
                    });
                } catch (err) {
                    _setOpLabel('NETWORK ERROR', err.message);
                    _setOpProgress(100, 'linear-gradient(90deg,#dc2626,#ef4444)');
                    _hideOpToast(3500);
                    throw err;
                }
                if (!resp.ok) {
                    const j = await resp.json().catch(() => ({}));
                    _setOpLabel('FAILED', (j.error || ('HTTP ' + resp.status)));
                    _setOpProgress(100, 'linear-gradient(90deg,#dc2626,#ef4444)');
                    _hideOpToast(3500);
                    const err = new Error(j.error || ('HTTP ' + resp.status));
                    err.response = resp; err.json = j;
                    throw err;
                }
                const total = parseInt(resp.headers.get('Content-Length') || '0', 10);
                const buildSec = ((Date.now() - start) / 1000).toFixed(1);
                _setOpLabel('Downloading', total
                    ? ('0.0 / ' + (total/1048576).toFixed(1) + ' MB  (built in ' + buildSec + 's)')
                    : ('0.0 MB  (built in ' + buildSec + 's)'));
                if (total) _setOpProgress(0); else _setOpProgress(null);
                let received = 0;
                const chunks = [];
                if (resp.body && typeof resp.body.getReader === 'function'){
                    const reader = resp.body.getReader();
                    for (;;){
                        const {done, value} = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        received += value.length;
                        const mb = (received / 1048576).toFixed(1);
                        if (total){
                            const tot = (total / 1048576).toFixed(1);
                            const pct = Math.round((received / total) * 100);
                            _setOpLabel('Downloading ' + pct + '%',
                                mb + ' / ' + tot + ' MB');
                            _setOpProgress(pct);
                        } else {
                            _setOpLabel('Downloading', mb + ' MB');
                        }
                    }
                } else {
                    // No ReadableStream support — fall back to .blob().
                    const blob = await resp.blob();
                    _setOpLabel('Downloading', (blob.size/1048576).toFixed(1) + ' MB');
                    _setOpProgress(100);
                    return {blob, headers: resp.headers};
                }
                _setOpLabel('SAVED', (received/1048576).toFixed(1) + ' MB ready');
                _setOpProgress(100, 'linear-gradient(90deg,#16a34a,#22c55e)');
                _hideOpToast(1800);
                return {blob: new Blob(chunks), headers: resp.headers};
            };

            // Multi-file GET — packs the user's checkbox-selected files
            // into a single ZIP via /api/zip-files and triggers a normal
            // browser download.  All file roots are honored (data /
            // scripts / pgpy) by passing the active root + path to the
            // backend.  Falls back to per-file downloads if zip endpoint
            // is unavailable on an older controller.
            const batchDownloadFromController = async () => {
                const names = Array.from(selectedFiles);
                if (names.length === 0) return;
                if (names.length === 1) {
                    downloadFileFromController(names[0]);
                    return;
                }
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const {blob, headers} = await _fetchBlobWithProgress(
                        `${apiUrl}/api/zip-files`,
                        { names, root: fileBrowserRoot, path: fileBrowserPath },
                        'Zipping ' + names.length + ' files',
                        'Packing ' + names.length + ' file(s) on controller...'
                    );
                    const url  = URL.createObjectURL(blob);
                    const a    = document.createElement('a');
                    a.href     = url;
                    a.download = (headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/)?.[1] || `red5_files_${Date.now()}.zip`;
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                } catch (err) {
                    if (!err.response) toast('GET selected error: ' + err.message);
                    // Server-side errors are already shown in the toast.
                }
            };

            // GET on directory — zips the entire subtree (preserving
            // structure) and downloads it as a single archive.  Honors
            // the active fileBrowserRoot / fileBrowserPath.
            const downloadDirFromController = async (dirname) => {
                if (!dirname) return;
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const {blob, headers} = await _fetchBlobWithProgress(
                        `${apiUrl}/api/zip-dir`,
                        { dirname, root: fileBrowserRoot, path: fileBrowserPath },
                        'Zipping ' + dirname + '/',
                        'Walking ' + dirname + '/ and packing files on controller (this can take 30+ s for large folders)...'
                    );
                    const url  = URL.createObjectURL(blob);
                    const a    = document.createElement('a');
                    a.href     = url;
                    a.download = (headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/)?.[1] || `${dirname}.zip`;
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                } catch (err) {
                    if (!err.response) toast('GET dir error: ' + err.message);
                    // Server-side errors are already shown in the toast.
                }
            };

            // Directory upload (request 3) — uses webkitdirectory so the
            // browser surfaces every file under the chosen tree, preserves
            // each file's relative path on the controller, and degrades
            // to per-file chunking so partial failures leave the
            // controller recoverable.  Pre-flight checks /api/disk-status
            // and refuses if free disk < 2 \u00d7 total upload size.
            const uploadDirectoryToController = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.multiple = true;
                input.webkitdirectory = true;  // Chrome / Edge / FF / Safari 13+
                input.directory = true;        // legacy Firefox alias
                input.onchange = async (e) => {
                    const files = Array.from(e.target.files);
                    if (files.length === 0) return;
                    const totalBytes = files.reduce((s, f) => s + f.size, 0);
                    const apiUrl = window.API_BASE_URL || '';

                    // Pre-flight: check the controller has space.  Refuse
                    // if free disk < 2x upload size; user picks a smaller
                    // upload or runs the disk-status cleanup first.
                    try {
                        const ds = await fetch(`${apiUrl}/api/disk-status`).then(r => r.json());
                        if (ds && typeof ds.free_bytes === 'number' && ds.free_bytes < totalBytes * 2) {
                            const ok = confirm(
                                'Disk headroom low.\n\n' +
                                'Total upload: ' + (totalBytes/1048576).toFixed(2) + ' MB (' + files.length + ' files)\n' +
                                'Controller free: ' + (ds.free_bytes/1048576).toFixed(2) + ' MB\n' +
                                'Recommended free \u2265 ' + (totalBytes*2/1048576).toFixed(2) + ' MB\n\n' +
                                'Run /api/disk-status?cleanup=1 first?  Click OK to abort, Cancel to upload anyway.'
                            );
                            if (ok) return;
                        }
                    } catch (_) { /* disk-status optional */ }

                    // Chunk by file: each file is its own upload.  Partial
                    // failure leaves earlier files committed; failed files
                    // are reported in the summary so the operator can
                    // retry just those.
                    const results = [];
                    let okCount = 0, failCount = 0;
                    for (let i = 0; i < files.length; i++) {
                        const f = files[i];
                        const rawRelPath = f.webkitRelativePath || f.name;
                        // Apply the same " (N)" suffix scrubbing as
                        // single-file uploads.  For directory uploads
                        // webkitRelativePath carries the folder prefix,
                        // so normalise the basename in place.
                        const relPath    = normalizeUploadFilename(rawRelPath);
                        const renamed    = relPath !== rawRelPath;
                        const uploadName = fileBrowserPath ? `${fileBrowserPath}/${relPath}` : relPath;
                        try {
                            const dataURL = await new Promise((resolve, reject) => {
                                const reader = new FileReader();
                                reader.onload  = (ev) => resolve(ev.target.result);
                                reader.onerror = reject;
                                reader.readAsDataURL(f);
                            });
                            const r = await fetch(`${apiUrl}/api/upload-file`, {
                                method:  'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body:    JSON.stringify({ filename: uploadName, file_data: dataURL, root: fileBrowserRoot }),
                            });
                            const j = await r.json();
                            if (j.success) { okCount++; }
                            else { failCount++; results.push(relPath + ' \u2014 ' + (j.error || 'failed') + (renamed ? ' (was "' + rawRelPath + '")' : '')); }
                        } catch (err) {
                            failCount++;
                            results.push(relPath + ' \u2014 ' + err.message + (renamed ? ' (was "' + rawRelPath + '")' : ''));
                        }
                    }
                    // Native browser alert() — matches the delete-file
                    // confirm() popup so the operator's muscle memory
                    // works uniformly across file-browser actions.
                    alert('Directory upload finished.\n\nOK:  ' + okCount + '\nFAIL: ' + failCount +
                          (results.length ? '\n\n' + results.join('\n') : ''));
                    openFileBrowser(fileBrowserPath);
                };
                input.click();
            };
            
            const createDirectoryOnController = async () => {
                const name = prompt('New folder name:');
                if (!name || !name.trim()) return;
                const cleanName = name.trim().replace(/[^a-zA-Z0-9_\-\.]/g, '_');
                const fullPath = fileBrowserPath ? `${fileBrowserPath}/${cleanName}` : cleanName;
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const response = await fetch(`${apiUrl}/api/create-directory`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ dirname: fullPath, root: fileBrowserRoot })
                    });
                    const data = await response.json();
                    if (data.success) {
                        openFileBrowser(fileBrowserPath);
                    } else {
                        toast(`Create folder failed: ${data.error}`);

                } catch (err) {
                    toast(`Could not reach controller: ${err.message}`);
                }
            };

            const deleteDirectoryFromController = async (dirname) => {

                const rootLabel = fileBrowserRoot === 'scripts' ? '/root/scripts/' : '/root/data/';

            const moveFileOnController = async (filename) => {

            const toggleFileSelection = (filename) => {

            const toggleSelectAll = (filesList) => {

                const allSelected = selectableFiles.length > 0 && selectableFiles.every(n => selectedFiles.has(n));

            const batchDeleteFiles = async () => {
                if (selectedFiles.size === 0) return;
                const names = Array.from(selectedFiles);
                const rootLabel = fileBrowserRoot === 'scripts' ? '/root/scripts/' : '/root/data/';
                if (!confirm(`Delete ${names.length} file${names.length > 1 ? 's' : ''} from ${rootLabel}${fileBrowserPath ? fileBrowserPath + '/' : ''}?\n\n${names.join('\n')}\n\nThis cannot be undone.`)) return;
                const apiUrl = window.API_BASE_URL || '';

                for (const name of names) {
                    try {

                        const response = await fetch(`${apiUrl}/api/delete-file`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ filename: fullName, root: fileBrowserRoot })
                        });
                        const data = await response.json();
                        results.push(data.success ? `${name} - deleted` : `${name} - FAILED: ${data.error}`);
                    } catch (err) {
                        results.push(`${name} - ERROR: ${err.message}`);

                }
                toast(`Batch delete results:\n\n${results.join('\n')}`);
                openFileBrowser(fileBrowserPath);
            };

            const batchMoveFiles = async () => {
                if (selectedFiles.size === 0) return;
                const names = Array.from(selectedFiles);
                const dest = prompt(`Move ${names.length} file${names.length > 1 ? 's' : ''} to which directory?\n\nEnter path relative to /root/data/\n(empty = root /root/data/)\n\nFiles:\n${names.join('\n')}`, '');
                if (dest === null) return;
                const destClean = dest.trim();
                const apiUrl = window.API_BASE_URL || '';
                const results = [];
                for (const name of names) {
                    try {
                        const srcPath = fileBrowserPath ? `${fileBrowserPath}/${name}` : name;
                        const response = await fetch(`${apiUrl}/api/move-file`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ src: srcPath, dest_dir: destClean })
                        });
                        const data = await response.json();
                        results.push(data.success ? `${name} - moved` : `${name} - FAILED: ${data.error}`);
                    } catch (err) {
                        results.push(`${name} - ERROR: ${err.message}`);
                    }
                }
                toast(`Batch move results:\n\n${results.join('\n')}`);
                openFileBrowser(fileBrowserPath);
            };
            
            // Opens the image picker modal, fetches images from controller
            const [imagePickerPath, setImagePickerPath] = useState('');
            const openImagePicker = async (callback, startPath) => {
                imagePickerCallback.current = callback;
                setShowImagePicker(true);
                setImagePickerLoading(true);

                setImagePickerPath(browsePath);
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const qs = browsePath ? `?path=${encodeURIComponent(browsePath)}` : '';
                    const response = await fetch(`${apiUrl}/api/files${qs}`);
                    const data = await response.json();
                    if (data.success) {
                        // Show directories + image files
                        setImagePickerFiles(data.files.filter(f => f.type === 'image' || f.type === 'directory'));
                    } else {
                        setImagePickerFiles([]);
                    }
                } catch (err) {
                    setImagePickerFiles([]);
                }
                setImagePickerLoading(false);
            };
            
            const navigateImagePicker = async (relPath) => {
                setImagePickerLoading(true);
                setImagePickerPath(relPath);
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const qs = relPath ? `?path=${encodeURIComponent(relPath)}` : '';
                    const response = await fetch(`${apiUrl}/api/files${qs}`);

                    } else {

                } catch (err) {
                    setImagePickerFiles([]);
                }
                setImagePickerLoading(false);
            };
            
            const selectImageFromController = (filename) => {
                const apiUrl = window.API_BASE_URL || '';
                const fullRelPath = imagePickerPath ? `${imagePickerPath}/${filename}` : filename;
                // V2.0 hosted demo: image bytes live in MongoDB and are
                // served through the /api/assets/ route (which falls back
                // to the tenant_assets collection).  V1.9 controllers also
                // accept the /api/assets/ prefix (the route is registered).
                const imageURL = `${apiUrl}/api/assets/${fullRelPath}`;
                setShowImagePicker(false);
                if (imagePickerCallback.current) {
                    imagePickerCallback.current(fullRelPath, imageURL);
                }
            };
            
            // Load a JSON config file from the virtual controller.
            // V2.0 routes well-known configs through dedicated API endpoints
            // (map_config.json -> /api/map-config, equipment_types.json ->
            // /api/equipment-types) so we always get tenant-aware data instead
            // of HTML from the SPA fallback route.  Unknown paths still fall
            // back to /api/assets/<path> so the legacy "load arbitrary JSON
            // from /root/data/<x>" flow keeps working.
            const loadConfigFromController = async (filepath, onLoaded, onFail) => {
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const lower  = (filepath || '').toLowerCase();
                    let url;
                    if (lower.endsWith('map_config.json')) {
                        url = `${apiUrl}/api/map-config`;
                    } else if (lower.endsWith('equipment_types.json')) {
                        url = `${apiUrl}/api/equipment-types`;
                    } else if (lower.endsWith('collector_config.json')) {
                        url = `${apiUrl}/api/collector-config`;
                    } else {
                        url = `${apiUrl}/api/assets/${filepath}`;
                    }
                    const response = await fetch(url, { credentials: 'include' });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const ct = (response.headers.get('content-type') || '').toLowerCase();
                    const text = await response.text();
                    // The API endpoints can return an "empty/demo" envelope when
                    // nothing is saved for this tenant (e.g. {floors:[], mode:'demo'}).
                    // Treat that as a fail so the alternate-path fallback can fire.
                    if (lower.endsWith('map_config.json') && ct.includes('json')) {
                        try {
                            const obj = JSON.parse(text);
                            if (obj && Array.isArray(obj.floors) && obj.floors.length === 0) {
                                throw new Error('No map_config saved yet');
                            }
                        } catch (parseErr) {
                            if (parseErr.message === 'No map_config saved yet') throw parseErr;
                            // not JSON -> fall through to onLoaded so caller can re-parse
                        }
                    }
                    onLoaded(text, filepath);
                } catch (err) {
                    if (onFail) {
                        onFail(err);
                    } else {
                        toast(`Failed to load ${filepath} from controller:\n${err.message}`);
                    }
                }
            };
            
            // Schema load: choose source then apply
            const loadSchemaWithChoice = () => {
                const source = prompt('Load equipment_types.json from:\n\n1 = Controller (/root/data/)\n2 = Local PC (browse)\n\nEnter 1 or 2:', '1');
                if (!source) return;
                
                const applySchema = (jsonText) => {
                    try {
                        const loadedSchema = JSON.parse(jsonText);
                        const sanitizedData = sanitizeSchema(loadedSchema);
                        setSchema(sanitizedData);
                        const cats = Object.keys(sanitizedData);
                        if (cats.length > 0) {
                            setCategory(cats[0]);
                            const tIds = Object.keys(sanitizedData[cats[0]]);
                            if (tIds.length > 0) setTypeId(tIds[0]);
                            setActiveTarget({ type: 'point_group', idx: 0 });
                        }
                        toast('Equipment schema loaded successfully.');
                    } catch (err) { toast('Invalid JSON schema file: ' + err.message); }
                };
                
                if (source.trim() === '1') {
                    // Prefer site copy at /root/data/equipment_types.json (survives
                    // bundle overwrite of configs/), then configs/ fallback.
                    // /api/equipment-types already prefers site→configs; also try
                    // /api/assets/equipment_types.json explicitly as first probe.
                    const trySiteThenConfigs = () => {
                        loadConfigFromController('equipment_types.json', (text) => applySchema(text), () => {
                            loadConfigFromController('configs/equipment_types.json', (text) => applySchema(text), (err) => {
                                toast('Failed to load equipment_types.json from controller:\n' + (err && err.message || err));
                            });
                        });
                    };
                    // Probe flat asset path first (always /root/data/<file>)
                    (async () => {
                        try {
                            const apiUrl = window.API_BASE_URL || '';
                            const r = await fetch(`${apiUrl}/api/assets/equipment_types.json`, { credentials: 'include' });
                            if (r.ok) {
                                const text = await r.text();
                                const parsed = JSON.parse(text);
                                if (parsed && (parsed.ahu_types || parsed.vav_types)) {
                                    applySchema(text);
                                    return;
                                }
                            }
                        } catch (_) { /* fall through */ }
                        trySiteThenConfigs();
                    })();
                } else {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.json';
                    input.onchange = (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (ev) => applySchema(ev.target.result);
                        reader.readAsText(file);
                    };
                    input.click();
                }
            };
            
            // Map config load: choose source then apply
            const loadMapConfigWithChoice = () => {
                const source = prompt('Load map_config.json from:\n\n1 = Controller (/root/data/)\n2 = Local PC (browse)\n\nEnter 1 or 2:', '1');
                if (!source) return;
                
                if (source.trim() === '1') {
                    // Try configs/ subfolder first, then root
                    loadConfigFromController('configs/map_config.json', (text) => {
                        const blob = new Blob([text], { type: 'application/json' });
                        const file = new File([blob], 'map_config.json');
                        loadMapConfig(file);
                    }, () => {
                        loadConfigFromController('map_config.json', (text) => {
                            const blob = new Blob([text], { type: 'application/json' });
                            const file = new File([blob], 'map_config.json');
                            loadMapConfig(file);
                        });
                    });
                } else {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.json';
                    input.onchange = (e) => {
                        const file = e.target.files[0];
                        if (file) loadMapConfig(file);
                    };
                    input.click();
                }
            };
            
            const loadMapConfig = (file) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.floors && Array.isArray(data.floors)) {
                            // Load floors — resolve image paths to loadable URLs
                            const apiUrl = window.API_BASE_URL || '';
                            const loadedFloors = data.floors.map(f => {
                                const rawPath = f.image_path || f.imagePath || '';
                                return {
                                    id: f.id,
                                    name: f.name,
                                    imagePath: rawPath,
                                    // If imageData is embedded, use it; otherwise load from /api/assets/
                                    imageData: f.imageData || (rawPath ? `${apiUrl}/api/assets/${rawPath}` : null),
                                    originalFileName: rawPath
                                };
                            });
                            setFloorPlans(loadedFloors);
                            
                            const allMarkers = [];
                            data.floors.forEach((floor, idx) => {
                                if (floor.markers) {
                                    floor.markers.forEach(m => {
                                        const markerData = {
                                            id: m.id,
                                            type: m.type,
                                            name: m.name,
                                            x: m.x,
                                            y: m.y,
                                            active: m.active,
                                            equipment_type_id: m.equipment_type_id || '',
                                            floorIdx: idx,
                                            ...(m.type === 'vav' ? { ahu_id: m.ahu_id || '' } : {}),
                                        };
                                        
                                        if (m.telemetry) {
                                            if (m.type === 'ahu') {
                                                markerData.oa_temp = m.telemetry.oa_temp || 0;
                                                markerData.sa_temp = m.telemetry.sa_temp || 0;
                                                markerData.ra_temp = m.telemetry.ra_temp || 0;
                                                markerData.humidity = m.telemetry.humidity || 0;
                                                markerData.enthalpy = m.telemetry.enthalpy || 0;
                                            } else if (m.type === 'vav') {
                                                markerData.zone_temp = m.telemetry.zone_temp || 0;
                                                markerData.damper_position = m.telemetry.damper_position || 0;
                                            }
                                        } else {
                                            if (m.type === 'ahu') {
                                                markerData.oa_temp = m.oa_temp || 0;
                                                markerData.sa_temp = m.sa_temp || 0;
                                                markerData.ra_temp = m.ra_temp || 0;
                                                markerData.humidity = m.humidity || 0;
                                                markerData.enthalpy = m.enthalpy || 0;
                                            } else if (m.type === 'vav') {
                                                markerData.zone_temp = m.zone_temp || 0;
                                                markerData.damper_position = m.damper_position || 0;
                                            }
                                        }
                                        
                                        allMarkers.push(markerData);
                                    });
                                }
                            });
                            setFloorMarkers(allMarkers);
                            const allWindows = [];
                            data.floors.forEach((floor, idx) => {
                                (floor.windows || []).forEach(w => {
                                    const verts = (Array.isArray(w.vertices) && w.vertices.length >= 3)
                                        ? w.vertices.map(v => [Number(v[0]), Number(v[1])])
                                        : null;
                                    allWindows.push({
                                        id: w.id || ('w_' + idx + '_' + allWindows.length),
                                        floorIdx: idx,
                                        x: Number(w.x),
                                        y: Number(w.y),
                                        length: Number(w.length) || 8,
                                        angle_deg: Number(w.angle_deg) || 0,
                                        blind_level: Math.min(1, Math.max(0, Number(w.blind_level) || 0)),
                                        sill_height_m: w.sill_height_m != null ? w.sill_height_m : 1.0,
                                        head_height_m: w.head_height_m != null ? w.head_height_m : 2.2,
                                        skew_x: verts ? 0 : (w.skew_x != null ? w.skew_x : 0.42),
                                        skew_y: verts ? 0 : (w.skew_y != null ? w.skew_y : 0),
                                        stretch_x: verts ? 1 : (w.stretch_x != null ? w.stretch_x : 1),
                                        stretch_y: verts ? 1 : (w.stretch_y != null ? w.stretch_y : 1),
                                        name: w.name || '',
                                        blind_type: (w.blind_type === 'horizontal' || w.blind_type === 'vertical') ? w.blind_type : 'roller',
                                        ...(verts ? { vertices: verts } : {}),
                                    });
                                });
                            });
                            setFloorWindows(allWindows);
                            const allRooms = [];
                            data.floors.forEach((floor, idx) => {
                                (floor.rooms || []).forEach((r, ri) => {
                                    const verts = (r.vertices || r.points || [])
                                        .map(v => [Number(v[0]), Number(v[1])])
                                        .filter(v => Number.isFinite(v[0]) && Number.isFinite(v[1]));
                                    if (verts.length < 3) return;
                                    allRooms.push({
                                        id: r.id || ('room_' + idx + '_' + ri),
                                        floorIdx: idx,
                                        name: r.name || ('Room ' + (allRooms.filter(x => x.floorIdx === idx).length + 1)),
                                        vertices: verts,
                                    });
                                });
                            });
                            setFloorRooms(allRooms);
                            const allObs = [];
                            const orients = {};
                            data.floors.forEach((floor, idx) => {
                                (floor.obstructions || []).forEach((o, oi) => {
                                    const verts = (o.vertices || o.points || [])
                                        .map(v => [Number(v[0]), Number(v[1])])
                                        .filter(v => Number.isFinite(v[0]) && Number.isFinite(v[1]));
                                    if (verts.length < 3) return;
                                    allObs.push({
                                        id: o.id || ('obs_' + idx + '_' + oi),
                                        floorIdx: idx,
                                        name: o.name || ('Concrete ' + (allObs.filter(x => x.floorIdx === idx).length + 1)),
                                        vertices: verts,
                                    });
                                });
                                if (floor.orientation && typeof floor.orientation === 'object') {
                                    const o = {};
                                    ['north', 'south', 'west', 'east'].forEach(k => {
                                        const p = floor.orientation[k];
                                        if (!p) return;
                                        const x = p.x != null ? Number(p.x) : Number(p.x_m);
                                        const y = p.y != null ? Number(p.y) : Number(p.y_m);
                                        if (Number.isFinite(x) && Number.isFinite(y)) o[k] = { x, y };
                                    });
                                    if (Object.keys(o).length) orients[idx] = o;
                                }
                            });
                            setFloorObstructions(allObs);
                            setFloorOrientations(orients);
                            setCurrentFloorIdx(0);
                            setActiveTarget({ type: 'floor_plan', idx: 0 });
                            
                            const floorCount = data.floors.length;
                            const markerCount = allMarkers.length;
                            const ahuCount = allMarkers.filter(m => m.type === 'ahu').length;

                                                    </div>
                                                </div>
