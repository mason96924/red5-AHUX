        const { useState, useRef, useEffect, useMemo, useCallback } = React;

        // --- DEFINITIVE ERROR BOUNDARY ---
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return <div className="p-10 text-rose-500 font-mono bg-slate-950 h-full w-full flex flex-col items-center justify-center text-center">
                        <h1 className="text-2xl font-black mb-4 uppercase text-white tracking-tighter italic leading-none">{window.t ? window.t('system_crash_prevented') : 'System Render Crash Prevented'}</h1>
                        <p className="bg-slate-900 p-4 rounded border border-rose-900/50 mb-6 max-w-2xl text-[10px] leading-relaxed shadow-black">{this.state.error?.toString()}</p>
                        <button onClick={() => window.location.reload()} className="px-8 py-3 bg-indigo-600 text-white rounded-xl font-black uppercase tracking-widest shadow-xl active:scale-95 transition-all">{window.t ? window.t('reload_system') : 'Reload System'}</button>
                    </div>;
                }
                return this.props.children;
            }
        }

        // ============================================================================
        // UTILITY: VFD BACKGROUND REMOVAL
        // ============================================================================
        const processAndExtractVFD = (imageSource, callback) => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i+1], b = data[i+2];
                    if (r > 190 && g > 190 && b > 190 && Math.abs(r-g) < 25 && Math.abs(g-b) < 25) {
                        data[i+3] = 0; 
                    }
                }
                
                ctx.putImageData(imgData, 0, 0);
                callback(canvas.toDataURL('image/png'));
            };
            img.src = imageSource;
        };

        // ============================================================================
        // 1-2. LOADED FROM EXTERNAL JS FILES (see <script> tags below main script)
        // Preview components: js/preview-components.js
        // Schema config: js/schema-config.js
        // Utilities: js/utils.js
        // ============================================================================

        // 3. MAIN APPLICATION & CANVAS

        // ============================================================================

        const App = () => {
            const lang = window.useLang ? window.useLang() : 'en';
            const [i18nReady, setI18nReady] = React.useState(!!window.LangSelector);
            React.useEffect(() => {
                if (window.LangSelector) { setI18nReady(true); return; }
                const iv = setInterval(() => { if (window.LangSelector) { setI18nReady(true); clearInterval(iv); } }, 200);
                return () => clearInterval(iv);
            }, []);
            // ============= PASSWORD AUTHENTICATION (v12.5) =============
            // ============= PASSWORD SECURITY (v12.10) =============
            const MASTER_KEY = "b%9P$MdeQP][";  // Recovery key - only you know this
            
            // Simple hash function that works over HTTP (no crypto.subtle needed)
            const hashPassword = async (password) => {
                let hash = 0;
                for (let i = 0; i < password.length; i++) {
                    const char = password.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                const hex = Math.abs(hash).toString(16).padStart(8, '0');
                // Double-hash for better distribution
                let hash2 = 0;
                const salted = password + hex;
                for (let i = 0; i < salted.length; i++) {
                    const char = salted.charCodeAt(i);
                    hash2 = ((hash2 << 5) - hash2) + char;
                    hash2 = hash2 & hash2;
                }
                return hex + Math.abs(hash2).toString(16).padStart(8, '0');
            };
            
            // Authentication - check sessionStorage set by landing page
            const engineerAuth = sessionStorage.getItem('engineerAuthenticated') === 'true';
            const [isAuthenticated, setIsAuthenticated] = useState(engineerAuth || true);
            const [configPassword, setConfigPassword] = useState(localStorage.getItem('configPasswordHash') || '');
            const [passwordInput, setPasswordInput] = useState('');
            const [showPasswordDialog, setShowPasswordDialog] = useState(true);  // Always show dialog for verification
            
            const [bgImage, setBgImage] = useState(null);
            const [schema, setSchema] = useState(FALLBACK_SCHEMA);
            
            const categories = Object.keys(schema);
            const [category, setCategory] = useState(categories[0] || '');
            const typeIds = schema[category] ? Object.keys(schema[category]) : [];
            const [typeId, setTypeId] = useState(typeIds[0] || '');
            
            const [activeTarget, setActiveTarget] = useState({ type: 'point_group', idx: 0 });
            const [activeSegmentId, setActiveSegmentId] = useState(null); // Track which segment is being edited
            
            // ============= FLOOR PLAN MAPPER STATE (v12.2) =============
            // CRITICAL: Floor Plan Mapper maps PHYSICAL INSTANCES, not schema types
            // Output: floor_mapped.json (separate from equipment_types.json)
            const [floorPlans, setFloorPlans] = useState([]); // [{id, name, imagePath, imageData (for preview only)}]
            const [currentFloorIdx, setCurrentFloorIdx] = useState(0);
            const [floorMarkers, setFloorMarkers] = useState([]); // Physical AHU/VAV instances with coordinates
            const [draggedMarkerType, setDraggedMarkerType] = useState(null); // 'ahu' or 'vav'
            const [selectedMarkerId, setSelectedMarkerId] = useState(null);
            const [showPsychroChart, setShowPsychroChart] = useState(false);
            const [psychroChartData, setPsychroChartData] = useState(null);
            const [draggingFloorMarker, setDraggingFloorMarker] = useState(null);
            const floorCanvasRef = useRef(null);
            // Image aspect ratio (natural width / height) used by the air-flow
            // segment Snap-Guide overlay to convert width-fraction to %-of-height
            // for horizontal crosshair positioning.  Updated on image onLoad.
            const [imgAspect, setImgAspect] = useState(1);
            
            // Deployment path - hardcoded for flat /root/data structure
            const deploymentPath = '/root';
            
            // Configuration mode: 'equipment' or 'map' or 'points'
            const [configMode, setConfigMode] = useState(localStorage.getItem('configMode') || 'equipment');
            // Equipment-mode sub-tab: equip / sensors / aligners / sim — one
            // 4-tab row replaces the legacy stacked accordions (Equipment
            // Category + Global Simulation Rig) and the 2-tab Sensors/Aligners
            // strip below.  Defaults to 'sensors' to preserve the prior
            // landing view; persisted across reloads.
            // Drag-and-drop sensor regrouping: which drop target is being
            // hovered over right now.  Value:
            //   null              → no drag in progress (or not over a drop zone)
            //   '__UNGROUPED__'   → over the "Ungrouped Sensors" header
            //   <group.id>        → over that group's header
            const [dragOverGroupId, setDragOverGroupId] = useState(null);
            const [equipSubTab, setEquipSubTab] = useState(localStorage.getItem('equipSubTab') || 'sensors');
            useEffect(() => { try { localStorage.setItem('equipSubTab', equipSubTab); } catch(e){} }, [equipSubTab]);

            // Sun-path overlay state (Phase A of the "3D View" roadmap).
            // sunState holds {enabled, sun:{azimuth,elevation,is_day}, hour, doy}
            // reported by the SunCompass component; used to apply per-marker
            // amber-ring exposure halos when `sunState.enabled` is true.
            const [sunState, setSunState] = useState(null);
            // Building lat/lon for solar math — attempt to read the first entry
            // of weather_location.json (saved by Dashboard); fall back to NYC.
            const [buildingLatLon, setBuildingLatLon] = useState({lat: 40.7128, lon: -74.0060});
            useEffect(() => {
                fetch('/api/weather-location').then(r => r.ok ? r.json() : null).then(data => {
                    if (Array.isArray(data) && data[0] && typeof data[0].lat === 'number') {
                        setBuildingLatLon({lat: data[0].lat, lon: data[0].lon});
                    }
                }).catch(() => {});
            }, []);
            
            // ============= POINTS EDITOR STATE =============
            const [pointsEditorView, setPointsEditorView] = useState('table'); // Default to 'table' now, not 'json'
            const [pointsJsonText, setPointsJsonText] = useState('');
            const [pointsTableData, setPointsTableData] = useState([]); // Array of point objects for table
            const [selectedEquipmentType, setSelectedEquipmentType] = useState('ahu_types');
            const [selectedEquipmentId, setSelectedEquipmentId] = useState('');
            const [jsonError, setJsonError] = useState('');
            const [editingCell, setEditingCell] = useState(null); // {rowIndex, field, value}
            
            const [showGrid, setShowGrid] = useState(true);
            const [theme, setTheme] = useState('dark'); // Theme state: 'dark' or 'light'
            
            // File Browser state
            const [showFileBrowser, setShowFileBrowser] = useState(false);
            const [fileBrowserData, setFileBrowserData] = useState(null);
            const [fileBrowserLoading, setFileBrowserLoading] = useState(false);
            const [fileBrowserPath, setFileBrowserPath] = useState('');
            const [fileBrowserRoot, setFileBrowserRoot] = useState(null);
            const [selectedFiles, setSelectedFiles] = useState(new Set()); // relative path for directory navigation
            
            // Image Picker state (for choosing images from controller)
            const [showImagePicker, setShowImagePicker] = useState(false);
            const [imagePickerFiles, setImagePickerFiles] = useState([]);
            const [imagePickerLoading, setImagePickerLoading] = useState(false);
            const imagePickerCallback = useRef(null); // callback(filename, imageURL)
            
            const [draggingTarget, setDraggingTarget] = useState(null); 
            const isDraggingMode = useRef(null); 
            
            const [view, setView] = useState({ scale: 1, x: 0, y: 0 });
            const [isPanning, setIsPanning] = useState(false);
            const [panMode, setPanMode] = useState(false); 
            const panStart = useRef({ x: 0, y: 0 });
            
            const [simAuto, setSimAuto] = useState(true);
            const [simSpeed, setSimSpeed] = useState(0);
            const [simFault, setSimFault] = useState(false);
            const [simDamper, setSimDamper] = useState(0);
            const [simValve, setSimValve] = useState(0);
            const [simFilter, setSimFilter] = useState(0);
            const [simHeat, setSimHeat] = useState(0);
            const [vfdActive, setVfdActive] = useState({});
            
            const [localTest, setLocalTest] = useState({});
            
            // ---- Sidebar pop-out (extra-monitor support) ----
            // popupWin: the spawned browser window that hosts the sidebar
            // when "popped out".  null = sidebar is in the main page.
            // popupHost: the <div> inside the popup that React renders into
            // via createPortal — re-uses the existing sidebar JSX verbatim
            // so behaviour is identical whether docked or popped out.
            const [popupWin,  setPopupWin]  = useState(null);
            const [popupHost, setPopupHost] = useState(null);

            const popOutSidebar = useCallback(() => {
                // Refuse double-popout (idempotent on repeated clicks).
                if (popupWin && !popupWin.closed) { popupWin.focus(); return; }
                const win = window.open('', 'red5_sidebar',
                    'width=480,height=900,resizable=yes,scrollbars=yes,menubar=no,toolbar=no,location=no,status=no');
                if (!win) {
                    alert('Popup window blocked. Please allow popups for this site, then click "Pop Out" again.');
                    return;
                }
                // Wipe any default content; build a clean shell.
                win.document.open(); win.document.write('<!doctype html><html><head></head><body></body></html>'); win.document.close();
                // Title + favicon parity with the main window.
                const titleEl = win.document.createElement('title');
                titleEl.textContent = 'Red5 Sidebar (popped out)';
                win.document.head.appendChild(titleEl);
                // Resolve relative URLs (images, fonts, etc.) against the
                // main window's URL so all assets keep loading.
                const baseEl = win.document.createElement('base');
                baseEl.href = window.location.href;
                win.document.head.appendChild(baseEl);
                // Clone parent <style> blocks + <link rel="stylesheet"> +
                // the Tailwind CDN <script>.  This gives the popup the
                // exact same look-and-feel without needing a separate
                // build pipeline.  Stays correct even on the offline
                // controller because the Tailwind script is loaded in the
                // main window's cache and re-fetched (or served by the
                // controller's own static file route).
                document.head.querySelectorAll('style, link[rel="stylesheet"]').forEach(node => {
                    win.document.head.appendChild(node.cloneNode(true));
                });
                const tailwind = document.querySelector('script[src*="tailwindcss"]');
                if (tailwind) {
                    const tw = win.document.createElement('script');
                    tw.src = tailwind.src;
                    win.document.head.appendChild(tw);
                }
                // Mirror parent <body> classes so dark/light theme is honoured.
                win.document.body.className = document.body.className;
                win.document.body.style.margin = '0';
                win.document.body.style.background = 'transparent';
                // Mount point for createPortal.
                const root = win.document.createElement('div');
                root.id = 'sidebar-portal-root';
                root.style.cssText = 'display:flex;flex-direction:column;width:100vw;min-height:100vh;';
                win.document.body.appendChild(root);
                setPopupWin(win);
                setPopupHost(root);
                // Snap back automatically when the operator closes the popup.
                const closeWatcher = setInterval(() => {
                    if (win.closed) {
                        clearInterval(closeWatcher);
                        setPopupWin(null);
                        setPopupHost(null);
                    }
                }, 400);
            }, [popupWin]);

            // If the parent tab is navigated away or refreshed, kill the
            // orphan popup so the operator isn't left with a stale window
            // (its React portal would be detached and useless).
            useEffect(() => {
                const onUnload = () => { if (popupWin && !popupWin.closed) popupWin.close(); };
                window.addEventListener('beforeunload', onUnload);
                return () => window.removeEventListener('beforeunload', onUnload);
            }, [popupWin]);

            const imageRef = useRef(null);

            // Load saved password hash from localStorage on mount (for verification, not auto-auth)
            useEffect(() => {
                const savedPasswordHash = localStorage.getItem('configPasswordHash');
                if (savedPasswordHash) {
                    setConfigPassword(savedPasswordHash);
                    // Don't auto-authenticate - user must enter password each time
                }
            }, []);

            useEffect(() => {
                const apiUrl = (window.API_BASE_URL || '');
                // Try configs/ subfolder first, then root
                fetch(apiUrl + '/assets/configs/equipment_types.json')
                    .then(r => { if (!r.ok) throw new Error('not in configs/'); return r.json(); })
                    .then(data => { 
                        if (data && Object.keys(data).length > 0) {
                            const sanitizedData = sanitizeSchema(data);
                            setSchema(sanitizedData); 
                            const cats = Object.keys(sanitizedData);
                            setCategory(cats[0]);
                            setTypeId(Object.keys(sanitizedData[cats[0]])[0]);
                        }
                    })
                    .catch(() => {
                        // Fallback to root
                        fetch(apiUrl + '/assets/equipment_types.json')
                            .then(r => r.ok ? r.json() : {})
                            .then(data => { 
                                if (data && Object.keys(data).length > 0) {
                                    const sanitizedData = sanitizeSchema(data);
                                    setSchema(sanitizedData); 
                                    const cats = Object.keys(sanitizedData);
                                    setCategory(cats[0]);
                                    setTypeId(Object.keys(sanitizedData[cats[0]])[0]);
                                }
                            })
                            .catch((e) => console.warn("Failed to load schema from server."));
                    });
            }, []);

            // Sync activeTarget when configMode is 'map' on load
            useEffect(() => {
                if (configMode === 'map') {
                    setActiveTarget({ type: 'floor_plan', idx: 0 });
                }
            }, []);

            const groupedPoints = useMemo(() => {
                if (!schema[category] || !schema[category][typeId]) return [];
                const entry = schema[category][typeId];
                const pts = entry.points || [];
                const sensorGroups = entry.sensor_groups || [];
                const groupDefs = new Map();
                sensorGroups.forEach(g => groupDefs.set(g.id, g));

                const groups = [];

                // PHASE 1 — One `isGroup: true` row per defined sensor_group
                // that has at least one member.  Used by the canvas to
                // render grouped pills (e.g. the "SA" pill containing
                // SAF/SAT/SAH stacked rows).  Position/scale come from
                // the FIRST member point so existing pill placements
                // survive the migration.
                sensorGroups.forEach(g => {
                    const groupIndices = [];
                    pts.forEach((p, i) => {
                        if (p.group_id === g.id) groupIndices.push(i);
                    });
                    if (groupIndices.length === 0) return;
                    const firstPt = pts[groupIndices[0]];
                    groups.push({
                        isGroup: true,
                        groupId: g.id,
                        defaultName: g.name || g.id,
                        indices: groupIndices,
                        points: groupIndices.map(i => pts[i]),
                        x: firstPt.x,
                        y: firstPt.y,
                        scale: firstPt.scale || 1.0,
                        name: (firstPt.name && firstPt.name !== firstPt.label) ? firstPt.name : (g.name || g.id),
                    });
                });

                // PHASE 2 — One `isGroup: false` row per individual point,
                // INCLUDING points that are already members of a group.
                // The SENSORS sidebar panel uses these rows to render
                // each member inside its parent group expansion (filter:
                // !isGroup && group_id === g.id).  The canvas skips
                // these for grouped points (they're already drawn as
                // part of the parent isGroup:true pill — see the
                // `inGroupMember` short-circuit in the canvas map).
                //
                // Defensive: if a point references a deleted group, we
                // clear the dangling group_id here so the row falls
                // through to "Ungrouped Sensors" instead of vanishing.
                pts.forEach((p, i) => {
                    if (p.group_id && !groupDefs.has(p.group_id)) {
                        p.group_id = null;
                    }
                    groups.push({
                        isGroup: false,
                        groupId: p.label,
                        defaultName: p.label,
                        indices: [i],
                        points: [p],
                        x: p.x,
                        y: p.y,
                        scale: p.scale || 1.0,
                        name: (p.name && p.name !== p.label) ? p.name : p.label,
                    });
                });

                return groups;
            }, [schema, category, typeId]);

            const duplicateSelectedAligner = () => {

                    const file = e.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const csvText = event.target.result;
                            const lines = csvText.split('\n').filter(line => line.trim());
                            
                            if (lines.length === 0) {
                                alert('❌ CSV file is empty');
                                return;
                            }
                            
                            // Auto-detect headers from first row
                            const headers = lines[0].split(',').map(h => h.trim());
                            const dataRows = lines.slice(1);
                            
                            const importedData = dataRows.map(line => {
                                const values = line.split(',').map(v => v.trim());
                                const row = {};
                                headers.forEach((header, i) => {
                                    row[header] = values[i] || '';
                                });
                                return row;
                            });
                            
                            setPointsTableData(importedData);
                            setPointsJsonText(JSON.stringify(importedData, null, 2));
                            alert(`✅ Imported ${importedData.length} rows`);

            const exportCSVFile = () => {
                try {
                    if (pointsTableData.length === 0) {
                        alert('❌ No data to export');
                        return;
                    }
                    
                    // Get all unique keys as headers
                    const allKeys = [...new Set(pointsTableData.flatMap(p => Object.keys(p)))];
                    
                    // Build CSV
                    let csv = allKeys.join(',') + '\n';
                    pointsTableData.forEach(row => {
                        const values = allKeys.map(key => {
                            const val = row[key];
                            return val !== undefined && val !== null ? String(val) : '';
                        });
                        csv += values.join(',') + '\n';
                    });
                    
                    // Download
                    const blob = new Blob([csv], { type: 'text/csv' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${selectedEquipmentType}_${selectedEquipmentId}_points.csv`;
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    alert('✅ CSV downloaded!');
                } catch (err) {
                    alert('❌ Failed to export CSV: ' + err.message);
                }
            };

            const unmapGroup = (indices) => {
                setSchema(prevSchema => {
                    const draft = JSON.parse(JSON.stringify(prevSchema));
                    const list = draft[category][typeId].points;
                    indices.forEach(idx => {
                        if (list && list[idx]) { list[idx].x = null; list[idx].y = null; }
                    });
                    return draft;
                });
                setActiveTarget({ type: 'none', idx: 0 });
                setDraggingTarget(null);
                isDraggingMode.current = null;
            };

            const updateTargetCoords = (target, updates) => {
                if (!target) return;
                setSchema(prevSchema => {
                    if (!prevSchema[category] || !prevSchema[category][typeId]) return prevSchema;
                    const updatedType = { ...prevSchema[category][typeId] };
                    if (target.type === 'animation') {
                        const currentVisualAssets = updatedType.visual_assets || {};
                        const updatedAnims = [...(currentVisualAssets.animations || [])];
                        if (updatedAnims[target.idx]) { updatedAnims[target.idx] = { ...updatedAnims[target.idx], ...updates }; updatedType.visual_assets = { ...currentVisualAssets, animations: updatedAnims }; }
                    }
                    return { ...prevSchema, [category]: { ...prevSchema[category], [typeId]: updatedType } };
                });
            };

            const handleFineTune = (target, axis, value) => {
                if (['outline_path', 'animation_type', 'element_id', 'telemetry_key', 'telemetry_keys', 'image_data', 'dp_active_channel', 'dp_active_row'].includes(axis)) {
                    const updates = { [axis]: value };
                    if (axis === 'animation_type' && value === 'air_flow_path') {
                        updates.segments = [{ id: Date.now(), type: "SA", offsetX: 0, offsetY: 0, offsetXFrac: 0, offsetYFrac: 0, scale: 1.0, stretchX: 1.0, stretchY: 1.0, rotX: 0, rotY: 0, rotZ: 0, skewX: 0, skewY: 0, path: DEFAULT_WAVY_PATH }];
                    }
                    if (axis === 'animation_type' && value === 'vfd_aligner') {
                        updates.telemetry_keys = { target_hz: 'INV1_F', actual_hz: 'INV1_H', amps: 'INV1_A', alarm: 'INV1_ALM', run_cmd: 'INV1_SST', status: 'INV1_STATUS' };
                    }
                    if (axis === 'animation_type' && value === 'dp_sensor_aligner') {
                        updates.telemetry_keys = { ch1_temp: 'ZONE_TEMP', ch2_rh: 'ZONE_RH', ch3_pa: 'DP_PA' };
                        updates.dp_active_channel = 0;
                    }
                    if (axis === 'animation_type' && value === 'dp_display_aligner') {
                        updates.telemetry_keys = { indoor_temp: 'ZONE_TEMP', indoor_rh: 'ZONE_RH', diff_pressure: 'DP_PA', vav_flow: 'VAV_FLOW', cav_flow: 'CAV_FLOW' };
                        updates.dp_active_row = 0;
                    }
                    updateTargetCoords(target, updates);
                    return;
                }
                
                let numVal = parseFloat(value);
                if (isNaN(numVal)) numVal = 0;
                
                if (['x', 'y', 'pill_x', 'pill_y', 'sensor_x', 'sensor_y'].includes(axis)) numVal = Number(Math.max(0, Math.min(100, numVal)).toFixed(1));
                else if (['scale', 'stretchX', 'stretchY', 'pill_scale', 'screen_scale', 'sensor_scale', 'sensor_stretchX', 'sensor_stretchY'].includes(axis)) numVal = Number(Math.max(0.1, Math.min(10, numVal)).toFixed(2));
                else if (['rotX', 'rotY', 'skewX', 'skewY', 'sensor_rotX', 'sensor_rotY', 'sensor_skewX', 'sensor_skewY'].includes(axis)) numVal = Number(Math.max(-90, Math.min(90, numVal)).toFixed(1));
                else if (['rotZ', 'sensor_rotZ'].includes(axis)) numVal = Number(Math.max(-180, Math.min(180, numVal)).toFixed(1));
                else if (['pipeLength', 'base_w', 'base_h', 'screen_w', 'screen_h', 'pill_w', 'pill_h'].includes(axis)) numVal = Number(Math.max(20, Math.min(1000, numVal)).toFixed(0));
                else if (['pipeThickness', 'separation'].includes(axis)) numVal = Number(Math.max(0, Math.min(200, numVal)).toFixed(0));
                else if (['screen_dx', 'screen_dy', 'pill_dx', 'pill_dy'].includes(axis)) numVal = Number(Math.round(numVal));

                updateTargetCoords(target, { [axis]: numVal });
            };

            const handleFineTuneGroup = (indices, axis, value) => {
                let numVal = value;
                if (['x', 'y', 'scale'].includes(axis)) {
                    numVal = parseFloat(value);
                    if (isNaN(numVal)) numVal = 0;
                    if (['x', 'y'].includes(axis)) numVal = Number(Math.max(0, Math.min(100, numVal)).toFixed(1));
                    if (axis === 'scale') numVal = Number(Math.max(0.1, Math.min(10, numVal)).toFixed(2));
                }

                setSchema(prevSchema => {
                    const draft = JSON.parse(JSON.stringify(prevSchema));
                    const list = draft[category][typeId].points;
                    indices.forEach((idx, i) => {
                        if (list && list[idx]) {
                            if (axis === 'name') { if (i === 0) list[idx][axis] = value; } 
                            else { list[idx][axis] = numVal; }
                        }
                    });
                    return draft;
                });
            };

            const handleAirflowSegmentChange = (animIdx, segIdx, field, value) => {
                setSchema(prevSchema => {
                    const draft = JSON.parse(JSON.stringify(prevSchema));
                    const anim = draft[category][typeId].visual_assets.animations[animIdx];
                    if (anim && anim.segments && anim.segments[segIdx]) { 
                        anim.segments[segIdx][field] = value; 
                        // Auto-select this segment when editing
                        setActiveSegmentId(anim.segments[segIdx].id);
                    }
                    return draft;
                });
            };

            const addAirflowSegment = (animIdx) => {
                setSchema(prevSchema => {
                    const draft = JSON.parse(JSON.stringify(prevSchema));
                    const anim = draft[category][typeId].visual_assets.animations[animIdx];
                    if (anim) {
                        if (!anim.segments) anim.segments = [];
                        const offX = anim.segments.length * 120; 
                        const offY = anim.segments.length * 40; 
                        // Convert default offset hint to canonical Frac using the
                        // currently-displayed image natural width if available.
                        // Falls back to 1500 px so segments don't pile up at origin.
                        const refW = (imageRef.current && imageRef.current.naturalWidth) || 1500;
                        const offXFrac = offX / refW;
                        const offYFrac = offY / refW;
                        // NEW: Use temperature system instead of type
                        anim.segments.push({ 
                            id: Date.now(), 
                            start_temp_mode: 'sensor',
                            start_temp_value: 'OAT',
                            end_temp_mode: 'sensor',
                            end_temp_value: 'SAT',
                            offsetX: offX, 
                            offsetY: offY, 
                            offsetXFrac: offXFrac,
                            offsetYFrac: offYFrac,
                            scale: 1.0, 
                            stretchX: 1.0, 
                            stretchY: 1.0, 
                            rotX: 0, 
                            rotY: 0, 
                            rotZ: 0, 
                            skewX: 0, 
                            skewY: 0, 
                            path: DEFAULT_WAVY_PATH 
                        });
                    }
                    return draft;
                });
            };

            const removeAirflowSegment = (animIdx, segIdx) => {
                setSchema(prevSchema => {
                    const draft = JSON.parse(JSON.stringify(prevSchema));
                    const anim = draft[category][typeId].visual_assets.animations[animIdx];
                    if (anim && anim.segments) anim.segments.splice(segIdx, 1);
                    return draft;
                });
            };

            const handleSidebarClick = (type, idx) => {
                setActiveTarget({ type, idx });
                if (type === 'point_group') {
                    const grp = groupedPoints[idx];
                    if (grp && grp.x == null && bgImage) {
                        handleFineTuneGroup(grp.indices, 'x', 50);
                        handleFineTuneGroup(grp.indices, 'y', 50);
                    }
                } else if (type === 'animation') {
                    const list = schema[category]?.[typeId]?.visual_assets?.animations || [];
                    if (list[idx] && list[idx].x == null && bgImage) {
                        const defaults = { x: 50, y: 50 };
                        if (list[idx].animation_type === 'vfd_aligner') {
                            defaults.pill_x = 50; defaults.pill_y = 60; defaults.pill_scale = 1.0;
                            defaults.screen_dx = 0; defaults.screen_dy = -50;
                        }
                        updateTargetCoords({ type, idx }, defaults); 
                    }
                }
            };

            const handleElementMouseDown = (e, type, idx, mode = 'move', subtype = 'main') => {
                if (panMode || e.button === 1) return; 
                e.stopPropagation(); e.preventDefault(); 
                
                let initOffX = 0, initOffY = 0;
                setDraggingTarget({ type, idx, subtype, startX: e.clientX, startY: e.clientY, initOffX, initOffY }); 
                setActiveTarget({ type, idx }); 
                isDraggingMode.current = mode;
            };

            const handleCanvasMouseDown = (e) => {
                if (panMode || e.button === 1 || e.target.id === 'canvas-bg' || e.target.id === 'transform-wrapper' || e.target.tagName === 'IMG') {
                    e.preventDefault();
                    setIsPanning(true);
                    panStart.current = { x: e.clientX - view.x, y: e.clientY - view.y };
                }
            };

            const handleCanvasMouseMove = (e) => {
                if (isPanning) {
                    setView(prev => ({ 
                        ...prev, 
                        x: e.clientX - panStart.current.x, 
                        y: e.clientY - panStart.current.y 
                    }));
                    return;
                }       
                if (draggingTarget !== null && isDraggingMode.current && imageRef.current) {
                    const rect = imageRef.current.getBoundingClientRect();
                    const xPct = Math.max(0, Math.min(100, Number((((e.clientX - rect.left) / rect.width) * 100).toFixed(1))));
                    const yPct = Math.max(0, Math.min(100, Number((((e.clientY - rect.top) / rect.height) * 100).toFixed(1))));

                    const subtype = draggingTarget.subtype;

                    if (draggingTarget.type === 'point_group') {
                        const grp = groupedPoints[draggingTarget.idx];
                        if (!grp) return;
                        if (isDraggingMode.current === 'move') {
                            handleFineTuneGroup(grp.indices, 'x', xPct);
                            handleFineTuneGroup(grp.indices, 'y', yPct);
                        }
                        return;
                    }

                    const list = schema[category]?.[typeId]?.visual_assets?.animations || [];
                    const item = list[draggingTarget.idx];
                    if (!item) return;

                    if (isDraggingMode.current === 'move') {
                        if (subtype === 'sensor') updateTargetCoords(draggingTarget, { sensor_x: xPct, sensor_y: yPct });
                        else if (subtype === 'vfd_screen') {
                            const dxScaled = (e.clientX - draggingTarget.startX) / view.scale / (item.scale || 1.0);
                            const dyScaled = (e.clientY - draggingTarget.startY) / view.scale / (item.scale || 1.0);
                            updateTargetCoords(draggingTarget, { screen_dx: Math.round(draggingTarget.initOffX + dxScaled), screen_dy: Math.round(draggingTarget.initOffY + dyScaled) });
                        } else if (subtype === 'vfd_pill') {
                            const dxScaled = (e.clientX - draggingTarget.startX) / view.scale / (item.scale || 1.0);
                            const dyScaled = (e.clientY - draggingTarget.startY) / view.scale / (item.scale || 1.0);
                            updateTargetCoords(draggingTarget, { pill_dx: Math.round(draggingTarget.initOffX + dxScaled), pill_dy: Math.round(draggingTarget.initOffY + dyScaled) });
                        } else {
                            updateTargetCoords(draggingTarget, { x: xPct, y: yPct });
                        }
                    }
                    else if (isDraggingMode.current === 'move-pill') {
                        updateTargetCoords(draggingTarget, { pill_x: xPct, pill_y: yPct });
                    }
                    else if (isDraggingMode.current === 'move-segment') {
                        // Frac math: drag delta in screen px → fraction of image natural width.
                        // rect.width includes view.scale, so dividing by it gives screen-fraction-of-image,
                        // which equals natural-fraction (image scales uniformly).
                        const dxScreen = (e.clientX - draggingTarget.startX);
                        const dyScreen = (e.clientY - draggingTarget.startY);
                        const dxFrac = rect.width > 0 ? (dxScreen / rect.width) : 0;
                        const dyFrac = rect.width > 0 ? (dyScreen / rect.width) : 0; // use width as the canonical denominator for both axes
                        // Legacy px: keep computing it for backward compat (old hosts that haven't been updated)
                        const dxScaled = (e.clientX - draggingTarget.startX) / view.scale;
                        const dyScaled = (e.clientY - draggingTarget.startY) / view.scale;
                        
                        const segIdx = item.segments?.findIndex(s => s.id === subtype) ?? -1;
                        if (segIdx > -1) {
                            const initFx = (draggingTarget.initOffXFrac != null) ? draggingTarget.initOffXFrac : 0;
                            const initFy = (draggingTarget.initOffYFrac != null) ? draggingTarget.initOffYFrac : 0;
                            handleAirflowSegmentChange(draggingTarget.idx, segIdx, 'offsetXFrac', +(initFx + dxFrac).toFixed(6));
                            handleAirflowSegmentChange(draggingTarget.idx, segIdx, 'offsetYFrac', +(initFy + dyFrac).toFixed(6));
                            // Also keep legacy px in sync (best-effort, for backward compat with older renderers)
                            handleAirflowSegmentChange(draggingTarget.idx, segIdx, 'offsetX', Math.round(draggingTarget.initOffX + dxScaled));
                            handleAirflowSegmentChange(draggingTarget.idx, segIdx, 'offsetY', Math.round(draggingTarget.initOffY + dyScaled));
                        }
                    }
                    else if (isDraggingMode.current === 'rotate' && draggingTarget.type === 'animation') {
                        if (typeof subtype === 'number' || typeof subtype === 'string') {
                            const segIdx = item.segments?.findIndex(s => s.id === subtype) ?? -1;
                            if (segIdx > -1) {
                                const seg = item.segments[segIdx];
                                // Prefer canonical Frac; fall back to legacy px scaled by current display ratio.
                                const dispW = imageRef.current ? imageRef.current.offsetWidth : rect.width / Math.max(view.scale, 0.0001);
                                const natW = imageRef.current ? imageRef.current.naturalWidth : dispW;
                                const segPxX = (seg.offsetXFrac != null) ? (seg.offsetXFrac * dispW) : ((seg.offsetX || 0) * (dispW / Math.max(natW, 1)));
                                const segPxY = (seg.offsetYFrac != null) ? (seg.offsetYFrac * dispW) : ((seg.offsetY || 0) * (dispW / Math.max(natW, 1)));
                                const centerX = rect.left + (item.x / 100 * rect.width) + (segPxX * view.scale);
                                const centerY = rect.top + (item.y / 100 * rect.height) + (segPxY * view.scale);
                                let angle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
                                angle += 90; if (angle < 0) angle += 360;
                                handleAirflowSegmentChange(draggingTarget.idx, segIdx, 'rotZ', angle);
                                return;
                            }
                        }
                        
                        const originX = subtype === 'sensor' ? item.sensor_x : item.x;
                        const originY = subtype === 'sensor' ? item.sensor_y : item.y;
                        const centerX = rect.left + (originX / 100) * rect.width;
                        const centerY = rect.top + (originY / 100) * rect.height;
                        let angle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
                        angle += 90; if (angle < 0) angle += 360;
                        handleFineTune(draggingTarget, subtype === 'sensor' ? 'sensor_rotZ' : 'rotZ', angle);
                    }
                    else if (isDraggingMode.current === 'scale' && draggingTarget.type === 'animation') {
                        if (typeof subtype === 'number' || typeof subtype === 'string') {
                            const segIdx = item.segments?.findIndex(s => s.id === subtype) ?? -1;
                            if (segIdx > -1) {
                                const seg = item.segments[segIdx];
                                const dispW = imageRef.current ? imageRef.current.offsetWidth : rect.width / Math.max(view.scale, 0.0001);
                                const natW = imageRef.current ? imageRef.current.naturalWidth : dispW;
                                const segPxX = (seg.offsetXFrac != null) ? (seg.offsetXFrac * dispW) : ((seg.offsetX || 0) * (dispW / Math.max(natW, 1)));
                                const segPxY = (seg.offsetYFrac != null) ? (seg.offsetYFrac * dispW) : ((seg.offsetY || 0) * (dispW / Math.max(natW, 1)));
                                const centerX = rect.left + (item.x / 100 * rect.width) + (segPxX * view.scale);
                                const centerY = rect.top + (item.y / 100 * rect.height) + (segPxY * view.scale);
                                const dist = Math.sqrt(Math.pow(e.clientX - centerX, 2) + Math.pow(e.clientY - centerY, 2));
                                const newScale = Math.max(0.1, (dist / 100).toFixed(2));
                                handleAirflowSegmentChange(draggingTarget.idx, segIdx, 'scale', newScale);
                                return;
                            }
                        }
                        
                        const originX = subtype === 'sensor' ? item.sensor_x : item.x;
                        const originY = subtype === 'sensor' ? item.sensor_y : item.y;
                        const centerX = rect.left + (originX / 100) * rect.width;
                        const centerY = rect.top + (originY / 100) * rect.height;
                        const dist = Math.sqrt(Math.pow(e.clientX - centerX, 2) + Math.pow(e.clientY - centerY, 2));
                        const newScale = Math.max(0.1, (dist / 100).toFixed(2));
                        handleFineTune(draggingTarget, subtype === 'sensor' ? 'sensor_scale' : 'scale', newScale);
                    }
                }
            };

            const handleImageClick = (e) => {
                if (isDraggingMode.current || panMode || e.button === 1) return; 
                if (!imageRef.current || draggingTarget !== null) return;
                
                const rect = imageRef.current.getBoundingClientRect();
                const xPct = Number((((e.clientX - rect.left) / rect.width) * 100).toFixed(1));
                const yPct = Number((((e.clientY - rect.top) / rect.height) * 100).toFixed(1));

                if (activeTarget.type === 'point_group') {
                    if (activeTarget.idx >= groupedPoints.length) return;
                    const grp = groupedPoints[activeTarget.idx];
                    handleFineTuneGroup(grp.indices, 'x', xPct);
                    handleFineTuneGroup(grp.indices, 'y', yPct);
                    if (activeTarget.idx < groupedPoints.length - 1) setActiveTarget({ type: 'point_group', idx: activeTarget.idx + 1 });
                } else if (activeTarget.type === 'animation') {
                    const list = schema[category]?.[typeId]?.visual_assets?.animations || [];
                    if (activeTarget.idx >= list.length) return; 
                    const updates = { x: xPct, y: yPct };
                    if (['centrifugal_fan', 'rectangular_fan'].includes(list[activeTarget.idx].animation_type)) {
                        updates.pill_x = xPct; updates.pill_y = yPct + 10;
                    }
                    if (list[activeTarget.idx].animation_type === 'diff_pressure_switch') {
                        updates.sensor_x = xPct + 10; updates.sensor_y = yPct - 10;
                    }
                    updateTargetCoords(activeTarget, updates);
                    if (activeTarget.idx < list.length - 1) setActiveTarget({ type: 'animation', idx: activeTarget.idx + 1 });
                }
            };

            const handleWheel = (e) => {
                setView(prev => {
                    const delta = e.deltaY < 0 ? 0.2 : -0.2;
                    return { ...prev, scale: Math.max(0.2, Math.min(10, prev.scale + delta)) };
                });
            };

            const exportConfig = () => {
                const schemaData = schema;
                
                // Check if deployment path is set
                if (deploymentPath && deploymentPath.trim()) {
                    // Save to server via backend API
                    const apiUrl = window.API_BASE_URL || '';
                    
                    fetch(`${apiUrl}/api/save-equipment-schema`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            deployment_path: deploymentPath,
                            equipment_schema: schemaData
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            alert(`Equipment schema saved to:\n\n${data.file}`);
                        } else {
                            throw new Error(data.error || 'Save failed');
                        }
                    })
                    .catch(err => {
                        alert(`Error saving to server:\n\n${err.message}\n\nFalling back to browser download...`);
                        // Fallback to browser download
                        downloadToBuffer();
                    });
                } else {
                    // No deployment path - download to browser
                    downloadToBuffer();
                }
                
                function downloadToBuffer() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(schemaData, null, 2));
                    const downloadAnchorNode = document.createElement('a');
                    downloadAnchorNode.setAttribute("href", dataStr);
                    downloadAnchorNode.setAttribute("download", "equipment_types.json");
                    document.body.appendChild(downloadAnchorNode);
                    downloadAnchorNode.click();
                    downloadAnchorNode.remove();
                }
            };

            // ============= FLOOR PLAN MAPPER FUNCTIONS (v12.2) =============
            
            const addFloor = () => {
                addNewFloorPlan();
            };
            
            // Shared helper: finalize adding a new floor with given image
            const finalizeNewFloor = (fileName, imageData) => {
                const floorName = prompt(`Name this floor plan:\n\nExamples: Ground Floor, Level 2 - East Wing`, `Floor ${floorPlans.length + 1}`);
                if (!floorName || !floorName.trim()) {
                    alert('Floor name is required. Floor plan not added.');
                    return;
                }
                const newFloor = {
                    id: `floor_${Date.now()}`,
                    name: floorName.trim(),
                    imagePath: fileName,
                    imageData: imageData,
                    originalFileName: fileName
                };
                const updatedFloors = [...floorPlans, newFloor];
                setFloorPlans(updatedFloors);
                setCurrentFloorIdx(updatedFloors.length - 1);
            };
            
            const addNewFloorPlan = () => {
                const source = prompt('Load floor plan image from:\n\n1 = Controller (/root/data/)\n2 = Local PC (browse)\n\nEnter 1 or 2:', '2');
                if (!source) return;
                
                if (source.trim() === '1') {
                    // Pick from controller
                    openImagePicker((filename, imageURL) => {
                        finalizeNewFloor(filename, imageURL);
                    });
                } else {
                    // Pick from local PC
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/png,image/jpeg,image/jpg,image/svg+xml';
                    input.onchange = async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        
                        const reader = new FileReader();
                        reader.onload = async (event) => {
                            const imageDataURL = event.target.result;
                            const fileName = file.name;
                            
                            finalizeNewFloor(fileName, imageDataURL);
                            
                            // Also upload image to controller
                            try {
                                const apiUrl = window.API_BASE_URL || '';
                                const response = await fetch(`${apiUrl}/api/save-floor-plan`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ filename: `graphics/floor_plans/${fileName}`, image_data: imageDataURL })
                                });
                                const data = await response.json();
                                if (data.success) {
                                    alert(`Floor plan added.\n\nImage saved to controller: /root/data/${data.relative_path || fileName}`);
                                } else {
                                    alert(`Floor plan added to preview.\n\nSave to controller failed: ${data.error}`);
                                }
                            } catch (err) {
                                alert(`Floor plan added to preview.\n\nCould not reach controller: ${err.message}`);
                            }
                        };
                        reader.readAsDataURL(file);
                    };
                    input.click();
                }
            };
            
            const replaceFloorBackground = () => {
                if (floorPlans.length === 0 || !floorPlans[currentFloorIdx]) {
                    alert('No floor selected. Upload a floor plan first.');
                    return;
                }
                
                const currentFloorName = floorPlans[currentFloorIdx].name;
                const source = prompt(`Change image for "${currentFloorName}" from:\n\n1 = Controller (/root/data/)\n2 = Local PC (browse)\n\nEnter 1 or 2:`, '2');
                if (!source) return;
                
                const applyImage = (fileName, imageData) => {
                    setFloorPlans(prev => prev.map((floor, idx) => 
                        idx === currentFloorIdx 
                            ? { ...floor, imagePath: fileName, imageData: imageData, originalFileName: fileName }
                            : floor
                    ));
                };
                
                if (source.trim() === '1') {
                    // Pick from controller
                    openImagePicker((filename, imageURL) => {
                        applyImage(filename, imageURL);
                        alert(`Background updated for "${currentFloorName}" using ${filename} from controller.`);
                    });
                } else {
                    // Pick from local PC
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/png,image/jpeg,image/jpg,image/svg+xml';
                    input.onchange = async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        
                        const reader = new FileReader();
                        reader.onload = async (event) => {
                            const imageDataURL = event.target.result;
                            const fileName = file.name;
                            
                            applyImage(fileName, imageDataURL);
                            
                            try {

            const renameFloor = (floorIdx) => {

                if (newName && newName.trim() && newName.trim() !== currentName) {

                const xPct = ((e.clientX - rect.left) / rect.width) * 100;

            };

            const exportMapConfig = () => {
                // Also generate collector_config.json from floor markers
                const generateCollectorConfig = (markers) => {
                    const groups = {};
                    const orphanVavs = [];

                    // Group markers by floor, dedup within each floor only
                    const byFloor = {};
                    markers.forEach(m => {
                        if (!m.name) return;
                        const fi = m.floorIdx !== undefined ? m.floorIdx : -1;
                        if (!byFloor[fi]) byFloor[fi] = { ahus: [], vavs: [] };
                        const name = m.name.trim();
                        if (m.type === 'ahu' && !byFloor[fi].ahus.includes(name)) byFloor[fi].ahus.push(name);
                        if (m.type === 'vav' && !byFloor[fi].vavs.includes(name)) byFloor[fi].vavs.push(name);
                    });

                    const getOrientation = (name) => {
                        const m = name.match(/[-_]([ESWN])$/i);
                        return m ? m[1].toUpperCase() : null;
                    };

                    // Process each floor independently
                    // VAV names are NOT globally unique — same name on different floors = different box
                    Object.keys(byFloor).sort((a, b) => a - b).forEach(fi => {
                        const floor = byFloor[fi];

                        // Create AHU groups
                        floor.ahus.forEach(ahuName => {
                            if (!groups[ahuName]) {
                                const csvObj = 'CSV_' + ahuName.replace(/[-\s]/g, '');
                                groups[ahuName] = { csv_object: csvObj, vavs: [] };
                            }
                        });

                        if (floor.ahus.length === 0) {
                            floor.vavs.forEach(v => orphanVavs.push(v));
                            return;
                        }

                        floor.vavs.forEach(v => {
                            if (floor.ahus.length === 1) {
                                // Single AHU on floor — all VAVs go to it
                                groups[floor.ahus[0]].vavs.push(v);
                            } else {
                                // Multi-AHU floor — match by E/S/W/N orientation
                                const vOrient = getOrientation(v);
                                let matched = false;
                                if (vOrient) {
                                    for (const ahuName of floor.ahus) {
                                        if (getOrientation(ahuName) === vOrient) {
                                            groups[ahuName].vavs.push(v);
                                            matched = true;
                                            break;
                                        }
                                    }
                                }
                                if (!matched) {
                                    groups[floor.ahus[0]].vavs.push(v);
                                }
                            }
                        });
                    });

                    if (orphanVavs.length > 0) {
                        console.warn('Orphaned VAVs (no AHU on their floor):', orphanVavs);
                    }

                    // Final dedup within each AHU
                    Object.keys(groups).forEach(a => { groups[a].vavs = [...new Set(groups[a].vavs)]; });

                    return {
                        version: '1.1',
                        interval: 5,
                        ahu_groups: groups,
                        dashboard_point_map: {
                            ahu: { oa_t: 'OAT', oa_rh: 'OAH', sa_t: 'SAT', sa_rh: 'SAH' },
                            vav: { zone_t: 't', zone_rh: 'rh' }
                        }
                    };
                };


                // Prepare data
                const mapConfigData = {
                    version: "1.1",
                    deployment_note: "Floor plan images stored with relative paths under /root/data/",
                    floors: floorPlans.map((floor, idx) => ({
                        id: floor.id,
                        name: floor.name,
                        image_path: floor.imagePath || '',
                        markers: floorMarkers.filter(m => m.floorIdx === idx).map(m => ({
                            id: m.id,
                            type: m.type,
                            name: m.name,
                            x: m.x,
                            y: m.y,
                            active: m.active,
                            equipment_type_id: m.equipment_type_id || '',
                            telemetry: m.type === 'ahu' ? {
                                oa_temp: m.oa_temp,
                                sa_temp: m.sa_temp,
                                ra_temp: m.ra_temp,
                                humidity: m.humidity,
                                enthalpy: m.enthalpy
                            } : {
                                zone_temp: m.zone_temp,
                                damper_position: m.damper_position
                            }
                        }))
                    }))
                };
                
                const imageManifest = {
                    note: "Images stored with relative paths under /root/data/",
                    images: floorPlans.map(floor => ({
                        path: floor.imagePath || '',
                        filename: floor.originalFileName || floor.imagePath || '',
                        floor_name: floor.name
                    }))
                };

                // Generate collector_config.json from all floor markers
                // VAVs assigned by FLOOR — all VAVs on the same floor as an AHU belong to it
                const allMarkersWithFloor = floorMarkers.map(m => ({ type: m.type, name: m.name, floorIdx: m.floorIdx }));
                const collectorConfigData = generateCollectorConfig(allMarkersWithFloor);

                // Debug: show what was generated
                const debugLines = ['Collector Config Generated:'];
                Object.entries(collectorConfigData.ahu_groups).forEach(([ahu, grp]) => {
                    debugLines.push(ahu + ' (' + grp.csv_object + '): ' + grp.vavs.length + ' VAVs');
                    debugLines.push('  ' + grp.vavs.join(', '));

                // Check if deployment path is set

                        fetch(`${apiUrl}/api/save-config`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                deployment_path: deploymentPath,
                                map_config: mapConfigData,
                                image_manifest: imageManifest
                            })
                        }).then(r => r.json()),
                        fetch(`${apiUrl}/api/collector-config`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(collectorConfigData)
                        }).then(r => r.json())
                    ])
                    .then(([mapResult, collResult]) => {
                        const msgs = [];
                        if (mapResult.success) msgs.push('map_config.json saved');
                        else msgs.push('map_config.json error: ' + (mapResult.error || 'Unknown'));
                        if (collResult.success) msgs.push('collector_config.json saved');
                        else msgs.push('collector_config.json error: ' + (collResult.error || 'Unknown'));
                        
                        const ahuCount = Object.keys(collectorConfigData.ahu_groups).length;
                        const vavCount = Object.values(collectorConfigData.ahu_groups).reduce((s, g) => s + g.vavs.length, 0);
                        msgs.push('\nCollector config: ' + ahuCount + ' AHUs, ' + vavCount + ' VAVs');
                        Object.entries(collectorConfigData.ahu_groups).forEach(([ahu, grp]) => {
                            msgs.push('  ' + ahu + ': ' + grp.vavs.length + ' VAVs [' + grp.vavs.join(', ') + ']');
                        });
                        alert(msgs.join('\n'));
                    })
                    .catch(err => {
                        alert('Error saving: ' + err.message + '\n\nFalling back to browser download...');
                        downloadToBrowser(mapConfigData, imageManifest, collectorConfigData);
                    });
                } else {
                    downloadToBrowser(mapConfigData, imageManifest, collectorConfigData);
                }
            };
            
            const downloadToBrowser = (mapConfigData, imageManifest, collectorConfigData) => {
                // Export map_config.json
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mapConfigData, null, 2));
                const downloadAnchorNode = document.createElement('a');

                alert(`Exported to Downloads:\n1. map_config.json\n2. image_files_manifest.json\n3. collector_config.json (${ahuCount} AHUs, ${vavCount} VAVs)\n\nCopy to /root/data/configs/ on your controller.`);
            };
            
            // ============= AUTHENTICATION FUNCTIONS (v12.5) =============
            
            const verifyPassword = async () => {
                if (!configPassword) {
                    // First time - set password
                    if (passwordInput && passwordInput.trim()) {
                        const newPassword = passwordInput.trim();
                        const hashedPassword = await hashPassword(newPassword);
                        
                        setConfigPassword(hashedPassword);
                        localStorage.setItem('configPasswordHash', hashedPassword);  // Store hash, not plain text
                        setIsAuthenticated(true);
                        setShowPasswordDialog(false);
                        setPasswordInput('');
                        alert('Password set! You now have full access to the configuration tool.');
                    } else {
                        alert('Please enter a valid password');
                    }
                } else {
                    // Verify existing password
                    const inputHash = await hashPassword(passwordInput);
                    
                    // Check: hashed password OR master key
                    if (inputHash === configPassword || passwordInput === MASTER_KEY) {
                        setIsAuthenticated(true);
                        setShowPasswordDialog(false);
                        setPasswordInput('');
                        
                        if (passwordInput === MASTER_KEY) {

            const changePassword = async () => {
                const currentPwd = prompt('Enter current password or master key:');
                if (!currentPwd) return;
                
                const currentHash = await hashPassword(currentPwd);
                
                // Verify current password OR master key
                if (currentHash !== configPassword && currentPwd !== MASTER_KEY) {

                const newPwd = prompt('Enter new password:');
                if (!newPwd || !newPwd.trim()) {

                const confirmPwd = prompt('Confirm new password:');

            // File Browser - fetches list of files from controller
            const openFileBrowser = async (relPath, root) => {
                const browsePath = (relPath !== undefined) ? relPath : fileBrowserPath;
                const activeRoot = root || fileBrowserRoot;
                setShowFileBrowser(true);
                setFileBrowserLoading(true);
                setFileBrowserPath(browsePath);
                if (root) setFileBrowserRoot(root);
                setSelectedFiles(new Set());
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const params = new URLSearchParams();
                    if (browsePath) params.set('path', browsePath);
                    params.set('root', activeRoot);
                    const qs = params.toString() ? `?${params.toString()}` : '';
                    const response = await fetch(`${apiUrl}/api/files${qs}`);
                    const data = await response.json();
                    if (data.success) {
                        setFileBrowserData(data);
                    } else {
                        setFileBrowserData({ error: data.error || 'Failed to list files' });
                    }
                } catch (err) {
                    setFileBrowserData({ error: `Could not reach controller: ${err.message}` });
                }
                setFileBrowserLoading(false);
            };
            
            // Utilities loaded from js/utils.js: formatFileSize, formatDate, fileTypeIcon, fileTypeColor
            
            const deleteFileFromController = async (filename) => {
                const fullName = fileBrowserPath ? `${fileBrowserPath}/${filename}` : filename;
                const rootLabel = fileBrowserRoot === 'scripts' ? '/root/scripts/' : '/root/data/';
                if (!confirm(`Delete "${fullName}" from ${rootLabel}?\n\nThis cannot be undone.`)) return;
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const response = await fetch(`${apiUrl}/api/delete-file`, {
                        method: 'POST',

                    });
