                                        title={t('export_map_config')}
                                        data-testid="sb-export-map-btn"
                                        className="py-3.5 bg-slate-800 hover:bg-slate-700 border border-emerald-700 text-emerald-300 hover:text-emerald-200 rounded-xl font-black text-[9px] uppercase tracking-wider transition-all active:scale-95">
                                    {t('export_map_config_short')}
                                    <span className="block text-[7px] font-bold normal-case tracking-normal opacity-70 mt-0.5">
                                        all floors
                                    </span>
                                </button>
                                <button onClick={exportCollectorConfig}
                                        title="Download full master collector_config.json (this floor AHUs updated)"
                                        data-testid="sb-export-collector-btn"
                                        className="py-3.5 bg-slate-800 hover:bg-slate-700 border border-cyan-700 text-cyan-300 hover:text-cyan-200 rounded-xl font-black text-[9px] uppercase tracking-wider transition-all active:scale-95">
                                    Export Master
                                    <span className="block text-[7px] font-bold normal-case tracking-normal opacity-70 mt-0.5">
                                        SP57 · downloads .json
                                    </span>
                                </button>
                                <button onClick={exportMapConfig}
                                        title={deploymentPath ? t('save_to_controller') : t('download_to_browser')}
                                        data-testid="sb-save-map-btn"
                                        className="py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-black text-[9px] uppercase tracking-wider shadow-lg active:scale-95 transition-all shadow-blue-500/20">
                                    {deploymentPath ? t('save_to_controller_short') : t('download_to_browser')}
                                </button>
                            </div>
                            )}
                        </div>
                    </div>
            );
            // ===== END const sidebarTree =====

            return (
                <div className={`flex w-full h-full ${colors.bg}`}>
                    {/* SIDEBAR — docked vs popped-out.  The same JSX tree
                        renders into either spot via React's createPortal,
                        so all click handlers + state flow continue to work
                        identically without any plumbing.  When popped out,
                        the in-page sidebar disappears and the canvas
                        below reflows to fill the freed width. */}
                    {!popupWin && sidebarTree}
                    {popupWin && popupHost && ReactDOM.createPortal(sidebarTree, popupHost)}

                    {/* MAIN INFINITE CANVAS */}
                    {configMode !== 'points' && configMode !== 'sizing' && (
                    <div 
                        id="canvas-bg"
                        className={`flex-1 relative overflow-hidden shadow-inner border-l ${colors.border} canvas-container ${panMode ? 'pan-mode-active' : ''} ${isPanning ? 'panning' : ''} ${activeTarget.type === 'floor_plan' ? 'floor-hairline' : ''}`}
                        style={{ backgroundColor: colors.canvasBg }}
                        onWheel={handleWheel} 
                        onMouseDown={handleCanvasMouseDown} 
                        onMouseMove={(e) => {
                            if (activeTarget.type === 'floor_plan') {
                                updateFloorHair(e);
                                handleFloorMarkerDrag(e);
                            } else {
                                handleCanvasMouseMove(e);
                            }
                        }}
                        onMouseLeave={() => { hideFloorHair(); }}
                        onMouseUp={() => {setIsPanning(false); setDraggingTarget(null); setDraggingFloorMarker(null); setDraggingWindowId(null); setDraggingNsKey(null); isDraggingMode.current = null;}}
                    >
                        <div className="absolute top-4 left-4 z-50 flex gap-2">
                            <button 
                                onClick={() => setPanMode(!panMode)} 
                                className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg backdrop-blur flex items-center gap-2 transition-all ${panMode ? 'bg-emerald-500 text-white border-emerald-400 border-2' : 'bg-slate-900/90 text-slate-400 border border-slate-700 hover:text-white'}`}
                            >
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M19 9l3 3-3 3M9 19l3 3 3 3M2 12h20M12 2v20"/></svg>
                                Pan Mode: {panMode ? 'ON' : 'OFF'}
                            </button>
                            <div className="bg-slate-900/90 text-white text-[10px] font-black uppercase px-3 py-2 border border-slate-700 shadow-lg backdrop-blur flex items-center rounded-xl pointer-events-none">
                                Zoom: {Math.round(view.scale * 100)}%
                            </div>
                            {activeTarget.type === 'floor_plan' && floorPlans.length > 0 && (
                                <button
                                    type="button"
                                    data-testid="floor-ns-hud-btn"
                                    onClick={startNsMarkers}
                                    className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg backdrop-blur border-2 transition-all ${
                                        nsMode
                                            ? 'bg-cyan-500 text-slate-900 border-cyan-200'
                                            : 'bg-slate-900/90 text-cyan-300 border-cyan-500/60 hover:bg-cyan-900/40'
                                    }`}
                                    title="Place or drag N/S/W/E on the floor image so Sun Path matches the plan"
                                >
                                    {nsMode && nsMode !== 'edit'
                                        ? ('Place ' + nsMode.toUpperCase())
                                        : (nsMode === 'edit'
                                            ? 'Done N/S/W/E'
                                            : ((floorOrientations[currentFloorIdx] || {}).north && (floorOrientations[currentFloorIdx] || {}).south
                                                ? 'Edit N/S/W/E'
                                                : 'Set N/S/W/E'))}
                                </button>
                            )}
                            {activeTarget.type === 'floor_plan' && nsMode && nsMode !== 'edit' && (
                                <div className="bg-cyan-500/90 text-slate-900 text-[10px] font-black uppercase px-3 py-2 border border-cyan-200 shadow-lg backdrop-blur flex items-center rounded-xl animate-pulse">
                                    Click {nsMode.toUpperCase()} on the floor image
                                </div>
                            )}
                            {activeTarget.type === 'floor_plan' && draggedMarkerType && (
                                <div className="bg-amber-500/90 text-black text-[10px] font-black uppercase px-3 py-2 border border-amber-300 shadow-lg backdrop-blur flex items-center rounded-xl animate-pulse">
                                    Click to place {draggedMarkerType.toUpperCase()}
                                </div>
                            )}
                        </div>
                        <div className="absolute bottom-4 right-4 z-50 flex flex-col items-end gap-2">
                            {window.ElcDaySelectorLive && (
                                <window.ElcDaySelectorLive
                                    lat={buildingLatLon.lat}
                                    timezone={buildingLatLon.timezone}
                                    lon={buildingLatLon.lon}
                                    style={{ position: 'relative', right: 0, bottom: 0 }}
                                />
                            )}
                            <div className="flex gap-2">
                            <button onClick={() => setView(p => ({...p, scale: Math.min(10, p.scale + 0.5)}))} className="w-8 h-8 bg-slate-900/90 hover:bg-indigo-600 text-white rounded border border-slate-700 shadow-lg backdrop-blur flex items-center justify-center font-black transition-all">+</button>
                            <button onClick={() => setView(p => ({...p, scale: Math.max(0.2, p.scale - 0.5)}))} className="w-8 h-8 bg-slate-900/90 hover:bg-indigo-600 text-white rounded border border-slate-700 shadow-lg backdrop-blur flex items-center justify-center font-black transition-all">-</button>
                            <button onClick={() => setView({x:0, y:0, scale: 1})} className="px-3 bg-slate-900/90 hover:bg-rose-600 text-white text-[10px] uppercase font-black tracking-widest rounded border border-slate-700 shadow-lg backdrop-blur transition-all">Reset</button>
                            </div>
                        </div>
                        {activeTarget.type === 'floor_plan' && !panMode && (
                            <div className="mapper-hairline" style={{ opacity: 0 }} data-testid="mapper-hairline-cursor">
                                <div ref={floorHairVRef} className="mapper-hairline-v" />
                                <div ref={floorHairHRef} className="mapper-hairline-h" />
                            </div>
                        )}

                        {/* FLOOR PLAN MODE */}
                        {activeTarget.type === 'floor_plan' ? (
                            floorPlans.length === 0 ? (
                                <div className="w-full h-full flex flex-col items-center justify-center pointer-events-none">
                                    <div className="text-slate-600 font-black text-4xl uppercase italic opacity-40 text-center leading-tight tracking-tighter mb-4">
                                        No Floor Plan Loaded
                                    </div>
                                    <div className="text-slate-500 font-mono text-sm max-w-md text-center">
                                        Click "📁 Upload Floor Plan" in the sidebar to add a floor plan image (PNG, JPG, or SVG)
                                    </div>
                                </div>
                            ) : (
                                <div className="w-full h-full flex items-center justify-center pointer-events-none">
                                    <div 
                                        ref={floorCanvasRef}
                                        onClick={handleFloorCanvasClick}
                                        onDoubleClick={(e) => {
                                            if (roomMode) { e.stopPropagation(); commitTracedRoom(); return; }
                                            if (windowTraceMode) { e.stopPropagation(); commitTracedWindow(); return; }
                                            if (obstructionTraceMode) { e.stopPropagation(); commitTracedObstruction(); }
                                        }}
                                        style={{ 
                                            transform: `translate(${view.x}px, ${view.y}px) scale(${view.scale})`, 
                                            transition: isPanning || draggingFloorMarker || draggingWindowId || draggingNsKey ? 'none' : 'transform 0.15s ease-out',
                                            cursor: (draggingNsKey || draggingWindowId || isPanning) ? 'grabbing' : (panMode ? 'grab' : 'none')
                                        }}
                                        className="relative inline-block border-2 border-slate-700 shadow-[0_0_50px_rgba(0,0,0,0.5)] bg-slate-900 max-w-full max-h-full pointer-events-auto"
                                    >
                                        <img 
                                            src={floorPlans[currentFloorIdx]?.imageData} 
                                            className="block max-w-full max-h-[85vh] opacity-90 pointer-events-none" 
                                            draggable="false" 
                                            alt="Floor Plan"
                                        />

                                        {/* ELC Sun Path sky-dome on the floor image (replaces Sun-Dial). */}
                                        {window.ElcSunPathOverlay && (
                                            <window.ElcSunPathOverlay
                                                enabled={sunPathEnabled}
                                                lat={buildingLatLon.lat}
                                                lon={buildingLatLon.lon}
                                                elevation_m={buildingLatLon.elevation_m}
                                                timezone={buildingLatLon.timezone}
                                                sun={sunState && sunState.sun}
                                                hour={sunHour}
                                                doy={sunDoy}
                                                adj={sunPathAdj}
                                                orientation={floorOrientations[currentFloorIdx]}
                                                showCardinals={false}
                                            />
                                        )}

                                        {/* Sun-Ray overlay — soft warm gradient coming from the sun's
                                            direction.  Sits below markers (zIndex 5) so clicks still
                                            reach markers at zIndex 10+.  Only visible when overlay on. */}
                                        {sunState && sunState.enabled && sunState.sun && window.SunRayOverlay && (
                                            <window.SunRayOverlay sun={sunState.sun} cloudCover={sunState.cloudCover} ghiWm2={sunState.ghiWm2}
                                                orientation={floorOrientations[currentFloorIdx]}
                                                rooms={floorRooms.filter(r => r.floorIdx === currentFloorIdx)} />
                                        )}
                                        {sunState && sunState.enabled && sunState.sun && window.WindowsSunshaftOverlay && (
                                            <window.WindowsSunshaftOverlay
                                                windows={floorWindows.filter(w => w.floorIdx === currentFloorIdx)}
                                                rooms={floorRooms.filter(r => r.floorIdx === currentFloorIdx)}
                                                sun={sunState.sun}
                                                cloudCover={sunState.cloudCover}
                                                orientation={floorOrientations[currentFloorIdx]}
                                                showBars={false}
                                                showRooms={false}
                                            />
                                        )}
                                        {/* Committed room polygons + in-progress trace */}
                                        <svg className="absolute inset-0 pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none"
                                             style={{width:'100%', height:'100%', zIndex: 8}}
                                             data-testid="mapper-rooms-overlay">
                                            {floorRooms.filter(r => r.floorIdx === currentFloorIdx).map(r => {
                                                const verts = r.vertices || [];
                                                if (verts.length < 3) return null;
                                                const sel = selectedRoomId === r.id;
                                                return (
                                                    <polygon key={r.id}
                                                        points={verts.map(v => `${v[0]},${v[1]}`).join(' ')}
                                                        fill={sel ? 'rgba(57,255,20,0.10)' : 'none'}
                                                        stroke={sel ? '#b8ff5a' : '#39ff14'}
                                                        strokeWidth={sel ? 1.25 : 1}
                                                        vectorEffect="non-scaling-stroke"
                                                    />
                                                );
                                            })}
                                            {roomMode && (roomMode.pts || []).length > 0 && (
                                                <g data-testid="mapper-room-trace-draft">
                                                    {(roomMode.pts || []).length >= 2 && (
                                                        <polyline
                                                            points={(roomMode.pts || []).map(p => `${p.x},${p.y}`).join(' ')}
                                                            fill="none"
                                                            stroke="#39ff14"
                                                            strokeWidth="1"
                                                            vectorEffect="non-scaling-stroke"
                                                        />
                                                    )}
                                                    {(roomMode.pts || []).map((p, i) => (
                                                        <circle key={i} cx={p.x} cy={p.y} r={i === 0 ? 0.28 : 0.18}
                                                                fill={i === 0 ? '#b8ff5a' : '#39ff14'}
                                                                stroke="#14532d" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                                                    ))}
                                                </g>
                                            )}
                                            {obstructionTraceMode && (obstructionTraceMode.pts || []).length > 0 && (
                                                <g data-testid="mapper-obs-trace-draft">
                                                    {(obstructionTraceMode.pts || []).length >= 2 && (
                                                        <polyline
                                                            points={(obstructionTraceMode.pts || []).map(p => `${p.x},${p.y}`).join(' ')}
                                                            fill="none" stroke="#94a3b8" strokeWidth="1"
                                                            vectorEffect="non-scaling-stroke" />
                                                    )}
                                                    {(obstructionTraceMode.pts || []).map((p, i) => (
                                                        <circle key={'ot'+i} cx={p.x} cy={p.y} r={i === 0 ? 0.28 : 0.18}
                                                                fill={i === 0 ? '#cbd5e1' : '#94a3b8'} />
                                                    ))}
                                                </g>
                                            )}
                                            {floorObstructions.filter(o => o.floorIdx === currentFloorIdx).map(o => {
                                                const verts = o.vertices || [];
                                                if (verts.length < 3) return null;
                                                return (
                                                    <polygon key={o.id}
                                                        points={verts.map(v => `${v[0]},${v[1]}`).join(' ')}
                                                        fill="rgba(148,163,184,0.18)"
                                                        stroke="#94a3b8"
                                                        strokeWidth="1"
                                                        vectorEffect="non-scaling-stroke"
                                                    />
                                                );
                                            })}
                                            {windowTraceMode && (windowTraceMode.pts || []).length > 0 && (
                                                <g data-testid="mapper-window-trace-draft">
                                                    {(windowTraceMode.pts || []).length >= 2 && (
                                                        <polyline
                                                            points={(windowTraceMode.pts || []).map(p => `${p.x},${p.y}`).join(' ')}
                                                            fill="none" stroke="#38bdf8" strokeWidth="1"
                                                            vectorEffect="non-scaling-stroke" />
                                                    )}
                                                    {(windowTraceMode.pts || []).map((p, i) => (
                                                        <circle key={'wt'+i} cx={p.x} cy={p.y} r={i === 0 ? 0.28 : 0.18}
                                                                fill={i === 0 ? '#7dd3fc' : '#38bdf8'} />
                                                    ))}
                                                </g>
                                            )}
                                            {floorWindows.filter(w => w.floorIdx === currentFloorIdx && isTracedWindow(w)).map(w => (
                                                window.TracedWindowBlindOverlay ? (
                                                    <window.TracedWindowBlindOverlay
                                                        key={'wv-'+w.id}
                                                        w={w}
                                                        selected={selectedWindowId === w.id}
                                                        testId={'floor-window-'+w.id}
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            setSelectedWindowId(w.id);
                                                        }}
                                                    />
                                                ) : (
                                                <polygon key={'wv-'+w.id}
                                                    points={w.vertices.map(v => `${v[0]},${v[1]}`).join(' ')}
                                                    fill={selectedWindowId === w.id ? 'rgba(125,211,252,0.28)' : 'rgba(125,211,252,0.12)'}
                                                    stroke={selectedWindowId === w.id ? '#fbbf24' : '#7dd3fc'}
                                                    strokeWidth={selectedWindowId === w.id ? 1.25 : 1}
                                                    vectorEffect="non-scaling-stroke"
                                                    style={{ pointerEvents: 'auto', cursor: 'pointer' }}
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        setSelectedWindowId(w.id);
                                                    }}
                                                />
                                                )
                                            ))}
                                        </svg>
                                        {(() => {
                                            const o = floorOrientations[currentFloorIdx] || {};
                                            const nsLine = o.north && o.south;
                                            const weLine = o.west && o.east;
                                            const showNsAxes = !!(draggingNsKey || nsMode);
                                            const canDragNs = !roomMode && !windowTraceMode && !obstructionTraceMode && (!nsMode || nsMode === 'edit');
                                            return (
                                                <>
                                                    {(showNsAxes && (nsLine || weLine)) && (
                                                        <svg className="absolute inset-0 pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none"
                                                             style={{width:'100%', height:'100%', zIndex: 19}}
                                                             data-testid="floor-ns-axes">
                                                            {nsLine && (
                                                                <line x1={o.south.x} y1={o.south.y} x2={o.north.x} y2={o.north.y}
                                                                      stroke="#22d3ee" strokeWidth="0.45" strokeDasharray="1.6 1.1" />
                                                            )}
                                                            {weLine && (
                                                                <line x1={o.west.x} y1={o.west.y} x2={o.east.x} y2={o.east.y}
                                                                      stroke="#fbbf24" strokeWidth="0.45" strokeDasharray="1.6 1.1" />
                                                            )}
                                                        </svg>
                                                    )}
                                                    {['north','south','west','east'].map(k => {
                                                        const p = o[k];
                                                        if (!p) return null;
                                                        const letter = k === 'north' ? 'N' : k === 'south' ? 'S' : k === 'west' ? 'W' : 'E';
                                                        const ns = (k === 'north' || k === 'south');
                                                        const grabbing = draggingNsKey === k;
                                                        return (
                                                            <div key={'ns-'+k}
                                                                 data-testid={'floor-ns-marker-'+k}
                                                                 title={canDragNs ? ('Drag ' + letter + ' to align Sun Path') : ('Place remaining N/S/W/E first')}
                                                                 onMouseDown={(e) => handleNsMarkerDragStart(e, k)}
                                                                 onClick={(e) => e.stopPropagation()}
                                                                 className="absolute z-[50]"
                                                                 style={{
                                                                     left: `${p.x}%`,
                                                                     top: `${p.y}%`,
                                                                     transform: 'translate(-50%,-50%)',
                                                                     cursor: canDragNs ? (grabbing ? 'grabbing' : 'grab') : 'default',
                                                                     pointerEvents: 'auto',
                                                                     touchAction: 'none',
                                                                 }}>
                                                                <div className={`w-7 h-7 rounded-full text-[11px] font-black flex items-center justify-center border-2 shadow-lg ${
                                                                    ns
                                                                        ? 'bg-cyan-400 text-slate-900 border-cyan-100'
                                                                        : 'bg-amber-400 text-slate-900 border-amber-100'
                                                                } ${grabbing ? 'scale-110' : ''}`}>
                                                                    {letter}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </>
                                            );
                                        })()}
                                        {/* Legacy wall-bar windows (2.5D). Traced 2D glass is the polygon only. */}
                                        {floorWindows.filter(w => w.floorIdx === currentFloorIdx && !isTracedWindow(w)).map(w => {
                                            const sel = selectedWindowId === w.id;
                                            if (window.WindowPlanPane) {
                                                return (
                                                    <window.WindowPlanPane
                                                        key={w.id}
                                                        w={w}
                                                        selected={sel}
                                                        testId={`floor-window-${w.id}`}
                                                        cursor="move"
                                                        onMouseDown={(e) => handleWindowDragStart(e, w.id)}
                                                        onClick={(e) => { e.stopPropagation(); setSelectedWindowId(w.id); }}
                                                    />
                                                );
                                            }
                                            const open = 1 - Math.min(1, Math.max(0, w.blind_level || 0));
                                            const len = Math.max(Number(w.length) || 8, 3);
                                            return (
                                                <div
                                                    key={w.id}
                                                    data-testid={`floor-window-${w.id}`}
                                                    title={`Window · open ${Math.round((1-(w.blind_level||0))*100)}% — drag to move`}
                                                    onMouseDown={(e) => handleWindowDragStart(e, w.id)}
                                                    onClick={(e) => { e.stopPropagation(); setSelectedWindowId(w.id); }}
                                                    style={{
                                                        position: 'absolute',
                                                        left: `${w.x}%`,
                                                        top: `${w.y}%`,
                                                        width: `${len}%`,
                                                        height: '12px',
                                                        transform: `translate(-50%, -50%) rotate(${Number(w.angle_deg)||0}deg)`,
                                                        cursor: 'move',
                                                        zIndex: sel ? 95 : 16,
                                                        pointerEvents: 'auto',
                                                    }}
                                                >
                                                    <div style={{
                                                        position: 'absolute',
                                                        left: 0, right: 0, top: '3px', bottom: '3px',
                                                        borderRadius: 2,
                                                        background: sel ? '#fbbf24' : '#7dd3fc',
                                                        opacity: 0.55 + 0.4 * open,
                                                        boxShadow: sel ? '0 0 10px rgba(251,191,36,0.7)' : '0 0 4px rgba(125,211,252,0.35)',
                                                        border: sel ? '1px solid #fde68a' : '1px solid rgba(186,230,253,0.5)',
                                                    }} />
                                                </div>
                                            );
                                        })}
                                        
                                        {/* Floor Markers */}
                                        {floorMarkers.filter(m => m.floorIdx === currentFloorIdx).map(marker => {
                                            const isSelected = selectedMarkerId === marker.id;
                                            // Compute sun-exposure halo color when overlay is enabled.
                                            // marker.x, marker.y are 0..100 (%) from the top-left.
                                            let exposureRing = null;
                                            let shadowGeom  = null;
                                            if (sunState && sunState.enabled && sunState.sun) {
                                                const floorWins = floorWindows.filter(w => w.floorIdx === currentFloorIdx);
                                                const floorRms = floorRooms.filter(r => r.floorIdx === currentFloorIdx);
                                                if (floorWins.length) {
                                                    const score = window.red5SunBlindScore
                                                        ? window.red5SunBlindScore(marker.x, marker.y, sunState.sun, floorWins, { rooms: floorRms, orientation: floorOrientations[currentFloorIdx] })
                                                        : 0;
                                                    exposureRing = window.red5ExposureColor ? window.red5ExposureColor(score) : null;
                                                }
                                                if (window.red5MarkerShadow) {
                                                    shadowGeom = window.red5MarkerShadow(sunState.sun);
                                                }
                                            }
                                            return (
                                                <div
                                                    key={marker.id}
                                                    onMouseDown={(e) => handleFloorMarkerDragStart(e, marker.id)}
                                                    onClick={(e) => {e.stopPropagation(); setSelectedMarkerId(isSelected ? null : marker.id);}}
                                                    style={{
                                                        position: 'absolute',
                                                        left: `${marker.x}%`,
                                                        top: `${marker.y}%`,
                                                        transform: 'translate(-50%, -50%)',
                                                        cursor: 'move',
                                                        zIndex: isSelected ? 100 : 10
                                                    }}
                                                    className="pointer-events-auto"
                                                >
                                                    {marker.type === 'ahu' ? (
                                                        <div className={`relative ${isSelected ? 'scale-125' : 'scale-100'} transition-transform`}
                                                             style={exposureRing ? {filter: `drop-shadow(0 0 10px ${exposureRing}) drop-shadow(0 0 4px ${exposureRing})`} : {}}>
                                                            {/* Directional shadow pointing away from sun */}
                                                            {shadowGeom && (
                                                                <div style={{
                                                                    position:'absolute', left:'50%', top:'50%',
                                                                    width: shadowGeom.length_px, height: 6,
                                                                    transform: 'translate(0, -50%) rotate(' + (shadowGeom.angle_deg - 90) + 'deg)',
                                                                    transformOrigin: '0 50%',
                                                                    background: 'linear-gradient(90deg, rgba(15,23,42,' + shadowGeom.opacity + '), rgba(15,23,42,0))',
                                                                    borderRadius: 999,
                                                                    pointerEvents: 'none',
                                                                    zIndex: -1
                                                                }}/>
                                                            )}
                                                            <div className={`w-8 h-8 rounded-sm ${marker.active ? 'bg-green-500' : 'bg-gray-500'} border-2 ${isSelected ? 'border-amber-400 shadow-[0_0_20px_rgba(251,191,36,0.8)]' : 'border-white'} shadow-xl flex items-center justify-center`}
                                                                 style={exposureRing ? {borderColor: exposureRing, boxShadow: `0 0 14px ${exposureRing}`} : {}}>
                                                                <svg className="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
                                                                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm0-10c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"/>

                                                            </div>

                                                                <div className="absolute -bottom-5 left-1/2 -translate-x-1/2 whitespace-nowrap bg-slate-900/90 text-white px-2 py-0.5 rounded text-[8px] font-bold">
                                                                    {marker.name}
                                                                </div>
                                                            )}
                                                        </div>
                                                    ) : (
                                                        <div className={`relative ${isSelected ? 'scale-125' : 'scale-100'} transition-transform`}
                                                             style={exposureRing ? {filter: `drop-shadow(0 0 8px ${exposureRing}) drop-shadow(0 0 3px ${exposureRing})`} : {}}>
                                                            {/* Directional shadow pointing away from sun */}
                                                            {shadowGeom && (
                                                                <div style={{
                                                                    position:'absolute', left:'50%', top:'50%',
                                                                    width: shadowGeom.length_px, height: 5,
                                                                    transform: 'translate(0, -50%) rotate(' + (shadowGeom.angle_deg - 90) + 'deg)',
                                                                    transformOrigin: '0 50%',
                                                                    background: 'linear-gradient(90deg, rgba(15,23,42,' + shadowGeom.opacity + '), rgba(15,23,42,0))',
                                                                    borderRadius: 999,
                                                                    pointerEvents: 'none',
                                                                    zIndex: -1
                                                                }}/>
                                                            )}
                                                            <div className={`w-6 h-6 rounded-full ${marker.active ? 'bg-blue-500' : 'bg-gray-500'} border-2 ${isSelected ? 'border-amber-400 shadow-[0_0_20px_rgba(251,191,36,0.8)]' : 'border-white'} shadow-xl`}
                                                                 style={exposureRing ? {borderColor: exposureRing, boxShadow: `0 0 12px ${exposureRing}`} : {}}></div>
                                                            {marker.name && (
                                                                <div className="absolute -bottom-5 left-1/2 -translate-x-1/2 whitespace-nowrap bg-slate-900/90 text-white px-2 py-0.5 rounded text-[8px] font-bold">
                                                                    {marker.name}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )
                        ) : (
                            /* EQUIPMENT SCHEMA MODE */
                            !bgImage ? (
                                <div className="w-full h-full flex flex-col items-center justify-center pointer-events-none">
                                    <div className="text-slate-800 font-black text-4xl uppercase italic opacity-20 text-center leading-tight tracking-tighter">
                                        Image Not Found<br/>
                                        <span className="text-xl font-mono">{currentType.visual_assets?.base_graphic || 'No Graphic Defined'}</span>
                                    </div>
                                </div>
                            ) : (
                                <div className="w-full h-full flex items-center justify-center pointer-events-none">
                                    <div 
                                        id="transform-wrapper"
                                        style={{ transform: `translate(${view.x}px, ${view.y}px) scale(${view.scale})`, transition: isPanning ? 'none' : 'transform 0.15s ease-out' }}
                                        className="relative inline-block border border-slate-700 shadow-[0_0_50px_rgba(0,0,0,0.5)] bg-slate-200 max-w-full max-h-full pointer-events-auto"

                                        {showGrid && <div className="absolute inset-0 blueprint-grid pointer-events-none opacity-50 mix-blend-multiply"></div>}
                                        <div className="absolute inset-0 z-0" onClick={handleImageClick}></div>

                                    <div className="absolute inset-0 pointer-events-none" style={{ perspective: '1500px' }}>
                                        
                                        {animations.map((a, i) => {
                                            if (a.x == null || a.y == null) return null;
                                            
                                            const isActive = isTargetActive('animation', i);
                                            const isTesting = localTest[i]; 
                                            
                                            const isSplitDP = a.animation_type === 'diff_pressure_switch';
                                            const isNeonPipe = a.animation_type === 'neon_pipe_coil';
                                            const isAirflow = a.animation_type === 'air_flow_path';
                                            const isVFD = a.animation_type === 'vfd_aligner';
                                            const isHeatingMode = a.element_id && a.element_id.toLowerCase().includes('heat');
                                            const hasPill = ['centrifugal_fan'].includes(a.animation_type);  //- DONE BY JK
                                            
                                            const pX = a.pill_x !== null ? a.pill_x : a.x;
                                            const pY = a.pill_y !== null ? a.pill_y : a.y + 10;
                                            const pScale = a.pill_scale ?? 1.0;

                                            const sX = a.sensor_x ?? a.x;
                                            const sY = a.sensor_y ?? a.y - 20;
                                            const sScale = a.sensor_scale ?? 0.8;
                                            
                                            const wPx = a.base_w || 150;
                                            const hPx = a.base_h || 150;

                                            // Override Simulation Values if Local Test is Active
                                            const simSpeedVal = isTesting ? 60 : simSpeed;
                                            const simValveVal = isTesting ? 100 : simValve;
                                            const simDamperVal = isTesting ? 100 : simDamper;
                                            const simFilterVal = isTesting ? 90 : simFilter;
                                            const simHeatVal = isTesting ? 100 : simHeat;

                                            if (isVFD) {
                                                const chassisW = a.base_w || 220;
                                                const chassisH = a.base_h || 300;
                                                const screenW = a.screen_w || 140;
                                                const screenH = a.screen_h || 85;
                                                const pillW = a.pill_w || 100;
                                                const pillH = a.pill_h || 32;

                                                const isAlarmActive = simFault && !isTesting;
                                                const displayActivated = isAlarmActive ? false : (vfdActive[i] ?? true);
                                                const isRunning = (simSpeedVal > 0) && displayActivated && !isAlarmActive;
                                                
                                                const simHz = (simSpeedVal / 100) * 60.0;
                                                const displayHz = simHz;
                                                const displayAmps = (displayHz / 60) * 8.5;

                                                return (
                                                    <div key={`vfd_${i}`} 
                                                         className={`absolute ${isActive?'z-50':'z-20'} pointer-events-none`}
                                                         style={{ left: `${a.x}%`, top: `${a.y}%`, transform: `scale(${a.scale ?? 1.0})` }}>
                                                         
                                                         <div className="relative w-0 h-0">
                                                            {/* CHASSIS */}
                                                            <div className="absolute pointer-events-auto"
                                                                 style={{ left: 0, top: 0, width: chassisW, height: chassisH, transform: 'translate(-50%, -50%)' }}
                                                                 onMouseDown={(e) => handleElementMouseDown(e, 'animation', i, 'move', 'main')}>
                                                                 <PreviewVFDChassis imageData={a.image_data} isRunning={isRunning} isAlarm={isAlarmActive} />
                                                                 {isActive && !panMode && (
                                                                     <div className="absolute -top-4 -right-4 flex gap-1 pointer-events-auto z-50">
                                                                         <button onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); setActiveTarget({type:'none', idx:0}); }} className="w-7 h-7 bg-slate-700 hover:bg-slate-600 text-white rounded-full flex items-center justify-center shadow-lg border-2 border-white cursor-pointer transition-transform hover:scale-110" title="Minimize VFD">
                                                                             <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                                                         </button>
                                                                         <button onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); unmapItem('animation', i); }} className="w-7 h-7 bg-rose-600 hover:bg-rose-500 text-white rounded-full flex items-center justify-center shadow-lg border-2 border-white cursor-pointer transition-transform hover:scale-110" title="Unmap VFD">
                                                                             <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                                                         </button>
                                                                     </div>
                                                                 )}
                                                            </div>

                                                            {/* SCREEN */}
                                                            <div className="absolute pointer-events-auto"
                                                                 style={{ left: a.screen_dx || 0, top: a.screen_dy || 0, width: screenW, height: screenH, transform: `translate(-50%, -50%) scale(${a.screen_scale ?? 1.0})` }}
                                                                 onMouseDown={(e) => handleElementMouseDown(e, 'animation', i, 'move', 'vfd_screen')}>
                                                                 <PreviewVFDDisplay targetHz={displayHz} actualHz={isRunning ? displayHz : 0.0} amps={isRunning ? displayAmps : 0.0} isRunning={isRunning} hasFault={isAlarmActive} />
                                                                 {isActive && !panMode && <div className="absolute inset-[-2px] border border-dashed rounded pointer-events-none border-sky-400 shadow-[0_0_15px_rgba(56,189,248,0.5)]"></div>}
                                                            </div>

                                                            {/* PILL */}
                                                            <div className="absolute pointer-events-auto"
                                                                 style={{ left: a.pill_dx || 0, top: a.pill_dy || 0, width: pillW, height: pillH, transform: `translate(-50%, -50%) scale(${a.pill_scale ?? 1.0})` }}
                                                                 onMouseDown={(e) => handleElementMouseDown(e, 'animation', i, 'move', 'vfd_pill')}>
                                                                 <PreviewVFDPill isActivated={displayActivated} isRunning={isRunning} hasFault={isAlarmActive} onToggleActivate={(val) => setVfdActive(p => ({...p, [i]: val}))} />
                                                                 {isActive && !panMode && <div className="absolute inset-[-2px] border border-dashed rounded pointer-events-none border-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.5)]"></div>}
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            }
                                            
                                            const transformStyle = `scale(${a.scale}) scaleX(${a.stretchX}) scaleY(${a.stretchY}) skewX(${a.skewX}deg) skewY(${a.skewY}deg) rotateX(${a.rotX}deg) rotateY(${a.rotY}deg) rotateZ(${a.rotZ}deg)`;
                                            
                                            return (
                                                <React.Fragment key={`anim_frag_${i}`}>
                                                    
                                                    {/* PRIMARY ALIGNER BODY */}
                                                    {!isAirflow && (
                                                        <div 
                                                            className={`absolute pointer-events-none ${isActive ? 'z-50' : 'z-20'}`}
                                                            style={{ 
                                                                left: `${a.x}%`, top: `${a.y}%`, 
                                                                width: `${wPx}px`, height: `${hPx}px`,
                                                                marginLeft: `-${wPx/2}px`, marginTop: `-${hPx/2}px`,
                                                                transform: transformStyle,
                                                                transformStyle: 'preserve-3d'
                                                            }}
                                                        >
                                                            <div 
                                                                className="absolute inset-0 flex items-center justify-center pointer-events-auto"
                                                                onMouseDown={(e) => handleElementMouseDown(e, 'animation', i, 'move', 'main')}
                                                                style={{ cursor: panMode ? 'grab' : (isDraggingMode.current && draggingTarget?.subtype === 'main' ? 'grabbing' : 'grab'), transformStyle: 'preserve-3d' }}
                                                            >
                                                                {/* PRO MODE: Broadened the include check so _aligner suffixes trigger the correct component */}
                                                                {['centrifugal_fan'].includes(a.animation_type) && <PreviewCentrifugalFan outlinePath={a.outline_path} isAuto={simAuto} isManualRunning={simSpeedVal > 0} fanSpeed={simSpeedVal} hasFault={simFault && !isTesting} isActive={isActive} />}
                                                                {['rectangular_fan', 'rectangular_fan_aligner'].includes(a.animation_type) && <PreviewRectangularFan isAuto={simAuto} isManualRunning={simSpeedVal > 0} fanSpeed={simSpeedVal} hasFault={simFault && !isTesting} />}
                                                                {['hydration_valve', 'hydration_valve_aligner'].includes(a.animation_type) && <PreviewHydrationValve hydrateLevel={simValveVal} isHeating={isHeatingMode} width={wPx} height={hPx} rotX={a.rotX || 0} rotY={a.rotY || 0} rotZ={a.rotZ || 0} />}
                                                                {['antifreeze_coil_valve', 'antifreeze_coil'].includes(a.animation_type) && <PreviewAntiFreezeCoil activation={simValveVal} width={wPx} height={hPx} scale={1} stretchX={1} stretchY={1} rotX={a.rotX || 0} rotY={a.rotY || 0} rotZ={a.rotZ || 0} skewX={a.skewX || 0} skewY={a.skewY || 0} numCoils={a.numCoils || 4} isActive={isActive} />}
                                                                {['damper'].includes(a.animation_type) && <PreviewDamper damperPos={simDamperVal} width={wPx} height={hPx} />}
                                                                {['circular_damper'].includes(a.animation_type) && <PreviewCircularDamper damperPos={simDamperVal} width={wPx} height={hPx} isActive={isActive} />}
                                                                {['neon_pipe_coil'].includes(a.animation_type) && <PreviewNeonPipeCoil value={isHeatingMode ? simHeatVal : simValveVal} isHeating={isHeatingMode} length={a.pipeLength} thickness={a.pipeThickness} separation={a.separation} />}
                                                                {['diff_pressure_switch', 'differential_pressure_switch_aligner'].includes(a.animation_type) && <PreviewPressureSwitchFilter filterLoad={simFilterVal} separation={a.separation} thickness={a.pipeThickness} />}
                                                                {a.animation_type === 'dp_sensor_aligner' && <PreviewDPSensor ch1={23.7} ch2={47.3} ch3={0.0} activeChannel={a.dp_active_channel || 0} />}
                                                                {a.animation_type === 'dp_display_aligner' && <PreviewDPDisplay temp={9.2} rh={20.7} dp={0} vavFlow={450} cavFlow={1200} activeRow={a.dp_active_row || 0} />}
                                                                
                                                                {!ALIGNER_TYPES.includes(a.animation_type) && (
                                                                    <div className="w-full h-full border-2 border-dashed border-fuchsia-500 bg-fuchsia-600/30 rounded flex items-center justify-center backdrop-blur-sm">
                                                                        <span className="text-[10px] font-mono font-black text-fuchsia-200 uppercase tracking-widest">{a.animation_type}</span>
                                                                    </div>
                                                                )}

                                                                {/* ON-CANVAS DRAG TOOLS FOR GLOBAL BODY */}
                                                                {isActive && !panMode && (
                                                                    <>
                                                                        <div className="absolute inset-[-4px] border border-dashed rounded pointer-events-none border-indigo-500/50"></div>
                                                                        <div className="absolute top-[-30px] left-1/2 -translate-x-1/2 w-[1px] h-[30px] bg-amber-400/50 pointer-events-none"></div>
                                                                        <div onMouseDown={(e) => handleElementMouseDown(e, 'animation', i, 'rotate', 'main')} className="absolute top-[-34px] left-1/2 -translate-x-1/2 w-4 h-4 bg-amber-400 rounded-full border-2 border-white cursor-grab active:cursor-grabbing shadow-md z-50 pointer-events-auto"></div>
                                                                        <div onMouseDown={(e) => handleElementMouseDown(e, 'animation', i, 'scale', 'main')} className={`absolute bottom-[-6px] right-[-6px] w-4 h-4 rounded-sm border-2 border-white bg-fuchsia-500 cursor-nwse-resize shadow-md z-50 pointer-events-auto`}></div>

                                                                        <div className="absolute -top-4 -right-4 flex gap-1 pointer-events-auto z-50">
                                                                            <button onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); setActiveTarget({type: 'none', idx: 0}); }} className="w-7 h-7 bg-slate-700 hover:bg-slate-600 text-white rounded-full flex items-center justify-center shadow-lg border-2 border-white cursor-pointer transition-transform hover:scale-110" title="Minimize Aligner">
                                                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                                                            </button>
                                                                            <button onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); unmapItem('animation', i); }} className="w-7 h-7 bg-rose-600 hover:bg-rose-500 text-white rounded-full flex items-center justify-center shadow-lg border-2 border-white cursor-pointer transition-transform hover:scale-110" title="Unmap Aligner from Canvas">
                                                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                                                            </button>
                                                                        </div>
                                                                    </>
                                                                )}
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* SECONDARY ALIGNER BODY (Digital Gauge for DP Switch) */}
                                                    {isSplitDP && (
                                                        <div 
                                                            className={`absolute pointer-events-auto ${isActive ? 'z-50' : 'z-20'}`}
                                                            style={{ 
                                                                left: `${sX}%`, top: `${sY}%`, 
                                                                width: '150px', height: '100px',
                                                                marginLeft: '-75px', marginTop: '-50px',
                                                                transform: `scale(${sScale}) scaleX(${a.sensor_stretchX}) scaleY(${a.sensor_stretchY}) skewX(${a.sensor_skewX}deg) skewY(${a.sensor_skewY}deg) rotateX(${a.sensor_rotX}deg) rotateY(${a.sensor_rotY}deg) rotateZ(${a.sensor_rotZ}deg)`,
                                                                transformStyle: 'preserve-3d'
                                                            }}
                                                        >
                                                            <div 
                                                                className="absolute inset-0 pointer-events-auto flex items-center justify-center"
                                                                onMouseDown={(e) => handleElementMouseDown(e, 'animation', i, 'move', 'sensor')}
                                                                style={{ cursor: panMode ? 'grab' : (isDraggingMode.current && draggingTarget?.subtype === 'sensor' ? 'grabbing' : 'grab'), transformStyle: 'preserve-3d' }}
                                                            >
                                                                <PreviewPressureSwitchDisplay filterLoad={simFilterVal} />
                                                                
                                                                {isActive && !panMode && (
                                                                    <>
                                                                        <div className="absolute inset-[-4px] border border-dashed border-rose-500/50 rounded pointer-events-none"></div>
                                                                        <div className="absolute top-[-20px] left-1/2 -translate-x-1/2 w-[1px] h-[20px] bg-amber-400/50 pointer-events-none"></div>
                                                                        <div onMouseDown={(e) => handleElementMouseDown(e, 'animation', i, 'rotate', 'sensor')} className="absolute top-[-24px] left-1/2 -translate-x-1/2 w-4 h-4 bg-amber-400 rounded-full border-2 border-white cursor-grab active:cursor-grabbing shadow-md z-50 pointer-events-auto"></div>
                                                                        <div onMouseDown={(e) => handleElementMouseDown(e, 'animation', i, 'scale', 'sensor')} className={`absolute bottom-[-6px] right-[-6px] w-4 h-4 rounded-sm border-2 border-white bg-fuchsia-500 cursor-nwse-resize shadow-md z-50 pointer-events-auto`}></div>
                                                                    </>
                                                                )}
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* DECOUPLED PILL BODY (For Fans) */}
                                                    {hasPill && (
                                                        <div 
                                                            className={`absolute pointer-events-auto z-[100] ${isActive ? 'ring-[3px] ring-emerald-500 rounded-full shadow-[0_0_20px_rgba(16,185,129,0.5)]' : ''}`}
                                                            style={{ left: `${pX}%`, top: `${pY}%`, transform: `translate(-50%, -50%) scale(${pScale})` }}
                                                        >
                                                            <div 
                                                                onMouseDown={(e) => handleElementMouseDown(e, 'animation', i, 'move-pill')}
                                                                className="bg-slate-900/90 backdrop-blur-md px-3 py-1.5 rounded-full border border-slate-700 shadow-[0_10px_20px_rgba(0,0,0,0.8)] flex items-center gap-3 pointer-events-auto hover:border-slate-500 transition-colors"
                                                                style={{ cursor: panMode ? 'grab' : (isDraggingMode.current && draggingTarget?.subtype === 'pill' ? 'grabbing' : 'grab') }}
                                                            >
                                                                {isActive && !panMode && <div className="absolute -left-5 text-emerald-400 font-black cursor-grab">⋮⋮</div>}
                                                                
                                                                <div className="w-5 h-5 bg-slate-800 rounded-full flex items-center justify-center text-[9px] font-black text-slate-400 pointer-events-none">M</div>
                                                                <div className={`w-9 h-5 rounded-full p-0.5 shadow-inner flex items-center pointer-events-none ${simSpeedVal > 0 && !simFault ? 'bg-emerald-500' : 'bg-slate-800 border border-slate-600'}`}>
                                                                    <div className={`w-4 h-4 bg-white rounded-full shadow-md transform transition-transform ${simSpeedVal > 0 && !simFault ? 'translate-x-4' : 'translate-x-0'}`}></div>
                                                                </div>
                                                                <div className={`text-[10px] font-black w-3 text-center pointer-events-none ${simSpeedVal > 0 && !simFault ? 'text-emerald-400' : 'text-slate-500'}`}>{simSpeedVal > 0 && !simFault ? 'R' : 'S'}</div>
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* MULTI-SEGMENT AIRFLOW SIMULATOR */}
                                                    {isAirflow && a.segments && Array.isArray(a.segments) && a.segments.length > 0 && (
                                                        <React.Fragment>

                                                        {/* SNAP-GUIDE OVERLAY (image-spanning crosshair + numeric Frac badge per segment, only when segment-anim is selected) */}
                                                        {isActive && !panMode && a.segments.map((seg, segIdx) => {
                                                            // Convert canonical Frac (or scaled legacy) → image-relative %.
                                                            // CSS percentages auto-track image resizes (no JS resize listeners needed).
                                                            const dispW = imageRef.current ? imageRef.current.offsetWidth : 1;
                                                            const natW  = imageRef.current ? imageRef.current.naturalWidth : dispW;
                                                            const fx = (seg.offsetXFrac != null) ? seg.offsetXFrac : ((seg.offsetX || 0) / Math.max(natW, 1));
                                                            const fy = (seg.offsetYFrac != null) ? seg.offsetYFrac : ((seg.offsetY || 0) / Math.max(natW, 1));
                                                            // segment center on the AHU image:
                                                            //   leftPct = a.x + fx*100         (frac-of-width × 100 = %-of-width)
                                                            //   topPct  = a.y + fy*100*aspect  (convert width-frac to %-of-height via aspect)
                                                            const leftPct = a.x + fx * 100;
                                                            const topPct  = a.y + fy * 100 * imgAspect;
                                                            const segKey = `snapguide_${i}_${seg.id || segIdx}`;
                                                            return (
                                                                <React.Fragment key={segKey}>
                                                                    {/* Vertical crosshair */}
                                                                    <div className="absolute pointer-events-none" style={{
                                                                        left: `${leftPct}%`, top: 0, height: '100%', width: '0px',
                                                                        borderLeft: '1px dashed rgba(245,158,11,0.55)',
                                                                        zIndex: 45,
                                                                    }} data-testid={`snapguide-vert-${segIdx}`}/>
                                                                    {/* Horizontal crosshair */}
                                                                    <div className="absolute pointer-events-none" style={{
                                                                        top: `${topPct}%`, left: 0, width: '100%', height: '0px',
                                                                        borderTop: '1px dashed rgba(245,158,11,0.55)',
                                                                        zIndex: 45,
                                                                    }} data-testid={`snapguide-horiz-${segIdx}`}/>
                                                                    {/* Numeric Frac badge near segment center (offset diagonally to avoid covering it) */}
                                                                    <div className="absolute pointer-events-none" style={{
                                                                        left: `calc(${leftPct}% + 14px)`,
                                                                        top:  `calc(${topPct}% + 14px)`,
                                                                        background: 'rgba(2,6,23,0.88)',
                                                                        color: '#fcd34d',
                                                                        fontSize: '9px',
                                                                        fontFamily: 'ui-monospace, monospace',
                                                                        fontWeight: 900,
                                                                        padding: '2px 6px',
                                                                        borderRadius: '3px',
                                                                        border: '1px solid rgba(245,158,11,0.45)',
                                                                        letterSpacing: '0.5px',
                                                                        whiteSpace: 'nowrap',
                                                                        zIndex: 46,
                                                                    }} data-testid={`snapguide-badge-${segIdx}`}>
                                                                        {`Frac: ${fx.toFixed(3)}, ${fy.toFixed(3)} · ${Math.round(fx * dispW)},${Math.round(fy * dispW)} px`}
                                                                    </div>
                                                                </React.Fragment>
                                                            );
                                                        })}

                                                        <div className={`absolute ${isActive ? 'z-50' : 'z-40'}`} style={{ 
                                                            left: `${a.x}%`, 
                                                            top: `${a.y}%`,
                                                            pointerEvents: 'none',
                                                            visibility: 'visible',
                                                            opacity: 1,
                                                        }}>
                                                            
                                                            {isActive && !panMode && (
                                                                <div className="absolute -top-4 -right-4 flex gap-1 pointer-events-auto z-50">
                                                                    <button onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); setActiveTarget({type:'none', idx:0}); }} className="w-7 h-7 bg-slate-700 hover:bg-slate-600 text-white rounded-full flex items-center justify-center shadow-lg border-2 border-white cursor-pointer transition-transform hover:scale-110" title="Minimize Airflow">
