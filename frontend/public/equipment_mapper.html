                }
            };
            
            const uploadFileToController = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.multiple = true;
                input.onchange = async (e) => {
                    const files = Array.from(e.target.files);
                    if (files.length === 0) return;
                    
                    const apiUrl = window.API_BASE_URL || '';
                    const results = [];
                    
                    for (const file of files) {
                        try {
                            const dataURL = await new Promise((resolve, reject) => {
                                const reader = new FileReader();
                                reader.onload = (ev) => resolve(ev.target.result);
                                reader.onerror = reject;
                                reader.readAsDataURL(file);
                            });
                            
                            const uploadName = fileBrowserPath ? `${fileBrowserPath}/${file.name}` : file.name;
                            const response = await fetch(`${apiUrl}/api/upload-file`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ filename: uploadName, file_data: dataURL, root: fileBrowserRoot })
                            });
                            const data = await response.json();
                            results.push(data.success ? `${file.name} - OK` : `${file.name} - FAILED: ${data.error}`);
                        } catch (err) {
                            results.push(`${file.name} - ERROR: ${err.message}`);
                        }
                    }
                    
                    alert(`Upload results:\n\n${results.join('\n')}`);
                    openFileBrowser(fileBrowserPath);
                };
                input.click();
            };
            
            const downloadFileFromController = (filename) => {
                const apiUrl = window.API_BASE_URL || '';
                const fullName = fileBrowserPath ? `${fileBrowserPath}/${filename}` : filename;
                const link = document.createElement('a');
                link.href = `${apiUrl}/assets/${fullName}`;
                link.download = filename;
                link.click();
            };

            // Multi-file GET — packs the user's checkbox-selected files
            // into a single ZIP via /api/zip-files and triggers a normal
            // browser download.  All file roots are honored (data /
            // scripts / pgpy) by passing the active root + path to the
            // backend.  Falls back to per-file downloads if zip endpoint
            // is unavailable on an older controller.
            const batchDownloadFromController = async () => {
                const names = Array.from(selectedFiles);
                if (names.length === 0) return;
                if (names.length === 1) {
                    downloadFileFromController(names[0]);
                    return;
                }
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const r = await fetch(`${apiUrl}/api/zip-files`, {
                        method:  'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body:    JSON.stringify({ names, root: fileBrowserRoot, path: fileBrowserPath }),
                    });
                    if (!r.ok) {
                        const j = await r.json().catch(() => ({}));
                        alert('GET selected failed: ' + (j.error || r.status));
                        return;
                    }
                    const blob = await r.blob();
                    const url  = URL.createObjectURL(blob);
                    const a    = document.createElement('a');
                    a.href     = url;
                    a.download = (r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/)?.[1] || `red5_files_${Date.now()}.zip`;
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                } catch (err) {
                    alert('GET selected error: ' + err.message);
                }
            };

            // GET on directory — zips the entire subtree (preserving
            // structure) and downloads it as a single archive.  Honors
            // the active fileBrowserRoot / fileBrowserPath.
            const downloadDirFromController = async (dirname) => {
                if (!dirname) return;
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const r = await fetch(`${apiUrl}/api/zip-dir`, {
                        method:  'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body:    JSON.stringify({ dirname, root: fileBrowserRoot, path: fileBrowserPath }),
                    });
                    if (!r.ok) {
                        const j = await r.json().catch(() => ({}));
                        alert('GET dir failed: ' + (j.error || r.status));
                        return;
                    }
                    const blob = await r.blob();
                    const url  = URL.createObjectURL(blob);
                    const a    = document.createElement('a');
                    a.href     = url;
                    a.download = (r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/)?.[1] || `${dirname}.zip`;
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                } catch (err) {
                    alert('GET dir error: ' + err.message);
                }
            };

            // Directory upload (request 3) — uses webkitdirectory so the
            // browser surfaces every file under the chosen tree, preserves
            // each file's relative path on the controller, and degrades
            // to per-file chunking so partial failures leave the
            // controller recoverable.  Pre-flight checks /api/disk-status
            // and refuses if free disk < 2 \u00d7 total upload size.
            const uploadDirectoryToController = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.multiple = true;
                input.webkitdirectory = true;  // Chrome / Edge / FF / Safari 13+
                input.directory = true;        // legacy Firefox alias
                input.onchange = async (e) => {
                    const files = Array.from(e.target.files);
                    if (files.length === 0) return;
                    const totalBytes = files.reduce((s, f) => s + f.size, 0);
                    const apiUrl = window.API_BASE_URL || '';

                    // Pre-flight: check the controller has space.  Refuse
                    // if free disk < 2x upload size; user picks a smaller
                    // upload or runs the disk-status cleanup first.
                    try {
                        const ds = await fetch(`${apiUrl}/api/disk-status`).then(r => r.json());
                        if (ds && typeof ds.free_bytes === 'number' && ds.free_bytes < totalBytes * 2) {
                            const ok = confirm(
                                'Disk headroom low.\n\n' +
                                'Total upload: ' + (totalBytes/1048576).toFixed(2) + ' MB (' + files.length + ' files)\n' +
                                'Controller free: ' + (ds.free_bytes/1048576).toFixed(2) + ' MB\n' +
                                'Recommended free \u2265 ' + (totalBytes*2/1048576).toFixed(2) + ' MB\n\n' +
                                'Run /api/disk-status?cleanup=1 first?  Click OK to abort, Cancel to upload anyway.'
                            );
                            if (ok) return;
                        }
                    } catch (_) { /* disk-status optional */ }

                    // Chunk by file: each file is its own upload.  Partial
                    // failure leaves earlier files committed; failed files
                    // are reported in the summary so the operator can
                    // retry just those.
                    const results = [];
                    let okCount = 0, failCount = 0;
                    for (let i = 0; i < files.length; i++) {
                        const f = files[i];
                        const relPath = f.webkitRelativePath || f.name;
                        const uploadName = fileBrowserPath ? `${fileBrowserPath}/${relPath}` : relPath;
                        try {
                            const dataURL = await new Promise((resolve, reject) => {
                                const reader = new FileReader();
                                reader.onload  = (ev) => resolve(ev.target.result);
                                reader.onerror = reject;
                                reader.readAsDataURL(f);
                            });
                            const r = await fetch(`${apiUrl}/api/upload-file`, {
                                method:  'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body:    JSON.stringify({ filename: uploadName, file_data: dataURL, root: fileBrowserRoot }),
                            });
                            const j = await r.json();
                            if (j.success) { okCount++; }
                            else { failCount++; results.push(relPath + ' \u2014 ' + (j.error || 'failed')); }
                        } catch (err) {
                            failCount++;
                            results.push(relPath + ' \u2014 ' + err.message);
                        }
                    }
                    alert('Directory upload finished.\n\nOK:  ' + okCount + '\nFAIL: ' + failCount +
                          (results.length ? '\n\n' + results.join('\n') : ''));
                    openFileBrowser(fileBrowserPath);
                };
                input.click();
            };
            
            const createDirectoryOnController = async () => {
                const name = prompt('New folder name:');
                if (!name || !name.trim()) return;
                const cleanName = name.trim().replace(/[^a-zA-Z0-9_\-\.]/g, '_');
                const fullPath = fileBrowserPath ? `${fileBrowserPath}/${cleanName}` : cleanName;
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const response = await fetch(`${apiUrl}/api/create-directory`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ dirname: fullPath, root: fileBrowserRoot })
                    });
                    const data = await response.json();
                    if (data.success) {
                        openFileBrowser(fileBrowserPath);
                    } else {
                        alert(`Create folder failed: ${data.error}`);
                    }
                } catch (err) {
                    alert(`Could not reach controller: ${err.message}`);
                }
            };

            const deleteDirectoryFromController = async (dirname) => {
                const fullPath = fileBrowserPath ? `${fileBrowserPath}/${dirname}` : dirname;
                const rootLabel = fileBrowserRoot === 'scripts' ? '/root/scripts/' : '/root/data/';
                if (!confirm(`Delete folder "${fullPath}" and ALL its contents from ${rootLabel}?\n\nThis cannot be undone.`)) return;
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const response = await fetch(`${apiUrl}/api/delete-directory`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ dirname: fullPath, root: fileBrowserRoot })
                    });
                    const data = await response.json();
                    if (data.success) {
                        openFileBrowser(fileBrowserPath);
                    } else {
                        alert(`Delete folder failed: ${data.error}`);
                    }
                } catch (err) {
                    alert(`Could not reach controller: ${err.message}`);
                }
            };

            const moveFileOnController = async (filename) => {
                const srcPath = fileBrowserPath ? `${fileBrowserPath}/${filename}` : filename;
                const rootLabel = fileBrowserRoot === 'scripts' ? '/root/scripts/' : '/root/data/';
                const dest = prompt(`Move "${filename}" to which directory?\n\nEnter path relative to ${rootLabel}\n(empty = root ${rootLabel})`, '');
                if (dest === null) return;
                const destClean = dest.trim();
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const response = await fetch(`${apiUrl}/api/move-file`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ src: srcPath, dest_dir: destClean, root: fileBrowserRoot })
                    });
                    const data = await response.json();
                    if (data.success) {
                        openFileBrowser(fileBrowserPath);
                    } else {
                        alert(`Move failed: ${data.error}`);
                    }
                } catch (err) {
                    alert(`Could not reach controller: ${err.message}`);
                }
            };

            const toggleFileSelection = (filename) => {
                setSelectedFiles(prev => {
                    const next = new Set(prev);
                    if (next.has(filename)) next.delete(filename);
                    else next.add(filename);
                    return next;
                });
            };

            const toggleSelectAll = (filesList) => {
                const selectableFiles = filesList.filter(f => f.type !== 'directory').map(f => f.name);
                const allSelected = selectableFiles.length > 0 && selectableFiles.every(n => selectedFiles.has(n));
                if (allSelected) {
                    setSelectedFiles(new Set());

                    setSelectedFiles(new Set(selectableFiles));
                }
            };

            const batchDeleteFiles = async () => {
                if (selectedFiles.size === 0) return;
                const names = Array.from(selectedFiles);
                const rootLabel = fileBrowserRoot === 'scripts' ? '/root/scripts/' : '/root/data/';
                if (!confirm(`Delete ${names.length} file${names.length > 1 ? 's' : ''} from ${rootLabel}${fileBrowserPath ? fileBrowserPath + '/' : ''}?\n\n${names.join('\n')}\n\nThis cannot be undone.`)) return;
                const apiUrl = window.API_BASE_URL || '';
                const results = [];
                for (const name of names) {
                    try {
                        const fullName = fileBrowserPath ? `${fileBrowserPath}/${name}` : name;
                        const response = await fetch(`${apiUrl}/api/delete-file`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ filename: fullName, root: fileBrowserRoot })
                        });
                        const data = await response.json();
                        results.push(data.success ? `${name} - deleted` : `${name} - FAILED: ${data.error}`);
                    } catch (err) {
                        results.push(`${name} - ERROR: ${err.message}`);
                    }
                }
                alert(`Batch delete results:\n\n${results.join('\n')}`);
                openFileBrowser(fileBrowserPath);
            };

            const batchMoveFiles = async () => {
                if (selectedFiles.size === 0) return;
                const names = Array.from(selectedFiles);
                const dest = prompt(`Move ${names.length} file${names.length > 1 ? 's' : ''} to which directory?\n\nEnter path relative to /root/data/\n(empty = root /root/data/)\n\nFiles:\n${names.join('\n')}`, '');
                if (dest === null) return;
                const destClean = dest.trim();
                const apiUrl = window.API_BASE_URL || '';
                const results = [];
                for (const name of names) {
                    try {
                        const srcPath = fileBrowserPath ? `${fileBrowserPath}/${name}` : name;
                        const response = await fetch(`${apiUrl}/api/move-file`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ src: srcPath, dest_dir: destClean })
                        });
                        const data = await response.json();
                        results.push(data.success ? `${name} - moved` : `${name} - FAILED: ${data.error}`);
                    } catch (err) {
                        results.push(`${name} - ERROR: ${err.message}`);
                    }
                }
                alert(`Batch move results:\n\n${results.join('\n')}`);
                openFileBrowser(fileBrowserPath);
            };
            
            // Opens the image picker modal, fetches images from controller
            const [imagePickerPath, setImagePickerPath] = useState('');
            const openImagePicker = async (callback, startPath) => {
                imagePickerCallback.current = callback;
                setShowImagePicker(true);
                setImagePickerLoading(true);
                const browsePath = startPath || '';
                setImagePickerPath(browsePath);
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const qs = browsePath ? `?path=${encodeURIComponent(browsePath)}` : '';
                    const response = await fetch(`${apiUrl}/api/files${qs}`);
                    const data = await response.json();
                    if (data.success) {
                        // Show directories + image files
                        setImagePickerFiles(data.files.filter(f => f.type === 'image' || f.type === 'directory'));
                    } else {
                        setImagePickerFiles([]);
                    }
                } catch (err) {
                    setImagePickerFiles([]);
                }
                setImagePickerLoading(false);
            };
            
            const navigateImagePicker = async (relPath) => {
                setImagePickerLoading(true);
                setImagePickerPath(relPath);
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const qs = relPath ? `?path=${encodeURIComponent(relPath)}` : '';
                    const response = await fetch(`${apiUrl}/api/files${qs}`);
                    const data = await response.json();
                    if (data.success) {
                        setImagePickerFiles(data.files.filter(f => f.type === 'image' || f.type === 'directory'));
                    } else {
                        setImagePickerFiles([]);
                    }
                } catch (err) {
                    setImagePickerFiles([]);
                }
                setImagePickerLoading(false);
            };
            
            const selectImageFromController = (filename) => {
                const apiUrl = window.API_BASE_URL || '';
                const fullRelPath = imagePickerPath ? `${imagePickerPath}/${filename}` : filename;
                const imageURL = `${apiUrl}/assets/${fullRelPath}`;
                setShowImagePicker(false);
                if (imagePickerCallback.current) {
                    imagePickerCallback.current(fullRelPath, imageURL);
                }
            };
            
            // Load a JSON config file from controller by fetching /assets/path
            const loadConfigFromController = async (filepath, onLoaded, onFail) => {
                try {
                    const apiUrl = window.API_BASE_URL || '';
                    const response = await fetch(`${apiUrl}/assets/${filepath}`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const text = await response.text();
                    onLoaded(text, filepath);
                } catch (err) {
                    if (onFail) {
                        onFail(err);
                    } else {
                        alert(`Failed to load ${filepath} from controller:\n${err.message}`);
                    }
                }
            };
            
            // Schema load: choose source then apply
            const loadSchemaWithChoice = () => {
                const source = prompt('Load equipment_types.json from:\n\n1 = Controller (/root/data/)\n2 = Local PC (browse)\n\nEnter 1 or 2:', '1');
                if (!source) return;
                
                const applySchema = (jsonText) => {
                    try {
                        const loadedSchema = JSON.parse(jsonText);
                        const sanitizedData = sanitizeSchema(loadedSchema);
                        setSchema(sanitizedData);
                        const cats = Object.keys(sanitizedData);
                        if (cats.length > 0) {
                            setCategory(cats[0]);
                            const tIds = Object.keys(sanitizedData[cats[0]]);
                            if (tIds.length > 0) setTypeId(tIds[0]);
                            setActiveTarget({ type: 'point_group', idx: 0 });
                        }
                        alert('Equipment schema loaded successfully.');
                    } catch (err) { alert('Invalid JSON schema file: ' + err.message); }
                };
                
                if (source.trim() === '1') {
                    // Try configs/ subfolder first, then root
                    loadConfigFromController('configs/equipment_types.json', (text) => applySchema(text), () => {
                        loadConfigFromController('equipment_types.json', (text) => applySchema(text));
                    });
                } else {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.json';
                    input.onchange = (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (ev) => applySchema(ev.target.result);
                        reader.readAsText(file);
                    };
                    input.click();
                }
            };
            
            // Map config load: choose source then apply
            const loadMapConfigWithChoice = () => {
                const source = prompt('Load map_config.json from:\n\n1 = Controller (/root/data/)\n2 = Local PC (browse)\n\nEnter 1 or 2:', '1');
                if (!source) return;
                
                if (source.trim() === '1') {
                    // Try configs/ subfolder first, then root
                    loadConfigFromController('configs/map_config.json', (text) => {
                        const blob = new Blob([text], { type: 'application/json' });
                        const file = new File([blob], 'map_config.json');
                        loadMapConfig(file);
                    }, () => {
                        loadConfigFromController('map_config.json', (text) => {
                            const blob = new Blob([text], { type: 'application/json' });
                            const file = new File([blob], 'map_config.json');
                            loadMapConfig(file);
                        });
                    });
                } else {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.json';
                    input.onchange = (e) => {
                        const file = e.target.files[0];
                        if (file) loadMapConfig(file);
                    };
                    input.click();
                }
            };
            
            const loadMapConfig = (file) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.floors && Array.isArray(data.floors)) {
                            // Load floors — resolve image paths to loadable URLs
                            const apiUrl = window.API_BASE_URL || '';
                            const loadedFloors = data.floors.map(f => {
                                const rawPath = f.image_path || f.imagePath || '';
                                return {
                                    id: f.id,
                                    name: f.name,
                                    imagePath: rawPath,
                                    // If imageData is embedded, use it; otherwise load from /assets/
                                    imageData: f.imageData || (rawPath ? `${apiUrl}/assets/${rawPath}` : null),
                                    originalFileName: rawPath
                                };
                            });
                            setFloorPlans(loadedFloors);
                            
                            const allMarkers = [];
                            data.floors.forEach((floor, idx) => {
                                if (floor.markers) {
                                    floor.markers.forEach(m => {
                                        const markerData = {
                                            id: m.id,
                                            type: m.type,
                                            name: m.name,
                                            x: m.x,
                                            y: m.y,
                                            active: m.active,
                                            equipment_type_id: m.equipment_type_id || '',
                                            floorIdx: idx
                                        };
                                        
                                        if (m.telemetry) {
                                            if (m.type === 'ahu') {
                                                markerData.oa_temp = m.telemetry.oa_temp || 0;
                                                markerData.sa_temp = m.telemetry.sa_temp || 0;
                                                markerData.ra_temp = m.telemetry.ra_temp || 0;
                                                markerData.humidity = m.telemetry.humidity || 0;
                                                markerData.enthalpy = m.telemetry.enthalpy || 0;
                                            } else if (m.type === 'vav') {
                                                markerData.zone_temp = m.telemetry.zone_temp || 0;
                                                markerData.damper_position = m.telemetry.damper_position || 0;
                                            }
                                        } else {
                                            if (m.type === 'ahu') {
                                                markerData.oa_temp = m.oa_temp || 0;
                                                markerData.sa_temp = m.sa_temp || 0;
                                                markerData.ra_temp = m.ra_temp || 0;
                                                markerData.humidity = m.humidity || 0;
                                                markerData.enthalpy = m.enthalpy || 0;
                                            } else if (m.type === 'vav') {
                                                markerData.zone_temp = m.zone_temp || 0;
                                                markerData.damper_position = m.damper_position || 0;
                                            }
                                        }
                                        
                                        allMarkers.push(markerData);
                                    });
                                }
                            });
                            setFloorMarkers(allMarkers);
                            setCurrentFloorIdx(0);
                            setActiveTarget({ type: 'floor_plan', idx: 0 });
                            
                            const floorCount = data.floors.length;
                            const markerCount = allMarkers.length;
                            const ahuCount = allMarkers.filter(m => m.type === 'ahu').length;
                            const vavCount = allMarkers.filter(m => m.type === 'vav').length;
                            
                            alert(`map_config.json loaded.\n\n${floorCount} floor${floorCount !== 1 ? 's' : ''}, ${ahuCount} AHU${ahuCount !== 1 ? 's' : ''}, ${vavCount} VAV${vavCount !== 1 ? 's' : ''}.\n\nYou can continue editing from where you left off.`);
                        }
                    } catch (err) {
                        alert('Error loading map_config.json: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };

            const renderValueControl = (p) => {
                const minVal = parseFloat(p.min);

                if (isDigital) {
                    // Digital (0/1)
                    if (isRW) {
                        // RW Digital: Show on/off slider
                        return (
                            <label className="relative inline-flex items-center cursor-pointer pointer-events-auto">
                                <input type="checkbox" className="sr-only peer" />
                                <div className="w-7 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-emerald-500 shadow-inner"></div>
                            </label>
                        );
                    } else {
                        // RO Digital: Show status only (no control)
                        return <div className="px-1.5 py-0.5 rounded text-[7px] font-black bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 uppercase tracking-widest pointer-events-none">ON</div>;
                    }
                } else {
                    // Analog (continuous values)
                    if (isRW) {

                                <button className="w-4 h-4 bg-slate-700 hover:bg-slate-600 rounded text-white text-[10px] font-black flex items-center justify-center">+</button>
                                {p.unit && <span className="text-[7px] font-black text-slate-400 pointer-events-none">{p.unit}</span>}
                            </div>
                        );
                    } else {
                        // RO Analog: Show value only (no control)
                        return <div className="font-mono text-[10px] font-black uppercase tracking-widest whitespace-nowrap text-emerald-400 pointer-events-none">0.0 {p.unit && <span className="text-[8px] text-slate-400 ml-0.5">{p.unit}</span>}</div>;
                    }

            // Theme colors
            const colors = theme === 'dark' ? {

                bgSecondary: 'bg-slate-950',
                bgTertiary: 'bg-slate-800',
                text: 'text-white',
                textSecondary: 'text-slate-400',
                textTertiary: 'text-slate-500',
                border: 'border-slate-800',

                canvasBg: '#0a0a0a',
            } : {

                bgPrimary: 'bg-white',
                bgSecondary: 'bg-gray-50',
                bgTertiary: 'bg-gray-200',
                text: 'text-gray-900',
                textSecondary: 'text-gray-600',
                textTertiary: 'text-gray-500',
                border: 'border-gray-300',
                borderSecondary: 'border-gray-400',
                canvasBg: '#f5f5f5',
            };

            const currentType = schema[category]?.[typeId] || { name: "Unknown", points: [], visual_assets: { animations: [] } };
            const animations = currentType.visual_assets?.animations || [];
            const isTargetActive = (type, idx) => activeTarget.type === type && activeTarget.idx === idx;

            // Show password dialog if not authenticated
            if (!isAuthenticated) {
                return (
                    <>
                        <div className="flex w-full h-full bg-slate-950">
                            {/* Main app hidden until authenticated */}
                        </div>
                        
                        {/* PASSWORD DIALOG MODAL (v12.5 - Authentication Required) */}
                        {showPasswordDialog && (
                            <div 
                                className="fixed inset-0 z-[1000] flex items-center justify-center bg-black/95 backdrop-blur-sm"
                            >
                                <div 
                                    onClick={e => e.stopPropagation()}

                                    <div className="text-center mb-6">
                                        <div className="text-6xl mb-4">🔒</div>
                                        <h2 className="text-2xl font-black text-amber-400 mb-2 uppercase tracking-tight">
                                            {t('equipment_config_tool')}

                                        <p className="text-slate-400 text-sm">
                                            {!configPassword ? t('set_pw_prompt') : t('enter_pw_prompt')}

                                        className="w-full bg-slate-950 border-2 border-slate-700 focus:border-amber-500 rounded-lg p-3 text-white text-lg font-mono outline-none transition-all mb-4"
                                    />
                                    
                                    <button 
                                        onClick={verifyPassword}
                                        className="w-full px-6 py-3 bg-amber-600 hover:bg-amber-500 text-white rounded-lg font-black uppercase tracking-widest transition-all"
                                    >
                                        {!configPassword ? '🔐 ' + t('set_password_enter') : '🔓 ' + t('unlock')}
                                    </button>
                                    
                                    <p className="text-[10px] text-slate-500 text-center mt-4">
                                        This tool creates equipment_types.json and map_config.json

                <div

                                    title="Back to Dashboard"

                            {/* Inline AHU Sizing Pulse */}

                                        e.dataTransfer.dropEffect = 'move';
                                        if (dragOverGroupId !== targetGroupId) setDragOverGroupId(targetGroupId);
                                    },
                                    onDragLeave: (e) => {
                                        // Only clear if we're truly leaving (not a child move).

                                                                        </div>
                                                                    </div>
                                                                );
                                                            })

                                                        } catch (err) { alert('Failed: ' + err.message); }

                                                    className="py-2 bg-amber-700 hover:bg-amber-600 text-white rounded text-[9px] font-bold uppercase tracking-wider transition-all"
                                                >
                                                    CSV
                                                </button>
                                            </div>
                                        )}
                                        
                                        {jsonError && (
                                            <div className="bg-red-900/20 border border-red-500 rounded p-2 text-[8px] text-red-400">
                                                ⚠️ {jsonError}
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}
                            {/* END EQUIPMENT/MAP/POINTS MODE */}
                        </div>

                        {/* Bottom Action Buttons - 3-button row when in Equipment mode
                            (Save Clean Template + Save Working File + Save to Controller),
                            single button when in Map mode.  Replaces the old 2-button
                            row that lived under Load Schema/Asset + the original solo
                            bottom Save-to-Controller button. */}
                        <div className="px-6 pb-6 mt-auto shrink-0">
                            {configMode === 'equipment' && (
                            <div className="grid grid-cols-3 gap-1.5">
                                <button onClick={exportCleanJSON}
                                        title={deploymentPath ? t('save_clean_template') : t('export_clean_json')}
                                        data-testid="sb-save-clean-btn"
                                        className="py-2.5 bg-slate-800 hover:bg-slate-700 border border-emerald-700 text-emerald-300 hover:text-emerald-200 rounded-lg font-black text-[9px] uppercase tracking-wider transition-all">
                                    Clean Tpl
                                </button>
                                <button onClick={exportConfig}
                                        title={deploymentPath ? t('save_working_file') : t('download_current')}
                                        data-testid="sb-save-working-btn"
                                        className="py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 rounded-lg font-black text-[9px] uppercase tracking-wider transition-all">
                                    Working
                                </button>
                                <button onClick={exportConfig}
                                        title={deploymentPath ? t('save_to_controller') : t('download_to_browser')}
                                        data-testid="sb-save-controller-btn"
                                        className="py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-black text-[9px] uppercase tracking-wider transition-all shadow-lg shadow-emerald-500/20">
                                    Controller
                                </button>
                            </div>
                            )}
                            {configMode === 'map' && floorPlans.length > 0 && (
                            <button onClick={exportMapConfig} data-testid="sb-save-map-btn" className="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-black text-[11px] uppercase tracking-[0.2em] rounded-xl shadow-lg active:scale-95 transition-all shadow-blue-500/20">
                                {deploymentPath ? t('save_to_controller') : t('download_to_browser')}
                            </button>
                            )}
                        </div>
                    </div>
            );
            // ===== END const sidebarTree =====

            return (
                <div className={`flex w-full h-full ${colors.bg}`}>
                    {/* SIDEBAR — docked vs popped-out.  The same JSX tree
                        renders into either spot via React's createPortal,
                        so all click handlers + state flow continue to work
                        identically without any plumbing.  When popped out,
                        the in-page sidebar disappears and the canvas
                        below reflows to fill the freed width. */}
                    {!popupWin && sidebarTree}
                    {popupWin && popupHost && ReactDOM.createPortal(sidebarTree, popupHost)}

                    {/* MAIN INFINITE CANVAS */}
                    {configMode !== 'points' && configMode !== 'sizing' && (
                    <div 
                        id="canvas-bg"
                        className={`flex-1 relative overflow-hidden shadow-inner border-l ${colors.border} canvas-container ${panMode ? 'pan-mode-active' : ''} ${isPanning ? 'panning' : ''}`}
                        style={{ backgroundColor: colors.canvasBg }}
                        onWheel={handleWheel} 
                        onMouseDown={handleCanvasMouseDown} 
                        onMouseMove={activeTarget.type === 'floor_plan' ? handleFloorMarkerDrag : handleCanvasMouseMove}
                        onMouseUp={() => {setIsPanning(false); setDraggingTarget(null); setDraggingFloorMarker(null); isDraggingMode.current = null;}}
                    >
                        <div className="absolute top-4 left-4 z-50 flex gap-2">
                            <button 
                                onClick={() => setPanMode(!panMode)} 
                                className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg backdrop-blur flex items-center gap-2 transition-all ${panMode ? 'bg-emerald-500 text-white border-emerald-400 border-2' : 'bg-slate-900/90 text-slate-400 border border-slate-700 hover:text-white'}`}
                            >
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M19 9l3 3-3 3M9 19l3 3 3 3M2 12h20M12 2v20"/></svg>
                                Pan Mode: {panMode ? 'ON' : 'OFF'}
                            </button>
                            <div className="bg-slate-900/90 text-white text-[10px] font-black uppercase px-3 py-2 border border-slate-700 shadow-lg backdrop-blur flex items-center rounded-xl pointer-events-none">
                                Zoom: {Math.round(view.scale * 100)}%
                            </div>
                            {activeTarget.type === 'floor_plan' && draggedMarkerType && (
                                <div className="bg-amber-500/90 text-black text-[10px] font-black uppercase px-3 py-2 border border-amber-300 shadow-lg backdrop-blur flex items-center rounded-xl animate-pulse">
                                    Click to place {draggedMarkerType.toUpperCase()}
                                </div>
                            )}
                        </div>
                        <div className="absolute bottom-4 right-4 z-50 flex gap-2">
                            <button onClick={() => setView(p => ({...p, scale: Math.min(10, p.scale + 0.5)}))} className="w-8 h-8 bg-slate-900/90 hover:bg-indigo-600 text-white rounded border border-slate-700 shadow-lg backdrop-blur flex items-center justify-center font-black transition-all">+</button>
                            <button onClick={() => setView(p => ({...p, scale: Math.max(0.2, p.scale - 0.5)}))} className="w-8 h-8 bg-slate-900/90 hover:bg-indigo-600 text-white rounded border border-slate-700 shadow-lg backdrop-blur flex items-center justify-center font-black transition-all">-</button>
                            <button onClick={() => setView({x:0, y:0, scale: 1})} className="px-3 bg-slate-900/90 hover:bg-rose-600 text-white text-[10px] uppercase font-black tracking-widest rounded border border-slate-700 shadow-lg backdrop-blur transition-all">Reset</button>
                        </div>

                        {/* FLOOR PLAN MODE */}
                        {activeTarget.type === 'floor_plan' ? (
                            floorPlans.length === 0 ? (
                                <div className="w-full h-full flex flex-col items-center justify-center pointer-events-none">
                                    <div className="text-slate-600 font-black text-4xl uppercase italic opacity-40 text-center leading-tight tracking-tighter mb-4">
                                        No Floor Plan Loaded
                                    </div>
                                    <div className="text-slate-500 font-mono text-sm max-w-md text-center">
                                        Click "📁 Upload Floor Plan" in the sidebar to add a floor plan image (PNG, JPG, or SVG)
                                    </div>
                                </div>
                            ) : (
                                <div className="w-full h-full flex items-center justify-center pointer-events-none">
                                    <div 
                                        ref={floorCanvasRef}
                                        onClick={handleFloorCanvasClick}
                                        style={{ 
                                            transform: `translate(${view.x}px, ${view.y}px) scale(${view.scale})`, 
                                            transition: isPanning || draggingFloorMarker ? 'none' : 'transform 0.15s ease-out',
                                            cursor: draggedMarkerType ? 'crosshair' : 'default'
                                        }}
                                        className="relative inline-block border-2 border-slate-700 shadow-[0_0_50px_rgba(0,0,0,0.5)] bg-slate-900 max-w-full max-h-full pointer-events-auto"
                                    >
                                        <img 
                                            src={floorPlans[currentFloorIdx]?.imageData} 
                                            className="block max-w-full max-h-[85vh] opacity-90 pointer-events-none" 
                                            draggable="false" 
                                            alt="Floor Plan"
                                        />

                                        {/* Sun-Path Phase A: floating compass.  Mounted inside the
                                            floor-plan image wrapper so the compass visually belongs
                                            to the floor and its slider doesn't conflict with the
                                            sidebar scroll. */}
                                        {window.SunCompass && (
                                            <window.SunCompass
                                                lat={buildingLatLon.lat}
                                                lon={buildingLatLon.lon}
                                                onChange={(s) => setSunState(s)}
                                            />
                                        )}

                                        {/* Sun-Ray overlay — soft warm gradient coming from the sun's
                                            direction.  Sits below markers (zIndex 5) so clicks still
                                            reach markers at zIndex 10+.  Only visible when overlay on. */}
                                        {sunState && sunState.enabled && sunState.sun && window.SunRayOverlay && (
                                            <window.SunRayOverlay sun={sunState.sun} />
                                        )}
                                        
                                        {/* Floor Markers */}
                                        {floorMarkers.filter(m => m.floorIdx === currentFloorIdx).map(marker => {
                                            const isSelected = selectedMarkerId === marker.id;
                                            // Compute sun-exposure halo color when overlay is enabled.
                                            // marker.x, marker.y are 0..100 (%) from the top-left.
                                            let exposureRing = null;
                                            let shadowGeom  = null;
                                            if (sunState && sunState.enabled && sunState.sun && window.red5SunExposureScore) {
                                                const score = window.red5SunExposureScore(
                                                    marker.x / 100, marker.y / 100, sunState.sun
                                                );
                                                exposureRing = window.red5ExposureColor(score);
                                                if (window.red5MarkerShadow) {
                                                    shadowGeom = window.red5MarkerShadow(sunState.sun);
                                                }
                                            }
                                            return (
                                                <div
                                                    key={marker.id}
                                                    onMouseDown={(e) => handleFloorMarkerDragStart(e, marker.id)}
                                                    onClick={(e) => {e.stopPropagation(); setSelectedMarkerId(isSelected ? null : marker.id);}}
                                                    style={{
                                                        position: 'absolute',
                                                        left: `${marker.x}%`,
                                                        top: `${marker.y}%`,
                                                        transform: 'translate(-50%, -50%)',
                                                        cursor: 'move',
                                                        zIndex: isSelected ? 100 : 10
                                                    }}
                                                    className="pointer-events-auto"
                                                >
                                                    {marker.type === 'ahu' ? (
                                                        <div className={`relative ${isSelected ? 'scale-125' : 'scale-100'} transition-transform`}
                                                             style={exposureRing ? {filter: `drop-shadow(0 0 10px ${exposureRing}) drop-shadow(0 0 4px ${exposureRing})`} : {}}>
                                                            {/* Directional shadow pointing away from sun */}
                                                            {shadowGeom && (
                                                                <div style={{
                                                                    position:'absolute', left:'50%', top:'50%',
                                                                    width: shadowGeom.length_px, height: 6,
                                                                    transform: 'translate(0, -50%) rotate(' + (shadowGeom.angle_deg - 90) + 'deg)',
                                                                    transformOrigin: '0 50%',
                                                                    background: 'linear-gradient(90deg, rgba(15,23,42,' + shadowGeom.opacity + '), rgba(15,23,42,0))',
                                                                    borderRadius: 999,
                                                                    pointerEvents: 'none',
                                                                    zIndex: -1
                                                                }}/>
                                                            )}
                                                            <div className={`w-8 h-8 rounded-sm ${marker.active ? 'bg-green-500' : 'bg-gray-500'} border-2 ${isSelected ? 'border-amber-400 shadow-[0_0_20px_rgba(251,191,36,0.8)]' : 'border-white'} shadow-xl flex items-center justify-center`}
                                                                 style={exposureRing ? {borderColor: exposureRing, boxShadow: `0 0 14px ${exposureRing}`} : {}}>
                                                                <svg className="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
                                                                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm0-10c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"/>
                                                                </svg>
                                                            </div>
                                                            {marker.name && (
                                                                <div className="absolute -bottom-5 left-1/2 -translate-x-1/2 whitespace-nowrap bg-slate-900/90 text-white px-2 py-0.5 rounded text-[8px] font-bold">
                                                                    {marker.name}
                                                                </div>
                                                            )}
                                                        </div>
                                                    ) : (
                                                        <div className={`relative ${isSelected ? 'scale-125' : 'scale-100'} transition-transform`}
                                                             style={exposureRing ? {filter: `drop-shadow(0 0 8px ${exposureRing}) drop-shadow(0 0 3px ${exposureRing})`} : {}}>
                                                            {/* Directional shadow pointing away from sun */}
                                                            {shadowGeom && (
                                                                <div style={{
                                                                    position:'absolute', left:'50%', top:'50%',
                                                                    width: shadowGeom.length_px, height: 5,
                                                                    transform: 'translate(0, -50%) rotate(' + (shadowGeom.angle_deg - 90) + 'deg)',
                                                                    transformOrigin: '0 50%',
                                                                    background: 'linear-gradient(90deg, rgba(15,23,42,' + shadowGeom.opacity + '), rgba(15,23,42,0))',
                                                                    borderRadius: 999,
                                                                    pointerEvents: 'none',
                                                                    zIndex: -1
                                                                }}/>
                                                            )}
                                                            <div className={`w-6 h-6 rounded-full ${marker.active ? 'bg-blue-500' : 'bg-gray-500'} border-2 ${isSelected ? 'border-amber-400 shadow-[0_0_20px_rgba(251,191,36,0.8)]' : 'border-white'} shadow-xl`}
                                                                 style={exposureRing ? {borderColor: exposureRing, boxShadow: `0 0 12px ${exposureRing}`} : {}}></div>
                                                            {marker.name && (
                                                                <div className="absolute -bottom-5 left-1/2 -translate-x-1/2 whitespace-nowrap bg-slate-900/90 text-white px-2 py-0.5 rounded text-[8px] font-bold">
                                                                    {marker.name}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )
                        ) : (
                            /* EQUIPMENT SCHEMA MODE */
                            !bgImage ? (
                                <div className="w-full h-full flex flex-col items-center justify-center pointer-events-none">
                                    <div className="text-slate-800 font-black text-4xl uppercase italic opacity-20 text-center leading-tight tracking-tighter">
                                        Image Not Found<br/>
                                        <span className="text-xl font-mono">{currentType.visual_assets?.base_graphic || 'No Graphic Defined'}</span>
                                    </div>
                                </div>
                            ) : (
                                <div className="w-full h-full flex items-center justify-center pointer-events-none">
                                    <div 
                                        id="transform-wrapper"
                                        style={{ transform: `translate(${view.x}px, ${view.y}px) scale(${view.scale})`, transition: isPanning ? 'none' : 'transform 0.15s ease-out' }}
                                        className="relative inline-block border border-slate-700 shadow-[0_0_50px_rgba(0,0,0,0.5)] bg-slate-200 max-w-full max-h-full pointer-events-auto"
                                    >
                                        <img ref={imageRef} src={bgImage} className="block max-w-full max-h-[85vh] opacity-95 mix-blend-multiply pointer-events-none shadow-black shadow-inner" draggable="false" onLoad={(e) => { const im = e.target; if (im.naturalHeight > 0) setImgAspect(im.naturalWidth / im.naturalHeight); }} />
                                        {showGrid && <div className="absolute inset-0 blueprint-grid pointer-events-none opacity-50 mix-blend-multiply"></div>}
                                        <div className="absolute inset-0 z-0" onClick={handleImageClick}></div>

                                    {/* 3D ENGINE WRAPPER */}
                                    <div className="absolute inset-0 pointer-events-none" style={{ perspective: '1500px' }}>
                                        
                                        {animations.map((a, i) => {
                                            if (a.x == null || a.y == null) return null;
                                            
                                            const isActive = isTargetActive('animation', i);
                                            const isTesting = localTest[i]; 
                                            
                                            const isSplitDP = a.animation_type === 'diff_pressure_switch';
                                            const isNeonPipe = a.animation_type === 'neon_pipe_coil';
                                            const isAirflow = a.animation_type === 'air_flow_path';
                                            const isVFD = a.animation_type === 'vfd_aligner';
                                            const isHeatingMode = a.element_id && a.element_id.toLowerCase().includes('heat');
                                            const hasPill = ['centrifugal_fan'].includes(a.animation_type);  //- DONE BY JK
                                            
                                            const pX = a.pill_x !== null ? a.pill_x : a.x;
                                            const pY = a.pill_y !== null ? a.pill_y : a.y + 10;
                                            const pScale = a.pill_scale ?? 1.0;

                                            const sX = a.sensor_x ?? a.x;
                                            const sY = a.sensor_y ?? a.y - 20;
                                            const sScale = a.sensor_scale ?? 0.8;
                                            
                                            const wPx = a.base_w || 150;
                                            const hPx = a.base_h || 150;

                                            // Override Simulation Values if Local Test is Active
                                            const simSpeedVal = isTesting ? 60 : simSpeed;
                                            const simValveVal = isTesting ? 100 : simValve;
                                            const simDamperVal = isTesting ? 100 : simDamper;
                                            const simFilterVal = isTesting ? 90 : simFilter;
                                            const simHeatVal = isTesting ? 100 : simHeat;

                                            if (isVFD) {
                                                const chassisW = a.base_w || 220;
                                                const chassisH = a.base_h || 300;
                                                const screenW = a.screen_w || 140;
                                                const screenH = a.screen_h || 85;
                                                const pillW = a.pill_w || 100;
                                                const pillH = a.pill_h || 32;

                                                const isAlarmActive = simFault && !isTesting;
                                                const displayActivated = isAlarmActive ? false : (vfdActive[i] ?? true);
                                                const isRunning = (simSpeedVal > 0) && displayActivated && !isAlarmActive;
                                                
                                                const simHz = (simSpeedVal / 100) * 60.0;
                                                const displayHz = simHz;
                                                const displayAmps = (displayHz / 60) * 8.5;

                                                return (
                                                    <div key={`vfd_${i}`} 
                                                         className={`absolute ${isActive?'z-50':'z-20'} pointer-events-none`}
                                                         style={{ left: `${a.x}%`, top: `${a.y}%`, transform: `scale(${a.scale ?? 1.0})` }}>
                                                         
                                                         <div className="relative w-0 h-0">
                                                            {/* CHASSIS */}
                                                            <div className="absolute pointer-events-auto"
                                                                 style={{ left: 0, top: 0, width: chassisW, height: chassisH, transform: 'translate(-50%, -50%)' }}
                                                                 onMouseDown={(e) => handleElementMouseDown(e, 'animation', i, 'move', 'main')}>
                                                                 <PreviewVFDChassis imageData={a.image_data} isRunning={isRunning} isAlarm={isAlarmActive} />
                                                                 {isActive && !panMode && (
                                                                     <div className="absolute -top-4 -right-4 flex gap-1 pointer-events-auto z-50">
                                                                         <button onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); setActiveTarget({type:'none', idx:0}); }} className="w-7 h-7 bg-slate-700 hover:bg-slate-600 text-white rounded-full flex items-center justify-center shadow-lg border-2 border-white cursor-pointer transition-transform hover:scale-110" title="Minimize VFD">
                                                                             <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                                                         </button>
                                                                         <button onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); unmapItem('animation', i); }} className="w-7 h-7 bg-rose-600 hover:bg-rose-500 text-white rounded-full flex items-center justify-center shadow-lg border-2 border-white cursor-pointer transition-transform hover:scale-110" title="Unmap VFD">
                                                                             <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                                                         </button>
                                                                     </div>
                                                                 )}
                                                            </div>

                                                            {/* SCREEN */}
                                                            <div className="absolute pointer-events-auto"
                                                                 style={{ left: a.screen_dx || 0, top: a.screen_dy || 0, width: screenW, height: screenH, transform: `translate(-50%, -50%) scale(${a.screen_scale ?? 1.0})` }}
                                                                 onMouseDown={(e) => handleElementMouseDown(e, 'animation', i, 'move', 'vfd_screen')}>
                                                                 <PreviewVFDDisplay targetHz={displayHz} actualHz={isRunning ? displayHz : 0.0} amps={isRunning ? displayAmps : 0.0} isRunning={isRunning} hasFault={isAlarmActive} />
                                                                 {isActive && !panMode && <div className="absolute inset-[-2px] border border-dashed rounded pointer-events-none border-sky-400 shadow-[0_0_15px_rgba(56,189,248,0.5)]"></div>}
                                                            </div>

                                                            {/* PILL */}
                                                            <div className="absolute pointer-events-auto"
                                                                 style={{ left: a.pill_dx || 0, top: a.pill_dy || 0, width: pillW, height: pillH, transform: `translate(-50%, -50%) scale(${a.pill_scale ?? 1.0})` }}
                                                                 onMouseDown={(e) => handleElementMouseDown(e, 'animation', i, 'move', 'vfd_pill')}>
                                                                 <PreviewVFDPill isActivated={displayActivated} isRunning={isRunning} hasFault={isAlarmActive} onToggleActivate={(val) => setVfdActive(p => ({...p, [i]: val}))} />
                                                                 {isActive && !panMode && <div className="absolute inset-[-2px] border border-dashed rounded pointer-events-none border-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.5)]"></div>}
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            }
                                            
                                            const transformStyle = `scale(${a.scale}) scaleX(${a.stretchX}) scaleY(${a.stretchY}) skewX(${a.skewX}deg) skewY(${a.skewY}deg) rotateX(${a.rotX}deg) rotateY(${a.rotY}deg) rotateZ(${a.rotZ}deg)`;
                                            
                                            return (
                                                <React.Fragment key={`anim_frag_${i}`}>
                                                    
                                                    {/* PRIMARY ALIGNER BODY */}
                                                    {!isAirflow && (
                                                        <div 
                                                            className={`absolute pointer-events-none ${isActive ? 'z-50' : 'z-20'}`}
                                                            style={{ 
                                                                left: `${a.x}%`, top: `${a.y}%`, 
                                                                width: `${wPx}px`, height: `${hPx}px`,
                                                                marginLeft: `-${wPx/2}px`, marginTop: `-${hPx/2}px`,
                                                                transform: transformStyle,
                                                                transformStyle: 'preserve-3d'
                                                            }}
                                                        >
                                                            <div 
                                                                className="absolute inset-0 flex items-center justify-center pointer-events-auto"
                                                                onMouseDown={(e) => handleElementMouseDown(e, 'animation', i, 'move', 'main')}
                                                                style={{ cursor: panMode ? 'grab' : (isDraggingMode.current && draggingTarget?.subtype === 'main' ? 'grabbing' : 'grab'), transformStyle: 'preserve-3d' }}
                                                            >
                                                                {/* PRO MODE: Broadened the include check so _aligner suffixes trigger the correct component */}
                                                                {['centrifugal_fan'].includes(a.animation_type) && <PreviewCentrifugalFan outlinePath={a.outline_path} isAuto={simAuto} isManualRunning={simSpeedVal > 0} fanSpeed={simSpeedVal} hasFault={simFault && !isTesting} isActive={isActive} />}
                                                                {['rectangular_fan', 'rectangular_fan_aligner'].includes(a.animation_type) && <PreviewRectangularFan isAuto={simAuto} isManualRunning={simSpeedVal > 0} fanSpeed={simSpeedVal} hasFault={simFault && !isTesting} />}
                                                                {['hydration_valve', 'hydration_valve_aligner'].includes(a.animation_type) && <PreviewHydrationValve hydrateLevel={simValveVal} isHeating={isHeatingMode} width={wPx} height={hPx} rotX={a.rotX || 0} rotY={a.rotY || 0} rotZ={a.rotZ || 0} />}
                                                                {['antifreeze_coil_valve', 'antifreeze_coil'].includes(a.animation_type) && <PreviewAntiFreezeCoil activation={simValveVal} width={wPx} height={hPx} scale={1} stretchX={1} stretchY={1} rotX={a.rotX || 0} rotY={a.rotY || 0} rotZ={a.rotZ || 0} skewX={a.skewX || 0} skewY={a.skewY || 0} numCoils={a.numCoils || 4} isActive={isActive} />}
                                                                {['damper'].includes(a.animation_type) && <PreviewDamper damperPos={simDamperVal} width={wPx} height={hPx} />}
                                                                {['circular_damper'].includes(a.animation_type) && <PreviewCircularDamper damperPos={simDamperVal} width={wPx} height={hPx} isActive={isActive} />}
                                                                {['neon_pipe_coil'].includes(a.animation_type) && <PreviewNeonPipeCoil value={isHeatingMode ? simHeatVal : simValveVal} isHeating={isHeatingMode} length={a.pipeLength} thickness={a.pipeThickness} separation={a.separation} />}

                                                            const leftPct = a.x + fx * 100;

                                                              })()

                                                            </div>

                                                        (() => {
                                                            const hasRW = grp.points.some(p => p.access === 'RW');
                                                            if (hasRW) {
                                                                // RW DATABOX — rectangular, labeled rows, scrollable
                                                                return (
                                                                    <>
                                                                        <div className="flex items-center justify-between px-2 py-1 border-b border-amber-800/40 flex-shrink-0">
                                                                            <div className="flex items-center gap-1.5">
                                                                                <div className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${isActive ? 'bg-indigo-400 animate-pulse' : 'bg-amber-400 shadow-[0_0_6px_#f59e0b]'}`}></div>
                                                                                <span className="font-mono text-[8px] font-black uppercase tracking-widest text-amber-300 whitespace-nowrap">{displayName}</span>
                                                                            </div>
                                                                            <span className="text-[6px] font-black text-amber-500/70 uppercase tracking-widest">RW</span>
