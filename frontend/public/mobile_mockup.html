<!DOCTYPE html>
<!--
  RED5 STUDIO · MOBILE START PAGE MOCKUP
  Static HTML+CSS+JS approximation of the proposed mobile landing.
  Drop into /app/frontend/public/ and open on a phone (or in
  desktop dev-tools mobile mode at 390×844) to evaluate layout,
  hierarchy, colour, and information density before wiring up
  the production React shell.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Red5 Studio · Mobile</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #050912;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #e2e8f0;
    height: 100%; min-height: 100vh;
    overscroll-behavior: contain;
  }
  /* Desktop-preview frame — on real mobile this just fills the screen. */
  .device-frame {
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 55%),
      linear-gradient(180deg, #0b1220 0%, #050912 100%);
    display: flex; flex-direction: column;
    box-shadow: 0 0 80px rgba(99, 102, 241, 0.15);
  }
  /* ── TOP HEADER ────────────────────────────────────────────── */
  header.brand {
    padding: 22px 24px 4px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; font-weight: 900; letter-spacing: 0.18em;
    color: #f87171; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
  }
  .logo .dot { width: 7px; height: 7px; border-radius: 50%; background: #f87171; box-shadow: 0 0 10px #f87171; }
  .status-bar {
    display: flex; align-items: center; gap: 10px;
    font-family: ui-monospace, monospace; font-size: 10px; color: #94a3b8;
  }
  .status-bar .pulse { width: 6px; height: 6px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }

  h1.page-title {
    padding: 4px 24px 0;
    font-size: 32px;
    font-weight: 900; line-height: 1.05; letter-spacing: -0.02em;
    color: #f8fafc;
  }
  h1.page-title span.accent {
    background: linear-gradient(135deg, #ec4899 0%, #f43f5e 60%, #fb7185 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle {
    padding: 6px 24px 0;
    font-size: 12px; color: #64748b; line-height: 1.5;
  }
  .ts {
    padding: 16px 24px 0;
    font-family: ui-monospace, monospace; font-size: 10px;
    color: #475569; letter-spacing: 0.08em;
    display: flex; align-items: center; gap: 8px;
  }
  .ts .dot { width: 4px; height: 4px; background: #475569; border-radius: 50%; }

  /* ── CENTRE INFO-GRAPHIC ───────────────────────────────────── */
  .hero {
    margin: 24px 20px 0;
    border-radius: 24px;
    padding: 22px 22px 20px;
    background:
      radial-gradient(circle at 100% 0%, rgba(244, 63, 94, 0.12) 0%, transparent 55%),
      linear-gradient(180deg, rgba(15, 23, 42, 0.85) 0%, rgba(2, 6, 23, 0.85) 100%);
    border: 1px solid rgba(244, 63, 94, 0.25);
    backdrop-filter: blur(14px);
    box-shadow: 0 14px 50px rgba(244, 63, 94, 0.12), inset 0 1px 0 rgba(255,255,255,0.06);
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; inset: -1px;
    background: linear-gradient(135deg, transparent 40%, rgba(244, 63, 94, 0.15) 60%, transparent 80%);
    pointer-events: none;
  }
  .hero-row { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 14px; align-items: stretch; }
  .hero-cell { text-align: center; padding: 4px 0 0; }
  .hero-cell .label {
    font-family: ui-monospace, monospace; font-size: 8.5px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: #64748b; margin-bottom: 6px;
  }
  .hero-cell .num {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 38px; font-weight: 800; line-height: 1;
    color: #e2e8f0; font-variant-numeric: tabular-nums;
  }
  .hero-cell .unit { font-size: 11px; color: #475569; margin-top: 4px; font-weight: 600; letter-spacing: 0.05em; }
  .hero-divider { background: linear-gradient(180deg, transparent 10%, rgba(100,116,139,0.35) 50%, transparent 90%); width: 1px; }

  .hero-bad {
    margin-top: 20px; padding: 16px 18px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(244, 63, 94, 0.20) 0%, rgba(220, 38, 38, 0.10) 100%);
    border: 1px solid rgba(244, 63, 94, 0.45);
    display: flex; align-items: center; gap: 14px;
    position: relative; overflow: hidden;
  }
  .hero-bad::after {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: #f43f5e; box-shadow: 0 0 14px #f43f5e;
  }
  .hero-bad .left { flex: 1; }
  .hero-bad .left .label {
    font-family: ui-monospace, monospace; font-size: 9px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: #fda4af; margin-bottom: 4px;
  }
  .hero-bad .left .sub { font-size: 10px; color: #94a3b8; margin-top: 2px; }
  .hero-bad .right {
    text-align: right;
  }
  .hero-bad .right .big {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 34px; font-weight: 800; line-height: 1;
    color: #fb7185; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px rgba(244, 63, 94, 0.35);
  }
  .hero-bad .right .pct {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px; color: #fda4af; font-weight: 700;
  }

  /* ── AHU DROPDOWN LIST ─────────────────────────────────────── */
  .section-head {
    padding: 28px 24px 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-head h2 {
    font-family: ui-monospace, monospace;
    font-size: 10.5px; font-weight: 800;
    letter-spacing: 0.18em; text-transform: uppercase; color: #94a3b8;
  }
  .section-head .sort-chip {
    font-family: ui-monospace, monospace;
    font-size: 8.5px; font-weight: 800; letter-spacing: 0.10em;
    padding: 4px 10px; border-radius: 14px;
    background: rgba(244, 63, 94, 0.12); color: #fda4af;
    border: 1px solid rgba(244, 63, 94, 0.30);
    text-transform: uppercase;
  }

  .ahu-list { padding: 0 20px 32px; display: flex; flex-direction: column; gap: 10px; }
  .ahu-row {
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(71, 85, 105, 0.35);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 14px;
    transition: all 180ms ease;
    cursor: pointer;
    position: relative; overflow: hidden;
  }
  .ahu-row::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent, #475569);
    box-shadow: 0 0 12px var(--accent, #475569);
    opacity: 0.85;
  }
  .ahu-row:active { transform: scale(0.985); }
  .ahu-row .id {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 14px; font-weight: 800; color: #f1f5f9;
    letter-spacing: 0.05em; flex-shrink: 0; min-width: 78px;
  }
  .ahu-row .meta { flex: 1; }
  .ahu-row .bar-row {
    display: flex; align-items: center; gap: 8px;
    font-family: ui-monospace, monospace; font-size: 10px;
  }
  .ahu-row .bar-row .bar-bg {
    flex: 1; height: 5px; background: rgba(51, 65, 85, 0.6); border-radius: 3px; overflow: hidden;
  }
  .ahu-row .bar-row .bar-fill {
    height: 100%; background: var(--accent, #475569);
    box-shadow: 0 0 6px var(--accent, #475569);
    border-radius: 3px; transition: width 600ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .ahu-row .bar-row .pct {
    color: var(--accent, #94a3b8); font-weight: 800;
    min-width: 36px; text-align: right; font-variant-numeric: tabular-nums;
  }
  .ahu-row .sub {
    font-family: ui-monospace, monospace; font-size: 9.5px;
    color: #64748b; margin-top: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .ahu-row .sub b { color: #e2e8f0; font-weight: 700; }
  .ahu-row .sub .sep { width: 2px; height: 2px; background: #475569; border-radius: 50%; }
  .ahu-row .chev { color: #475569; font-size: 18px; padding-left: 2px; }

  /* ── FOOTER ───────────────────────────────────────────────── */
  .footer {
    margin-top: auto;
    padding: 18px 24px calc(20px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(30, 41, 59, 0.6);
    display: flex; align-items: center; justify-content: space-between;
    font-family: ui-monospace, monospace; font-size: 9px; color: #475569;
    letter-spacing: 0.08em;
  }
  .footer .links { display: flex; gap: 16px; }
  .footer a { color: #64748b; text-decoration: none; }
  .footer a:active { color: #ec4899; }

  /* Tablet/desktop hint */
  @media (min-width: 480px) {
    body::before {
      content: '↩ shrink to a mobile width (or open on a phone) for the real layout';
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      font-family: ui-monospace, monospace; font-size: 10px;
      background: rgba(15, 23, 42, 0.9); color: #94a3b8;
      padding: 6px 14px; border-radius: 12px;
      border: 1px solid #334155; z-index: 999;
    }
  }
</style>
</head>
<body>
<div class="device-frame">

  <!-- ── TOP BRAND BAR ────────────────────────────────────────── -->
  <header class="brand">
    <div class="logo"><span class="dot"></span>RED5 STUDIO</div>
    <div class="status-bar">
      <span class="pulse"></span>
      <span id="ts-tag">LIVE</span>
    </div>
  </header>

  <h1 class="page-title">Site<br><span class="accent">Overview</span></h1>
  <div class="subtitle">Quick health snapshot. Drill into the worst-performing AHU first.</div>
  <div class="ts">
    <span class="dot"></span><span id="ts-now">— • —</span>
    <span class="dot"></span><span>4 sites</span>
  </div>

  <!-- ── CENTRE INFO-GRAPHIC ──────────────────────────────────── -->
  <section class="hero">
    <div class="hero-row">
      <div class="hero-cell">
        <div class="label">AHUs</div>
        <div class="num" id="stat-ahu">8</div>
        <div class="unit">total online</div>
      </div>
      <div class="hero-divider"></div>
      <div class="hero-cell">
        <div class="label">VAVs</div>
        <div class="num" id="stat-vav">142</div>
        <div class="unit">across all units</div>
      </div>
    </div>
    <div class="hero-bad">
      <div class="left">
        <div class="label">⚠ Out of comfort zone</div>
        <div class="sub" id="stat-bad-sub">VAVs needing operator attention</div>
      </div>
      <div class="right">
        <div class="big" id="stat-bad">31</div>
        <div class="pct" id="stat-bad-pct">21.8%</div>
      </div>
    </div>
  </section>

  <!-- ── AHU LIST (DROP-DOWN) ─────────────────────────────────── -->
  <div class="section-head">
    <h2>AHU Drilldown</h2>
    <div class="sort-chip">▼ Worst first</div>
  </div>
  <div class="ahu-list" id="ahu-list"></div>

  <div class="footer">
    <span>Red5 Studio v3.0 · Mobile</span>
    <div class="links">
      <a href="#" id="link-refresh">refresh</a>
      <a href="#" id="link-full">full site →</a>
    </div>
  </div>

</div>

<script>
/* ────────────────────────────────────────────────────────────
   Mock data — wire to /api/site_summary later.  Sorted by
   "VAVs out of CZ" descending so the worst AHU is on top —
   matches the operator workflow "fix the loudest fire first".
   ──────────────────────────────────────────────────────────── */
const AHUs = [
  { id: 'AHU-05-N', total: 24, out: 11, name: 'North Wing'   },
  { id: 'AHU-02-S', total: 18, out:  7, name: 'South Wing'   },
  { id: 'AHU-01-E', total: 22, out:  5, name: 'East Annex'   },
  { id: 'AHU-07-W', total: 16, out:  3, name: 'West Lab'     },
  { id: 'AHU-08-R', total: 14, out:  3, name: 'Roof Plenum'  },
  { id: 'AHU-03-W', total: 12, out:  1, name: 'Workshop'     },
  { id: 'AHU-04-C', total: 19, out:  1, name: 'Conference'   },
  { id: 'AHU-06-L',  total: 17, out:  0, name: 'Lobby'        }
];
// Sort by out-of-CZ count desc, ties broken by pct desc
AHUs.sort((a, b) => (b.out - a.out) || (b.out / b.total - a.out / a.total));

function accentForPct(pct) {
  // Hot ≥ 30 %  -> rose-500
  // Warm 10-30  -> amber-400
  // Cool < 10   -> emerald-400
  // Zero       -> slate
  if (pct === 0)  return { c: '#475569', name: 'NOMINAL' };
  if (pct >= 30)  return { c: '#f43f5e', name: 'CRITICAL' };
  if (pct >= 10)  return { c: '#facc15', name: 'WARN' };
  return { c: '#34d399', name: 'OK' };
}

function render() {
  const totalAhu = AHUs.length;
  const totalVav = AHUs.reduce((s, a) => s + a.total, 0);
  const totalBad = AHUs.reduce((s, a) => s + a.out, 0);
  const pctBad   = (totalBad / totalVav * 100).toFixed(1);

  document.getElementById('stat-ahu').textContent = totalAhu;
  document.getElementById('stat-vav').textContent = totalVav;
  document.getElementById('stat-bad').textContent = totalBad;
  document.getElementById('stat-bad-pct').textContent = pctBad + '%';
  document.getElementById('stat-bad-sub').textContent =
    totalBad > 0 ? `${totalBad} of ${totalVav} VAVs need attention` : 'All VAVs nominal';

  const list = document.getElementById('ahu-list');
  list.innerHTML = '';
  AHUs.forEach((a, idx) => {
    const pct = a.total > 0 ? (a.out / a.total * 100) : 0;
    const ac  = accentForPct(pct);
    const row = document.createElement('div');
    row.className = 'ahu-row';
    row.style.setProperty('--accent', ac.c);
    row.innerHTML = `
      <div class="id">${a.id}</div>
      <div class="meta">
        <div class="bar-row">
          <div class="bar-bg"><div class="bar-fill" style="width:${pct.toFixed(0)}%"></div></div>
          <div class="pct">${pct.toFixed(0)}%</div>
        </div>
        <div class="sub">
          <b>${a.out}</b>/${a.total} out of CZ
          <span class="sep"></span>
          ${a.name}
          <span class="sep"></span>
          <span style="color:${ac.c};font-weight:800">${ac.name}</span>
        </div>
      </div>
      <div class="chev">›</div>
    `;
    // Stagger the bar fill animation so the list reads as cascading on load.
    requestAnimationFrame(() => {
      setTimeout(() => row.querySelector('.bar-fill').style.transitionDelay = '0ms', 0);
    });
    list.appendChild(row);
  });
}

function refreshTimestamp() {
  const d = new Date();
  const t = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
  document.getElementById('ts-now').textContent = `synced ${t}`;
}

render();
refreshTimestamp();
setInterval(refreshTimestamp, 30000);

document.getElementById('link-refresh').addEventListener('click', (e) => {
  e.preventDefault();
  refreshTimestamp();
  // Re-randomise a couple of outs to simulate a poll
  AHUs.forEach(a => {
    if (Math.random() < 0.3) {
      a.out = Math.max(0, Math.min(a.total, a.out + (Math.random() < 0.5 ? -1 : 1)));
    }
  });
  AHUs.sort((a, b) => (b.out - a.out) || (b.out / b.total - a.out / a.total));
  render();
});
</script>

</body>
</html>
