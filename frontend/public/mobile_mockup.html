<!DOCTYPE html>
<!--
  RED5 STUDIO · MOBILE START PAGE MOCKUP (iter 2)
  Big circular gauge in the centre with AHU + VAV icons inside.
  AHU drilldown moved into a tappable collapsed dropdown at the
  bottom of the screen.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Red5 Studio · Mobile</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #050912;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #e2e8f0;
    min-height: 100vh;
    overscroll-behavior: contain;
  }
  .device-frame {
    max-width: 420px; margin: 0 auto; min-height: 100vh;
    background:
      radial-gradient(circle at 50% 18%, rgba(244, 63, 94, 0.18) 0%, transparent 55%),
      radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 55%),
      linear-gradient(180deg, #0b1220 0%, #050912 100%);
    display: flex; flex-direction: column;
    box-shadow: 0 0 80px rgba(99, 102, 241, 0.15);
    position: relative;
  }

  /* ── TOP HEADER ─────────────────────────────────────────── */
  header.brand {
    padding: 22px 24px 4px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; font-weight: 900; letter-spacing: 0.18em;
    color: #f87171; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
  }
  .logo .dot { width: 7px; height: 7px; border-radius: 50%; background: #f87171; box-shadow: 0 0 10px #f87171; }
  .status-bar {
    display: flex; align-items: center; gap: 10px;
    font-family: ui-monospace, monospace; font-size: 10px; color: #94a3b8;
  }
  .status-bar .pulse { width: 6px; height: 6px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }

  h1.page-title {
    padding: 4px 24px 0;
    font-size: 30px;
    font-weight: 900; line-height: 1.05; letter-spacing: -0.02em;
    color: #f8fafc;
  }
  h1.page-title span.accent {
    background: linear-gradient(135deg, #ec4899 0%, #f43f5e 60%, #fb7185 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle {
    padding: 6px 24px 0;
    font-size: 12px; color: #64748b; line-height: 1.5;
  }
  .ts {
    padding: 14px 24px 0;
    font-family: ui-monospace, monospace; font-size: 10px;
    color: #475569; letter-spacing: 0.08em;
    display: flex; align-items: center; gap: 8px;
  }
  .ts .dot { width: 4px; height: 4px; background: #475569; border-radius: 50%; }

  /* ── GAUGE CARD ─────────────────────────────────────────── */
  .gauge-card {
    margin: 22px 20px 0;
    padding: 20px 20px 22px;
    border-radius: 28px;
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.6) 0%, rgba(2, 6, 23, 0.4) 100%);
    border: 1px solid rgba(244, 63, 94, 0.18);
    backdrop-filter: blur(10px);
    display: flex; flex-direction: column; align-items: center;
  }
  .ring-wrap {
    position: relative;
    width: 260px; height: 260px;
    margin: 4px auto 6px;
  }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg, .ring-fg {
    fill: none; stroke-width: 14; stroke-linecap: round;
  }
  .ring-bg { stroke: rgba(51, 65, 85, 0.45); }
  .ring-fg {
    stroke: url(#ringGrad);
    filter: drop-shadow(0 0 12px rgba(244, 63, 94, 0.55));
    transition: stroke-dashoffset 1200ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .ring-tick {
    fill: rgba(100, 116, 139, 0.5);
  }

  .gauge-centre {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .gauge-pct {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 64px; font-weight: 900; line-height: 1;
    background: linear-gradient(180deg, #fff 0%, #fb7185 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.04em;
  }
  .gauge-pct .sym {
    font-size: 28px; vertical-align: top; line-height: 1; margin-left: 2px;
    color: #fb7185; -webkit-text-fill-color: #fb7185;
  }
  .gauge-label {
    font-family: ui-monospace, monospace;
    font-size: 9.5px; font-weight: 800; letter-spacing: 0.20em;
    color: #fda4af; text-transform: uppercase; margin-top: 4px;
    text-align: center;
  }
  .gauge-fraction {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px; font-weight: 700; color: #94a3b8; margin-top: 6px;
  }
  .gauge-fraction b { color: #fb7185; }

  /* ── PILL ROW INSIDE THE RING (AHU + VAV) ─────────────── */
  .icon-row {
    display: flex; gap: 22px; margin-top: 16px; padding: 4px 0;
  }
  .icon-pill {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 14px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(99, 102, 241, 0.25);
    border-radius: 18px;
    backdrop-filter: blur(8px);
  }
  .icon-pill .ic {
    width: 22px; height: 22px;
    display: grid; place-items: center;
    border-radius: 8px;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.30), rgba(139, 92, 246, 0.18));
    border: 1px solid rgba(139, 92, 246, 0.45);
  }
  .icon-pill .ic svg { width: 14px; height: 14px; stroke: #c4b5fd; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-pill .num {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 18px; font-weight: 800; color: #f1f5f9;
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  .icon-pill .lbl {
    font-family: ui-monospace, monospace;
    font-size: 8.5px; font-weight: 700; letter-spacing: 0.14em;
    color: #94a3b8; text-transform: uppercase;
    line-height: 1; margin-top: 3px;
  }

  /* ── AHU DROPDOWN ───────────────────────────────────────── */
  .dropdown {
    margin: 26px 20px 24px;
    border-radius: 20px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(71, 85, 105, 0.5);
    overflow: hidden;
    backdrop-filter: blur(8px);
  }
  .dd-trigger {
    width: 100%;
    padding: 16px 18px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(90deg, rgba(244, 63, 94, 0.08) 0%, transparent 100%);
    border: 0; cursor: pointer;
    text-align: left;
    transition: background 200ms ease;
  }
  .dd-trigger:active { background: rgba(244, 63, 94, 0.14); }
  .dd-trigger .left { display: flex; align-items: center; gap: 12px; }
  .dd-trigger .ic-circle {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(244, 63, 94, 0.25), rgba(190, 24, 93, 0.15));
    border: 1px solid rgba(244, 63, 94, 0.50);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .dd-trigger .ic-circle svg { width: 16px; height: 16px; stroke: #fda4af; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dd-trigger .title-block {
    display: flex; flex-direction: column;
  }
  .dd-trigger .title-block .t1 {
    font-size: 13px; font-weight: 800; color: #f1f5f9; line-height: 1.1;
  }
  .dd-trigger .title-block .t2 {
    font-family: ui-monospace, monospace; font-size: 9.5px;
    color: #94a3b8; letter-spacing: 0.10em; margin-top: 3px;
    text-transform: uppercase;
  }
  .dd-trigger .chev {
    width: 18px; height: 18px; color: #94a3b8;
    transition: transform 260ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .dropdown.open .chev { transform: rotate(180deg); color: #fb7185; }
  .dd-body {
    max-height: 0; opacity: 0; overflow: hidden;
    transition: max-height 320ms cubic-bezier(0.16, 1, 0.3, 1), opacity 220ms ease;
  }
  .dropdown.open .dd-body {
    max-height: 1200px; opacity: 1;
  }
  .ahu-list {
    padding: 4px 12px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .ahu-row {
    background: rgba(2, 6, 23, 0.6);
    border: 1px solid rgba(51, 65, 85, 0.4);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    position: relative; overflow: hidden;
    cursor: pointer; transition: transform 140ms;
  }
  .ahu-row::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent, #475569);
    box-shadow: 0 0 10px var(--accent, #475569); opacity: 0.85;
  }
  .ahu-row:active { transform: scale(0.985); }
  .ahu-row .id {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px; font-weight: 800; color: #f1f5f9;
    letter-spacing: 0.05em; flex-shrink: 0; min-width: 76px;
  }
  .ahu-row .meta { flex: 1; min-width: 0; }
  .ahu-row .bar-row { display: flex; align-items: center; gap: 8px; }
  .ahu-row .bar-bg { flex: 1; height: 5px; background: rgba(51, 65, 85, 0.6); border-radius: 3px; overflow: hidden; }
  .ahu-row .bar-fill { height: 100%; background: var(--accent, #475569); box-shadow: 0 0 6px var(--accent, #475569); border-radius: 3px; }
  .ahu-row .pct {
    font-family: ui-monospace, monospace; font-size: 11px;
    color: var(--accent, #94a3b8); font-weight: 800;
    min-width: 38px; text-align: right; font-variant-numeric: tabular-nums;
  }
  .ahu-row .sub {
    font-family: ui-monospace, monospace; font-size: 9px;
    color: #64748b; margin-top: 4px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .ahu-row .sub b { color: #e2e8f0; font-weight: 700; }
  .ahu-row .sub .sep { width: 2px; height: 2px; background: #475569; border-radius: 50%; }
  .ahu-row .sub .badge {
    color: var(--accent, #94a3b8); font-weight: 800; letter-spacing: 0.06em;
  }

  /* ── FOOTER ─────────────────────────────────────────────── */
  .footer {
    margin-top: auto;
    padding: 16px 24px calc(20px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(30, 41, 59, 0.6);
    display: flex; align-items: center; justify-content: space-between;
    font-family: ui-monospace, monospace; font-size: 9px; color: #475569;
    letter-spacing: 0.08em;
  }
  .footer a { color: #64748b; text-decoration: none; }
  .footer a:active { color: #ec4899; }
  .footer .links { display: flex; gap: 14px; }

  @media (min-width: 480px) {
    body::before {
      content: 'desktop preview — open on a phone or use dev-tools mobile mode';
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      font-family: ui-monospace, monospace; font-size: 10px;
      background: rgba(15, 23, 42, 0.9); color: #94a3b8;
      padding: 6px 14px; border-radius: 12px;
      border: 1px solid #334155; z-index: 999; white-space: nowrap;
    }
  }
</style>
</head>
<body>
<div class="device-frame">

  <!-- ── BRAND BAR ────────────────────────────────────────── -->
  <header class="brand">
    <div class="logo"><span class="dot"></span>RED5 STUDIO</div>
    <div class="status-bar"><span class="pulse"></span><span id="ts-tag">LIVE</span></div>
  </header>

  <h1 class="page-title">Site<br><span class="accent">Overview</span></h1>
  <div class="subtitle">Big number first. Tap the drilldown for unit-by-unit health.</div>
  <div class="ts">
    <span class="dot"></span><span id="ts-now">— • —</span>
    <span class="dot"></span><span>4 sites</span>
  </div>

  <!-- ── CIRCULAR GAUGE ───────────────────────────────────── -->
  <section class="gauge-card">
    <div class="ring-wrap">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"  stop-color="#fb7185"/>
            <stop offset="50%" stop-color="#f43f5e"/>
            <stop offset="100%" stop-color="#e11d48"/>
          </linearGradient>
        </defs>
        <!-- ticks every 30 deg, subtle -->
        <g id="ringTicks"></g>
        <circle class="ring-bg" cx="100" cy="100" r="86"/>
        <circle id="ringFg" class="ring-fg" cx="100" cy="100" r="86" pathLength="100" stroke-dasharray="0 100"/>
      </svg>
      <div class="gauge-centre">
        <div class="gauge-pct"><span id="gPct">0</span><span class="sym">%</span></div>
        <div class="gauge-label">VAVs out of CZ</div>
        <div class="gauge-fraction"><b id="gNum">0</b> of <span id="gDen">0</span></div>
      </div>
    </div>

    <!-- AHU + VAV pills, sit just under the ring -->
    <div class="icon-row">
      <div class="icon-pill">
        <div class="ic">
          <!-- AHU icon: stylised box with twin fans + duct -->
          <svg viewBox="0 0 24 24">
            <rect x="3" y="6" width="18" height="12" rx="2"/>
            <circle cx="9"  cy="12" r="2.6"/>
            <circle cx="15" cy="12" r="2.6"/>
            <line x1="3"  y1="10" x2="3"  y2="14"/>
            <line x1="21" y1="10" x2="21" y2="14"/>
          </svg>
        </div>
        <div>
          <div class="num" id="pAhu">0</div>
          <div class="lbl">AHUs</div>
        </div>
      </div>
      <div class="icon-pill">
        <div class="ic">
          <!-- VAV icon: smaller box with damper line + arrow -->
          <svg viewBox="0 0 24 24">
            <rect x="4" y="7" width="16" height="10" rx="1.5"/>
            <line x1="8" y1="9" x2="16" y2="15"/>
            <path d="M3 12 H6"/>
            <path d="M18 12 H21"/>
          </svg>
        </div>
        <div>
          <div class="num" id="pVav">0</div>
          <div class="lbl">VAVs</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── AHU DROPDOWN ─────────────────────────────────────── -->
  <div class="dropdown" id="dd">
    <button class="dd-trigger" id="ddTrigger">
      <div class="left">
        <div class="ic-circle">
          <svg viewBox="0 0 24 24"><path d="M3 12 H21"/><path d="M3 6 H21"/><path d="M3 18 H21"/></svg>
        </div>
        <div class="title-block">
          <div class="t1">AHU Drilldown</div>
          <div class="t2"><span id="ddSummary">tap to expand · worst first</span></div>
        </div>
      </div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9 L12 15 L18 9"/>
      </svg>
    </button>
    <div class="dd-body">
      <div class="ahu-list" id="ahuList"></div>
    </div>
  </div>

  <div class="footer">
    <span>Red5 Studio v3.0 · Mobile</span>
    <div class="links">
      <a href="#" id="lRefresh">refresh</a>
      <a href="#" id="lFull">full site →</a>
    </div>
  </div>
</div>

<script>
const AHUs = [
  { id: 'AHU-05-N', total: 24, out: 11, name: 'North Wing'  },
  { id: 'AHU-02-S', total: 18, out:  7, name: 'South Wing'  },
  { id: 'AHU-01-E', total: 22, out:  5, name: 'East Annex'  },
  { id: 'AHU-07-W', total: 16, out:  3, name: 'West Lab'    },
  { id: 'AHU-08-R', total: 14, out:  3, name: 'Roof Plenum' },
  { id: 'AHU-03-W', total: 12, out:  1, name: 'Workshop'    },
  { id: 'AHU-04-C', total: 19, out:  1, name: 'Conference'  },
  { id: 'AHU-06-L', total: 17, out:  0, name: 'Lobby'       }
];
AHUs.sort((a, b) => (b.out - a.out) || (b.out / b.total - a.out / a.total));

/* SVG circular gauge — pathLength=100 means the dasharray we set is
   the literal percent.  Tween from 0 → target on mount so the ring
   visibly fills (operator-attention cue). */
function setRing(pct) {
  const fg = document.getElementById('ringFg');
  fg.style.strokeDasharray = `${pct} ${100 - pct}`;
  // Tween the numeric readout in lockstep with the ring fill
  const start = parseFloat(document.getElementById('gPct').textContent) || 0;
  const t0 = performance.now();
  function step(t) {
    const k = Math.min(1, (t - t0) / 1200);
    const eased = 1 - Math.pow(1 - k, 3);
    document.getElementById('gPct').textContent = (start + (pct - start) * eased).toFixed(0);
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function accentForPct(pct) {
  if (pct === 0)  return { c: '#475569', name: 'NOMINAL'  };
  if (pct >= 30)  return { c: '#f43f5e', name: 'CRITICAL' };
  if (pct >= 10)  return { c: '#facc15', name: 'WARN'     };
  return                  { c: '#34d399', name: 'OK'       };
}

function render() {
  const totalAhu = AHUs.length;
  const totalVav = AHUs.reduce((s, a) => s + a.total, 0);
  const totalBad = AHUs.reduce((s, a) => s + a.out, 0);
  const pctBad   = totalVav > 0 ? (totalBad / totalVav * 100) : 0;

  document.getElementById('pAhu').textContent = totalAhu;
  document.getElementById('pVav').textContent = totalVav;
  document.getElementById('gNum').textContent = totalBad;
  document.getElementById('gDen').textContent = totalVav;
  setRing(pctBad);

  // Worst AHU + worst pct → drop-down summary teaser
  const worst = AHUs[0];
  const worstPct = worst.total > 0 ? Math.round(worst.out / worst.total * 100) : 0;
  document.getElementById('ddSummary').textContent =
    `worst: ${worst.id} · ${worst.out}/${worst.total} (${worstPct}%) · tap`;

  const list = document.getElementById('ahuList');
  list.innerHTML = '';
  AHUs.forEach((a) => {
    const pct = a.total > 0 ? (a.out / a.total * 100) : 0;
    const ac  = accentForPct(pct);
    const row = document.createElement('div');
    row.className = 'ahu-row';
    row.style.setProperty('--accent', ac.c);
    row.innerHTML = `
      <div class="id">${a.id}</div>
      <div class="meta">
        <div class="bar-row">
          <div class="bar-bg"><div class="bar-fill" style="width:${pct.toFixed(0)}%"></div></div>
          <div class="pct">${pct.toFixed(0)}%</div>
        </div>
        <div class="sub">
          <b>${a.out}</b>/${a.total} out of CZ
          <span class="sep"></span>${a.name}
          <span class="sep"></span><span class="badge">${ac.name}</span>
        </div>
      </div>`;
    list.appendChild(row);
  });
}

function refreshTimestamp() {
  const d = new Date();
  const t = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
  document.getElementById('ts-now').textContent = `synced ${t}`;
}

/* Draw 12 tick marks every 30° on the gauge ring (purely decorative
   but anchors the eye and reads as "this is a real gauge"). */
function drawTicks() {
  const g = document.getElementById('ringTicks');
  const cx = 100, cy = 100, rOut = 92, rIn = 87;
  const ticks = [];
  for (let i = 0; i < 12; i++) {
    const a = (i * 30 - 90) * Math.PI / 180;
    const x1 = cx + rOut * Math.cos(a), y1 = cy + rOut * Math.sin(a);
    const x2 = cx + rIn  * Math.cos(a), y2 = cy + rIn  * Math.sin(a);
    ticks.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(100,116,139,0.55)" stroke-width="1.4" stroke-linecap="round"/>`);
  }
  g.innerHTML = ticks.join('');
}

drawTicks();
render();
refreshTimestamp();
setInterval(refreshTimestamp, 30000);

document.getElementById('ddTrigger').addEventListener('click', () => {
  document.getElementById('dd').classList.toggle('open');
});

document.getElementById('lRefresh').addEventListener('click', (e) => {
  e.preventDefault();
  refreshTimestamp();
  AHUs.forEach(a => {
    if (Math.random() < 0.30) a.out = Math.max(0, Math.min(a.total, a.out + (Math.random() < 0.5 ? -1 : 1)));
  });
  AHUs.sort((a, b) => (b.out - a.out) || (b.out / b.total - a.out / a.total));
  render();
});
</script>
</body>
</html>
