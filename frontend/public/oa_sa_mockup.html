<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mockup · OA 3D + SA 3D side-by-side</title>
<style>
  :root {
    --bg: #0b1018;
    --panel: #131a26;
    --line: #1f2a3a;
    --text: #d8dde4;
    --muted: #6b7684;
    --oa: #fb7185;        /* same as engine's OA dot colour */
    --sa: #60a5fa;        /* matches engine's SA palette */
    --grid: #243245;
    --rh: rgba(148, 163, 184, .35);
    --mono: ui-monospace, "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 ui-sans-serif, system-ui; }
  header {
    padding: 18px 28px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .04em; }
  header h1 small { color: var(--muted); font-weight: 400; margin-left: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: .15em; text-transform: uppercase; }
  header .note { color: var(--muted); font-family: var(--mono); font-size: 11px; }

  main {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    padding: 24px 28px; min-height: calc(100% - 60px);
  }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .panel > header {
    padding: 14px 18px; border: 0; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.015);
  }
  .panel h2 { margin: 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--text); display: flex; align-items: center; gap: 10px; }
  .panel h2 .dot { width: 10px; height: 10px; border-radius: 50%; }
  .panel h2 .dot.oa { background: var(--oa); box-shadow: 0 0 8px rgba(251,113,133,.6); }
  .panel h2 .dot.sa { background: var(--sa); box-shadow: 0 0 8px rgba(96,165,250,.6); }
  .panel h2 small { font-family: var(--mono); font-size: 10px; color: var(--muted); font-weight: 400; letter-spacing: .08em; text-transform: none; margin-left: 6px; }

  .chart-host { flex: 1; padding: 16px 12px 8px; }
  .chart-host svg { display: block; width: 100%; height: 100%; }

  .axis-label { font-family: var(--mono); font-size: 9px; fill: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
  .axis-tick  { font-family: var(--mono); font-size: 9px; fill: var(--muted); }

  /* Stats footer */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .l { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  .stat .v { font-family: var(--mono); font-size: 14px; color: var(--text); font-weight: 600; }
  .stat .v.oa { color: var(--oa); }
  .stat .v.sa { color: var(--sa); }
</style>
</head>
<body>
<header>
  <h1>RED5 <small>Mockup · OA / SA 3D Comparison · no W×Time · no ΔH×Time</small></h1>
  <div class="note">24-hour window · 1-hour samples · synthetic data</div>
</header>

<main>
  <!-- OA panel -->
  <section class="panel">
    <header>
      <h2><span class="dot oa"></span> OA · Outside Air <small>3D T-W-Time strip</small></h2>
    </header>
    <div class="chart-host"><svg id="svg-oa" viewBox="0 0 720 460" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div class="stats">
      <div class="stat"><span class="l">T range</span><span class="v oa" id="oa-trange">—</span></div>
      <div class="stat"><span class="l">RH range</span><span class="v oa" id="oa-rh">—</span></div>
      <div class="stat"><span class="l">W mean</span><span class="v oa" id="oa-w">—</span></div>
      <div class="stat"><span class="l">h mean</span><span class="v oa" id="oa-h">—</span></div>
    </div>
  </section>

  <!-- SA panel -->
  <section class="panel">
    <header>
      <h2><span class="dot sa"></span> SA · Supply Air <small>matched to OA · cooling control + coil BF=0.10</small></h2>
    </header>
    <div class="chart-host"><svg id="svg-sa" viewBox="0 0 720 460" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div class="stats">
      <div class="stat"><span class="l">T range</span><span class="v sa" id="sa-trange">—</span></div>
      <div class="stat"><span class="l">RH range</span><span class="v sa" id="sa-rh">—</span></div>
      <div class="stat"><span class="l">W mean</span><span class="v sa" id="sa-w">—</span></div>
      <div class="stat"><span class="l">h mean</span><span class="v sa" id="sa-h">—</span></div>
    </div>
  </section>
</main>

<script>
(() => {
  // ---------- Psychrometrics (matches /utils/psychrometric.js minimally)
  const P_ATM = 101.325;
  const getPsat = (T) => 0.61078 * Math.exp((17.27 * T) / (T + 237.3));      // kPa, T °C
  const getW    = (T, rh) => 0.621945 * (rh/100 * getPsat(T)) / (P_ATM - rh/100 * getPsat(T));   // kg/kg
  const getH    = (T, W)  => 1.006 * T + W * 1000 * (2501 + 1.86 * T) / 1000; // kJ/kg

  // ---------- Synthetic 24-hour data
  // OA: daily sine, peak 34 °C @ 15:00, trough 26 °C @ 04:00, RH inverse
  const HOURS = 24;
  const oa = [], sa = [];
  for (let h = 0; h < HOURS; h++) {
    // OA model
    const phase = (h - 4) / 24 * 2 * Math.PI;
    const T_oa  = 30 + 4 * Math.sin(phase);                // 26..34
    const RH_oa = 65 - 18 * Math.sin(phase);               // 47..83
    const W_oa  = getW(T_oa, RH_oa);
    const H_oa  = getH(T_oa, W_oa);

    // SA model — typical cooling AHU: setpoint 14 °C, slight rise when OA load drops.
    // We compute a coil ADP (apparatus dew point) and apply a bypass factor.
    const T_set = 14 + 0.3 * Math.sin(phase + Math.PI/3);  // 13.7..14.3
    const ADP_T = T_set - 1.5;                             // dew point on coil
    const ADP_W = getW(ADP_T, 100);
    const BF    = 0.10;                                    // coil bypass factor
    // SA = ADP + BF · (MA - ADP); approximate MA ≈ 0.20·OA + 0.80·RA (RA=24°C/50%RH)
    const RA_T = 24, RA_RH = 50;
    const RA_W = getW(RA_T, RA_RH);
    const MA_T = 0.20 * T_oa + 0.80 * RA_T;
    const MA_W = 0.20 * W_oa + 0.80 * RA_W;
    const T_sa = ADP_T + BF * (MA_T - ADP_T);
    const W_sa = ADP_W + BF * (MA_W - ADP_W);
    // RH at SA
    const Pw   = (W_sa * P_ATM) / (0.621945 + W_sa);
    const RH_sa = Math.min(100, Math.max(0, (Pw / getPsat(T_sa)) * 100));
    const H_sa  = getH(T_sa, W_sa);

    oa.push({ h, T: T_oa, RH: RH_oa, W: W_oa, H: H_oa });
    sa.push({ h, T: T_sa, RH: RH_sa, W: W_sa, H: H_sa });
  }

  // ---------- Render a 3D strip into an SVG (T × W × Time, isometric projection)
  function render3D(svgId, series, color, glowColor) {
    const svg = document.getElementById(svgId);
    const NS = "http://www.w3.org/2000/svg";

    // ranges
    const T_MIN = 10, T_MAX = 36, W_MAX_G = 25;                 // W in g/kg
    const SX = 520, SY = 320, SZ = 90;                          // logical strip dims
    const PAD_L = 110, PAD_T = 40;

    // Isometric-ish projection (Z depth pulls right + down a touch)
    const ANG_X = 0.55, ANG_Y = 0.35;
    const project = (x, y, z) => ({
      px: PAD_L + x + z * ANG_X,
      py: PAD_T + (SY - y) - z * ANG_Y * 0.6,
    });
    const t2x = (T) => ((T - T_MIN) / (T_MAX - T_MIN)) * SX;
    const w2y = (W_g) => (W_g / W_MAX_G) * SY;
    const h2z = (h) => (h / (HOURS - 1)) * SZ;

    // Background floor (psy chart silhouette)
    const floor = document.createElementNS(NS, "g");
    const fp = (() => {
      // four corners of the psy floor in 3D (W=0 plane)
      const c00 = project(0,   0, 0);
      const c10 = project(SX,  0, 0);
      const c11 = project(SX,  0, SZ);
      const c01 = project(0,   0, SZ);
      return `M${c00.px},${c00.py} L${c10.px},${c10.py} L${c11.px},${c11.py} L${c01.px},${c01.py} Z`;
    })();
    const floorPath = document.createElementNS(NS, "path");
    floorPath.setAttribute("d", fp);
    floorPath.setAttribute("fill", "rgba(36, 50, 69, 0.5)");
    floorPath.setAttribute("stroke", "rgba(100, 116, 139, 0.35)");
    floor.appendChild(floorPath);

    // T grid lines on the floor (every 4°C)
    for (let T = T_MIN; T <= T_MAX; T += 4) {
      const a = project(t2x(T), 0, 0);
      const b = project(t2x(T), 0, SZ);
      const ln = document.createElementNS(NS, "line");
      ln.setAttribute("x1", a.px); ln.setAttribute("y1", a.py);
      ln.setAttribute("x2", b.px); ln.setAttribute("y2", b.py);
      ln.setAttribute("stroke", "rgba(100,116,139,.2)");
      floor.appendChild(ln);
    }
    // W back-wall lines (vertical, on z=0 plane)
    for (let W = 0; W <= W_MAX_G; W += 5) {
      const a = project(0,  w2y(W), 0);
      const b = project(SX, w2y(W), 0);
      const ln = document.createElementNS(NS, "line");
      ln.setAttribute("x1", a.px); ln.setAttribute("y1", a.py);
      ln.setAttribute("x2", b.px); ln.setAttribute("y2", b.py);
      ln.setAttribute("stroke", "rgba(100,116,139,.18)");
      floor.appendChild(ln);
    }
    svg.appendChild(floor);

    // RH=50% & RH=90% reference curves at z=0 (back wall)
    for (const rh of [30, 60, 90]) {
      const pts = [];
      for (let T = T_MIN; T <= T_MAX; T += 1) {
        const W_g = getW(T, rh) * 1000;
        if (W_g > W_MAX_G) break;
        const p = project(t2x(T), w2y(W_g), 0);
        pts.push(`${p.px.toFixed(1)},${p.py.toFixed(1)}`);
      }
      const path = document.createElementNS(NS, "polyline");
      path.setAttribute("points", pts.join(" "));
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "rgba(148,163,184,.35)");
      path.setAttribute("stroke-width", "1");
      svg.appendChild(path);
      // label
      const last = pts[pts.length - 1].split(",");
      const txt = document.createElementNS(NS, "text");
      txt.setAttribute("x", parseFloat(last[0]) + 4);
      txt.setAttribute("y", parseFloat(last[1]) - 2);
      txt.setAttribute("class", "axis-tick");
      txt.textContent = `${rh}%`;
      svg.appendChild(txt);
    }

    // Axes
    const axes = [
      // X: T
      { a: project(0, 0, 0),     b: project(SX, 0, 0),   l: "T (°C)", lx: SX/2, ly: -22, lz: 0 },
      // Y: W
      { a: project(0, 0, 0),     b: project(0, SY, 0),   l: "W (g/kg)", lx: -55, ly: SY/2, lz: 0 },
      // Z: time
      { a: project(0, 0, 0),     b: project(0, 0, SZ),   l: "Time (24h →)", lx: 0, ly: 0, lz: SZ + 18 },
    ];
    for (const ax of axes) {
      const ln = document.createElementNS(NS, "line");
      ln.setAttribute("x1", ax.a.px); ln.setAttribute("y1", ax.a.py);
      ln.setAttribute("x2", ax.b.px); ln.setAttribute("y2", ax.b.py);
      ln.setAttribute("stroke", "rgba(148,163,184,.65)");
      ln.setAttribute("stroke-width", "1.4");
      svg.appendChild(ln);
      const labelP = project(ax.lx, ax.ly, ax.lz);
      const txt = document.createElementNS(NS, "text");
      txt.setAttribute("x", labelP.px);
      txt.setAttribute("y", labelP.py);
      txt.setAttribute("class", "axis-label");
      txt.setAttribute("text-anchor", "middle");
      txt.textContent = ax.l;
      svg.appendChild(txt);
    }

    // T tick labels along the floor (z=0)
    for (let T = T_MIN; T <= T_MAX; T += 4) {
      const p = project(t2x(T), 0, 0);
      const t = document.createElementNS(NS, "text");
      t.setAttribute("x", p.px); t.setAttribute("y", p.py + 14);
      t.setAttribute("class", "axis-tick");
      t.setAttribute("text-anchor", "middle");
      t.textContent = T;
      svg.appendChild(t);
    }

    // The series ribbon: connect each (T_i, W_i, t_i) with a line + glowing dot
    // Build the polyline in 3D-projected coords
    const polyPts = series.map((s, i) => {
      const p = project(t2x(s.T), w2y(s.W * 1000), h2z(s.h));
      return `${p.px.toFixed(1)},${p.py.toFixed(1)}`;
    });

    // Shadow projection on the floor (W=0 plane) — soft helper to read depth
    const shadowPts = series.map((s, i) => {
      const p = project(t2x(s.T), 0, h2z(s.h));
      return `${p.px.toFixed(1)},${p.py.toFixed(1)}`;
    });
    const shadow = document.createElementNS(NS, "polyline");
    shadow.setAttribute("points", shadowPts.join(" "));
    shadow.setAttribute("fill", "none");
    shadow.setAttribute("stroke", color);
    shadow.setAttribute("stroke-width", "1");
    shadow.setAttribute("stroke-dasharray", "2,3");
    shadow.setAttribute("opacity", "0.4");
    svg.appendChild(shadow);

    // Vertical droplines from each sample to floor (sense of altitude)
    series.forEach((s, i) => {
      const a = project(t2x(s.T), w2y(s.W * 1000), h2z(s.h));
      const b = project(t2x(s.T), 0,                h2z(s.h));
      const ln = document.createElementNS(NS, "line");
      ln.setAttribute("x1", a.px); ln.setAttribute("y1", a.py);
      ln.setAttribute("x2", b.px); ln.setAttribute("y2", b.py);
      ln.setAttribute("stroke", color);
      ln.setAttribute("stroke-width", "0.7");
      ln.setAttribute("opacity", "0.25");
      svg.appendChild(ln);
    });

    // Main ribbon line
    const line = document.createElementNS(NS, "polyline");
    line.setAttribute("points", polyPts.join(" "));
    line.setAttribute("fill", "none");
    line.setAttribute("stroke", color);
    line.setAttribute("stroke-width", "2.6");
    line.setAttribute("stroke-linejoin", "round");
    line.setAttribute("stroke-linecap", "round");
    line.setAttribute("filter", `drop-shadow(0 0 4px ${glowColor})`);
    svg.appendChild(line);

    // Sample dots
    series.forEach((s, i) => {
      const p = project(t2x(s.T), w2y(s.W * 1000), h2z(s.h));
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", p.px); c.setAttribute("cy", p.py);
      c.setAttribute("r", "2.6");
      c.setAttribute("fill", color);
      c.setAttribute("stroke", "rgba(255,255,255,.85)");
      c.setAttribute("stroke-width", "0.8");
      svg.appendChild(c);

      // Hour label every 6h
      if (s.h % 6 === 0) {
        const lp = project(0, 0, h2z(s.h));
        const t = document.createElementNS(NS, "text");
        t.setAttribute("x", lp.px - 6); t.setAttribute("y", lp.py + 4);
        t.setAttribute("class", "axis-tick");
        t.setAttribute("text-anchor", "end");
        t.textContent = `${String(s.h).padStart(2,"0")}:00`;
        svg.appendChild(t);
      }
    });
  }

  // Render
  render3D("svg-oa", oa, "#fb7185", "rgba(251,113,133,.6)");
  render3D("svg-sa", sa, "#60a5fa", "rgba(96,165,250,.6)");

  // Stats
  const fmt = (n, d=1) => n.toFixed(d);
  const trMin = arr => Math.min(...arr.map(x => x.T)), trMax = arr => Math.max(...arr.map(x => x.T));
  const rhMin = arr => Math.min(...arr.map(x => x.RH)), rhMax = arr => Math.max(...arr.map(x => x.RH));
  const wMean = arr => arr.reduce((a,b) => a + b.W*1000, 0) / arr.length;
  const hMean = arr => arr.reduce((a,b) => a + b.H, 0) / arr.length;

  document.getElementById("oa-trange").textContent = `${fmt(trMin(oa))} – ${fmt(trMax(oa))} °C`;
  document.getElementById("oa-rh").textContent     = `${fmt(rhMin(oa),0)} – ${fmt(rhMax(oa),0)} %`;
  document.getElementById("oa-w").textContent      = `${fmt(wMean(oa),2)} g/kg`;
  document.getElementById("oa-h").textContent      = `${fmt(hMean(oa))} kJ/kg`;

  document.getElementById("sa-trange").textContent = `${fmt(trMin(sa))} – ${fmt(trMax(sa))} °C`;
  document.getElementById("sa-rh").textContent     = `${fmt(rhMin(sa),0)} – ${fmt(rhMax(sa),0)} %`;
  document.getElementById("sa-w").textContent      = `${fmt(wMean(sa),2)} g/kg`;
  document.getElementById("sa-h").textContent      = `${fmt(hMean(sa))} kJ/kg`;
})();
</script>
</body>
</html>
