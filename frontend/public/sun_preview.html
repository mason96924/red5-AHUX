<!doctype html>
<html><head>
<!-- Cache-control: psy_3d.html and friends have no compiled bundle to ?v=-stamp, so the HTML itself must opt-out of browser caching. Without this, PROD users see stale UI after every deploy until they hard-refresh.  Sentinel data-cache-policy attribute is used by scripts/inject_no_cache_meta.py and deploy.sh preflight to detect missing tags.  Do NOT remove. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" data-cache-policy="no-cache">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0"><meta charset="utf-8"><title>Sun-Path Phase A Preview</title>
<link rel="stylesheet" href="/api/assets/dashboard.tailwind.css?v=9f493d724d">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
<style>
  body{background:#020617;color:#e2e8f0;font-family:ui-monospace,monospace;}
  .plan{position:relative;width:640px;height:480px;margin:40px auto;background:linear-gradient(135deg,#e5d3b3,#c4a87a);border:2px solid #334155;border-radius:8px;overflow:hidden;}
  .plan::before{content:'';position:absolute;inset:10%;border:1px dashed #666;}
  .plan::after{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed #888;}
  h1{text-align:center;color:#22d3ee;font-weight:900;letter-spacing:.15em;text-transform:uppercase;margin:16px;}
</style>
</head><body>
<h1>Sun-Path Phase A — Preview (synthetic 3D floor plan)</h1>
<div id="root"></div>
<script type="text/plain" id="app-src">
const {useState, useEffect} = React;

/* Synthesize a shadow-free "3D-look" floor plan as a data-URL.  We draw a
   tan floor with beige walls (4 exterior + 2 interior dividers) using
   light/dark face shading so the canvas produces something silhouette-
   extractable.  This mimics the user's real 3D JPG without a baked-in
   sun shadow.                                                          */
function buildSynthPlan(){
  const c = document.createElement('canvas');
  c.width = 800; c.height = 600;
  const ctx = c.getContext('2d');
  // Cream floor
  ctx.fillStyle = '#f5ebd7'; ctx.fillRect(0, 0, 800, 600);
  // Exterior walls — slightly 3D with top + side faces
  function box(x, y, w, h, top, side){
    ctx.fillStyle = top;  ctx.fillRect(x, y, w, h);
    ctx.fillStyle = side; ctx.fillRect(x + w, y + 6, 10, h - 6); // right face
    ctx.fillStyle = side; ctx.fillRect(x + 6, y + h, w - 6, 8);  // bottom face
    ctx.strokeStyle = '#3c2e1d'; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h);
  }
  box(40, 40, 720, 18, '#9c7a4a', '#6a4f28');      // top wall
  box(40, 542, 720, 18, '#9c7a4a', '#6a4f28');     // bottom wall
  box(40, 40, 18, 520, '#a38252', '#74552f');      // left wall
  box(742, 40, 18, 520, '#a38252', '#74552f');     // right wall
  // Interior partitions
  box(380, 58, 18, 220, '#b08a5a', '#7c5b33');
  box(100, 280, 620, 14, '#b08a5a', '#7c5b33');
  // A couple of "columns"
  ctx.fillStyle = '#8a6b3f'; ctx.strokeStyle = '#3c2e1d';
  [[200,360], [560, 360], [200, 130], [560, 130]].forEach(([cx, cy]) => {
    ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  });
  return c.toDataURL('image/png');
}

function App(){
  const [sunState, setSunState] = useState(null);
  const [planUrl, setPlanUrl] = useState(null);
  useEffect(() => { setPlanUrl(buildSynthPlan()); }, []);
  const markers = [
    {id:1, type:'ahu',  x:50, y:12, name:'AHU-N'},
    {id:2, type:'ahu',  x:50, y:88, name:'AHU-S'},
    {id:3, type:'vav',  x:15, y:30, name:'VAV-NW'},
    {id:4, type:'vav',  x:85, y:30, name:'VAV-NE'},
    {id:5, type:'vav',  x:15, y:70, name:'VAV-SW'},
    {id:6, type:'vav',  x:85, y:70, name:'VAV-SE'},
    {id:7, type:'vav',  x:15, y:50, name:'VAV-W'},
    {id:8, type:'vav',  x:85, y:50, name:'VAV-E'},
  ];
  const sun = sunState && sunState.sun;
  return (
    <div className="plan" style={{width:800, height:600, background:'#f5ebd7', border:'2px solid #6a4f28'}}>
      {planUrl && <img src={planUrl} style={{position:'absolute', inset:0, width:'100%', height:'100%', zIndex:2, pointerEvents:'none'}}/>}
      {planUrl && sunState && sunState.enabled && sun && window.BuildingShadow && (
        <window.BuildingShadow imgSrc={planUrl} sun={sun} threshold={200}/>
      )}
      <window.SunCompass lat={40.71} lon={-74.01} theme="light" onChange={setSunState}/>
      {sunState && sunState.enabled && sun && window.SunRayOverlay && <window.SunRayOverlay sun={sun} theme="light" cloudCover={sunState.cloudCover} ghiWm2={sunState.ghiWm2}/>}
      {markers.map(m=>{
        let ring=null, shadow=null;
        if(sunState && sunState.enabled && sun){
          const sc = window.red5SunExposureScore(m.x/100, m.y/100, sun);
          ring = window.red5ExposureColor(sc);
          shadow = window.red5MarkerShadow(sun);
        }
        const shadowDiv = shadow && (
          <div style={{position:'absolute',left:'50%',top:'50%',width:shadow.length_px,height:6,
                       transform:'translate(0,-50%) rotate('+(shadow.angle_deg-90)+'deg)',
                       transformOrigin:'0 50%',
                       background:'linear-gradient(90deg, rgba(15,23,42,'+shadow.opacity+'), rgba(15,23,42,0))',
                       borderRadius:999,pointerEvents:'none',zIndex:-1}}/>
        );
        const shape = m.type==='ahu'
          ? <div className="relative"><div>{shadowDiv}<div className={'w-8 h-8 rounded-sm bg-green-500 border-2 shadow-xl flex items-center justify-center ' + (ring?'':'border-white')} style={ring?{borderColor:ring,boxShadow:'0 0 14px '+ring}:{}}>
              <svg className="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
            </div></div></div>
          : <div className="relative"><div>{shadowDiv}<div className={'w-6 h-6 rounded-full bg-blue-500 border-2 shadow-xl ' + (ring?'':'border-white')} style={ring?{borderColor:ring,boxShadow:'0 0 12px '+ring}:{}}></div></div></div>;
        return (
          <div key={m.id} style={{position:'absolute',left:m.x+'%',top:m.y+'%',transform:'translate(-50%,-50%)',zIndex:10,filter:ring?'drop-shadow(0 0 10px '+ring+')':'none'}}>
            {shape}
            <div className="absolute -bottom-5 left-1/2 -translate-x-1/2 whitespace-nowrap bg-slate-900/90 text-white px-2 py-0.5 rounded text-[8px] font-bold">{m.name}</div>
          </div>
        );
      })}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  // Fetch the sun-path module, concat with the preview app source, and
  // compile the whole thing via Babel (same pattern as equipment_mapper.html)
  fetch('/assets/js/sun-path.js').then(r => r.text()).then(src => {
    const combined = src + '\n\n' + document.getElementById('app-src').textContent;
    const s = document.createElement('script');
    s.type = 'text/babel';
    s.setAttribute('data-presets', 'react');
    s.textContent = combined;
    document.body.appendChild(s);
    if (window.Babel) Babel.transformScriptTags();
  });
</script>
</body></html>
